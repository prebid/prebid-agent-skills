  reviewer_cohort:
    go_reviewers: []
    java_reviewers: []
    cross_language_coordinator: null

overall:
  cross_language_state: aligned-with-documented-divergences
  blocker_count: 0
  warning_count: 2
  notes: |
    Beachfront is the ADR-007 F1 multi-endpoint-by-mediatype master sample plus the
    Rule 35 typed-config-subclass master sample plus the Rule 9 custom-request-type
    (parameterized_request_type=Void) master sample — three load-bearing patterns in
    one bidder. Cross-language status:

    R5-strict pass: capabilities (banner+video for both site+app), gvl_vendor_id (335),
    maintainer email, geoscope (both empty), modifying_vast_xml_allowed (false),
    bidder_info.endpoint (banner endpoint byte-equal), schema_interpretation
    (semantically equal — same combinators_used, same property set, same required_fields
    semantics).

    Documented warnings:
      - bidder_params_sha256: byte-only-whitespace-and-key-ordering divergence. Java
        drops one space, reorders oneOf, omits one description sentence. Validation
        semantics identical.
      - bidder_info_endpoint_construction: kind=custom on both sides but the encoding
        of the second (video) endpoint differs by design — Go opaque ExtraAdapterInfo
        JSON vs Java typed subclass field. ADR-007 F1 expected divergence; not a
        port-fidelity violation. Round-Trip Safety section flags Rule 35 inverse
        (Java→Go demotion) as lossy.

    Porter advice: when porting Java→Go, the Java's typed `videoEndpoint` field demotes
    to Go's `ExtraAdapterInfo` JSON string per Rule 35 inverse + emit
    `quirks[]: hardcoded-config-as-anti-pattern` on the Go destination. When porting
    Go→Java, the Go ExtraAdapterInfo string parses to extract `video_endpoint`, then
    a typed BeachfrontConfigurationProperties subclass with @NotBlank private String
    videoEndpoint emerges — the Java side is the structurally-richer form. The two
    custom request body types (BeachfrontBannerRequest + BeachfrontVideoRequest) are
    direct cross-language translations using the corresponding language idioms (Go
    structs with json tags ↔ Lombok @Value with @JsonProperty); Rule 9 covers the
    request-type customization.
