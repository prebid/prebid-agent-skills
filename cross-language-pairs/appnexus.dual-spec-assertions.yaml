overall:
  cross_language_state: divergent-byte-only
  blocker_count: 0
  warning_count: 1
  notes: |
    Appnexus is byte-divergent on bidder_params_json (Java is fully reformatted from
    the Go canonical form with extra whitespace/newlines throughout) but semantically
    equivalent: same 16 properties, same combinators (oneOf-of-oneOf + anyOf + not),
    same 4 flexible-types, same enum constraint on position, same legacy/new param
    coexistence (4 camelCase aliases). Capabilities, GVL ID 32, maintainer, geoscope
    all match. The implementation diverges substantially in idiom but preserves the
    cross-language behavioral contract: both sides emit the same composed batching
    rules ([pod-grouping, max-imps-per-request:10] in apply-order), the same
    schain-source-to-request-ext relocation, the same numeric bid_ad_type chain
    (0=banner, 1=video, 3=native — note 2 is skipped on both sides). The KEYWORDS
    field deserialization is a port-translation Rule 6 asymmetry worth highlighting:
    Go uses `func (ks *ExtImpAppnexusKeywords) UnmarshalJSON` typed-method polymorphism
    branching on first byte; Java uses runtime branching INSIDE AppnexusBidder via
    JsonNode.isObject/isArray/isTextual rather than a separate Jackson
    JsonDeserializer<ExtImpAppnexusKeywords> class. Both yield the same comma-joined
    string output; this is a Java-specific implementation choice (runtime-isobject-
    isarray-branching pattern, taxon `runtime-polymorphism-bidder-class`) that
    diverges from the Rule 6 default expectation of jackson-jsondeserialize. The
    iabCategories storage diverges: Go uses go-data-table (95-entry package-level
    var in adapters/appnexus/iab_categories.go); Java uses yaml-inlined (95 entries
    under adapters.appnexus.iab-categories in bidder-config/appnexus.yaml). Same
    data, different storage_kind — both reach the bidder via different injection.
    Porter advice: (a) reformat the Java bidder-params JSON to the Go-side canonical
    style for byte parity (this is mechanical), (b) when porting future bidders with
    multi-shape custom unmarshal, decide between the two Java patterns (runtime-
    branching in the bidder class vs separate JsonDeserializer) per the local
    conventions; appnexus chose the former. Also, the Java side declares the
    `mediafuse` parent_alias; Go has no equivalent alias declaration (Java carries
    aliases.mediafuse with maintainer override).
