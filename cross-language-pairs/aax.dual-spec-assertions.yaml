dual_spec_assertion_version: 1
bidder_name: aax
go_spec: prebid-server-go/read/test-fixtures/aax.golden.spec.yaml
java_spec: prebid-server-java/read/test-fixtures/aax.golden.spec.yaml
go_resolved_commit: d7f8515b86258688304b0d9b6668c6a0e258bc9e
java_resolved_commit: 69b1993c39ed3212ca63012a8c0924fdfa0b5d4a

assertions:
  bidder_params_sha256:
    go: 543bb3ef8a6e7fe06b0d73f43f90548a4040f8f67f765c8552ce3de5b3a83525
    java: c71febfe0778ea8b7e522fe04afa4bae0c76e6dbe3cc0e4c5ca2a07889004200
    byte_equal: false
    semantically_equal: false
    divergence_kind: semantic
    divergence_summary: |
      SEMANTIC DIVERGENCE — port-fidelity bug. The Java schema OMITS the
      `minLength: 1` constraint on `cid` and `crid` that the Go schema enforces.

      Go static/bidder-params/aax.json:
        "cid":  { "type": "string", "minLength": 1, "description": "..." }
        "crid": { "type": "string", "minLength": 1, "description": "..." }

      Java src/main/resources/static/bidder-params/aax.json:
        "cid":  { "type": "string", "description": "..." }
        "crid": { "type": "string", "description": "..." }

      Both files declare the same 2 properties as `required: [cid, crid]`,
      so an empty-string cid/crid will be REJECTED by Go (minLength:1 fails)
      but ACCEPTED by Java (no minLength, just required-presence). This is
      a real validation-behavior divergence: a publisher request with
      `imp.ext.bidder = {"cid": "", "crid": ""}` will succeed against the
      Java validator and fail against the Go validator. R5 cross-language
      structural parity FAILS at the semantic level, not just bytes.
    severity: fail
    upstream_action_recommended: |
      Add `"minLength": 1` to both `cid` and `crid` properties in the Java
      file at src/main/resources/static/bidder-params/aax.json. This is a
      one-line change that restores semantic parity. Recommend filing a
      port-fidelity bug upstream against prebid/prebid-server-java with
      cross-references to both files. The Go-side schema is canonical;
      Java should match it.

  bidder_info_capabilities:
    go:
      site: [banner, video, native]
      app: [banner, video, native]
    java:
      site: [banner, video, native]
      app: [banner, video, native]
    equivalent: true
    divergence_summary: |
      Both Go-source and Java-source specs declare the same capabilities:
      [banner, video, native] for both site and app. Match.
    severity: pass

  bidder_info_endpoint:
    go: https://prebid.aaxads.com/rtb/pb/aax-prebid
    java: https://prebid.aaxads.com/rtb/pb/aax-prebid?src={{PREBID_SERVER_ENDPOINT}}
    byte_equal: false
    semantically_equal: false
    divergence_kind: java-extra-source-attribution-param
    severity: warn
    divergence_summary: |
      Java appends a `?src={{PREBID_SERVER_ENDPOINT}}` query param that Go
      omits. Java's macro substitutes the prebid-server endpoint URL (used
      for source attribution / referral tracking on the AAX side); Go
      makes the bid call without surfacing this attribution. The bid
      response semantics are unaffected — same auction, same bid format —
      but Java carries one additional context field. Wave 11b B4 C1
      assertion-required-on-divergence: this entry is now mandatory under
      the FORM_DIVERGENT split (the endpoint URLs differ even after macro
      syntax normalization). Severity warn (not fail) because the
      divergence does not affect bid validity, only attribution.

  bidder_info_gvl_vendor_id:
    go: 720
    java: 720
    equivalent: true
    divergence_summary: null
    severity: pass

  bidder_info_maintainer:
    go: product@aax.media
    java: product@aax.media
    equivalent: true
    divergence_summary: null
    severity: pass

  bidder_info_geoscope:
    go: []
    java: []
    equivalent: true
    divergence_summary: null
    severity: pass

  bidder_info_modifying_vast_xml_allowed:
    go: true
    java: true
    equivalent: true
    divergence_summary: null
    severity: pass

  bidder_info_endpoint_construction:
    go_kind: single-token-substitution
    java_kind: single-token-substitution
    go_macros: [PREBID_SERVER_ENDPOINT]
    java_macros: [PREBID_SERVER_ENDPOINT]
    equivalent: true
    notes: |
      Both languages use the same {{PREBID_SERVER_ENDPOINT}} macro form;
      Java substitutes via String.replace at bean-wiring time (NOT per-request),
      Go via the canonical macros replacer at request time. Same observable URL,
      different mechanism timing.
    severity: pass

  params_schema_interpretation:
    go_required_fields: [cid, crid]
    java_required_fields: [cid, crid]
    go_combinators_used: []
    java_combinators_used: []
    go_flexible_types: []
    java_flexible_types: []
    go_properties: [cid, crid]
    java_properties: [cid, crid]
    go_constraints: { cid: { minLength: 1 }, crid: { minLength: 1 } }
    java_constraints: { cid: {}, crid: {} }
    equivalent: false
    divergence_summary: |
      Property set matches (cid + crid both required strings), descriptions
      match ("The customer id provided by AAX." / "The placement id provided
      by AAX."), but constraint sets differ — Java omits the minLength:1 that
      Go enforces. See bidder_params_sha256 assertion above for the full
      remediation guidance.
    severity: fail

  port_lineage:
    direction: unknown
    source_pr: null
    destination_pr: null
    fidelity_review_themes:
      - bid-type-3-step-chain
      - hardcoded-usd-currency
      - bidder-params-schema-drift

  reviewer_cohort:
    go_reviewers: []
    java_reviewers: [CTMBNara, AntoxaAntoxic]
    cross_language_coordinator: bretg

overall:
  cross_language_state: divergent-semantic
  blocker_count: 1
  warning_count: 0
  notes: |
    AAX is the ONLY pair in this set with a semantic (not whitespace-only)
    bidder_params_json divergence. The Java schema omits `minLength: 1` on
    both cid and crid that the Go schema enforces. This means a publisher
    request with empty-string cid/crid will be REJECTED by Go's validator
    but ACCEPTED by Java's validator — a real port-fidelity bug, not a
    formatting glitch. Recommend filing a port-fidelity bug upstream against
    prebid/prebid-server-java; the fix is a 2-line change to add `"minLength": 1`
    to each property in src/main/resources/static/bidder-params/aax.json.

    All non-params cross-language facts match: capabilities (site+app banner/
    video/native), GVL ID 720, maintainer email product@aax.media, empty
    geoscope, modifying_vast_xml_allowed:true, endpoint_construction
    (single-token-substitution with PREBID_SERVER_ENDPOINT macro). The
    behavioral implementations are also closely aligned: both use 3-step
    bid_type method_chain (by-bid-ext-typed-field via bid.ext.adCodeType
    -> by-imp-mediatype -> throw) with strict multi_format_detection, both
    hardcode USD currency (currency_overwrite_safety: unguarded-hardcoded
    on Java side, equivalent on Go side), both use openrtb2-passthrough
    request_body without any imp.ext unmarshal (no ExtImpAax POJO on either
    side; the upstream bidder reads imp.ext.bidder.{cid,crid} verbatim).

    Phase D agents flagged this as the canonical R5 SEMANTIC failure case
    (vs the byte-only failure cases on optidigital/mediasquare/appnexus/
    elementaltv/152media). The dual-spec assertion overall.cross_language_state
    is `divergent-semantic` and blocker_count=1 — this is the only pair in
    this set with a non-zero blocker_count, and the only pair where the cross-
    language test harness should produce a hard FAIL rather than a WARN.

    Both goldens are authored at the resolved commits and record this
    divergence: the Java-side golden carries a quirk
    (id: bidder-params-sha-divergence-from-go) capturing the same minLength
    omission, and the Go-side golden's `params.schema_interpretation.properties`
    block carries `constraints: { minLength: 1 }` on both `cid` and `crid`,
    making the divergence diff-comparable on either side.
