  notes: |
    Kobler is the canonical clean port pair and the ONLY pair in this set with byte-equal
    bidder_params_json across languages (R5 hard-pass). Schema content is trivial (single
    optional `test` boolean), capabilities, geoscope, GVL ID, maintainer email all match
    exactly. The Java port is a deliberate Go-to-Java translation (PR #3904 -> PR #3684);
    the Java side improved on the Go source by promoting devBidderEndpoint from a Go
    package-level const into KoblerConfigurationProperties.devEndpoint (@NotBlank), fixing
    the Go-side hardcoded-config-as-anti-pattern quirk. Currency conversion idiom diverges
    intentionally (Java passes bidRequest for time-context; Go does not) but this is a
    per-language asymmetry covered by Rule 32, NOT a port-fidelity violation. Porter advice:
    use kobler as the reference fixture for cross-language R5 contract verification — any
    new port pair should aim for byte-equal bidder_params (write Java JSON in the Go
    canonical style: literal block, double-quoted single-line `required` array, terminal
    newline, etc.).
