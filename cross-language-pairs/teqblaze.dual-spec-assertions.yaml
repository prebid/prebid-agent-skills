assertions:
  bidder_params_sha256:
    go: ef396f97c184f14224d0006d6277c6982e7afea42f650e43f31af2c79e8b53bb
    java: cf4b60b8f32e1379fe25290858433b8f03041384eabca6380dad1c91b0363f2a
    byte_equal: false
    semantically_equal: true                  # Same JSON Schema content (same $schema, properties, required+oneOf, types). TWO byte differences.
    divergence_kind: byte-only
    divergence_summary: |
      Two byte differences:
      (1) Title: Go says `"TeqBlaze Adapter Params"` (capital B). Java says `"Teqblaze Adapter Params"` (lowercase b). Description text on both says "TeqBlaze" — only the title diverges.
      (2) `oneOf` expansion: Go uses single-line form `{ "required": ["placementId"] }`. Java uses multi-line expanded form (each required: [...] on own indented line). Same JSON content; pretty-print style differs.
      Plus trailing-newline-presence: Java ends with `}\n`; Go ends with `}` (no trailing newline). Rule 38 byte-only divergence; Rule 39 derived view (combinators_used) agrees on `[oneOf]`.
    severity: warn

  bidder_info_capabilities:
    go:
      site: [banner, video, native]
      app: [banner, video, native]
    java:
      site: [banner, video, native]
      app: [banner, video, native]
    equivalent: true
    divergence_summary: null
    severity: pass

  bidder_info_gvl_vendor_id:
    go: 0
    java: 0
    equivalent: true
    divergence_summary: null
    severity: pass

