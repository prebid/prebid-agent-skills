    java: github@teqblaze.com
    equivalent: true
    divergence_summary: null
    severity: pass

  bidder_info_geoscope:
    go: []
    java: []
    equivalent: true
    divergence_summary: null
    severity: pass

  bidder_info_endpoint:
    go: ""                                    # whiteLabelOnly: true; parent has no endpoint
    java: "http://"                           # placeholder, never used
    byte_equal: false
    semantically_equal: true                  # Both indicate "parent non-functional"; aliases supply real endpoints
    divergence_kind: parent-non-functional-divergence
    divergence_summary: |
      Both sides declare the parent as non-functional but with different sentinels:
      Go uses `whiteLabelOnly: true` + omitted endpoint; Java uses `endpoint: http://`
      placeholder. Aliases (10 each side) supply real per-host endpoints. NOT a
      port-fidelity violation — it's the white-label-only-parent pattern (alternative
      to smarthub-style where the parent itself functions). Distinct flavor variant.
    severity: warn

  bidder_info_default_enabled:
    go: true
    java: true
    equivalent: true
    rule_45_match: n/a                        # Parent enabled on both; the 10 alias children all default-disabled on Java side per Rule 45
    divergence_summary: null
    severity: pass

  params_schema_interpretation:
    go_required_fields: []
    java_required_fields: []
