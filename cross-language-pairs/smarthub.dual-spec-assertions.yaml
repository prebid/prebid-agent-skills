assertions:
  bidder_params_sha256:
    go: 6d0d79e63f17e65beac23cb9dab6a7ad90e3eb729f333b725a106cc14415b000
    java: 92b2e3f638f6219083b14306cab72a3bee59f41c59e4961aa71accc152be0b65
    byte_equal: false
    semantically_equal: true                  # Same JSON Schema content (same $schema, properties, required, types). Java has trailing newline; Go does not.
    divergence_kind: byte-only
    divergence_summary: |
      JSON content equal. Bytes differ in trailing-newline presence: Java JSON ends
      with `}\n`; Go JSON ends with `}`. Rule 38 cross-language-byte-divergence WARN.
      To restore byte parity, drop the trailing newline on Java side (or add one on Go).
    severity: warn

  bidder_info_capabilities:
