overall:
  cross_language_state: aligned-with-known-divergence
  blocker_count: 0
  warning_count: 3
  notes: |
    Smarthub is the canonical Phase 5 P1 #2 fixture for ADR-003 Rule 44
    `white-label-saas` empire flavor. Largest empire in the corpus today (9 aliases
    on both sides, all coherently registered). Distinguished from adverxo
    (registration-only) by the per-alias `endpoint:` overrides — each alias child
    proxies through its own SaaS host (`{name}-prebid.attekmi.com`) while routing
    through the shared smarthub `Bidder<T>` instance.

    Three warn-level findings: (1) bidder_params_sha256 byte-divergent due to
    trailing-newline difference; semantically equal. (2) endpoint URL macro-form
    divergence (Go-template `{{.X}}` vs Java string-replace `{{X}}`); both forms
    valid Rule 11. (3) Alias IT class coverage — 8 of 9 Java aliases have IT
    classes; jdpmedia is missing despite having its fixture dir.

    No mutation-idiom divergence: both sides do `openrtb2-passthrough` (the entire
    BidRequest is marshaled directly). No currency conversion on either side.
    Single-batched on both sides (one HTTP request per call) — but with first-imp-
    only-extraction anti-pattern: only `request.imp[0].ext` is consulted for endpoint
    resolution (multi-imp callers' subsequent imps' bidder ext is ignored).

    Rebrand-in-progress: ADR-003 references the SmartHub→Attekmi rename via Java
    PR #3699. As of these pinned commits the rename has NOT landed — the YAML name,
    class names, and Go bidder constant remain `smarthub`/`SmartHub`. Only the URL
    host + maintainer email + JSON title carry the Attekmi branding. When the
    rename lands, this fixture will need Phase 2.7-style migration (add
    `lifecycle.rename` block; rename goldens).

    Phase 5 next: P1 #3 (teqblaze — second white-label-saas master with 9 aliases
    and a parallel structure to smarthub), then P2 (limelightDigital
    endpoint-macro-substitution flavor).
