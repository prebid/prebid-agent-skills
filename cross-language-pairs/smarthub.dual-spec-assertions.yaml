  bidder_info_endpoint:
    go: "https://prebid.attekmi.com/pbserver?partnerName={{.Host}}&seat={{.AccountID}}&token={{.SourceId}}"
    java: "https://prebid.attekmi.com/pbserver?partnerName={{Host}}&seat={{AccountID}}&token={{SourceId}}"
    byte_equal: false
    semantically_equal: false
    divergence_kind: macro-form-divergence
    divergence_summary: |
      Same observable URL pattern (both resolve to
      `prebid.attekmi.com/pbserver?partnerName={Host}&seat={AccountID}&token={SourceId}`)
      but with different macro syntax: Go uses Go-template form `{{.Host}}` (resolved
      via `macros.ResolveMacros` with `EndpointTemplateParams.Host/AccountID/SourceId`);
      Java uses string-replace form `{{Host}}` (resolved via three chained
      `String.replace` calls). Both forms valid per Rule 11
      (multi-token-substitution); the macro_syntax field on each
      bidder_info.endpoint_construction records the form (`go-template` vs
      `java-string-replace`). NOT a port-fidelity violation — the canonical
      cross-language asymmetry around macro syntax (per ADR-005-adjacent observation).
    severity: warn

