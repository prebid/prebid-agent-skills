    severity: pass

  bidder_info_maintainer:
    go: prebid@attekmi.com
    java: prebid@attekmi.com
    equivalent: true
    divergence_summary: |
      Both sides use `prebid@attekmi.com` (post-rebrand contact). Note: this is the
      Attekmi contact even though the bidder YAML name remains `smarthub` —
