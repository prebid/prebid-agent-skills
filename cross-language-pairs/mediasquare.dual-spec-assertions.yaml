assertions:
  bidder_params_sha256:
    go: 798a251b3a6b11aa42036a129f8f61b3f0a13335babe539a96658b01ddd44f4d
    java: 946207d8154ae56cf5b08d007b746cf75d4921a9650d2be5d6cf2f1893bf55a8
    byte_equal: false
    semantically_equal: true
    divergence_kind: byte-only
    divergence_summary: |
      Byte-only whitespace divergence in static/bidder-params/mediasquare.json.
      Go-side file (515 bytes): formats `required` as a single-line array
      `"required": ["owner", "code"]` — compact form.
      Java-side file (527 bytes): formats `required` as a 4-line block
      `"required": [\n    "owner",\n    "code"\n  ]` — multi-line form.
      Both files use 2-space indent and terminate with `\n}\n`. Parsing both as
      JSON yields semantically identical ASTs: same 2 properties (owner, code)
      with identical type=string + minLength=1 + descriptions, same
      required=[owner, code]. This is a pure whitespace/formatting divergence
      on a single field's array layout — classified as Phase D R5 byte-only
      failure with semantic equivalence.
    severity: warn

  bidder_info_capabilities:
    go:
      site: [banner, video, native]
      app: [banner, video, native]
    java:
      site: []
      app: [banner, video, native]
    equivalent: false
    divergence_summary: |
      CAPABILITY DIVERGENCE: Java bidder-config/mediasquare.yaml omits
      `site-media-types` entirely (yields empty list on MetaInfo POJO). Go
      static/bidder-info/mediasquare.yaml declares both site AND app
      capabilities with [banner, video, native]. Effectively, the Java
      configuration restricts mediasquare to app-only inventory while the Go
      configuration also accepts site inventory. This is a real cross-language
      capability divergence with operational impact — the same publisher
      request from a website would route to mediasquare on a Go PBS but be
      rejected on a Java PBS. Reviewers should reconcile: either add
      site-media-types to the Java YAML to match Go, or remove site from the
      Go YAML to match Java. Phase D agents flagged this as port-fidelity
      asymmetry not just whitespace; severity warn (operational asymmetry,
      not a hard fail because site capability omission is a legal YAML config).
    severity: warn

