overall:
  cross_language_state: divergent-byte-only
  blocker_count: 0
  warning_count: 2
  notes: |
    Mediasquare carries TWO distinct cross-language divergences. (1) bidder_params_json
    is byte-divergent due to the `required` array's single-line vs multi-line layout —
    semantically equivalent, just whitespace. (2) bidder_info.capabilities.site is empty
    on Java but populated [banner, video, native] on Go; this is a real configuration
    asymmetry where the Java port restricts inventory to app-only while Go allows site
    too. Schema content (owner, code, both required, both minLength=1), GVL ID 791,
    maintainer, geoscope all match. Both sides correctly opt-in to
    modifying_vast_xml_allowed:true. Behavioral implementations diverge significantly
    in idiom (Go: 4-file multi-file with custom msqParameters; Java: 10-class layout
    with Bidder<MediasquareRequest> generic + MediasquareCode/MediasquareMediaTypes
    type tree) but the cross-language behavioral parity holds (imp-flatten-aggregate
    batching, custom request body, by-response-payload-shape bid type resolution).
    Porter advice: (a) reformat one of the bidder-params JSON files for byte parity,
    (b) reconcile site-media-types — since the Go side is the older/canonical
    declaration, recommend adding `site-media-types: [banner, video, native]` to the
    Java bidder-config/mediasquare.yaml. Both fixes are small (1-line changes) and
    can ship as a parity-restoration housekeeping PR. The Java side's mtype computation
    via `bidType.ordinal() + 1` is a fragility worth noting (any reorder of the
    BidType enum breaks the wire-format mapping) — Go is explicit per-case.
