  - id: go.adapterstest.impids-required
    kind: count
    repo: go
    upstream_path: adapters/adapterstest
    glob: test_json.go
    mode: matches
    pattern: 'expected\.ImpIDs must contain at least one imp ID'
    expect: 1
    strict: true
    regenerate: "git grep -cF 'expected.ImpIDs must contain at least one imp ID' -- adapters/adapterstest/test_json.go"
