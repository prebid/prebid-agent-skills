    kind: absence
    repo: java
    upstream_path: src/main/java/org/prebid/server/bidder
    glob: '*Bidder.java'
    absent: 'tryParseImpExt'
    why: >
      The spelling the review missed. Pinned as absent so the INFO check keeps a
      referent: if a `try`-prefixed helper ever merges, the convention changed and
      the check should soften rather than keep citing a count.
    sites:
      - path: prebid-server-java/review/skills/bidder-class-pr-review/SKILL.md
        assert: '**zero** carry a `try` prefix'

