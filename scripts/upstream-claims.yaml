  - id: java.bidder-tests.makebids-204-cases
    kind: count
    repo: java
    upstream_path: src/test/java/org/prebid/server/bidder
    glob: "*BidderTest.java"
    mode: files
    pattern: 'givenHttpCall\(204|HttpResponse\.of\(\s*204'
    expect: 1
    strict: true
    why: >-
      port-go2java emits no 204 case against makeBids because HttpBidderRequester short-circuits NO_CONTENT
      before the bidder is invoked, so an emitted assertion of an empty result cannot hold. This is the corpus
      evidence for that omission. The single hit is sparteo, and it asserts an error rather than an empty
      result. If the count grows, the Java framework contract may have changed and the omission needs revisiting.
    regenerate: >-
