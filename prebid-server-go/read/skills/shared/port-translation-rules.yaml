rules_version: 0.4.0
intro: 49 explicit translation rules between Go and Java prebid-server adapter patterns, each anchored
  to an Adapter Specification field driver. Used by the future `port-go2java` and `port-java2go` skills
  as their translation contract. Two specs for the same bidder produced from each language MUST be consistent
  with these rules — a port that violates a rule surfaces as a port-fidelity warning.
