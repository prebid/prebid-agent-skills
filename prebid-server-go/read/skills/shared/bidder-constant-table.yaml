# Bidder constant lookup table — Phase D1.3 deliverable; refreshed Phase D3-B1.
#
# Maps each upstream Go bidder yaml_name to its `BidderName` constant root
# (the suffix of `Bidder{X}` declared in `openrtb_ext/bidders.go`). Sourced
# from upstream prebid/prebid-server master at the resolved_commit below.
#
# Used by:
# - port-go2java SKILL: when generating cross-language artifacts that
#   reference the Go-side constant (e.g., reviewer-comment anchors).
# - port-java2go SKILL: when emitting an entry into
#   openrtb_ext/bidders.go and exchange/adapter_builders.go (via
#   scripts/lib/port_engine.alphabetical_insert).
# - scripts/lib/port_engine.prefix_uniqueness_check: when
#   existing_names is not provided, the helper loads this table to run
#   the TestBidderUniquenessGatekeeping pre-check (first-6-letter prefix).
#
# Of the 271 entries, 84 are non-mechanical — the Go constant deviates
# from a naive title-case of the yaml_name. Examples: brand-acronym
# preservation (BidderAJA for `aja`; BidderMX for `mx`); reserved
# extension namespaces (Reserved* prefix); rebrands (BidderEmxDigital
# for `emx_digital`). The naive formula is
# `Bidder` + yaml_name[0].upper() + yaml_name[1:]; consult this table
# instead of recomputing.
#
# Module-version pinning: the upstream module path is declared in go.mod
# as `github.com/prebid/prebid-server/{module_version}`. The current
# major version is **v4** (PR #4710 bumped v3→v4 on 2026-03-05). All
# port-java2go templates that reference the import path consume
# ctx.module_version (default `v4`) so a future v5 bump is a one-line
# update at the SKILL Step 4 context-assembly site rather than a
# multi-template-touching change.
#
# Refresh cadence: regenerate when scripts/sync-from-upstream.py reports
# a new bidder upstream OR when go.mod's module-version line changes.
#
# Phase F2 / F-new-34 extension — `forms` sub-map (v1.0.0 promotion blocker
# #4). Most upstream bidders are MECHANICAL: their Go yaml_name lower-cases
# cleanly to the Java yaml_name, and PascalCase(yaml_name) == Go constant
# root == Java class root. These remain simple `name: ConstantRoot` string
# entries (backward-compatible). A minority — currently 6 — diverge
# non-mechanically across at least one of {Go yaml_name vs Java yaml_name,
# Go constant root vs Java class root, package name vs directory name}.
# For those, the entry value flips to a mapping with `go_constant_root`
# plus a `forms:` sub-map carrying the six per-aspect naming forms:
#
#   forms:
#     go_yaml_name:     str   # static/bidder-info/{x}.yaml + Go directory + Go package name (1:1 in 99% of pairs)
#     go_package_name:  str   # `package X` directive; usually == go_yaml_name; differs for cadent_aperture_mx
#     go_constant_root: str   # `openrtb_ext.Bidder{X}` constant suffix
#     java_yaml_name:   str   # bidder-config/{x}.yaml + Spring property keys + IT-fixture-folder name
#     java_class_root:  str   # `{X}Bidder` Java class root (also Configuration / ExtImp / Test class roots)
#     java_package:     str   # `org.prebid.server.bidder.{x}` Java package; usually == java_yaml_name
#
# Consumed by `scripts.lib.port_engine.lookup_forms(yaml_name) -> dict`
# (returns the populated sub-map when present, OR a mechanically-derived
# default when the entry is the simple-string form). Renderer reads
# `ctx.naming_form_resolution` (per-aspect form table) from this helper.
#
# Authoring guidance: only populate `forms:` when at least ONE form
# deviates from the mechanical formula. Mechanical formula:
#   go_yaml_name     = yaml_name            (the map key)
#   go_package_name  = yaml_name
#   go_constant_root = (the simple-string value)
#   java_yaml_name   = re.sub(r"[^a-z0-9]", "", yaml_name.lower())
#   java_class_root  = (the simple-string value)              # default; Rule 46 covers exceptions
#   java_package     = re.sub(r"[^a-z0-9]", "", yaml_name.lower())
#
# Currently populated `forms:` entries (6, the v1.0.0 F-new-34 set):
# - adkernelAdn       (Rule 46 lowercase; canary 7 master sample)
# - thetradedesk      (Rule 46 lowercase; PascalCase Java class divergence)
# - audienceNetwork   (Rule 46 lowercase; multi-form aspect coverage)
# - cadent_aperture_mx (Rule 46 underscore-drop + Rule 43 rebrand; intra-Go tri-form)
# - stroeerCore       (Rule 46 lowercase)
# - sspBC             (Rule 46 lowercase; brand-acronym preservation)

