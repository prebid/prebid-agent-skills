# Bidder constant lookup table — Phase D1.3 deliverable; refreshed Phase D3-B1.
#
# Maps each upstream Go bidder yaml_name to its `BidderName` constant root
# (the suffix of `Bidder{X}` declared in `openrtb_ext/bidders.go`). Sourced
# from upstream prebid/prebid-server master at the resolved_commit below.
#
# Used by:
# - port-go2java SKILL: when generating cross-language artifacts that
#   reference the Go-side constant (e.g., reviewer-comment anchors).
# - port-java2go SKILL: when emitting an entry into
#   openrtb_ext/bidders.go and exchange/adapter_builders.go (via
#   scripts/lib/port_engine.alphabetical_insert).
# - scripts/lib/port_engine.prefix_uniqueness_check: when
#   existing_names is not provided, the helper loads this table to run
#   the TestBidderUniquenessGatekeeping pre-check (first-6-letter prefix).
#
# Of the 271 entries, 84 are non-mechanical — the Go constant deviates
# from a naive title-case of the yaml_name. Examples: brand-acronym
# preservation (BidderAJA for `aja`; BidderMX for `mx`); reserved
# extension namespaces (Reserved* prefix); rebrands (BidderEmxDigital
# for `emx_digital`). The naive formula is
# `Bidder` + yaml_name[0].upper() + yaml_name[1:]; consult this table
# instead of recomputing.
#
# Module-version pinning: the upstream module path is declared in go.mod
# as `github.com/prebid/prebid-server/{module_version}`. The current
# major version is **v4** (PR #4710 bumped v3→v4 on 2026-03-05). All
# port-java2go templates that reference the import path consume
# ctx.module_version (default `v4`) so a future v5 bump is a one-line
# update at the SKILL Step 4 context-assembly site rather than a
# multi-template-touching change.
#
# Refresh cadence: regenerate when scripts/sync-from-upstream.py reports
# a new bidder upstream OR when go.mod's module-version line changes.

schema_version: "1.0.0"

upstream_source:
