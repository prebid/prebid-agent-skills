# Behavior Taxonomy — machine-readable source.
#
# Source of truth for the closed enumerations referenced by adapter-spec.
# schema.json. behavior-taxonomy.md is GENERATED from this file via
# scripts/render-taxonomy.py — DO NOT edit the markdown directly; edits
# made to the .md will be lost on next render.
#
# CI verifies render-drift via tests/test_render_taxonomy_drift.py.
#
# Phase 2.4 of execution-plan.md.

taxonomy_version: "1.0.0"
adapter_spec_version_min: "1.0.0"

intro: |
  Enumerated values for behavioral fields in the Adapter Specification. Each enumerated field has a default, an ordered or unordered set of allowed values, a `custom` fallback, and (for the rules-list patterns) `applied_in_order: true` semantics. The `custom` value REQUIRES a corresponding `quirks` entry — un-classified behavior cannot silently flow through. Defaults are emitted only when structural evidence affirmatively matches them; absence of evidence emits no default.

  This file is the source-of-truth for behavioral enums consumed by all 8 reader skills (4 Go + 4 Java) and the future write/port skills. Two specs for the same bidder produced from each language MUST agree on cross-language behavioral fields and MAY differ only on per-language idiom siblings (`go_idiom`, `java_idiom`, `mechanism_go`, `mechanism_java`).

how_to_read:
  - title: Default emission rule
    body: |
      An enumerated field's default is emitted only when the structural evidence affirmatively matches the default. For example, `make_requests.batching.rules[]` defaults to `[{ kind: single-batched }]` only when the reader confirms exactly one HTTP request is constructed and all imps are passed in it. If the reader cannot confirm, it emits no rules and surfaces an `incomplete-classification` quirk.
  - title: Custom-with-quirks contract
    body: |
      Any enumerated value of `custom` REQUIRES a `quirks[]` entry referencing the same field with a free-text summary. Readers that emit `custom` without a paired quirk fail validation rule R3.
  - title: Rules-list semantics
    body: |
      Rules-list fields (`batching.rules[]`, `bid_type_resolution.method_chain[]`) carry `applied_in_order: true`. Composability is allowed — Appnexus emits `[max-imps-per-request: 10, pod-grouping]`; Rubicon emits `[format-split, deals-split]`. Each rule MAY carry rule-specific fields (e.g., `max` on `max-imps-per-request`).
  - title: Per-language idiom siblings
    body: |
      Cross-language enumerated kinds live at the parent level (e.g., `mutation.entity_strategies`); the language-specific idiom lives under a sibling key (`mutation.go_idiom`, `mutation.java_idiom`). A spec emits BOTH the cross-language kind AND the relevant idiom for its source language.

enumerations:

  - field_path: "code.make_requests.batching.rules[]"
    description: |
      Refactored from scalar enum (`batching.kind`) to ordered list. Rules are applied in order; each rule may carry rule-specific fields.
    columns: ["Rule kind", "When it fires", "Carries", "Examples (bidder)", "Composability"]
    rows:
      - ["`single-batched`", "One HTTP request, all imps passed in. Default if the reader confirms a single `RequestData` carrying `len(request.Imp)` imps.", "none", "kobler, optidigital", "Terminal — does not compose with split rules."]
      - ["`per-imp`", "One HTTP request per imp. Loop in MakeRequests/makeHttpRequests producing N RequestData.", "none", "adkernel (per-imp split for some param combinations)", "Terminal."]
      - ["`max-imps-per-request`", "Imps split into batches of size N.", "`max: <int>`", "appnexus (`max: 10`)", "Composes with `pod-grouping` (Appnexus does both)."]
      - ["`format-split`", "One request per media type on multi-format imps.", "`formats: [banner, video, native, audio]`", "rubicon (multi-format split), adkernel (multi-format)", "Composes with `deals-split`."]
      - ["`deals-split`", "One request per deal line item on imps with deals.", "`deal_field: imp.pmp.deals[].id`", "rubicon", "Composes with `format-split`."]
      - ["`pod-grouping`", "Group imps by `imp.id` prefix before underscore (video adpod).", "`key: imp.id-prefix-before-underscore`", "appnexus video adpod", "Composes with `max-imps-per-request`."]
      - ["`imp-flatten-aggregate`", "Multiple imps coalesce into one custom request (the bidder's request shape is not OpenRTB-shaped).", "`custom_body_type: <type>`", "mediasquare (`MediasquareRequest`)", "Terminal."]
      - ["`filtered-subset`", "Filter imps by bidder-specific predicate before batching.", "`predicate: <free-text>`", "ogury (filters imps where `imp.ext.bidder` is non-null)", "Composes with `single-batched`, `per-imp`."]
      - ["`grouped-by-key`", "Group imps by an arbitrary key (publisher ID, account ID).", "`key: <field-path>`, `group_id_construction: <expr>`", "huaweiads (group by token), 33across (group by accountId)", "Composes with `max-imps-per-request`."]
      - ["`custom`", "Anything not captured above. REQUIRES `quirks` entry.", "n/a", "n/a", "n/a"]
    default: |
      `[{ kind: single-batched }]` when the reader observes one RequestData carrying all imps and no slicing logic.

  - field_path: "code.make_bids.bid_type_resolution.method_chain[]"
    description: |
      Refactored from scalar enum (`method`) to ordered chain. Each step has `{ method, field?, hardcoded_value?, fallback_action }`. `fallback_action` is one of:

      - `next` — try the next step in the chain.
      - `return-default` — return `default_value` and stop.
      - `throw` — emit a `BadServerResponse` error and stop.

      > **Cross-reference**: The full `errortypes.*` registry (BadInput, BadServerResponse, FailedToMarshal, FailedToUnmarshal, etc.) is documented at [`../../../review/skills/shared/framework-utilities.md`](../../../review/skills/shared/framework-utilities.md) (Error-Type Taxonomy section).

      Plus top-level `default_value` (default `banner`) and `multi_format_detection: { strict | lenient | none }`.

      Per-step schema:

      ```yaml
      method_chain:
        - method: <enum>           # by-imp-mediatype | by-bid-mtype | by-bid-ext-typed-field | by-imp-id-suffix | imp-prefix-lookup | by-response-payload-shape | hardcoded | custom
          field: <string>          # OPTIONAL. Required when method=by-bid-ext-typed-field. Path within bid.ext (e.g., "bid.ext.prebid.type", "bid.ext.appnexus.bidAdType").
          hardcoded_value: <enum>  # OPTIONAL. Required when method=hardcoded. The fixed BidType returned (e.g., BidTypeBanner).
          fallback_action: next | return-default | throw
      default_value: <BidType>     # OPTIONAL. Used when fallback_action=return-default on the last step.
      multi_format_detection: strict | lenient | none
      ```
    columns: ["Method", "What it does", "Example (bidder)"]
    rows:
      - ["`by-imp-mediatype`", "Resolve from the corresponding `imp` (matched by `bid.impid`) — checks which of `imp.banner / imp.video / imp.native / imp.audio` is non-nil. Default first step.", "optidigital, adagio"]
      - ["`by-bid-mtype`", "Resolve from `bid.mtype` (canonical OpenRTB 2.6 field — `1=banner, 2=video, 3=audio, 4=native`).", "seedtag, kueez"]
      - ["`by-bid-ext-typed-field`", "Look up `bid.ext.{path}` for a typed field (e.g., `bid.ext.prebid.type`, `bid.ext.appnexus.bidAdType`).", "kobler (`bid.ext.prebid.type`), appnexus (`bid.ext.appnexus.bidAdType`)"]
      - ["`by-imp-id-suffix`", "Parse a suffix on `imp.id` to disambiguate multi-format imps (e.g., `imp.id` ends in `_b` for banner, `_v` for video).", "adkernel multi-format split"]
      - ["`imp-prefix-lookup`", "Use a prefix on `imp.id` (typically before underscore) to look up the original imp.", "appnexus video adpod (paired with pod-grouping batching rule)"]
      - ["`by-response-payload-shape`", "Inspect the bid response payload structure (e.g., `bid.video != null` test).", "mediasquare (custom response with `video` sub-object)"]
      - ["`hardcoded`", "Always return a fixed media type.", "optidigital (always banner) — note: even single-mediatype adapters typically use `by-imp-mediatype`; `hardcoded` is rare"]
      - ["`custom`", "Anything not captured. REQUIRES `quirks` entry.", "n/a"]
    default: |
      `[{ method: by-imp-mediatype, fallback_action: throw }]` when the reader confirms the standard MType switch with no fallback.
    extra_prose: |
      **Examples of multi-step chains:**

      - **Aax**: `[{ method: by-bid-ext-typed-field, fallback_action: next }, { method: by-imp-mediatype, fallback_action: throw }]` — two steps, strict multi-format detection; the second step throws when neither `bid.ext.adCodeType` nor the matched imp's mediatype yields a type. The legacy 3-step form ending in `{ method: throw }` was schema-violating — `throw` is a `fallback_action`, not a `method`.
      - **Kobler**: `[{ method: by-bid-ext-typed-field, fallback_action: return-default }]` — one step with `default_value: banner`. The Go and Java specs MUST agree here.
      - **Generic openrtb**: `[{ method: by-bid-mtype, fallback_action: return-default }]` with `default_value: banner`.

      `multi_format_detection`:

      - `strict` — when imp has multiple media types and bid lacks `mtype`/typed-ext, throw.
      - `lenient` — fall back to default media type or first non-nil imp media type.
      - `none` — adapter does not handle multi-format imps.

  - field_path: "code.make_bids.http_status_handling.kind"
    description: |
      Splits HTTP-level status handling from application-level status handling. Note: this captures HOW the adapter checks HTTP status, NOT the application-layer body flag (handled below).
    columns: ["Kind", "What it means", "Examples"]
    rows:
      - ["`framework-default`", "Java pattern — adapter relies on framework-default `HttpUtil.validateResponse`. Returns errors auto-wrapped in `BidderError.badServerResponse`.", "most Java adapters"]
      - ["`framework-default-plus-empty-seatbid-shortcircuit`", "Java pattern — framework-default plus an early `if (CollectionUtils.isEmpty(bidResponse.getSeatbid())) return Collections.emptyList();` check.", "kobler (Java), optidigital (Java)"]
      - ["`custom-status-checks`", "Adapter implements bespoke status checks (e.g., specific 4xx codes treated as no-bid).", "adview"]
      - ["`canonical-go-helpers`", "Go pattern — adapter uses `adapters.IsResponseStatusCodeNoContent(resp)` and `adapters.CheckResponseStatusCodeForErrors(resp)`. The recommended pattern.", "optidigital (Go), most modern Go adapters"]
      - ["`legacy-raw-go`", "Go pattern — adapter directly inspects `responseData.StatusCode == http.StatusNoContent` / `!= http.StatusOK`. Not yet migrated to canonical helpers.", "kobler (Go)"]
      - ["`custom`", "Anything not captured. REQUIRES `quirks` entry.", "n/a"]
    default: |
      For Go, `canonical-go-helpers` if the canonical helpers are imported and called; `legacy-raw-go` if the adapter rolls its own status checks. For Java, `framework-default` if no override.
    extra_prose: |
      > **Cross-reference**: Go's canonical helpers `IsResponseStatusCodeNoContent` and `CheckResponseStatusCodeForErrors` are documented in [`../../../review/skills/shared/framework-utilities.md`](../../../review/skills/shared/framework-utilities.md) (Test Harness Contract section). The `legacy-raw-go` value flags adapters that pre-date these helpers and use direct `responseData.StatusCode == 204` checks instead.

  - field_path: "code.make_bids.application_status_handling"
    description: |
      Captures application-layer status indicators that live IN the response body, distinct from HTTP status. Paired with `http_status_handling`; both fields are always present in a spec.

      ```yaml
      application_status_handling:
        kind: none | retcode-field | custom-body-flag
        field: null               # Path into the response body, e.g., "retcode".
        success_codes: []         # E.g., [0, 200] for huaweiads.
        error_codes: []           # E.g., [400, 401, 403, 404, 500, 503] for huaweiads.
      ```
    columns: ["Kind", "What it means", "Example"]
    rows:
      - ["`none`", "Adapter does not check an application-layer status field.", "kobler, optidigital"]
      - ["`retcode-field`", "Adapter checks a `retcode` (or similar) field in the response body. Pairs `field`, `success_codes`, `error_codes`.", "huaweiads (`retcode` with success in {200} and errors in {400, 401, 403, 404, 500, 503})"]
      - ["`custom-body-flag`", "Adapter checks a non-standard body flag. REQUIRES `quirks` entry.", "n/a"]
    default: |
      `{ kind: none }` when no body-status check is found.

  - field_path: "code.make_requests.endpoint_resolution"
    description: |
      Split into `kind` (semantic, cross-language) + `mechanism_go` / `mechanism_java` (language-specific implementation).
    sub_sections:
      - title: "Kinds (semantic)"
        columns: ["Kind", "What it means", "Example"]
        rows:
          - ["`static`", "A literal URL with no substitution.", "kueez (single-string endpoint)"]
          - ["`single-token-substitution`", "One macro field substituted (e.g., `{{.AccountID}}`).", "adagio"]
          - ["`multi-token-substitution`", "Multiple macros substituted.", "rubicon (`{{.AccountID}}` + `{{.ZoneID}}`)"]
          - ["`query-parameter-augmentation`", "Endpoint URL has query params appended at request time (e.g., `?member_id=123`).", "appnexus (`member_id`)"]
          - ["`runtime-region-selection`", "Endpoint URL chosen from a runtime context (e.g., country code → region).", "huaweiads"]
          - ["`deploy-time-token`", "Endpoint URL has a non-Go-template placeholder substituted pre-deployment by the operator. Surfaces in `deploy_time_tokens[]`.", "rubicon (`REGION` token)"]
          - ["`dev-prod-toggle`", "Endpoint chosen between two literal URLs based on a request-time flag.", "kobler (`testMode` flag toggles between endpoint and devEndpoint)"]
          - ["`custom`", "Anything else. REQUIRES `quirks` entry.", "n/a"]
      - title: "Mechanisms (per-language implementation)"
        body: |
          **Go:**

          | Mechanism | When |
          |---|---|
          | `text/template` | Adapter parses a Go template at Builder time. |
          | `macros.NewStringIndexBasedReplacer` | Adapter uses the canonical replacer helper. |
          | `net/url` | Adapter constructs the URL via `url.URL` / `url.Values`. |
          | `string-concat` | Adapter concatenates strings or uses `fmt.Sprintf`. |
          | `null` | When no mechanism applies (Java-source spec). |

          **Java:**

          | Mechanism | When |
          |---|---|
          | `string-replace` | Adapter calls `endpoint.replace("{{.X}}", value)`. |
          | `URIBuilder` | Adapter uses `org.apache.http.client.utils.URIBuilder`. |
          | `custom-resolver-class` | Adapter uses a co-located resolver class (e.g., `RubiconUriBuilder`). |
          | `null` | When no mechanism applies (Go-source spec). |

          A spec emits `kind` always and the relevant `mechanism_*` for its source language; the other-language mechanism is null.

          > **Cross-reference — two distinct enums by design**: The schema declares two related but DIFFERENT enums for endpoint classification. `bidder_info.endpoint_construction.kind` (per `adapter-spec.schema.json` `$defs/BidderInfo.endpoint_construction.kind`) declares 9 values describing the YAML-declared endpoint shape: `static, template-macro, url-with-query, dev-prod-toggle, hardcoded-toggle, runtime-region-selection, deploy-time-token, single-token-substitution, custom`. `code.make_requests.endpoint_resolution.kind` declares 8 values describing the adapter-code mechanism: `static, single-token-substitution, multi-token-substitution, query-parameter-augmentation, runtime-region-selection, deploy-time-token, dev-prod-toggle, custom`. The overlap covers the cases where YAML form and code form align; the per-scope differences capture cases where they don't (e.g., a YAML `template-macro` may be implemented in code as `multi-token-substitution`). Earlier versions of this doc claimed they "share one canonical enum citing port-translation Rule 5" — that was incorrect (Rule 5 is actually about Site/App mutation idiom, not endpoint construction); the two enums have always been disjoint by schema design.

  - field_path: "code.make_requests.mutation"
    description: |
      ```yaml
      mutation:
        mutates_request: bool
        entity_strategies:        # Open map. Keys are any OpenRTB BidRequest field name (Site, App, Source, Imp, Banner, Device, User, Cur, Ext, Regs, Video, Geo, Id, RequestExt, etc.); values are from the closed strategy enum below.
          Site: ...
          App: ...
          Source: ...
          Imp: ...
          Banner: ...
          Device: ...
          User: ...
          Cur: ...
        go_idiom: ...             # Sibling — populated only on Go-source specs.
        java_idiom: ...           # Sibling — populated only on Java-source specs.
      ```
    sub_sections:
      - title: "Cross-language `entity_strategies` values"
        columns: ["Strategy", "What it means", "Go example", "Java example"]
        rows:
          - ["`none`", "Entity is unchanged.", "n/a", "n/a"]
          - ["`copy-then-mutate`", "Make a shallow or deep copy, mutate the copy, swap pointer.", "optidigital (`siteCopy := *site; siteCopy.X = ...; request.Site = &siteCopy`)", "n/a — Java doesn't naturally use this."]
          - ["`immutable-rebuild`", "Use a builder pattern to produce a new instance.", "n/a — Go doesn't naturally use this.", "kobler (`device.toBuilder().ipv6(null).ip(null).build()`)"]
          - ["`in-place`", "Mutate the entity directly via pointer/reference.", "kobler Go (`device.IP = \"\"`)", "n/a — Java POJOs are typically immutable."]
          - ["`append-if-missing`", "Append a value to a list if not already present (e.g., currency list).", "kobler Go (`Cur = append(Cur, \"USD\")` if not present)", "kobler Java (`new ArrayList<>(currencies); newCurrencies.add(DEFAULT)`)"]
          - ["`replace-with-null`", "Adapter sets the entity to null to suppress passthrough (e.g., `request.toBuilder().cur(null).build()`).", "n/a — Go does not naturally use this.", "rubicon Java (`Cur: replace-with-null`)"]
          - ["`synthesize-app-replacement`", "Adapter destructively converts request shape — deletes one entity, synthesizes a different one. Canonical: vungle (Site→App synthesis when only Site is present). Phase 2 ADR-007 F3.", "vungle Go", "n/a"]
      - title: "Go idioms (`mutation.go_idiom`)"
        columns: ["Idiom", "When"]
        rows:
          - ["`ptrutil.Clone`", "Adapter uses `ptrutil.Clone[T]` for deep-copy of pointer fields. Recommended for `Site`, `App`, `Publisher` mutations."]
          - ["`shallow-copy`", "Adapter dereferences a pointer to copy a value, mutates fields, then re-points."]
          - ["`direct-pointer-mutation`", "Adapter mutates through the pointer directly (mutates input). NOT recommended — flagged by reviewers."]
          - ["`none`", "Adapter does not mutate."]
      - title: "Java idioms (`mutation.java_idiom`)"
        columns: ["Idiom", "When"]
        rows:
          - ["`lombok-tobuilder`", "Adapter uses `entity.toBuilder().field(value).build()` to produce a new immutable instance. Default Java pattern."]
          - ["`flexible-extension-fillExtension`", "Adapter uses `FlexibleExtension.fillExtension` to add fields to an extension while preserving unknowns."]
          - ["`none`", "Adapter does not mutate."]

  - field_path: "code.make_requests.imp_ext_unmarshal"
    description: |
      ```yaml
      imp_ext_unmarshal:
        kind: standard-two-phase | direct | none | custom
        mechanism_go: jsonutil-two-phase | null
        mechanism_java: typeref-extprebid | typeref-custom-wrapper | direct-class | null
        target_type: openrtb_ext.ExtImp{Xyz} | ExtImp{Xyz}
        wrapper_type: null | <wrapper-class-name>
      ```
    sub_sections:
      - title: "Kinds (cross-language)"
        columns: ["Kind", "What it means", "Example"]
        rows:
          - ["`standard-two-phase`", "First unmarshal `imp.Ext` to a wrapper (`ExtImpBidder` Go / `ExtPrebid` Java), then unmarshal the inner `bidder` field to `ExtImp{Xyz}`. Default.", "kobler"]
          - ["`direct`", "Unmarshal `imp.Ext` directly to a custom wrapper class — the framework's `ExtImpBidder` is not used.", "appnexus (uses `AppnexusExtImp` direct wrapper)"]
          - ["`none`", "Adapter does not unmarshal `imp.ext` (no bidder-specific params).", "ogury (no proto)"]
          - ["`custom`", "Anything else. REQUIRES `quirks` entry.", "n/a"]
      - title: "Mechanisms (per-language)"
        body: |
          **Go:**

          - `jsonutil-two-phase` — the canonical pattern: `jsonutil.Unmarshal(imp.Ext, &bidderExt); jsonutil.Unmarshal(bidderExt.Bidder, &impExt)`.
          - `null` — when `kind: direct` or `none` or on Java-source specs.

          **Java:**

          - `typeref-extprebid` — canonical: `new TypeReference<ExtPrebid<?, ExtImp{Xyz}>>(){}` then `mapper.convertValue(imp.getExt(), TYPE_REFERENCE).getBidder()`.
          - `typeref-custom-wrapper` — uses a custom wrapper TypeReference (e.g., Appnexus `AppnexusExtImp`).
          - `direct-class` — the params type itself is the deserialization target (no wrapper).
          - `null` — when no mechanism applies.

          `wrapper_type` is null for the standard case; populated with the class/struct name for the direct/custom-wrapper cases.

  - field_path: "code.make_bids.currency_overwrite_safety"
    description: ""
    columns: ["Value", "What it means", "Example"]
    rows:
      - ["`guarded`", "Adapter overwrites `bidResponse.Currency` only when conditions are met (e.g., currency matches request currency).", "n/a — rare in master."]
      - ["`unguarded`", "Adapter overwrites `bidResponse.Currency` unconditionally (potential data loss).", "n/a — flagged by reviewers, typically removed."]
      - ["`unguarded-hardcoded`", "Adapter sets `bidResponse.Currency` to a hardcoded literal (e.g., `\"USD\"`) regardless of upstream value.", "aax (forced USD)"]
      - ["`passthrough-from-response`", "Adapter sets `bidResponse.Currency = response.Cur` from the upstream response. Default-recommended.", "kobler (both Go and Java)"]
      - ["`none`", "Adapter does not set `bidResponse.Currency`. The framework defaults the currency.", "optidigital"]
    default: |
      `none` when no `bidResponse.Currency = ...` assignment is found.

  - field_path: "code.make_bids.bid_pointer_pattern"
    description: |
      Cross-language values plus per-language siblings for Go-specific iteration idioms.
    sub_sections:
      - title: "Cross-language (`bid_pointer_pattern`)"
        columns: ["Value", "What it means", "Example"]
        rows:
          - ["`flatten-streams`", "Java stream pipeline using `flatMap` to flatten seatBid → bid pairs.", "kobler (Java)"]
          - ["`indexed-iteration`", "Loop using indexed access (`for i := range slice` / `for (int i = 0; i < ...; i++)`).", "kobler (Go)"]
          - ["`pointer-iteration`", "Loop using value-pointer references (Go: `&seatBid.Bid[i]`).", "optidigital (Go)"]
      - title: "Go sibling (`bid_pointer_go_sibling`)"
        columns: ["Value", "When"]
        rows:
          - ["`indexed-seatbid`", "Adapter ranges over `response.SeatBid` indexed and bids indexed. Idiom: `for i := range response.SeatBid { for j := range response.SeatBid[i].Bid { ... } }`."]
          - ["`range-value-pointer`", "Adapter ranges over values with pointer indexing. Idiom: `for _, seatBid := range response.SeatBid { for i := range seatBid.Bid { ... } }`."]
          - ["`null`", "On Java-source specs."]
    extra_prose: |
      A spec emits `bid_pointer_pattern` always; `bid_pointer_go_sibling` is populated only on Go-source specs.

  - field_path: "tests directory naming"
    description: ""
    sub_sections:
      - title: "Go (`tests.go_directory_naming`)"
        columns: ["Value", "What it means", "Example"]
        rows:
          - ["`canonical`", "Test root is `<bidder>test/` with no separator (e.g., `koblertest/`).", "kobler, optidigital"]
          - ["`legacy-test`", "Test root is `<bidder>/test/` (separator). Older convention.", "msft (`adapters/msft/test/`)"]
          - ["`custom`", "Anything else. REQUIRES `quirks` entry.", "msft (`adapters/msft/test-extrainfo/` co-existing with `test/`)"]
      - title: "Java (`tests.java_it_folder_naming`)"
        columns: ["Value", "What it means", "Example"]
        rows:
          - ["`canonical`", "IT fixtures under `src/test/resources/org/prebid/server/it/openrtb2/<bidder>/` with 4-file split (`test-{name}-bid-request.json`, `...-bid-response.json`, `test-auction-{name}-request.json`, `...-response.json`).", "most adapters"]
          - ["`suffix-augmented`", "The IT folder name carries an extra suffix (e.g., `<bidder>-cache/` for cache-flow tests).", "n/a — rare."]
          - ["`multi-folder`", "Multiple sibling folders for different test flows (auction vs AMP vs video).", "rubicon"]
          - ["`custom`", "Anything else. REQUIRES `quirks` entry.", "n/a"]

  - field_path: "params.schema_interpretation.combinators_used[]"
    description: |
      Unordered set; emitted as a list.
    columns: ["Value", "What it means", "Example"]
    rows:
      - ["`oneOf`", "Schema uses `oneOf` for mutually-exclusive variants.", "rubicon (`accountId` either string or int)"]
      - ["`anyOf`", "Schema uses `anyOf` for any-of variants.", "n/a — rare."]
      - ["`not`", "Schema uses `not` to negate.", "n/a — very rare."]
      - ["`oneOf-of-oneOf`", "Schema uses nested `oneOf` (compositional).", "rare; surfaces in port-translation as a fidelity concern."]
      - ["`json-aliases-present`", "Informational — Java POJO carries `@JsonAlias({...})` indicating legacy field-name compatibility.", "appnexus (Java)"]
    default: |
      empty list when no combinators are used.

  - field_path: "ext_pojo_construction.framework_choice"
    description: ""
    columns: ["Language", "Value", "When"]
    rows:
      - ["Go", "`go-struct`", "Always — Go has only one POJO style."]
      - ["Java", "`lombok-value-builder`", "Default Java pattern: `@Value @Builder` on `ExtImp{Xyz}`."]
      - ["Java", "`lombok-data`", "Mutable POJO `@Data @NoArgsConstructor`. Rare for ExtImp."]
      - ["Java", "`lombok-value-staticconstructor`", "`@Value(staticConstructor = \"of\")` — Kobler's choice."]

  - field_path: "ext_pojo_construction.custom_unmarshal.kind"
    description: ""
    columns: ["Value", "What it means", "Example"]
    rows:
      - ["`none`", "Default — framework handles unmarshal.", "kobler"]
      - ["`go-unmarshaljson`", "Go custom `func (X *Type) UnmarshalJSON(data []byte) error`.", "appnexus (Go — keywords field accepts string/object/array)"]
      - ["`jackson-jsondeserialize`", "Java `@JsonDeserialize(using = XyzDeserializer.class)` paired with a custom `JsonDeserializer<T>` class.", "n/a in Kobler; rubicon (Java)"]
      - ["`jackson-jsonalias-only`", "Java `@JsonAlias({...})` on individual fields only — no full deserializer. Used for legacy field-name compatibility.", "appnexus (Java)"]
      - ["`runtime-isobject-isarray-branching`", "Adapter branches at runtime on JSON shape (`isObject() vs isArray()`).", "appnexus keywords field"]
      - ["`custom`", "Anything else. REQUIRES `quirks` entry.", "n/a"]
    extra_prose: |
      Sibling field `where_branched`:

      - `bidder-class` — the branching happens in the bidder class itself.
      - `jsondeserializer-class` — branching in a separate JsonDeserializer.
      - `type-method` — branching in an `UnmarshalJSON` method on the type.
      - `null` — when `kind: none`.

  - field_path: "headers_constructed.authentication_kind"
    description: ""
    columns: ["Value", "What it means", "Example"]
    rows:
      - ["`none`", "No authentication header.", "kobler, optidigital"]
      - ["`basic-auth`", "HTTP Basic auth (base64-encoded `user:pass`). Pre-built in constructor.", "rubicon (`Authorization: Basic ...`)"]
      - ["`bearer-token`", "Bearer token in Authorization header.", "bidstack (Go) — Phase 2 ADR-008 stretch pair."]
      - ["`hmac-digest`", "HMAC-SHA256 of body, computed per-request.", "huaweiads"]
      - ["`custom`", "Anything else. REQUIRES `quirks` entry.", "n/a"]
    extra_prose: |
      `authentication_input` lists the config fields used to compute the auth value (e.g., `["XAPI.Username", "XAPI.Password"]` for Rubicon).

  - field_path: "iab_category_storage.storage_kind"
    description: ""
    columns: ["Value", "What it means", "Example"]
    rows:
      - ["`yaml-inlined`", "The IAB-category lookup map is inlined directly in `bidder-config/{xyz}.yaml`. Java-only pattern.", "appnexus (Java) — 95-entry `iabCategories` map, counted at master."]
      - ["`go-data-table`", "The lookup is a Go data file (e.g., `iab_categories.go`) co-located in the adapter directory.", "msft (Go)"]
      - ["`dynamic-fetched`", "The lookup is fetched at runtime from an upstream service. Rare.", "n/a in master sample."]
      - ["`none`", "Adapter does not perform IAB-category lookup.", "kobler, optidigital"]
    extra_prose: |
      Companion fields:

      - `yaml_field` — the YAML field name (e.g., `iab-categories`).
      - `go_data_file` — the Go file path (e.g., `adapters/msft/iab_categories.go`).
      - `table_size` — the number of entries in the table.
      - `delivery_mechanism` — `constructor-arg` (table is passed into the bidder constructor) or `static-init` (table is a package-level var) or `null`. Renamed from `injection` per ADR-001 D2 (Phase 2.7 migrates goldens).

quirks_taxa:
  - id: hardcoded-config-as-anti-pattern
    category: anti-pattern
    description: Adapter hardcodes a value that should live in YAML config. Canonical&#58; Kobler `devBidderEndpoint` constant.
    surfaces_in: [quirks]
  - id: json-key-style-mismatch
    description: JSON tag uses a different style than surrounding adapter. Canonical&#58; msft `pubclick` vs `pub_click`.
    surfaces_in: ["quirks + ext_struct.fields[].notes"]
  - id: port-fidelity-divergence
    description: Java port differs from Go source in load-bearing way. Canonical&#58; Kobler currency-conversion bidRequest context.
    surfaces_in: ["quirks + cross_language.port_concerns"]
  - id: bidder-constant-mismatch
    description: Test/builder references the wrong bidder constant. Canonical&#58; kobler_test.go `BidderKargo`, params_test.go `BidderKrushmedia`.
    surfaces_in: ["quirks + provenance.warnings"]
  - id: yaml-field-name-typo
    description: YAML field uses a near-canonical name PBS silently ignores.
    surfaces_in: ["quirks + bidder_info.yaml_field_name_quirks"]
  - id: multi-file-layout-justified
    description: Multi-file layout that the heuristic flags but reviewer accepted. Canonical&#58; Mediasquare non-OpenRTB body justified split.
    surfaces_in: [quirks]
  - id: legacy-go-pattern-pre-1.22
    description: Go code uses pattern that pre-dates Go 1.22 (e.g., capture-by-reference loop).
    surfaces_in: [quirks]
  - id: identifier-rule-workaround
    description: Class name modified to satisfy Java identifier rules. Canonical&#58; `152media` → `OneFiveTwoMediaTest`.
    surfaces_in: ["quirks + code_naming (top-level)"]
  - id: acronym-case-preservation
    description: TitleCase preserves brand acronym. Canonical&#58; `ElementalTV`, `FeedAd`, `BidTheatre`.
    surfaces_in: ["quirks + code_naming.preserves_acronym_case (top-level)"]
  - id: tilde-alias-syntax
    description: YAML alias declared as `oldname&#58; ~` rather than full block.
    surfaces_in: ["quirks + aliases[].config_form"]
  - id: bidder-rename-three-step
    description: Bidder rename via DELETE old YAML + CREATE new YAML + alias-back via tilde. Canonical&#58; Adoppler → ElementalTV.
    surfaces_in: ["quirks + lifecycle.rename"]
  - id: endpoint-compression-typo
    description: Specific case of `yaml-field-name-typo` for the gzip-compression field. Canonical&#58; Ogury `endpointCompression` vs `endpoint-compression`.
    surfaces_in: ["quirks + bidder_info.yaml_field_name_quirks"]
  - id: currency-conversion-bidrequest-context
    description: Java passes `bidRequest` for time-context to currency helper; Go does not. Cross-language port concern.
    surfaces_in: ["quirks (Java spec only)"]
  - id: mutation-idiom-tobuilder
    description: Java uses `lombok-tobuilder` where Go uses pointer-mutation. Cross-language port concern.
    surfaces_in: [quirks]
  - id: dev-endpoint-config-promotion
    description: Java port moves a Go-side hardcoded constant into YAML config (Kobler `devEndpoint`).
    surfaces_in: ["quirks (cross-language win)"]
  - id: incomplete-classification
    description: Reader could not classify a behavioral field with affirmative evidence.
    surfaces_in: ["quirks (read-time warning)"]
  - id: legacy-encoding-json-direct-usage
    category: anti-pattern
    description: Go adapter uses `encoding/json` `Marshal`/`Unmarshal` directly instead of `jsonutil`.
    surfaces_in: ["quirks + provenance.warnings"]
  - id: legacy-test-helpers-imported
    description: Adapter test imports `OrtbMockService`, `BidOnTags`, etc. — should migrate to JSON harness.
    surfaces_in: ["quirks + provenance.warnings"]
  - id: unguarded-currency-overwrite
    category: anti-pattern
    description: Adapter sets `bidResponse.Currency = response.Cur` without guarding against empty string. Canonical&#58; Optidigital.
    surfaces_in: ["quirks + code.make_bids.currency_overwrite_safety"]
  - id: hardcoded-bid-type
    category: anti-pattern
    description: '`MakeBids` returns a fixed BidType regardless of upstream response. Canonical&#58; Optidigital always returns BidTypeBanner.'
    surfaces_in: ["quirks + code.make_bids.bid_type_resolution.method_chain"]
  - id: legacy-impext-naming
    description: Imp ext struct uses legacy `ImpExt{Bidder}` pattern instead of canonical `ExtImp{Bidder}`. Canonical&#58; Optidigital `ImpExtOptidigital`.
    surfaces_in: ["quirks + params.ext_struct.type_name"]
  - id: cross-language-byte-divergence
    description: '`bidder_params_json` bytes differ between Go and Java sides; sha256 mismatch breaks the port-fidelity contract (Rule 1). Canonical&#58; 4 Java goldens (elementaltv, mediasquare, appnexus, huaweiads) detect divergence vs Go.'
    surfaces_in: ["quirks + provenance.warnings"]
  - id: alias-yaml-only
    description: 'Java alias declared in a parent YAML''s `aliases:` block but with no dedicated bidder class or IT fixtures (yet). Canonical&#58; Appnexus parent''s tilde-aliases pre-IT-class.'
    surfaces_in: ["quirks + aliases[]"]
  - id: application-status-code
    description: Adapter checks an application-level status field in the response body (e.g., `retcode`) rather than (or in addition to) HTTP status. Pairs with `application_status_handling.kind`. Canonical&#58; huaweiads `retcode` field.
    surfaces_in: ["quirks + code.make_bids.application_status_handling"]
  - id: country-code-resolution-fallback-chain
    description: Country code resolved through an ordered chain (e.g., `device.geo.country` → `user.geo.country` → MCC-MNC mapping → hardcoded default). Canonical&#58; huaweiads `CountryCodeResolver`.
    surfaces_in: [quirks]
  - id: custom-request-response-shape
    description: Adapter sends and/or receives non-OpenRTB JSON payloads (vendor-specific request body or response shape). Canonical&#58; huaweiads (`HuaweiAdsRequest`/`HuaweiAdsResponse`).
    surfaces_in: ["quirks + code.make_requests.request_body"]
  - id: empty-response-as-error
    description: Adapter treats an empty response (e.g., zero-length result list) as a protocol error rather than a no-bid. Canonical&#58; huaweiads empty `multiad`.
    surfaces_in: [quirks]
  - id: high-test-method-count
    description: Adapter has an unusually large unit-test count (>50 `@Test` methods or >2000 LOC of tests). Canonical&#58; huaweiads (~198 @Test methods, ~4880 LOC).
    surfaces_in: ["quirks + tests.unit_test_methods_count"]
  - id: nested-configuration-properties
    description: '`XyzConfigurationProperties` declares a nested non-trivial inner sub-class with multiple fields. Canonical&#58; huaweiads `ExtraInfo` (6 fields nested inside `HuaweiAdsConfigurationProperties`).'
    surfaces_in: ["quirks + spring_config.configuration_properties_class.nested_classes"]
  - id: parameterized-request-type
    description: Java bidder class declares `Bidder<CustomType>` with a non-default request body type. Canonical&#58; huaweiads (`Bidder<HuaweiAdsRequest>`), mediasquare (`Bidder<MediasquareRequest>`).
    surfaces_in: ["quirks + bidder_class.parameterized_request_type"]
  - id: per-request-cryptographic-auth
    description: Adapter computes per-request HMAC/signature for the Authorization header (not pre-built basic auth or static bearer). Canonical&#58; huaweiads HMAC-SHA-256 Digest.
    surfaces_in: ["quirks + headers_constructed.authentication_kind"]
  - id: redundant-work
    category: anti-pattern
    description: Adapter performs duplicate work without caching (e.g., parses `imp.ext` twice per request cycle). Canonical&#58; huaweiads `parseImpExt` called once in `makeHttpRequests` and again in `makeBids`.
    surfaces_in: [quirks]
  - id: runtime-polymorphism-bidder-class
    description: Java bidder class delegates to a runtime-selected helper based on request shape. Canonical&#58; appnexus video adpod runtime branch.
    surfaces_in: ["quirks + bidder_class"]
  - id: runtime-region-selection
    description: 'Endpoint URL chosen at runtime based on geographic context (country code → region). Same value as `endpoint_resolution.kind: runtime-region-selection`. Canonical&#58; huaweiads (5 region endpoints + EUROPEAN allowlist).'
    surfaces_in: ["quirks + endpoint_resolution"]
  - id: schema-undocumented-runtime-field
    description: Runtime POJO field that is NOT declared in the `bidder-params/{bidder}.json` schema (silently accepted, undocumented). Canonical&#58; huaweiads `ExtImpHuaweiAds.isTestAuthorization`.
    surfaces_in: ["quirks + params"]
  - id: shared-default-fan-out
    description: A single resolved default value fans out to multiple downstream uses. Canonical&#58; huaweiads resolved country code reused for `App.country`, `Device.belongCountry`, `Device.localeCountry`, endpoint resolver.
    surfaces_in: [quirks]
  - id: spring-config-properties-subclass
    description: Java configuration class extends `BidderConfigurationProperties` to add custom YAML fields. Canonical&#58; appnexus (`AppnexusConfigurationProperties` adds `platformId`, `iabCategories`), kobler (`devEndpoint`), huaweiads (`extraInfo`).
    surfaces_in: ["quirks + spring_config.configuration_properties_class.extends"]
  - id: time-formatting-quirk
    description: Non-standard time formatting at request build (e.g., custom epoch format, lowercased hex digest from Apache commons-codec). Canonical&#58; huaweiads HMAC nonce (`System.currentTimeMillis()` + lowercase Hex).
    surfaces_in: [quirks]
  - id: vendor-specific-protocol-quirk
    description: 'Bidder protocol carries a vendor-specific encoding quirk that doesn''t map to OpenRTB cleanly. Canonical&#58; huaweiads `creativeType > 100 ? type - 100 : type` offset, `nativeVersion: "1.1"` default.'
    surfaces_in: [quirks]
  - id: vendor-to-iab-mapping
    description: Adapter maps vendor-specific category codes to IAB categories at request or response time. Canonical&#58; huaweiads + appnexus IAB lookups.
    surfaces_in: ["quirks + iab_category_storage"]
  - id: yaml-configuration-rewrite-table
    description: YAML config carries a list of rewriting rules consumed at runtime. Canonical&#58; huaweiads `extra-info.pkgNameConvert` (app-bundle rewrite rules).
    surfaces_in: [quirks]
  - id: yaml-inlined-data-table
    description: 'YAML config inlines a large lookup data table (>50 entries) consumed at runtime. Canonical&#58; appnexus 95-entry IAB-category inline map (counted at master, not asserted). Pairs with `iab_category_storage.storage_kind: yaml-inlined`.'
    surfaces_in: ["quirks + iab_category_storage"]

  # New taxa from ADR-007 (Phase 2 novel-pattern schema additions):
  - id: multi-endpoint-by-mediatype
    description: Adapter routes requests to multiple distinct endpoints based on mediatype. ADR-007 F1. Canonical&#58; beachfront (banner endpoint vs video endpoint).
    surfaces_in: ["quirks + code.make_requests.endpoint_resolution.endpoints[]"]
  - id: language-stamped-header-divergence
    description: Header value differs by language (e.g., `Componentid&#58; prebid-go` vs `prebid-java`). Breaks byte-equality of outgoing requests across languages. ADR-007 F2. Canonical&#58; freewheelssp.
    surfaces_in: ["quirks + headers_constructed.language_stamped_headers"]
  - id: mediatype-context-rewrite-site-to-app
    description: Adapter destructively converts request shape (deletes `request.Site`, synthesizes `App{}`) to coerce mediatype context. ADR-007 F3. Canonical&#58; vungle.
    surfaces_in: ["quirks + code.make_requests.mutation.entity_strategies.Site"]
  - id: bid-post-processing-macro
    description: Adapter mutates bid fields after deserialization (e.g., replaces `${AUCTION_PRICE}` in `bid.NURL`/`bid.AdM`/`bid.BURL`). ADR-007 F4. Canonical&#58; thetradedesk.
    surfaces_in: ["quirks + code.make_bids.bid_post_processing.macros[]"]
  - id: imp-ext-strip-post-extraction
    description: Adapter sets `imp.Ext = nil` after parsing the bidder ext, stripping it from the outgoing payload. ADR-007 F5. Canonical&#58; beintoo.
    surfaces_in: ["quirks + code.make_requests.imp_ext_unmarshal.strip_post_extraction"]

  # Rule 45 taxa (ADR-004 — disabled-by-default Java alias):
  - id: disabled-by-default-empire-alias
    description: Java alias child of an empire parent ships with `enabled&#58; false` by default; publishers opt in via deployment config. Canonical Rule 45 case.
    surfaces_in: ["quirks (Java spec) + dual-spec assertion bidder_info_default_enabled"]
  - id: default-enabled-go-disabled-justified
    description: Go-side bidder ships disabled by default (typically white-label/legal restriction) while Java ships enabled. Inverse of Rule 45. Examples&#58; adagio, audienceNetwork, avocet.
    surfaces_in: ["quirks (Go spec) + bidder_info.default_enabled"]

  # Rule 46 taxon (ADR-005 — naming convention normalization):
  - id: naming-convention-normalization
    description: 'Java parent-YAML name derived from Go bidder name by lowercasing + dropping non-alphanumerics. 11 verified cases (refined 2026-05-03 from 12 — `freewheel-ssp/freewheelssp` removed per Phase 5 empirical verification; both canonical YAMLs use `freewheelssp`; the hyphenated form is a Go-only alias-stub via `aliasOf:`. See ADR-005 "Excluded cases".), including boldwin_rapid → boldwinrapid, audienceNetwork → audiencenetwork, adkernelAdn → adkerneladn.'
    surfaces_in: ["quirks (Java spec) + dual-spec assertion naming_asymmetry"]

post_taxa_note: |
  The taxon list is closed: a reader emitting a quirk MUST pick from this list, OR add a new taxon to this file (atomic with the spec change). New taxa REQUIRE Phase 2 sample evidence — the goal is to keep the taxonomy machine-readable.

