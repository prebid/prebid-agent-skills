adapter_spec_version: "1.0.0"
taxonomy_version: "1.0.0"
spec_kind: prebid-server-adapter
source_language: go

provenance:
  source:
    repo: prebid/prebid-server
    ref:
      branch: master
    resolved_commit: 2fae16f31693452b62dd2a0924b78e71bbec43ec
    fetch_method: github-raw
  read:
    skill_versions:
      orchestrator: 1.0.0
      read-bidder-info: 1.0.0
      read-bidder-params: 1.0.0
      read-adapter-code: 1.0.0
    timestamp_utc: 2026-05-02T00:00:00Z
    operator: claude-code/opus-4-7
  warnings:
    - type: dual-core-bidder-registration
      file: openrtb_ext/bidders.go
      line: 0
      summary: "BOTH `BidderCadentApertureMX` (cadent_aperture_mx) AND `BidderEmxDigital` (emx_digital) are registered as core bidders in `coreBidderNames`. They share the same `cadentaperturemx.Builder` function via separate entries in `exchange/adapter_builders.go`. Each has its own `static/bidder-info/<name>.yaml` (byte-identical, sha256 8ee63ad8171be58806cd796650525fc0056669ee9111d879ab5b828da9803a5f) and its own `static/bidder-params/<name>.json` (semantically equivalent, byte-different). Neither name is in `exchange/adapter_util.go::GetDisabledBidderWarningMessages` — both remain currently-supported core bidders. This is co-registration, NOT alias-back."
    - type: emx-digital-params-description-typo
      file: static/bidder-params/emx_digital.json
      line: 4
      summary: "The companion `emx_digital.json` (sibling registration) has its title correctly set to `EMX Digital Adapter Params` BUT the description still says `validates params accepted by the Cadent Aperture MX adapter` — copy-paste leak from the cadent file. The cadent file itself is internally consistent."

meta:
  bidder_name: cadent_aperture_mx
  is_alias: false
  alias_of: null
  parent_aliases: []                          # Go has NO YAML aliases under cadent_aperture_mx; the legacy `emx_digital` lives as a sibling core bidder, not a child alias
  whitelabel_only: false
  disabled: false
  module_path_major: v4
  java_artifact_version: null
  empire_canonical_master: false
  empire_parent_flavor: null

bidder_info:
  endpoint: "https://hb.emxdgt.com"           # No trailing slash, no path; the adapter appends `?t=<timeout>&ts=<unix>&src=pbserver` at request build time. Note: hostname retains the legacy EMX domain (`emxdgt.com`) even though the maintainer is on `cadent.tv` — SSP infrastructure was not rebranded along with the company name.
  endpoint_construction:
    kind: url-with-query                      # `endpoint?t=<tmax>&ts=<unix>&src=pbserver` — query params built at runtime via sprintf
    macros_used: ["t", "ts", "src"]
    macro_syntax: printf
    placeholders_unresolved: []
  endpoint_compression: null                  # Not declared in upstream YAML
  ortb_version: null
  default_enabled: true
  modifying_vast_xml_allowed: false
  maintainer:
    email: contactaperturemx@cadent.tv        # Cadent (post-acquisition) maintainer address; bidder name still uses legacy emx + new cadent dual-registration
  capabilities:
    site:
      mediaTypes:
        - banner
        - video
    app:
      mediaTypes:
        - banner
        - video
  geoscope: []                                # No geo restriction on cadent_aperture_mx parent. Java has [USA, CAN] on its `cadent_aperture_mx` ALIAS (alias-only field).
  gvl_vendor_id: 183
  user_sync:
    iframe:
      url: "https://cs.emxdgt.com/um?ssp=pbs&gdpr={{.GDPR}}&gdpr_consent={{.GDPRConsent}}&us_privacy={{.USPrivacy}}&redirect={{.RedirectURL}}"
      userMacro: "$UID"
  yaml_extra_fields: {}
  yaml_field_name_quirks: []

bidder_params_json: |
  {
      "$schema": "http://json-schema.org/draft-04/schema#",
      "title": "Cadent Aperture MX Adapter Params",
      "description": "A schema which validates params accepted by the Cadent Aperture MX adapter",
      "type": "object",
      "properties": {
        "tagid" : {
          "type": "string",
          "description": "The id of an inventory target"
        },
        "bidfloor": {
          "type": "string",
          "description": "The minimum price acceptable for a bid"
        }
      },

      "required": ["tagid"]
    }
bidder_params_sha256: 737b0ab2b135ac90a610212736bc1915e98b5a452d87cdebaee7c682e51957a6

params:
  schema_interpretation:
    properties:
      - name: tagid
        type: string
        description: "The id of an inventory target"
        notes:
          - "String type but parsed at runtime via strconv.ParseInt — must be a numeric string. Empty or zero rejected."
      - name: bidfloor
        type: string
        description: "The minimum price acceptable for a bid"
        notes:
          - "String type but parsed at runtime via strconv.ParseFloat — flexible-types coercion (string-to-float)"
    required_fields:
      - tagid
    flexible_types:
      - field: tagid
        declared_type: string
        runtime_parse: int64
        rejection_kind: parse-error-or-zero
      - field: bidfloor
        declared_type: string
        runtime_parse: float64
        rejection_kind: silent-zero-on-parse-error
    combinators_used: []
  ext_struct:
    package: openrtb_ext
    file: openrtb_ext/imp_cadent_aperture_mx.go
    type_name: ExtImpCadentApertureMX        # Note: `MX` all-caps in the type name. Java diverges (`ExtImpEmxDigital` is the Java POJO; there is NO ExtImpCadentApertureMx Java class — alias has no Java code).
    fields:
      - name: TagID
        json_tag: tagid
        type_native: string
        omitempty: false
        notes: []
      - name: BidFloor
        json_tag: bidfloor
        type_native: string
        omitempty: false
        notes:
          - "String type holds a stringified float; parsed via strconv.ParseFloat at runtime in addImpProps"
    custom_unmarshal: false
    custom_unmarshal_accepts: []
  params_test:
    file: adapters/cadent_aperture_mx/params_test.go      # Canonical plural form (NOT vungle's singular `param_test.go` quirk)
    valid_cases_count: null
    invalid_cases_count: null
    bidder_constant_referenced: openrtb_ext.BidderCadentApertureMX

code:
  package_or_class: cadentaperturemx          # Go convention drops underscores for package names
  directory_name: cadent_aperture_mx
  package_directory_mismatch: true            # Package `cadentaperturemx` lives in dir `cadent_aperture_mx/`. File names also drop underscores: `cadentaperturemx.go`, `cadentaperturemx_test.go`. ASYMMETRIC: the test fixture root keeps underscores: `cadent_aperture_mxtest/`. Tri-form within the same bidder.
  file_layout:
    kind: single-file
    files:
      - name: cadentaperturemx.go
        role: implementation
        loc: 319
  imports:
    has_template_engine: false                # Static endpoint with sprintf-style query-param appending
    has_currency_helper: false                # No requestInfo.ConvertCurrency usage
    has_jsonutil: true                        # util/jsonutil
    third_party:
      - github.com/prebid/openrtb/v20/adcom1
      - github.com/prebid/openrtb/v20/openrtb2
  adapter_struct:
    type_name: adapter
    type_visibility: unexported
    fields:
      - name: endpoint                        # LOWERCASE/unexported (vungle has uppercase Endpoint — divergence)
        type: string
      - name: testing                         # Test-only stabilization flag; set true via test entry point cadentaperturemx_test.go::setTesting. Java has NO equivalent.
        type: bool
  builder:
    signature_canonical: true
    extra_adapter_info_used: false
    template_parsed_at_build: false
    errors_returned: []
  make_requests:
    batching:
      applied_in_order: true
      rules:
        - kind: per-batch                     # SINGLE HTTP request for the entire batch — all imps go in one body. NOT per-imp.
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
    mutation:
      mutates_request: true
      entity_strategies:
        Imp: in-place                         # imp value-copy from range loop, then BidFloor + TagID + Secure mutated in-place; appended to resImps slice; resImps replaces request.Imp at end
        Banner: deep-copy-then-mutate         # `bannerCopy := *imp.Banner`; if W&H both nil, lift Format[0] into W/H, slice Format[1:]
        Video: deep-copy-then-mutate          # `videoCopy := *imp.Video`; cleanProtocol filters out CreativeVAST40 (protocol 7)
        Site: none
        App: none
        Source: none
        Device: none
        User: none
        Cur: none
      go_idiom: shallow-copy-then-mutate
      java_idiom: null
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase
      mechanism_java: null
      target_type: openrtb_ext.ExtImpCadentApertureMX
      wrapper_type: null
    endpoint_resolution:
      kind: dynamic-template-string
      mechanism_go: sprintf-with-runtime-values
      mechanism_java: null
      macros_used:
        - "t (TMax milliseconds, defaults to 1000 if 0)"
        - "ts (unix epoch seconds — testing-mode override pins to 2060541160)"
        - "src (literal `pbserver`)"
    helpers:
      - name: buildEndpoint
        signature: "func buildEndpoint(endpoint string, testing bool, timeout int64) string"
      - name: preprocess
        signature: "func preprocess(request *openrtb2.BidRequest) []error"
      - name: unpackImpExt
        signature: "func unpackImpExt(imp *openrtb2.Imp) (*openrtb_ext.ExtImpCadentApertureMX, error)"
      - name: addImpProps
        signature: "func addImpProps(imp *openrtb2.Imp, secure *int8, cadentExt *openrtb_ext.ExtImpCadentApertureMX)"
      - name: buildImpBanner
        signature: "func buildImpBanner(imp *openrtb2.Imp) error"
      - name: buildImpVideo
        signature: "func buildImpVideo(imp *openrtb2.Imp) error"
      - name: cleanProtocol
        signature: "func cleanProtocol(protocols []adcom1.MediaCreativeSubtype) []adcom1.MediaCreativeSubtype"
      - name: addHeaderIfNonEmpty
        signature: "func addHeaderIfNonEmpty(headers http.Header, headerName string, headerValue string)"
      - name: getBidType
        signature: "func getBidType(bidAdm string) openrtb_ext.BidType"
      - name: ContainsAny
        signature: "func ContainsAny(raw string, keys []string) bool"
  make_bids:
    response_type: openrtb2.BidResponse
    custom_response_type: null
    http_status_handling:
      kind: canonical-go-helpers               # 204 → no bids; non-200/204 → BadServerResponse
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: string-sniff-adm-substring  # Custom: `strings.ToLower(raw)` then ContainsAny([`<?xml`, `<vast`]) — substring match. Java side does NOT lowercase — case-sensitivity divergence.
          hardcoded_value: null
          fallback_action: classify-as-banner
      default_value: banner
      multi_format_detection: none
    bid_pointer_pattern: indexed-iteration    # `for i := range sb.Bid { ... &sb.Bid[i] ... }` — pointer to slice element
    bid_pointer_go_sibling: range-index
    currency_overwrite_safety: passthrough-from-response

