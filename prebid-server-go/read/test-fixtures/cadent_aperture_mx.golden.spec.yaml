lifecycle:
  rename:
    old_name: emx_digital
    new_name: cadent_aperture_mx
    subtype: java-leads                       # ADR-006 sub-type. Java retains `emxdigital` as canonical parent (with `cadent_aperture_mx` as a disabled, geo-restricted alias under it). Go has NOT consolidated — both `cadent_aperture_mx` and `emx_digital` are registered as fully-enabled core bidders sharing one Builder. The label "java-leads" is defensible under the parent-canonical interpretation (Java has chosen a canonical name; Go has not), though strictly the rename is partial on both sides.
    alias_back: false                         # Go does NOT use a YAML alias-back for emx_digital; it co-registers BOTH names as core bidders.
    alias_back_form: dual-core-bidder-registration
    package_moves: []
    fixture_dir_moves: []
    yaml_deletes: []
    yaml_adds: []
    merged_at: null                           # No discrete rename PR — Cadent acquired EMX Digital and the Cadent Aperture MX brand was added alongside the legacy emx_digital registration. Both still functional.
    release: null
    notes:
      - "Cadent acquired EMX Digital; the SSP/exchange product was rebranded to 'Cadent Aperture MX'. Maintainer email is `contactaperturemx@cadent.tv`."
      - "Endpoint hostname `hb.emxdgt.com` retains the legacy EMX domain — the SSP infrastructure was apparently not rebranded along with the company name."
      - "Go side: BOTH `BidderCadentApertureMX` (`cadent_aperture_mx`) and `BidderEmxDigital` (`emx_digital`) are registered as core bidders in `coreBidderNames`. They share the same `cadentaperturemx.Builder` function (separate entries in `exchange/adapter_builders.go`). Each has its own `static/bidder-info/<name>.yaml` (byte-identical sha256 8ee63ad8…) and its own `static/bidder-params/<name>.json` (semantically equivalent, byte-different — emx_digital file has a copy-paste bug saying 'Cadent Aperture MX adapter' in description)."
      - "Go side: NEITHER name is in `exchange/adapter_util.go::GetDisabledBidderWarningMessages` — both are currently-supported, not deprecated/removed. This contrasts with the vungle/liftoff phantom-rename pattern where the legacy name lives in the removed-bidder warning map."
      - "Java side handles the rename via tilde-inherit alias `aliases: { cadent_aperture_mx: { enabled: false, geoscope: [USA, CAN] } }` under emxdigital.yaml (default-disabled — Rule 45 instance + Rule 44-adjacent alias-back with geo-restriction). Maintainer email is identical on both sides."
      - "Asymmetric topology: Go has dual-core-bidder-registration (cadent_aperture_mx + emx_digital as siblings); Java has parent-with-disabled-alias (emxdigital parent + cadent_aperture_mx alias). Both retain both names but with different organizational primacy."
      - "Per ADR-006 LIFECYCLE_PAIRS: ('cadent_aperture_mx', 'emxdigital', 'java-leads', 'Cadent acquired EMX'). The label is empirically defensible (Java has designated a canonical) but the topology — neither side has fully completed the rename — is more nuanced than a simple java-leads framing."

