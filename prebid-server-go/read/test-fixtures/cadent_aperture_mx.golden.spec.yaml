quirks:
  - id: dual-core-bidder-registration
    file: openrtb_ext/bidders.go
    summary: "Both `BidderCadentApertureMX` (cadent_aperture_mx) and `BidderEmxDigital` (emx_digital) are registered as core bidders sharing one Builder. Each has its own bidder-info yaml (byte-identical) and bidder-params json (semantically equal, byte-different). NOT an alias-back; neither name is deprecated. Go's pre-empt of full rename consolidation. Java side has only ONE bidder (emxdigital) with cadent_aperture_mx as a disabled+geo-restricted alias."
    edge_case_taxon: bidder-rename-three-step
  - id: imp-id-clobbered-from-bid-id
    file: cadentaperturemx.go
    line: 281
    summary: "MakeBids clobbers `sb.Bid[i].ImpID = sb.Bid[i].ID` before appending the typed bid. The Cadent server response apparently emits Bid.ID matching the original imp.id; Go preempts and writes ImpID. Java side does NOT do this — cross-language behavioral asymmetry."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: bid-type-string-sniff-adm-lowercased
    file: cadentaperturemx.go
    line: 294
    summary: "getBidType lowercases AdM via `strings.ToLower(raw)` then substring-matches `<?xml` or `<vast` (lowercase needles). Match → BidTypeVideo, else → BidTypeBanner. Pure AdM string-sniffing; no imp-correlation, no bid.MType lookup, NEVER returns native or audio. Java side does NOT lowercase — `StringUtils.containsAny(bidAdm, '<?xml', '<vast')` is case-sensitive (Java would miss `<VAST>` uppercase). Real Cadent VAST responses likely use lowercase, so this is a latent fidelity gap rather than a current bug."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: testing-mode-fixed-timestamp
    file: cadentaperturemx.go
    line: 30
    summary: "Adapter struct has a `testing bool` field. When set, buildEndpoint returns a fixed `?t=1000&ts=2060541160` query string for golden test stability. Set true only via cadentaperturemx_test.go::setTesting (test-only side door). Java side has NO such flag — IT tests rely on `${json-unit.any-number}` placeholders for timestamp variance."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: banner-format-list-slicing
    file: cadentaperturemx.go
    line: 134
    summary: "buildImpBanner: if banner.W and banner.H are both nil, lifts Format[0] into W/H and slices Format[1:] (truncating the first format from the list). Cross-language symmetric — Java does the same via subList(1, ...)."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: vast40-protocol-filter
    file: cadentaperturemx.go
    line: 168
    summary: "cleanProtocol filters out adcom1.CreativeVAST40 (protocol 7) from imp.Video.Protocols. Cadent server doesn't support VAST 4.0; protocols are silently stripped. Cross-language symmetric — Java filters literal `7`."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: hardcoded-src-pbserver-query
    file: cadentaperturemx.go
    line: 34
    summary: "URL appends `&src=pbserver` literal to identify the request source. Cross-language symmetric — Java uses the same literal."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: secure-flag-from-url-scheme
    file: cadentaperturemx.go
    line: 222
    summary: "preprocess derives `secure` flag (1 or 0) by parsing `request.Site.Page` OR `request.App.Domain` OR `request.App.StoreURL` (in that priority) via url.Parse and checking if scheme is `https`. Cross-language symmetric — Java uses startsWith('https')."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: dnt-header-always-when-non-nil
    file: cadentaperturemx.go
    line: 67
    summary: "Adds DNT header from request.Device.DNT regardless of value (0 or 1) when Device.DNT is non-nil. Most adapters skip DNT=0; this one always sends. Cross-language symmetric — Java uses Objects.toString(device.getDnt(), null)."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: package-directory-mismatch-tri-form
    file: adapters/cadent_aperture_mx/cadentaperturemx.go
    summary: "Three naming forms within one Go bidder: directory `cadent_aperture_mx/` (with underscores), package `cadentaperturemx` (no underscores), test fixtures root `cadent_aperture_mxtest/` (with underscores again). Distinct from typical Go bidders that drop underscores consistently across all three layers."
    edge_case_taxon: yaml-field-name-typo

cross_language:
  go_artifacts:
    bidder_dir: adapters/cadent_aperture_mx/
    package_name: cadentaperturemx
    bidder_constant: openrtb_ext.BidderCadentApertureMX
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/emxdigital/
    bidder_class: EmxDigitalBidder
    config_class: EmxDigitalConfiguration
    yaml_path: src/main/resources/bidder-config/emxdigital.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/emxdigital/
  port_concerns:
    aliases_inverted: true                    # Java declares cadent_aperture_mx as disabled+geo-restricted alias under emxdigital. Go has NO YAML alias — co-registers both as core bidders with shared Builder. Cross-language asymmetry on the alias mechanism (Rule 33-adjacent).
    yaml_unification: false                   # Go has TWO yaml files (cadent_aperture_mx.yaml + emx_digital.yaml, byte-identical). Java has ONE yaml file (emxdigital.yaml with alias block).
    mutation_idiom_divergence: true
    package_directory_mismatch: true          # Go: package cadentaperturemx in dir cadent_aperture_mx (drops underscores). Java: package emxdigital in dir emxdigital (no mismatch on Java side; mismatch is Go-only).
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: null
    destination_language: null
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - bidder-rename-cadent-acquired-emx
      - dual-core-bidder-registration-go
      - parent-with-disabled-alias-java
      - bid-type-string-sniff-case-sensitivity
      - imp-id-clobber-go-only
      - currency-propagation-java-only
      - tri-form-go-naming
  go_specific_concerns:
    - "Go has dual-core-bidder-registration: BOTH `cadent_aperture_mx` and `emx_digital` are registered as core bidders in `coreBidderNames`, sharing the `cadentaperturemx.Builder`. Each has its own bidder-info yaml (byte-identical, sha256 8ee63ad8…) and bidder-params json (semantically equal, byte-different — emx file has a copy-paste bug saying 'Cadent Aperture MX adapter' in description)."
    - "Adapter struct fields are LOWERCASE/unexported (`endpoint`, `testing`). Most other Go adapters use uppercase exported fields. The lowercase form is consistent with the unexported `adapter` struct name. Builder has access via package-internal struct literal."
    - "ImpID clobbering: `sb.Bid[i].ImpID = sb.Bid[i].ID` (line 281) — Go assumes the Cadent server emits Bid.ID matching the original imp.id. Java side does NOT do this clobber — cross-language behavioral asymmetry."
    - "Bid-type AdM sniffing: `strings.ToLower(raw)` then `Contains(`<?xml`)` or `Contains(`<vast`)`. Java side does NOT lowercase — case-sensitivity divergence (Java would miss `<VAST>` uppercase variant). Real Cadent VAST responses likely use lowercase, so this is a latent fidelity gap rather than a current bug."
    - "Testing-mode fixed timestamp: `testing bool` on adapter struct produces `?t=1000&ts=2060541160` for golden test stability. Java has no equivalent — relies on `${json-unit.any-number}` placeholders in fixtures."
    - "Hardcoded `&src=pbserver` query parameter to identify the request source. Cross-language symmetric."
    - "Currency: Go does NOT propagate `bidResponse.cur` to TypedBid (TypedBid has no currency field). Java sets `BidderBid.cur = bidResponse.getCur()` — Java-only currency propagation."
    - "VAST 4.0 protocol filter: `cleanProtocol` strips `adcom1.CreativeVAST40` (protocol 7) from imp.Video.Protocols. Cross-language symmetric (Java filters literal `7`)."
    - "Test root directory `cadent_aperture_mxtest` KEEPS underscores even though the package `cadentaperturemx` and main file `cadentaperturemx.go` drop them. Tri-form Go naming within the same bidder."
    - "Builder signature accepts `bidderName openrtb_ext.BidderName` as the first parameter but does NOT branch on it — both BidderCadentApertureMX and BidderEmxDigital callers receive an identical adapter struct (only `endpoint` from config differs, but they share the same yaml content)."
  java_specific_concerns: []
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg
