quirks:
  - id: pubclick-vs-pub-click-style-mismatch
    file: openrtb_ext/imp_msft.go
    summary: "Incoming JSON tag is `pubclick` (PubClick string `json:\"pubclick\"`, imp_msft.go:14), bidder-params schema property name is `pubclick` (msft.json:35), but the OUTGOING mirror struct field uses `pub_click` (impExtOutgoingAppnexus.PubClick string `json:\"pub_click,omitempty\"` at models.go:30). The adapter rewrites the key on the wire — incoming key style differs from outgoing key style for the same logical field. Edge case #7."
    edge_case_taxon: json-key-style-mismatch
  - id: pubclick-schema-vs-outgoing-style-mismatch
    file: static/bidder-params/msft.json
    summary: "static/bidder-params/msft.json properties.pubclick (no underscore, msft.json:35) is the publisher-facing key; impExtOutgoingAppnexus serializes it back out as `pub_click` (with underscore, models.go:30). Schema and outgoing payload disagree on the same logical field's wire name. Edge case #7."
    edge_case_taxon: json-key-style-mismatch
  - id: multi-file-go-layout
    file: adapters/msft/
    summary: "Adapter is split across three .go files — msft.go (implementation, 395 LOC), models.go (struct types, 60 LOC), iab_categories.go (95-entry lookup table + helper, 106 LOC). The split is justified primarily by the size of the IAB lookup table; isolating it keeps msft.go grep-able. Most adapters are single-file. Edge case #4."
    edge_case_taxon: multi-file-layout-justified
  - id: legacy-test-directory-naming
    file: adapters/msft/test/
    summary: "Test root is adapters/msft/test/ rather than the canonical adapters/msft/msfttest/. Captured in tests.go_directory_naming: legacy-test."
    edge_case_taxon: incomplete-classification
  - id: test-extrainfo-dual-suite
    file: adapters/msft/test-extrainfo/
    summary: "Adapter exposes a SECOND test root, adapters/msft/test-extrainfo/, used by TestJsonSamplesWithExtraInfo (msft_test.go:33) with a custom ExtraAdapterInfo string `{\"hb_source\": 50, \"hb_source_video\": 60}`. The dual-suite layout is unique to msft in master — no other adapter co-locates a `test-extrainfo` sibling next to `test/`. Edge case #3 (custom-naming-with-canonical-stem-prefix). The two roots cannot both be encoded in a single tests.test_root_directory; the secondary root is surfaced via tests.fixture_inventory.extrainfo_exemplary and extrainfo_video extension fields."
    edge_case_taxon: incomplete-classification
  - id: max-imps-per-request-batching
    file: adapters/msft/msft.go
    summary: "Imps split into batches of <=10 (const maxImpsPerReq = 10, msft.go:24). buildRequests slices request.Imp via floor-then-ceil arithmetic at msft.go:294 and reassigns request.Imp = impsForRequest in-place per iteration (msft.go:303). Each batch becomes one HTTP RequestData. The supplemental fixture request-splitting.json (10378 bytes) covers 13 imps -> 2 requests of 10+3."
    edge_case_taxon: incomplete-classification
  - id: composed-batching-rules
    file: adapters/msft/msft.go
    summary: "Two ordered rules: (1) filtered-subset (validImps loop drops imps with parse/modify failures and short-circuits with errMemberIDMismatch on member-id divergence), (2) max-imps-per-request: 10. Composability captured in code.make_requests.batching.rules[]. Edge case #11."
    edge_case_taxon: incomplete-classification
  - id: hardcoded-default-hbsource
    file: adapters/msft/msft.go
    summary: "defaultHBSource (5) and defaultHBSourceVideo (6) are package-level const literals (msft.go:22-23). When ExtraAdapterInfo is unset OR sets the field to zero, parseExtraInfo overrides 0 with the default (msft.go:69-75). The defaults should arguably live in YAML (`extra_info` block) rather than the source — but msft is a known internal-ID convention so the hardcoding is justified. Surfaces here for port awareness."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: bid-pointer-local-variable-anti-pattern
    file: adapters/msft/msft.go
    summary: "Inside the SeatBid/Bid loop, the adapter copies sb.Bid[i] into a LOCAL `bid := sb.Bid[i]` variable (msft.go:347), unmarshals bid.Ext into bidExt, then takes `&bid` to populate TypedBid.Bid (msft.go:369). The pointer escapes to a value that will be rewritten on the next iteration — but Go's loop-variable lifetime semantics (post-Go-1.22) make `bid` a per-iteration local, so the pattern is safe. Pre-1.22 this would be a capture-by-reference bug."
    edge_case_taxon: legacy-go-pattern-pre-1.22
  - id: brand-category-multi-rejection
    file: adapters/msft/msft.go
    summary: "If findIABCategoryForBid returns NOT-FOUND AND the upstream bid carries len(bid.Cat) > 1, the adapter zeroes bid.Cat to []string{} (msft.go:363-366) — explicitly to force downstream policy rejection. This is a deliberate behavioral signal, not a defensive default — bidders MUST send <=1 IAB category OR a Microsoft brand-id that the table can resolve."
    edge_case_taxon: incomplete-classification
  - id: bid-ad-type-2-unmapped
    file: adapters/msft/msft.go
    summary: "getMediaTypeForBid maps bid.ext.appnexus.bid_ad_type values 0 -> banner, 1 -> video, 3 -> native. Value 2 (audio in OpenRTB 2.6 mtype) and any other unrecognized integer return an `unrecognized bid_ad_type in response: %d` error and the bid is dropped (msft.go:392-394). Audio bids cannot survive — the bidder declares no audio capability in YAML, so this is consistent."
    edge_case_taxon: incomplete-classification
  - id: bidder-name-rebrand-microsoft-vs-msft
    file: openrtb_ext/bidders.go
    summary: "The Go bidder constant is openrtb_ext.BidderMicrosoft (string value \"msft\") — the constant uses the legal entity name while the YAML directory and external API key use the abbreviation. Reviewers and porters should be aware that the constant identifier (BidderMicrosoft) does NOT share a stem with the directory (msft); the bidder constant string value is the canonical link."
    edge_case_taxon: incomplete-classification
  - id: appnexus-rebrand-fork
    file: adapters/msft/msft.go
    summary: "msft is functionally a fork of the legacy Appnexus adapter — the endpoint is http://ib.adnxs.com/openrtb2 (Appnexus's domain), the outgoing imp.ext is wrapped in an `appnexus` sub-key (impExtOutgoing.Appnexus, models.go:20), the request.ext.appnexus is computed and merged (modifyRequestExt, msft.go:224-244), and bid.ext.appnexus.bid_ad_type drives bid type resolution (msft.go:385). The Java repo retains the original adapter under bidder/appnexus/ with the same maintainer email (prebid@microsoft.com); the Go repo carries BOTH bidder/appnexus and bidder/msft as separate codebases. Cross-language port targets the Java appnexus directory's idioms but with a different bidder identity."
    edge_case_taxon: port-fidelity-divergence

cross_language:
  go_artifacts:
    bidder_dir: adapters/msft/
    package_name: msft
    bidder_constant: openrtb_ext.BidderMicrosoft
  java_artifacts:
    # NO Java port at the same name. Verified at commit
    # 69b1993c39ed3212ca63012a8c0924fdfa0b5d4a (prebid-server-java master, 2026-04-22):
    # there is no src/main/java/org/prebid/server/bidder/msft/ directory and no
    # msft.yaml config file. The legacy Appnexus adapter survives in Java at
    # src/main/java/org/prebid/server/bidder/appnexus/ with maintainer prebid@microsoft.com.
    # If a Java port is added later, the canonical paths are the stubs below.
    bidder_dir: src/main/java/org/prebid/server/bidder/msft/
    bidder_class: MsftBidder
    config_class: MsftConfiguration
    yaml_path: src/main/resources/bidder-config/msft.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/msft/
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: true
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: go
    source_pr: null
    destination_language: null
    destination_pr: null
    fidelity_review_themes: []
    # No Java port exists. The Java repo never picked up the msft fork; it kept
    # the legacy Appnexus adapter. A future cross-language port would need to
    # decide whether to (a) duplicate the Java appnexus adapter and rebrand, or
    # (b) extend the Java appnexus adapter with msft-specific behavior toggled by
    # a new BidderConfigurationProperties subclass. The Go side chose option (a)
    # — a wholesale fork.
  go_specific_concerns:
    - "Multi-file Go layout (msft.go + models.go + iab_categories.go) — a porter to Java must split the IAB lookup table into a separate resource (Java's appnexus inlines the iabCategories map directly in bidder-config/appnexus.yaml as a 120-entry block; msft Java would do similarly)."
    - "iabCategoryMap is a package-level static-init (storage_kind: go-data-table); the Java port would inline as yaml-inlined and inject via constructor-arg per the iab_category_storage taxonomy."
    - "Adapter struct holds url.URL by VALUE (not pointer). Builder dereferences the parsed *url.URL once and stores the value (msft.go:52); each MakeRequests call copies a.uri before potentially appending the member_id query param. Java equivalent would use String for the endpoint and URIBuilder per-request (Rule 12)."
    - "extraAdapterInfo (HBSource, HBSourceVideo) is parsed in the Builder via parseExtraInfo and applied directly to adapter struct fields. Java port should promote both fields to a MsftConfigurationProperties subclass with @NotBlank/@PositiveOrZero annotations (Rule 35)."
    - "ExtraAdapterInfo defaults are hardcoded constants (defaultHBSource=5, defaultHBSourceVideo=6 at msft.go:22-23) — port to YAML defaults under @Value annotations or BidderConfigurationProperties default field values."
    - "modifyRequestExt mutates request.Ext at runtime by merging an `appnexus` sub-key into the existing ext map (msft.go:240). The Java port would use Lombok toBuilder + ObjectMapper.valueToTree for the equivalent merge (Rule 5)."
    - "initDisplayManageVerBuilder returns a closure with `hasRun bool` capture for memoization across imps (msft.go:141-170). Java's natural rewrite is a sealed Supplier with a Holder<String> wrapper or a Memoizer.suppliers.memoize idiom — non-trivial port-fidelity concern."
    - "msft.go uses jsonparser (third-party github.com/buger/jsonparser) for two App.Ext path walks AND for the request.ext.prebid.targeting.includebrandcategory probe. Java port would use Jackson's JsonNode.path() chain — a clean translation but the canonical Go pattern (jsonutil.Unmarshal of a typed struct) would be cleaner if the schema is stable."
    - "buildRequests reuses the same headers http.Header value across all batched RequestData entries (buildHeaders is called once at msft.go:298). Each batch's RequestData.Headers points at the SAME map; mutations would race. The Java port via BidderUtil.defaultRequest copies the MultiMap per request — safer."
    - "modifyImp sets imp.TagID from ext.Bidder.InvCode unconditionally when InvCode != \"\" (msft.go:173-175), overwriting any existing TagID set by upstream prebid. The supplemental fixture inv-code-overridden.json verifies this behavior. A Java port must preserve the same semantics."
    - "modifyImp dereferences imp.Banner via shallow copy (msft.go:178), promotes Format[0].W/H to top-level W/H when both are nil (msft.go:180-184), then sets API from ext.Bidder.BannerFrameworks when banner.API is nil (msft.go:186-188). Three sequential mutations on the bannerCopy value before re-pointing imp.Banner. Java equivalent is a single banner.toBuilder().w(...).h(...).api(...).build() chain."
    - "Member-id uniqueness check (msft.go:108-117) uses uniqueMemberID across the imp loop — the FIRST non-zero member sets it; any subsequent non-zero member that disagrees triggers errMemberIDMismatch and aborts MakeRequests with the accumulated errors and no requests. Java port must preserve the early-exit semantics."
    - "appendMemberID uses url.URL.Query()/Set/Encode (msft.go:217-222) — the canonical net/url pattern. The function takes url.URL by VALUE (not pointer) so callers receive a fresh copy. Java port maps to URIBuilder.addParameter (Rule 12)."
    - "MakeBids constructs adapters.NewBidderResponseWithBidsCapacity(5) — a hardcoded capacity hint of 5 (msft.go:344). Java equivalent would size the bids ArrayList to 5 explicitly or pass to BidderBid.of(...).collect(Collectors.toList())."
    - "MakeBids reads bid.Ext via jsonutil.Unmarshal into bidExt then conditionally rewrites bid.Cat based on the IAB lookup result (msft.go:361-366). Java port would inject the iabCategoryMap as a constructor arg and apply the same conditional logic. The 'len(bid.Cat) > 1 -> empty' branch is a deliberate rejection signal."
    - "MakeBids uses canonical adapters.IsResponseStatusCodeNoContent + adapters.CheckResponseStatusCodeForErrors (msft.go:330-336) — modern pattern, NOT legacy-raw-go. Java equivalent is the framework-default plus an empty-seatbid short-circuit (Rule 30)."
    - "Bid loop hybrid pattern: outer SeatBid loop is range-value (`for _, sb := range`); inner Bid loop is range-index (`for i := range sb.Bid`). The bid pointer is taken from a local copy `bid := sb.Bid[i]` then `&bid` (msft.go:347, 369) — Go-1.22-safe but pre-1.22 would have aliased the loop variable."
  java_specific_concerns: []
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg
    # No PR history exists yet for cross-language msft work — the Go-side msft is a
    # fork of Appnexus that has not been mirrored in Java. Reviewer cohort is
    # populated empty pending the first cross-language PR.
