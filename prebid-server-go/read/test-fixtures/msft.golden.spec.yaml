iab_category_storage:
  storage_kind: go-data-table
  yaml_field: null
  go_data_file: adapters/msft/iab_categories.go
  table_size: 95
  delivery_mechanism: static-init
  # iabCategoryMap is a package-level map[int]string literal initialized at package
  # load time (iab_categories.go:10). 95 entries (sparse keys ranging 1..183 — the
  # source has gaps because some Microsoft brand-category ids do not have IAB
  # equivalents). The lookup is exposed via findIABCategoryForBid(bid *bidExt)
  # (string, bool) which reads bid.Appnexus.BrandCategory and returns the IAB tag.
  # MakeBids consumes the result at msft.go:361-366: a hit assigns bid.Cat to a
  # single-element slice; a miss with len(bid.Cat) > 1 zeroes bid.Cat to force
  # downstream rejection (multi-cat-ambiguous policy); a miss with <=1 bid.Cat is
  # passed through unchanged.

