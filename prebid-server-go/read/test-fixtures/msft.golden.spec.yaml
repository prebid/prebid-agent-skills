        notes: []
      - name: BannerFrameworks
        json_tag: banner_frameworks
        type_native: "[]adcom1.APIFramework"
        omitempty: false
        notes:
          - "Imports github.com/prebid/openrtb/v20/adcom1 — only ext struct in the adapter pulling adcom1. Element type is an int alias for OpenRTB API framework codes."
