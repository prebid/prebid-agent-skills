params:
  schema_interpretation:
    properties:
      - name: placement_id
        type: integer
        description: "Placement ID from Microsoft Monetize. You may use inv_code with member instead of a placement_id."
      - name: member
        type: integer
        description: "Member ID from Microsoft Monetize. Must be used with inv_code."
      - name: inv_code
        type: string
        description: "Inventory code from Microsoft Monetize. Must be used with member."
      - name: allow_smaller_sizes
        type: boolean
        description: "If true, ads smaller than your ad unit's size array will be allowed to serve."
      - name: use_pmt_rule
        type: boolean
        description: "If true, Microsoft Monetize will return net price after publisher payment rules are applied."
      - name: keywords
        type: string
        description: "Comma-delimited key-value pairs (max 100). Must be enabled by a Microsoft Monetize account manager."
      - name: traffic_source_code
        type: string
        description: "Specifies the third-party source of this impression."
      - name: pubclick
        type: string
        description: "Specifies a publisher supplied url for third-party click tracking."
      - name: ext_inv_code
        type: string
        description: "Specifies predefined value passed on the query string that can be used in reporting. The value must be entered into Microsoft Monetize before it is logged.."
      - name: ext_imp_id
        type: string
        description: "Specifies the unique identifier of an externally generated auction."
      - name: banner_frameworks
        type: array
        description: "List of supported API frameworks for banner ads supported by the publisher."
        items_type: integer
    required_fields: []
    flexible_types: []
    combinators_used:
      - oneOf
    # The oneOf requires either {placement_id} OR {inv_code, member}. There is no
    # top-level `required:` key — required-ness is conditional via oneOf.
  ext_struct:
    package: openrtb_ext
    file: openrtb_ext/imp_msft.go
    type_name: ImpExtMsft
    fields:
      - name: PlacementID
        json_tag: placement_id
        type_native: int
        omitempty: false
        notes: []
      - name: Member
        json_tag: member
        type_native: int
        omitempty: false
        notes: []
      - name: InvCode
        json_tag: inv_code
        type_native: string
        omitempty: false
        notes: []
      - name: AllowSmallerSizes
        json_tag: allow_smaller_sizes
        type_native: "*bool"
        omitempty: false
        notes: []
      - name: UsePaymentRule
        json_tag: use_pmt_rule
        type_native: "*bool"
        omitempty: false
        notes:
          - "Go field name (UsePaymentRule) does not match JSON tag stem (use_pmt_rule). The outgoing-side mirror struct (impExtOutgoingAppnexus.UsePmtRule, models.go:27) uses a name closer to the JSON tag — port-fidelity divergence within the same adapter."
      - name: Keywords
        json_tag: keywords
        type_native: string
        omitempty: false
        notes: []
      - name: TrafficSourceCode
        json_tag: traffic_source_code
        type_native: string
        omitempty: false
        notes: []
      - name: PubClick
        json_tag: pubclick
        type_native: string
        omitempty: false
        notes:
          - "JSON key is pubclick (no underscore), in contrast to all other underscore-separated tags on the same struct (placement_id, inv_code, allow_smaller_sizes, use_pmt_rule, traffic_source_code, ext_inv_code, ext_imp_id, banner_frameworks). The outgoing mirror impExtOutgoingAppnexus.PubClick uses tag pub_click WITH the underscore (models.go:30) — INCOMING and OUTGOING JSON keys differ. Edge case #7 (json-key-style-mismatch)."
      - name: ExtInvCode
        json_tag: ext_inv_code
        type_native: string
        omitempty: false
        notes: []
      - name: ExtImpID
        json_tag: ext_imp_id
        type_native: string
