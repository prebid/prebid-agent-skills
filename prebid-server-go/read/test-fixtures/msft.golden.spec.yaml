code:
  package_or_class: msft
  directory_name: msft
  package_directory_mismatch: false
  file_layout:
    kind: multi-file
    files:
      - name: msft.go
        role: implementation
        loc: 395
      - name: models.go
        role: models
        loc: 60
      - name: iab_categories.go
        role: data-table
        loc: 106
    # Edge case #4 (multi-file Go layout): three .go files in a single package.
    # msft.go is the bidder implementation; models.go holds the seven private struct
    # types (extraAdapterInfo, impExtIncoming, impExtOutgoing, impExtOutgoingAppnexus,
    # bidExt + nested bidExtAppnexus / bidExtCreative / bidExtVideo, requestExAppnexus);
    # iab_categories.go holds the static brand-id → IAB-category lookup table and one
    # function (findIABCategoryForBid). Splitting across roles is intentional and
    # justified by the table size (95 entries) — see iab_category_storage block.
  imports:
    has_template_engine: false
    has_currency_helper: false
    has_jsonutil: true
    third_party:
      - github.com/buger/jsonparser
    # jsonparser is used in two places: (1) initDisplayManageVerBuilder for App.Ext path
    # walks (msft.go:153, 159 — pulls openrtb_ext.PrebidExtKey/source and /version);
    # (2) modifyRequestExt for prebid.targeting.includebrandcategory probe (msft.go:268).
    # ptrutil is the canonical helper (ptrutil.ToPtr at msft.go:274-275).
  adapter_struct:
    type_name: adapter
    type_visibility: unexported
    fields:
      - name: uri
        type: url.URL
      - name: hbSource
        type: int
      - name: hbSourceVideo
        type: int
    # Note: uri is a VALUE (url.URL), NOT a pointer. Builder dereferences the parsed
    # *url.URL via *uri (msft.go:52). Each MakeRequests call copies a.uri to a local
    # variable before potentially appending a member_id query param — avoids race-y
    # mutation of adapter state.
  builder:
    signature_canonical: true
    extra_adapter_info_used: true
    template_parsed_at_build: false
    errors_returned:
      - source: url.Parse(config.Endpoint)
        condition: "endpoint URL malformed"
      - source: parseExtraInfo(config.ExtraAdapterInfo)
        condition: "ExtraAdapterInfo is non-empty and not parseable as JSON object {hb_source, hb_source_video}"
    # Builder consumes both config.Endpoint AND config.ExtraAdapterInfo (the latter
    # is JSON-decoded into extraAdapterInfo {HBSource, HBSourceVideo}). Defaults are
    # 5 (HBSource) and 6 (HBSourceVideo) — set in buildDefaultExtraInfo() and also
    # applied lazily inside parseExtraInfo when individual fields equal zero.
  make_requests:
    batching:
      applied_in_order: true
      rules:
        - kind: filtered-subset
          predicate: "imp passes per-imp parse + modify; imps that fail jsonutil.Unmarshal of imp.ext OR fail modifyImp are dropped from validImps"
        - kind: max-imps-per-request
          max_imps_per_request: 10
      # Edge case #11: msft chains two batching rules. First, every imp is parsed and
      # mutated; failed imps accumulate errors and are dropped from validImps. Second,
      # the surviving imps are split into HTTP requests of <=10 imps each via the
      # buildRequests loop (msft.go:294 computes ceil(len/10) batches, then
      # request.Imp = impsForRequest per iteration at msft.go:303). The constant is
      # named maxImpsPerReq (msft.go:24) — a literal `const = 10`. There is also a
      # cross-cutting member_id uniqueness check (msft.go:108-117): if two imps carry
      # different non-zero impExt.Bidder.Member values, MakeRequests returns
      # errMemberIDMismatch IMMEDIATELY with the accumulated errors and no requests.
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
      # Body is the standard openrtb2.BidRequest, but the adapter rewrites:
      #   - request.Imp[*].Ext (replaced with impExtOutgoing per imp; original imp.ext
      #     is consumed and discarded; outgoing wraps a fixed `appnexus` sub-object plus
      #     optional gpid passthrough — models.go:19-22)
      #   - request.Imp[*].TagID (set to ext.Bidder.InvCode when InvCode != "")
      #   - request.Imp[*].Banner (shallow-copied; W/H promoted from Format[0] when
      #     both nil; API populated from ext.Bidder.BannerFrameworks when banner.API
      #     is nil)
      #   - request.Imp[*].DisplayManagerVer (filled lazily from app.ext.prebid.{source,
      #     version} when imp.DisplayManagerVer is empty)
      #   - request.Ext (`appnexus` sub-key replaced with computed requestExAppnexus
      #     containing optional include_brand_category, brand_category_uniqueness,
      #     is_amp, hb_source — see msft.go:224-244)
      #   - request.Imp (mutated to validImps subset, then per-batch sliced)
    mutation:
      mutates_request: true
      entity_strategies:
        Imp: in-place
        Banner: copy-then-mutate
        Ext: in-place
      go_idiom: shallow-copy
      java_idiom: null
      # `Imp: in-place` — modifyImp takes *openrtb2.Imp and rewrites TagID, Banner ptr,
      # DisplayManagerVer, Ext directly through the pointer (msft.go:172-215). The
      # framework's request slice header is shared, so mutations write through.
      # `Banner: copy-then-mutate` — modifyImp dereferences imp.Banner, mutates the
      # local copy (W, H, API), then re-points imp.Banner to the copy
      # (msft.go:177-191). Idiomatic shallow-copy via `bannerCopy := *imp.Banner`.
      # `Ext: in-place` — both imp.Ext and request.Ext are reassigned via
      # jsonutil.Marshal output (msft.go:212, 242).
      # request.Imp itself is replaced wholesale on msft.go:126 (request.Imp = validImps)
      # and again on msft.go:303 per batch slice — also in-place mutation of the
      # framework's request struct.
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase
      mechanism_java: null
      target_type: openrtb_ext.ImpExtMsft
      wrapper_type: null
      # Two-phase via the impExtIncoming wrapper (models.go:13-16) which mirrors the
      # canonical {bidder: ImpExtXyz, gpid: string} shape. The outer ext is unmarshaled
      # in one shot to impExtIncoming (msft.go:98), then ext.Bidder gives access to
      # ImpExtMsft fields without a second jsonutil.Unmarshal. This is a structural
      # shortcut on `standard-two-phase` — semantically equivalent to two phases but
      # implemented as one Unmarshal of a struct that contains the inner Bidder field.
    endpoint_resolution:
      kind: query-parameter-augmentation
      mechanism_go: net/url
      mechanism_java: null
      macro_field_set: []
      template_params_struct_field_count: null
      # Endpoint http://ib.adnxs.com/openrtb2 is augmented with a ?member_id=<int>
      # query parameter ONLY when at least one imp has impExt.Bidder.Member != 0 AND
      # all member IDs across imps agree (msft.go:128-131, 217-222). The augmentation
      # uses url.URL.Query()/RawQuery — the canonical net/url pattern, NOT string
      # concatenation. Kobler-style template macro substitution is NOT used.
    helpers:
      - name: parseExtraInfo
        signature: "func parseExtraInfo(v string) (extraAdapterInfo, error)"
      - name: buildDefaultExtraInfo
        signature: "func buildDefaultExtraInfo() extraAdapterInfo"
      - name: initDisplayManageVerBuilder
        signature: "func initDisplayManageVerBuilder(req *openrtb2.BidRequest) func() string"
      - name: modifyImp
        signature: "func modifyImp(imp *openrtb2.Imp, ext impExtIncoming, displayManagerVerBuilder func() string) error"
      - name: appendMemberID
        signature: "func appendMemberID(uri url.URL, memberID int) url.URL"
      - name: getRequestExt
        signature: "func getRequestExt(ext json.RawMessage) (map[string]json.RawMessage, error)"
      - name: getAppnexusExt
        signature: "func (a *adapter) getAppnexusExt(extMap map[string]json.RawMessage, reqType metrics.RequestType) (requestExAppnexus, error)"
      - name: modifyRequestExt
        signature: "func (a *adapter) modifyRequestExt(request *openrtb2.BidRequest, requestInfo *adapters.ExtraRequestInfo) error"
      - name: buildRequests
        signature: "func buildRequests(imps []openrtb2.Imp, request *openrtb2.BidRequest, uri string) ([]*adapters.RequestData, []error)"
      - name: buildHeaders
        signature: "func buildHeaders() http.Header"
      - name: getMediaTypeForBid
        signature: "func getMediaTypeForBid(bid *bidExt) (openrtb_ext.BidType, error)"
      - name: findIABCategoryForBid
        signature: "func findIABCategoryForBid(bid *bidExt) (string, bool)"
  make_bids:
    response_type: openrtb2.BidResponse
    custom_response_type: null
    http_status_handling:
      kind: canonical-go-helpers
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: by-bid-ext-typed-field
          field: bid.ext.appnexus.bid_ad_type
          fallback_action: throw
      default_value: null
      multi_format_detection: none
      # Resolution is a single-step chain on bid.ext.appnexus.bid_ad_type (an int).
      # Mapping: 0 -> banner, 1 -> video, 3 -> native. Any other value (including 2,
      # the OpenRTB audio code, which is unmapped) returns an
      # `unrecognized bid_ad_type in response: %d` error and the bid is dropped
      # (msft.go:384-395). The chain has no fallback; it throws via the err return.
    bid_pointer_pattern: indexed-iteration
    bid_pointer_go_sibling: range-value-pointer
    # MakeBids ranges over response.SeatBid by value (`for _, sb := range`) and over
    # sb.Bid by index (`for i := range sb.Bid`); inside the inner loop it copies
    # sb.Bid[i] to a local `bid` variable and then takes &bid for the TypedBid pointer
    # (msft.go:347, 369). This is a hybrid — the SeatBid loop is range-value and the
    # Bid loop is indexed — but the Bid pointer ultimately points at the local copy.
    currency_overwrite_safety: guarded
    # `if appnexusResponse.Cur != "" { bidderResponse.Currency = appnexusResponse.Cur }`
    # (msft.go:377-379). The framework default is preserved when the upstream returns
    # an empty Cur, fixing the optidigital-class anti-pattern.

