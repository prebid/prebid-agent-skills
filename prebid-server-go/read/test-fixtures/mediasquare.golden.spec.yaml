quirks:
  # Edge case #4 — multi-file layout justified by the non-OpenRTB request body.
  - id: multi-file-layout-non-openrtb-payload
    file: adapters/mediasquare/
    summary: "Adapter splits across 4 source files (mediasquare.go = 129 LOC orchestrator, structs.go = 240 LOC types/init/setContent/getContent, parsers.go = 83 LOC GDPR/DSA parsers, utils.go = 95 LOC bid-shaping helpers + headerList + errorWriter). The split is justified by the custom payload: msqParameters/msqResponse and their constituent types are large enough that co-locating them with the orchestrator would exceed reviewable bounds."
    edge_case_taxon: multi-file-layout-justified
  # Edge case #5 — custom request body shape (paired with batching.rules custom_body_type
  # AND request_body.custom_body_type so the custom enum value has a quirks entry).
  - id: custom-request-body-msqparameters
    file: adapters/mediasquare/structs.go
    summary: "MakeRequests marshals msqParameters (structs.go:23-32), NOT openrtb2.BidRequest. Codes[] aggregates one entry per imp via setContent (structs.go:155-210); GDPR (consent_required + consent_string), DSA, tech (device/app/site/user verbatim), test, user_uid, pbjs (prebid version) are added at request scope. This is the canonical case for batching.rules: imp-flatten-aggregate."
    edge_case_taxon: multi-file-layout-justified
  # Edge case #6 — custom response shape.
  - id: custom-response-body-msqresponse
    file: adapters/mediasquare/structs.go
    summary: "MakeBids unmarshals into msqResponse (structs.go:13-20), with responses[] of msqResponseBids (structs.go:68-86). Each msqResponseBids carries cpm/creative_id/transaction_id/net_revenue/ttl/video{xml,url}/native{title/icon/image/cta/...}/adomain/dsa/burl. getContent (structs.go:213-240) flattens these into adapters.TypedBid records; bidType (utils.go:30-39) and mType (utils.go:18-27) classify by which sub-object is non-nil."
    edge_case_taxon: multi-file-layout-justified
  # Test naming — the Go test in mediasquare_test.go uses the canonical RunJSONBidderTest
  # harness, but TestMakeRequests adds two additional unit-test cases for nil-request
  # and empty-imp paths (mediasquare_test.go:24-44) that operate outside the JSON
  # fixture harness.
  - id: hand-rolled-makerequests-unit-tests
    file: adapters/mediasquare/mediasquare_test.go
    summary: "TestMakeRequests (mediasquare_test.go:24-44) exercises nil-request and empty-Imp paths via direct adapter calls + assert.Equal — both paths emit the `<MakeRequests> request: is empty.` error from utils.go:errorWriter. These are not represented in the JSON fixture set; they cover the fast-fail guard at mediasquare.go:30-33."
    edge_case_taxon: legacy-test-helpers-imported
  # MakeBids status handling — uses raw http.StatusXxx checks (mediasquare.go:98-117)
  # rather than canonical helpers (R30 / Rule 30).
  - id: legacy-raw-status-checks
    file: adapters/mediasquare/mediasquare.go
    summary: "MakeBids inspects response.StatusCode directly (mediasquare.go:98-107) with a switch on http.StatusBadRequest (BadInput) vs default (BadServerResponse), then a separate empty-Responses check (mediasquare.go:118-124) that emits BadServerResponse with http.StatusNoContent in the message. Predates and bypasses adapters.IsResponseStatusCodeNoContent / adapters.CheckResponseStatusCodeForErrors."
    edge_case_taxon: legacy-encoding-json-direct-usage
  # currency_overwrite_safety: unguarded (utils.go:234 inside getContent loop).
  - id: unguarded-currency-overwrite-on-each-bid
    file: adapters/mediasquare/structs.go
    summary: "getContent (structs.go:213-240) sets bidderResponse.Currency = resp.Currency on every iteration (line 234). Last-bid-wins overwrite with no guard against empty string; if the final response has Currency==\"\" the framework's default is silently overwritten to empty."
    edge_case_taxon: unguarded-currency-overwrite

cross_language:
  go_artifacts:
    bidder_dir: adapters/mediasquare/
    package_name: mediasquare
    bidder_constant: openrtb_ext.BidderMediasquare
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/mediasquare/
    bidder_class: MediasquareBidder
    config_class: MediasquareConfiguration
    yaml_path: src/main/resources/bidder-config/mediasquare.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/mediasquare/
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: false
    package_directory_mismatch: false
    multi_file_layout: true
    custom_unmarshaljson_present: false
  go_specific_concerns:
    - "Multi-file Go layout (mediasquare.go orchestrator + structs.go types + parsers.go + utils.go) — Java port keeps the equivalent split via co-located classes under bidder/mediasquare/{request,response}/ and a separate proto/.../mediasquare/ExtImpMediasquare.java. Port mapping is type-by-type, not file-by-file."
    - "Custom request body (msqParameters) marshaled directly via jsonutil.Marshal (mediasquare.go:78). Java port uses Bidder<MediasquareRequest> generic so the framework auto-marshals — see Rule 9 (parameterized Bidder<T>). Cross-language helpers diverge: Go assembles RequestData manually, Java uses BidderUtil.defaultRequest with a typed payload."
    - "Custom response (msqResponse) unmarshaled directly via jsonutil.Unmarshal (mediasquare.go:111). Java port uses mapper.decodeValue with response-specific class. Both sides require an explicit imp-flatten-aggregate batching rule plus by-response-payload-shape bid_type resolution (Rule 25)."
    - "GDPR/DSA parsing uses tiny ad-hoc parser structs (parserDSA, parserGDPR) with `setContent` methods that re-Unmarshal sub-fields. Java port simplifies via direct ObjectNode field access. Idiomatic Go-side encapsulation that does not translate cleanly."
    - "interface{} (any) used for DSA payload (structs.go:28, 84, parsers.go:12). Java side uses ObjectNode/JsonNode. Type erasure on the Go side makes the DSA passthrough opaque — porter must preserve the passthrough behavior, NOT the type."
    - "headerList is a package-level var (utils.go:12-15) constructed once at package init, shared across all RequestData. Idiomatic Go but Java side allocates fresh via HttpUtil.headers() per request. Functionally equivalent."
    - "Last-bid-wins currency overwrite (structs.go:234) — getContent sets bidderResponse.Currency on every iteration. Java port should guard via Optional.ofNullable(bid.getCurrency()).filter(StringUtils::isNotEmpty).orElse(...) per the unguarded-currency-overwrite quirk."
    - "version.Ver used to populate msqParams.PrebidVer (structs.go:144-149). When request.Test==1 the literal `prebid-test-version` is sent (line 144). When unset, `n/a` (line 148). The test-mode override is observable in JSON fixtures."
    - "ptrInt8ToBool (utils.go:82-87) — niche helper to convert *int8 (request.Regs.GDPR is *int8 in OpenRTB) to a bool with nil-safe semantics. Java port uses BooleanUtils.toBoolean(Boolean) or a direct null check."
    - "errorWriter (utils.go:90-95) — single-source error formatter with isEmpty branch. All errors emitted from MakeRequests follow this pattern via fmt.Errorf and surface as plain `error` (not errortypes.BadInput). Java port should map to BidderError.badInput per Rule 27."
  java_specific_concerns: []
  port_lineage:
    source_language: go
    source_pr: null
    destination_language: java
    destination_pr: null
    fidelity_review_themes: []
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg
