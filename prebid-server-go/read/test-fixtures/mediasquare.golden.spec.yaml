code:
  package_or_class: mediasquare
  directory_name: mediasquare
  package_directory_mismatch: false
  # Edge case #4 — multi-file Go layout. The adapter splits implementation across 4
  # source files (plus 2 test files). All files belong to package `mediasquare`.
  file_layout:
    kind: multi-file
    files:
      - name: mediasquare.go
        role: implementation
        loc: 129
      - name: structs.go
        role: types
        loc: 240
      - name: parsers.go
        role: parsers
        loc: 83
      - name: utils.go
        role: utils
        loc: 95
  imports:
    has_template_engine: false
    has_currency_helper: false
    has_jsonutil: true
    third_party: []
  adapter_struct:
    type_name: adapter
    type_visibility: unexported
    fields:
      - name: endpoint
        type: string
  builder:
    signature_canonical: true
    extra_adapter_info_used: false
    template_parsed_at_build: false
    errors_returned: []
  make_requests:
    # Edge case — multi-imp aggregation: each imp becomes one entry in
    # `msqParameters.Codes[]`, all sent in a single HTTP request.
    batching:
      applied_in_order: true
      rules:
        - kind: imp-flatten-aggregate
          custom_body_type: msqParameters
    # Edge case #5 — custom (non-OpenRTB) request body. The HTTP body is a
    # `msqParameters` struct (defined in structs.go), NOT an openrtb2.BidRequest.
    request_body:
      kind: custom
      custom_body_type: msqParameters
    mutation:
      mutates_request: false
      entity_strategies: {}
      go_idiom: none
      java_idiom: null
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase
      mechanism_java: null
      target_type: openrtb_ext.ImpExtMediasquare
      wrapper_type: null
    endpoint_resolution:
      kind: static
      mechanism_go: null
      mechanism_java: null
      macro_field_set: []
      template_params_struct_field_count: null
    helpers:
      - name: makeRequest
        signature: "func (a *adapter) makeRequest(request *openrtb2.BidRequest, msqParams *msqParameters) (requestData *adapters.RequestData, err error)"
      - name: initMsqParams
        signature: "func initMsqParams(request *openrtb2.BidRequest) (msqParams msqParameters)"
      - name: setContent
        signature: "func (msqParams *msqParametersCodes) setContent(currentImp openrtb2.Imp) (ok bool)"
      - name: getContent
        signature: "func (msqResp *msqResponse) getContent(bidderResponse *adapters.BidderResponse)"
      - name: parserDSA.getValue
        signature: "func (parser parserDSA) getValue(request *openrtb2.BidRequest) interface{}"
      - name: parserGDPR.getValue
        signature: "func (parser parserGDPR) getValue(field string, request *openrtb2.BidRequest) (gdpr string)"
      - name: mType
        signature: "func (msqBids *msqResponseBids) mType() openrtb2.MarkupType"
      - name: bidType
        signature: "func (msqBids *msqResponseBids) bidType() openrtb_ext.BidType"
      - name: extBid
        signature: "func (msqBids *msqResponseBids) extBid() (raw json.RawMessage)"
      - name: loadExtBid
        signature: "func (msqBids *msqResponseBids) loadExtBid() (extBid openrtb_ext.ExtBid, errs []error)"
      - name: extBidPrebidMeta
        signature: "func (msqBids *msqResponseBids) extBidPrebidMeta() *openrtb_ext.ExtBidPrebidMeta"
      - name: ptrInt8ToBool
        signature: "func ptrInt8ToBool(i *int8) bool"
      - name: errorWriter
        signature: "func errorWriter(header string, err error, isEmpty bool) error"
  make_bids:
    # Edge case #6 — custom response unmarshal. The body is a `msqResponse`
    # struct (defined in structs.go), with `responses[]` carrying msqResponseBids
    # entries that are NOT openrtb2.Bid-shaped (cpm/creative_id/native sub-object).
    response_type: custom
    custom_response_type: msqResponse
    http_status_handling:
      # Direct StatusCode == http.StatusOK / StatusCode == http.StatusBadRequest checks
      # at mediasquare.go:98-107 — does not use adapters.IsResponseStatusCodeNoContent
      # or adapters.CheckResponseStatusCodeForErrors helpers.
      kind: legacy-raw-go
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      # See utils.go:30-39 — bidType() inspects payload shape (Video!=nil, Native!=nil)
      # and falls back to banner. Pairs with custom response_type.
      method_chain:
        - method: by-response-payload-shape
          fallback_action: return-default
      default_value: banner
      multi_format_detection: none
    # `for _, resp := range msqResp.Responses` over a value-receiver slice
    # (structs.go:215). Bid is built fresh per iteration into tmpTBid.Bid.
    bid_pointer_pattern: indexed-iteration
    bid_pointer_go_sibling: range-value-pointer
    # structs.go:234 — `bidderResponse.Currency = resp.Currency` on each iteration,
    # final assignment wins; no guard against empty string.
    currency_overwrite_safety: unguarded

