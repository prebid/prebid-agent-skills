# preserve byte-fidelity. The raw file is 515 bytes terminating with `\n}\n`. A `|`
# block emitter would normalize the terminating newline (and we lose round-trip
# determinism). The double-quoted form satisfies R2: sha256(decoded scalar) ==
# bidder_params_sha256 exactly.
bidder_params_json: "{\n  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\n  \"title\": \"Mediasquare Adapter Params\",\n  \"description\": \"A schema which validates params accepted by the Mediasquare adapter\",\n  \"type\": \"object\",\n  \"properties\": {\n    \"owner\": {\n      \"type\": \"string\",\n      \"minLength\": 1,\n      \"description\": \"The owner provided for mediasquare.\"\n    },\n    \"code\": {\n      \"type\": \"string\",\n      \"minLength\": 1,\n      \"description\": \"The code provided for mediasquare.\"\n    }\n  },\n  \"required\": [\"owner\", \"code\"]\n}\n"
bidder_params_sha256: 798a251b3a6b11aa42036a129f8f61b3f0a13335babe539a96658b01ddd44f4d

