quirks:
  - id: hardcoded-caller-name-version
    file: adapters/33across/33across.go
    summary: "Package-level var CALLER = TtxCaller{\"Prebid-Server\", \"n/a\"} (line 45) is hardcoded and appended to request.ext.ttx.caller[] on every MakeRequests call (line 194). The Version field is the literal string \"n/a\" rather than being sourced from build metadata or config — should be promoted to a config field or sourced from buildinfo."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: legacy-encoding-json-direct-usage
    file: adapters/33across/33across.go
    summary: "Adapter mixes encoding/json (json.Marshal at lines 105, 152, 196) with jsonutil (used for Unmarshal paths at lines 80, 130, 137, 181, 219, 230). Recommended: migrate Marshal calls to the canonical jsonutil package."
    edge_case_taxon: legacy-encoding-json-direct-usage
  - id: bid-type-default-on-ext-unmarshal-failure
    file: adapters/33across/33across.go
    summary: "MakeBids (lines 230-234) treats jsonutil.Unmarshal(sb.Bid[i].Ext, &bidExt) failure as a silent fallback to BidTypeBanner — no error is appended, no BadServerResponse surfaced. Permissive behavior; canonical adapters throw on missing/malformed ext."
    edge_case_taxon: hardcoded-bid-type
  - id: caller-injection-mutates-shared-request-ext
    file: adapters/33across/33across.go
    summary: "makeReqExt rewrites request.Ext on the shared input request (line 68) before grouping imps into SRA buckets — mutation persists across all per-group HTTP requests AND aliases back into the framework's BidRequest. Direct-pointer-mutation idiom on RequestExt rather than copy-then-mutate."
    edge_case_taxon: hardcoded-config-as-anti-pattern

cross_language:
  go_artifacts:
    bidder_dir: adapters/33across/
    package_name: ttx
    bidder_constant: openrtb_ext.Bidder33Across
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/ttx/
    bidder_class: TtxBidder
    config_class: TtxConfiguration
    yaml_path: src/main/resources/bidder-config/ttx.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/ttx/
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: true
    package_directory_mismatch: true
    multi_file_layout: false
    custom_unmarshaljson_present: false
  go_specific_concerns:
    - "Package name `ttx` does NOT match directory `33across/` — Go-only constraint (Go forbids package names starting with a digit, so the directory uses the brand name 33across while the package follows Go's identifier rules with the legacy name `ttx`). Java has no analogous constraint; the Java port lives under `bidder/ttx/` (matching directory == class prefix) with no inversion."
    - "Adapter struct `TtxAdapter` is EXPORTED — most Go adapters use an unexported `adapter` type. Exported variant is rarer and reflects the legacy ttx naming carried forward."
    - "Multiple package-level types are exported: `TtxAdapter`, `TtxCaller`, `Ext`, `CALLER` package-level var. None are referenced from outside the adapters/33across package — the visibility is over-broad relative to canonical practice."
    - "MakeRequests groups imps by SRA key (productId+zoneId) and emits one HTTP request per group — this is the `grouped-by-key` batching rule. The Java port must replicate the grouping order; Go uses a `map[string][]Imp` whose iteration order is randomized, which the Java side typically replaces with a deterministic ordering."
    - "validateVideoParams returns BOTH the videoCopy (mutated with StartDelay default) AND an error in the same call (line 254-256, 265). The caller (makeImps line 163-172) assigns videoCopy unconditionally before checking err — but if err != nil, the imp is dropped, so the assignment is benign in practice; flagged for port-translation as the Java side typically restructures this."
    - "MakeBids silently maps Unmarshal-failure on bid.Ext to BidTypeBanner (line 230-234) — Java's typeref unmarshal would throw; the port must preserve the Go side's swallow-and-default behavior."
    - "Direct encoding/json (json.Marshal/json.Unmarshal) is used in 33across.go alongside jsonutil — mixed style. json.Marshal is used at lines 105, 152, 196 (request body, imp ext, request ext); jsonutil.Unmarshal is used for read paths."
    - "MakeBids uses raw http.StatusXxx checks rather than canonical adapters.IsResponseStatusCodeNoContent / adapters.CheckResponseStatusCodeForErrors — pre-dates the helpers."
  java_specific_concerns: []
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg
