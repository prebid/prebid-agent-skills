quirks:
  - id: video-only-capability
    file: static/bidder-info/bidstack.yaml
    summary: "Capabilities declares ONLY app.mediaTypes: [video] — no site, no dooh, no banner/native/audio. Canonical exemplar of a video-only adapter; bid type is therefore hardcoded to BidTypeVideo in MakeBids (bidstack.go:99)."
    edge_case_taxon: hardcoded-bid-type
  - id: bearer-token-from-imp-ext
    file: bidstack.go
    summary: "Authorization header is constructed per-request as `Bearer <publisherId>` where publisherId is read from imp[0].ext.bidder.publisherId (prepareHeaders, lines 109-119). Only the FIRST imp is consulted — multi-imp callers cannot override per-imp; multiple distinct publisherIds across imps are silently ignored."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: legacy-raw-status-checks
    file: bidstack.go
    summary: "MakeBids uses raw status code checks (StatusNoContent, StatusBadRequest, StatusOK at lines 77-86) instead of canonical adapters.IsResponseStatusCodeNoContent / adapters.CheckResponseStatusCodeForErrors helpers. Pre-dates the canonical helpers; 400 is mapped to a literal `\"bad request from publisher\"` string error rather than a typed errortypes.BadInput."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: imp-ext-unmarshal-only-via-prepareHeaders
    file: bidstack.go
    summary: "getBidderExt is invoked only inside prepareHeaders (line 109) to extract the publisherId for the Authorization header — NOT to validate or transform per-imp. The framework's params_test.go validates publisherId schema-wise, but MakeRequests itself never inspects publisherId on imps beyond the first. Schema-only validation, not behavioral."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: hardcoded-bid-type-video
    file: bidstack.go
    summary: "MakeBids unconditionally assigns BidType: openrtb_ext.BidTypeVideo on every bid (line 99) regardless of bid.mtype, imp.video presence, or bid.ext shape. Justified by video-only capabilities, but the adapter does NOT cross-check against imp.video presence — a bidder returning a banner-shaped bid would still be tagged video."
    edge_case_taxon: hardcoded-bid-type
  - id: cross-language-capability-divergence
    file: static/bidder-info/bidstack.yaml
    summary: "Go declares only `app: video` in capabilities. Java declares BOTH `site-media-types: [video]` AND `app-media-types: [video]` plus a `cookie-family-name: bidstack` user-sync block. Cross-language port drift: the Java port broadens the surface (site-allowed) and adds usersync that Go lacks. R5 port-fidelity concern; the Go and Java bidder-params bytes also differ (different whitespace formatting in the `required` array)."
    edge_case_taxon: port-fidelity-divergence

cross_language:
  go_artifacts:
    bidder_dir: adapters/bidstack/
    package_name: bidstack
    bidder_constant: openrtb_ext.BidderBidstack
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/bidstack/
    bidder_class: BidstackBidder
    config_class: BidstackConfiguration
    yaml_path: src/main/resources/bidder-config/bidstack.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/bidstack/
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  go_specific_concerns:
    - "Capabilities asymmetry: Go declares only `capabilities.app.mediaTypes: [video]`. The Java port broadens to BOTH `app-media-types: [video]` and `site-media-types: [video]` in `bidder-config/bidstack.yaml`. Port-fidelity issue — a Go-source port to Java should preserve the app-only restriction, OR the Go side should be updated to match the broader Java surface (raise with maintainer)."
    - "User-sync absent on Go (no `userSync:` block in `static/bidder-info/bidstack.yaml`) but present on Java (`usersync: { cookie-family-name: bidstack }`). Single-direction asymmetry — porting Go→Java the user-sync metadata must be ADDED; porting Java→Go it must be DROPPED."
    - "bidder-params bytes are NOT byte-identical between Go and Java (bidder_params_ref.sha256: Go=4d5a3385 651B vs Java=00b8e327 656B, both re-derived from upstream). The schemas are semantically equivalent (same fields, same required) but Java reformats the `required` array as multi-line while Go keeps the single-line `[ \"publisherId\" ]` form. R5 port-fidelity violation — the porter should normalize one direction."
    - "`prepareHeaders` constructs the Authorization header from `imp[0].ext.bidder.publisherId` ONLY (line 109). Multi-imp requests with diverging publisherIds across imps silently use the first; Go has no per-imp Authorization. Java port must replicate this single-publisher constraint or surface it explicitly."
    - "MakeBids hardcodes `BidType: openrtb_ext.BidTypeVideo` (line 99) without inspecting bid.mtype or imp.video presence — relies on the YAML capabilities to enforce video-only at the framework level. A future port to Java should preserve the hardcoded-video pattern (`BidType.video`) rather than introducing a `by-imp-mediatype` lookup."
    - "MakeBids uses legacy raw status checks (`StatusNoContent`, `StatusBadRequest`, `StatusOK`) at lines 77-86 instead of canonical `adapters.IsResponseStatusCodeNoContent` / `adapters.CheckResponseStatusCodeForErrors`. The 400 path returns a literal `errors.New(\"bad request from publisher\")` rather than a typed `errortypes.BadInput` — pre-dates the canonical helpers + typed-error registry."
    - "Currency conversion: `MakeRequests` mutates `imp.BidFloor` and `imp.BidFloorCur` in-place via indexed pointer (lines 47-58), converting non-USD floors to USD. Imp slice mutation is direct on `request.Imp[i]` — the framework's BidRequest is not deep-copied first, so the conversion writes through to shared memory. Idiom: `direct-pointer-mutation` (rare; reviewers typically flag in favor of `shallow-copy`)."
    - "Imp ext type is named `ImpExtBidstack` (legacy `ImpExt{Bidder}` style) rather than canonical `ExtImp{Bidder}` (which would be `ExtImpBidstack`). Same pattern Optidigital uses — surfaces as a legacy-naming carry-forward."
  java_specific_concerns: []
