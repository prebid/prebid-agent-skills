quirks:
  - id: imp-ext-strip-post-extraction
    file: limelightDigital.go
    line: 121
    summary: "After extracting imp.Ext into ImpExtLimelightDigital, the adapter sets `imp.Ext = nil` (line 121) — STRIPS the ext from the outgoing request rather than passing it through. ADR-007 F5 imp-ext-strip-post-extraction master sample. Both Go AND Java sides do this; symmetric pattern. Distinct from teqblaze's REPACK pattern (teqblaze rewrites with new fields; limelightDigital removes entirely)."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: request-id-derived-per-imp
    file: limelightDigital.go
    line: 80
    summary: "Per-imp split mutates the request copy's ID: `requestCopy.ID = request.ID + \"-\" + imp.ID`. Each per-imp HTTP request carries a derived ID combining the original request ID and the imp ID. Unusual pattern — most per-imp adapters preserve the original request ID. Java side does NOT do this (the Java port preserves request.id verbatim per imp). Cross-language asymmetry."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: request-ext-stripped
    file: limelightDigital.go
    line: 81
    summary: "`requestCopy.Ext = nil` strips the request-level Ext (not just imp.Ext) before serialization. Drops any auction-level ext fields the publisher added. Cross-language symmetric — Java side also drops via builder."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: flexible-type-via-json-number
    file: openrtb_ext/imp_limelightDigital.go
    summary: "PublisherID is `json.Number` — handles the schema's `[\"integer\", \"string\"]` flexible-type via Go's standard encoding/json mechanism. Distinct from jsonutil.StringInt/IntString (which the bidder-params SKILL documents as the canonical Go flexible-type idiom). First corpus example of json.Number for flexibility."
    edge_case_taxon: incomplete-classification
  - id: legacy-impext-naming
    file: openrtb_ext/imp_limelightDigital.go
    summary: "Type name `ImpExtLimelightDigital` uses legacy `ImpExt*` form (vs newer `ExtImp*` form). Common to older adapters; not a regression."
    edge_case_taxon: legacy-impext-naming
  - id: builder-error-message-typo
    file: limelightDigital.go
    line: 28
    summary: "Builder returns `errors.New(\"Endpoint  adapter parameter is not provided\")` — note the DOUBLE-space between `Endpoint` and `adapter`. Upstream typo preserved verbatim in source; doesn't affect functionality but reviewers often miss in code review."
    edge_case_taxon: yaml-field-name-typo

cross_language:
  go_artifacts:
    bidder_dir: adapters/limelightDigital/
    package_name: limelightDigital
    bidder_constant: openrtb_ext.BidderLimelightDigital
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/limelightdigital/   # NOTE: lowercase package vs Go's camelCase
    bidder_class: LimeLightDigitalBidder                                    # NOTE: CamelCase double-cap (LimeLight) vs Go single-cap (Limelight)
    config_class: LimeLightDigitalConfiguration
    yaml_path: src/main/resources/bidder-config/limelightDigital.yaml       # camelCase matches Go YAML
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/limelightdigital/
  port_concerns:
    aliases_inverted: true                    # Java parent.aliases[15] vs Go per-alias YAMLs — Rule 33
    yaml_unification: false
    mutation_idiom_divergence: true           # Java imp.toBuilder().ext(null).build() ↔ Go in-place imp.Ext = nil + shallow-copy
    package_directory_mismatch: false         # Go: package=dir=limelightDigital. Java: dir=limelightdigital, class=LimeLightDigital — separate concern (multi-form naming).
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: prebid/prebid-server-java#2228
    destination_language: null
    destination_pr: prebid/prebid-server#2539
    fidelity_review_themes:
      - port-fidelity
      - alias-empire-endpoint-macro-substitution
      - imp-ext-strip-post-extraction
      - flexible-type-publisher-id
      - multi-form-naming-asymmetry
  go_specific_concerns:
    - "PublisherID is `json.Number` (encoding/json's standard) — handles schema's flexible-type `[\"integer\", \"string\"]` for the field. Java side uses `Integer` (less flexible — would fail on a string-form publisher ID input). Cross-language asymmetry: schema is more permissive than the Java type system."
    - "Per-imp split via `requestCopy := *request` shallow-copy + `requestCopy.Imp = []openrtb2.Imp{imp}` + `requestCopy.ID = request.ID + \"-\" + imp.ID`. The request ID is MUTATED per imp (derived). Java side preserves request.id verbatim per imp."
    - "imp.Ext = nil (line 121, in getImpressionExt) AND requestCopy.Ext = nil (line 81, before serialization) — both ext fields stripped before sending to bidder. Java side mirrors via imp.toBuilder().ext(null).build(). ADR-007 F5 imp-ext-strip-post-extraction master sample."
    - "MakeRequests does NOT URL-encode the macro-substituted host/publisher_id values when building endpoint URL via macros.ResolveMacros. Java side DOES url-encode (HttpUtil.encodeUrl on both substitutions). Cross-language asymmetry — could surface as wire-format URL divergence for hosts containing reserved URL characters."
    - "Builder returns error \"Endpoint  adapter parameter is not provided\" with double-space (line 28). Upstream typo; preserved verbatim."
    - "15 aliases (filmzie, iionads, evtech, adsyield, greedygame, appstock, xtrmqb, embimedia, tgm, streamlyn, streamvision, orangeclickmedia, velonium, adtg_org, performist). adtg_org has UNDERSCORE — Go YAML accepts (per PR #4211). Java IT class name is `AdtgorgTest` (no underscore — Java identifier-rule workaround). performist alias has truncated endpoint (`/openrtb/{{PublisherID}}` only, NO `?host={{Host}}` query) — distinct from sibling aliases."
  java_specific_concerns: []
