      rules:
        - kind: per-imp                       # Rule 10
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
    mutation:
      mutates_request: true
      entity_strategies:
        Imp: in-place                         # imp value-copy from `for _, imp := range request.Imp` then directly mutated (BidFloor, BidFloorCur, Ext)
        Cur: none
      go_idiom: shallow-copy                  # `requestCopy := *request` per loop iteration
      java_idiom: null
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase        # Rule 1
      mechanism_java: null
      target_type: openrtb_ext.ImpExtLimelightDigital
      wrapper_type: null
    endpoint_resolution:
      kind: multi-token-substitution
      mechanism_go: text/template
      mechanism_java: null
      macros_used:
        - Host
        - PublisherID
      template_params_struct_field_count: 2
    helpers:
      - name: getImpressionExt
        signature: "func getImpressionExt(imp *openrtb2.Imp) (*openrtb_ext.ImpExtLimelightDigital, error)"
      - name: buildEndpointURL
        signature: "func (a *adapter) buildEndpointURL(params *openrtb_ext.ImpExtLimelightDigital) (string, error)"
      - name: getMediaTypeForBid
        signature: "func getMediaTypeForBid(impId string, imps []openrtb2.Imp) (openrtb_ext.BidType, error)"
  make_bids:
    response_type: openrtb2.BidResponse
    custom_response_type: null
    http_status_handling:
      kind: legacy-raw-go                     # Explicit per-status: 204 (no content), 400 (BadInput), other non-200 (BadServerResponse). Plus empty-body short-circuit returning (nil, nil).
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: by-imp-mediatype            # Rule 22 — match impID to source imp; first non-nil mediatype field determines bid type
          field: imp.banner|video|audio|native
          fallback_action: throw
      default_value: null
      multi_format_detection: strict
    bid_pointer_pattern: indexed-iteration    # `for i, bid := range seatBid.Bid { ... &seatBid.Bid[i] ... }` — index-based pointer to avoid range-var aliasing
    bid_pointer_go_sibling: range-index
    currency_overwrite_safety: passthrough-from-response

