params:
  schema_interpretation:
    properties:
      - name: host
        type: string
        description: "Ad network's RTB host"
        format: hostname
        pattern: '^.+\..+$'
      - name: publisherId
        type: ["integer", "string"]            # FLEXIBLE TYPE — first corpus example with this Go-side capture
        description: "Publisher ID"
        minimum: 1
        pattern: '^[1-9][0-9]*$'
    required_fields:
      - host
      - publisherId
    flexible_types:
      - publisherId                            # First corpus example — schema declares `["integer", "string"]` for publisherId. Go uses json.Number to handle both shapes; Java uses Integer (less flexible).
    combinators_used: []
  ext_struct:
    package: openrtb_ext
    file: openrtb_ext/imp_limelightDigital.go
    type_name: ImpExtLimelightDigital          # Legacy ImpExt* form. Single-cap `LimelightDigital` (vs Java's CamelCase `LimeLightDigital`).
    fields:
      - name: Host
        json_tag: host
        type_native: string
        omitempty: false
        notes: []
      - name: PublisherID
        json_tag: publisherId
        type_native: json.Number               # Critical: Go uses json.Number to handle the integer-OR-string flexibility from the schema's `["integer", "string"]` type. encoding/json's standard json.Number type unmarshals both forms. PublisherID.String() yields the canonical decimal-string form for endpoint URL substitution.
        omitempty: false
        notes:
          - "json.Number handles the schema's flexible-type `[\"integer\", \"string\"]` for publisherId — Go's standard mechanism (vs jsonutil.StringInt/IntString)"
    custom_unmarshal: false
    custom_unmarshal_accepts: []
  params_test:
