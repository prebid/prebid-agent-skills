lifecycle:
  rename:
    old_name: liftoff
    new_name: vungle
    subtype: bilateral                        # ADR-006 sub-type. Both sides ended at vungle as canonical, with each side's own backward-compat for liftoff. NOT go-leads as ADR-006 originally claimed (operator-facing migration guidance only; the bidder name was never actually renamed in code).
    alias_back: false                         # Go side does NOT use an alias YAML for liftoff; the legacy name lives in the removed-bidder warning map.
    alias_back_form: removed-bidder-warning-map
    package_moves: []
    fixture_dir_moves: []
    yaml_deletes: []
    yaml_adds: []
    merged_at: null                           # No discrete rename PR; the bidder always was vungle. Liftoff appeared in operator configs based on the 2021 Liftoff/Vungle acquisition news; backward-compat surfaces handle that.
    release: null
    notes:
      - "Liftoff acquired Vungle in 2021. The acquisition was a parent-company-name change; the SSP/exchange product remained `Vungle Exchange`."
      - "Some operators configured `liftoff` based on the acquisition news (treating it as a rename). Both prebid-server-go and prebid-server-java handle this with backward-compat: Go via the removed-bidder warning map; Java via tilde_inherit alias `aliases: { liftoff: { enabled: false } }` in vungle.yaml."
      - "Maintainer email is `vxssp@liftoff.io` (Liftoff parent company) on both sides."
      - "ADR-006 originally classified this as go-leads with `liftoff (Go) ↔ vungle (Java)`. Upstream evidence (this fixture) shows the actual state is bilateral with phantom-rename history. ADR-006 was subsequently corrected per this evidence — see CHANGELOG `## Unreleased — ADR corrections (no version bump)` and ADR-006 line 3 `refined 2026-05-03`."

