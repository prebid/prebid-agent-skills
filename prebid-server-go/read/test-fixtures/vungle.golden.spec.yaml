      target_type: openrtb_ext.ImpExtVungle
      wrapper_type: vungleImpressionExt       # Custom wrapper struct: embeds *adapters.ExtImpBidder PLUS adds an `Ext openrtb_ext.ImpExtVungle "vungle"` field. Wire-format imp.ext after repack has the ExtImpBidder fields PLUS a `vungle` key.
    endpoint_resolution:
      kind: static
      mechanism_go: literal
      mechanism_java: null
      macros_used: []
    helpers: []
  make_bids:
