quirks:
  - id: site-to-app-synthesis
    file: vungle.go
    line: 90
    summary: "If request has Site (no App), MakeRequests SYNTHESIZES a fake App with `App.ID = pub_app_store_id` and removes Site (`requestCopy.Site = nil`). If request has App, copies App and overrides App.ID with pub_app_store_id. ADR-007 F3 mediatype-context-rewrite-site-to-app master sample (first corpus example). The wire-format outgoing request to Vungle ALWAYS has app context, never site."
    edge_case_taxon: mediatype-context-rewrite-site-to-app
  - id: buyer-uid-promotion-to-imp-ext
    file: vungle.go
    line: 70
    summary: "BidToken in imp.ext is sourced from `requestCopy.User.BuyerUID` at runtime (line 70: `bidderImpExt.BidToken = requestCopy.User.BuyerUID`). This is publisher-context promotion: a request-level field becomes an imp-level ext field. Distinct from publisher-supplied imp ext fields. Java side performs the same promotion."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: imp-ext-repack-with-vungle-key
    file: vungle.go
    line: 75
    summary: "MakeRequests repacks imp.ext with a custom shape: vungleImpressionExt embeds *adapters.ExtImpBidder PLUS adds an `Ext openrtb_ext.ImpExtVungle \"vungle\"` field tagged `vungle`. Wire-format imp.ext after repack has the ExtImpBidder.bidder fields preserved AND a new `vungle` key added carrying the same params (with bid_token populated from buyerUID). Distinct from teqblaze's REPACK (which strips and rewrites) — vungle ADDS a parallel key alongside `bidder`. Java side mirrors this via VungleImpressionExt with `prebid + bidder + vungle` keys."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: hardcoded-video-bid-type
    file: vungle.go
    line: 130
    summary: "MakeBids sets BidType = openrtb_ext.BidTypeVideo for ALL bids regardless of bid.mtype or imp media type (line 130). Rule 26 hardcoded fallback master sample (first time captured). The capabilities block declares only video on both site and app, so this is consistent with the bidder's declared scope, but it skips bid validation."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: param-test-go-singular-filename
    file: adapters/vungle/param_test.go
    summary: "Test file is `param_test.go` (SINGULAR) instead of canonical `params_test.go` (plural). Same filename quirk as Ogury (PR #4082). The Go test runner accepts either name; readers of the params section must tolerate both forms."
    edge_case_taxon: yaml-field-name-typo
  - id: removed-bidder-warning-for-liftoff
    file: exchange/adapter_util.go
    summary: "`liftoff` is in the removed-bidder warning map redirecting to `vungle`. Backward-compat for operators who configured `liftoff` based on the 2021 Liftoff/Vungle parent-company-name change. The bidder was never actually renamed in code — Vungle stayed canonical throughout."
    edge_case_taxon: bidder-rename-three-step

cross_language:
  go_artifacts:
    bidder_dir: adapters/vungle/
    package_name: vungle
    bidder_constant: openrtb_ext.BidderVungle
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/vungle/
    bidder_class: VungleBidder
    config_class: VungleConfiguration
    yaml_path: src/main/resources/bidder-config/vungle.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/vungle/
  port_concerns:
    aliases_inverted: true                    # Java declares `aliases: { liftoff: { enabled: false } }` under vungle parent (alias-back via tilde). Go declares NO alias YAML — uses removed-bidder warning map instead. Cross-language asymmetry on the alias-back mechanism (Rule 33-adjacent).
    yaml_unification: false
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: prebid/prebid-server-java#1819
    destination_language: null
    destination_pr: prebid/prebid-server#3024
    fidelity_review_themes:
      - port-fidelity
      - mediatype-context-rewrite-site-to-app
      - buyer-uid-promotion
      - hardcoded-video-bid-type
      - phantom-rename-liftoff-vungle
  go_specific_concerns:
    - "vungleImpressionExt struct embeds *adapters.ExtImpBidder anonymously AND adds an `Ext openrtb_ext.ImpExtVungle \"vungle\"` field (line 25). Wire-format imp.ext after repack carries ExtImpBidder.bidder fields verbatim AND a new `vungle` key with the publisher's app_store_id, placement_reference_id, and bid_token (populated from request.User.BuyerUID)."
    - "Site-to-App synthesis (line 90-99): if request has Site object (no App), MakeRequests sets requestCopy.Site = nil and synthesizes a fresh App `{ID: pub_app_store_id}`. If request has App, copies and overrides App.ID. The outgoing request to Vungle ALWAYS has app context. ADR-007 F3 mediatype-context-rewrite-site-to-app master sample."
    - "All bids are classified as BidTypeVideo regardless of bid.mtype or imp media type (line 130). Hardcoded video — Rule 26 master sample. The capabilities block declares only video, so the hardcoded fallback is consistent — but no validation against bid.mtype."
    - "param_test.go is singular (NOT plural params_test.go). Ogury-style filename quirk; same as Ogury PR #4082."
    - "X-OpenRTB-Version: 2.5 header (line 116). Pinned to 2.5 — distinct from adapters that pin to 2.6 or omit the header. Vungle's upstream may not yet support 2.6 features."
    - "Liftoff/Vungle phantom rename: `liftoff` appears in exchange/adapter_util.go's removed-bidder warning map redirecting to `vungle`. Backward-compat for operators configuring liftoff based on the 2021 acquisition. The bidder name was never actually renamed in code — vungle stayed canonical."
  java_specific_concerns: []
