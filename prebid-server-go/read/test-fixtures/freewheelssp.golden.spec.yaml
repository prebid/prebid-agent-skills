params:
  schema_interpretation:
    properties:
      - name: zoneId
        type: ["integer", "string"]            # FLEXIBLE TYPE — accepts both integer and string forms
        description: "Zone ID"
        notes:
          - "Schema declares `[\"integer\", \"string\"]` union. Go uses `jsonutil.StringInt` (custom type that unmarshals both forms). Java uses plain `String` field with Jackson lenient string coercion. Cross-language symmetric on schema, asymmetric on native type."
    required_fields:
      - zoneId
    flexible_types:
      - field: zoneId
        declared_type: ["integer", "string"]
        runtime_parse: jsonutil.StringInt
        rejection_kind: never                 # Custom type tolerates both; never rejects on type mismatch
    combinators_used: []
  ext_struct:
    package: openrtb_ext
    file: openrtb_ext/imp_freewheelssp.go
    type_name: ImpExtFreewheelSSP             # NOTE: `Imp` prefix (legacy form) NOT `ExtImp` prefix. Distinct from typical `ExtImp<Bidder>` naming convention.
    fields:
      - name: ZoneId
        json_tag: zoneId
        type_native: jsonutil.StringInt        # Custom type that handles both integer and string JSON forms
        omitempty: false
        notes:
          - "ASYMMETRIC: Java POJO has 4 fields (zoneId + customSiteSectionId + networkId + profileId); Go ext struct has only 1 (zoneId). A request that passes the extra Java fields will be FORWARDED by Java but SILENTLY DROPPED by Go because Go's ext struct doesn't declare them."
    custom_unmarshal: false
    custom_unmarshal_accepts: []
  params_test:
    # No params_test.go here either -- absent at the pin, at master, and throughout
    # upstream history. Param validation runs through `freewheelssp_test.go`.
    file: null
    valid_cases_count: null
    invalid_cases_count: null
    bidder_constant_referenced: null

code:
  package_or_class: freewheelssp
  directory_name: freewheelssp
  package_directory_mismatch: false
  file_layout:
    kind: single-file
    files:
      - name: freewheelssp.go
        role: implementation
        loc: 115
  imports:
    has_template_engine: false                # No template engine — endpoint is a plain string
    has_currency_helper: false
    has_jsonutil: true                        # util/jsonutil for imp.ext unmarshal
    third_party:
      - github.com/prebid/openrtb/v20/openrtb2
  adapter_struct:
    type_name: adapter
    type_visibility: unexported
    fields:
      - name: endpoint                        # SINGLE field, lowercase/unexported
        type: string
  builder:
    signature_canonical: true
    extra_adapter_info_used: false
    template_parsed_at_build: false
    errors_returned: []
  make_requests:
    batching:
      applied_in_order: true
      rules:
        - kind: per-batch                     # SINGLE outbound HTTP request with ALL imps in one body. No per-imp/per-key splitting.
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
    mutation:
      mutates_request: true
      entity_strategies:
        Imp: in-place                         # `imp := &request.Imp[i]`; imp.Ext OVERWRITTEN with json.Marshal(impExt) — drops the {"bidder":...} wrapper, replaces with inner ext fields directly
        Banner: none
        Video: none                           # Video imps are forwarded as-is (no mutation)
        Site: none
        App: none
        Source: none
        Device: none
        User: none
        Cur: none
      go_idiom: index-pointer-mutate
      java_idiom: null
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase
      mechanism_java: null
      target_type: openrtb_ext.ImpExtFreewheelSSP
      wrapper_type: null                       # No custom wrapper — direct unwrap of {"bidder":...} envelope
    endpoint_resolution:
      kind: static
      mechanism_go: literal
      mechanism_java: null
      macros_used: []
    helpers: []                                # Inline; no helper functions extracted
  make_bids:
    response_type: openrtb2.BidResponse
    custom_response_type: null
    http_status_handling:
      kind: canonical-go-helpers               # 204 → nil bids; non-200 → BadServerResponse
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: hardcoded                    # Rule 26 hardcoded — ALL bids classified BidTypeVideo regardless of bid.MType, imp media type, or AdM content. Capabilities declare video-only, so consistent with bidder scope but skips bid validation.
          hardcoded_value: BidTypeVideo
          fallback_action: throw
      default_value: video
      multi_format_detection: none
    bid_pointer_pattern: range-with-bid-copy   # `for i := range seatBid.Bid { bid := seatBid.Bid[i]; ... &bid ... }` — value copy then pointer-to-local. NOT range-index (`&seatBid.Bid[i]`).
    bid_pointer_go_sibling: range-value-copy
    currency_overwrite_safety: passthrough-from-response   # Go propagates `bidResp.Cur` to BidderResponse.Currency (response-level, NOT per-bid). Java propagates per-bid via bidCurrency on each BidderBid.

