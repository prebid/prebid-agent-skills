quirks:
  - id: three-yaml-go-layout
    file: static/bidder-info/
    summary: "THREE bidder-info YAML files for the freewheel ecosystem: (1) freewheelssp.yaml canonical, (2) freewheel-ssp.yaml alias-stub via NEW `aliasOf:` top-level field (distinct from cadent's full duplication and from vungle's removed-bidder-warning-map), (3) fwssp.yaml separate top-level bidder package. Two distinct Go bidder constants registered: BidderFreewheelSSP and BidderFWSSP."
    edge_case_taxon: bidder-rename-three-step
  - id: alias-of-yaml-stub-mechanism
    file: static/bidder-info/freewheel-ssp.yaml
    line: 1
    summary: "FIRST CORPUS EXAMPLE of the Go `aliasOf:` YAML alias-stub mechanism. The hyphenated YAML file declares `aliasOf: freewheelssp` as its first field; the framework reads this and treats freewheel-ssp as a runtime alias of freewheelssp (sharing endpoint, params, and adapter code). Distinct from cadent's full-duplication pattern. Distinct from vungle's removed-bidder warning."
    edge_case_taxon: bidder-rename-three-step
  - id: adr-007-f2-label-collision-corrected
    file: adapters/freewheelssp/freewheelssp.go
    line: 16
    summary: "ADR-007 F2 master claim (freewheelssp = language-stamped-header-divergence) RE-AFFIRMED. The label-collision in coverage-report.py:58 (mis-labeling F2 as multi-endpoint-by-mediatype, which is F1's master = beachfront) was corrected per the ADR-corrections commit. Empirical structural evidence on the SINGLE-endpoint fact: adapter struct has ONE `endpoint string` field; MakeRequests uses it verbatim — confirming F2 is about HEADER divergence (Componentid value), not per-mediatype endpoint switching. Capabilities are video-only (no banner in scope)."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: hardcoded-video-bid-type
    file: adapters/freewheelssp/freewheelssp.go
    line: 87
    summary: "MakeBids sets `bidType := openrtb_ext.BidTypeVideo` once and uses it for ALL bids regardless of bid.MType, imp media type, or AdM content. Rule 26 hardcoded fallback (same pattern as vungle). Cross-language symmetric — Java side hardcodes BidType.video too."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: imp-ext-replace-with-inner
    file: adapters/freewheelssp/freewheelssp.go
    line: 38
    summary: "After unwrapping {\"bidder\":...} envelope into ImpExtFreewheelSSP, the adapter OVERWRITES imp.Ext with json.Marshal(impExt) — replacing the wrapper with the inner ext fields directly. Wire-format imp.ext sent to upstream has only {\"zoneId\":...} (no `bidder` key). Cross-language symmetric — Java does the same via mapper.valueToTree(extImpFreewheelSSP)."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: ext-struct-field-count-asymmetry
    file: openrtb_ext/imp_freewheelssp.go
    summary: "Go ImpExtFreewheelSSP has ONE field (ZoneId). Java ExtImpFreewheelSSP has FOUR fields (zoneId + customSiteSectionId + networkId + profileId). Real behavioral asymmetry: a request containing the extra fields will be FORWARDED to upstream by Java (as snake_case `custom_site_section_id` etc.) but SILENTLY DROPPED by Go. Cross-language fidelity gap."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: bid-pointer-range-value-copy
    file: adapters/freewheelssp/freewheelssp.go
    line: 90
    summary: "`for i := range seatBid.Bid { bid := seatBid.Bid[i]; ... &bid ... }` — VALUE COPY of the bid into a local variable, then pointer-to-local. Distinct from the more common `for i := range seatBid.Bid { ... &seatBid.Bid[i] ... }` (range-index pointer pattern used by cadent and most other adapters)."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: error-message-misspelling-infomation
    file: adapters/freewheelssp/freewheelssp.go
    line: 26
    summary: "Error message uses misspelled \"Infomation\" (sic) instead of \"Information\". Cross-language identical: Java side preserves the same misspelling verbatim. Useful for golden-test message-equality assertions across languages."
    edge_case_taxon: yaml-field-name-typo
  - id: header-componentid-language-divergent
    file: adapters/freewheelssp/freewheelssp.go
    line: 53
    summary: "Custom header `Componentid: prebid-go` identifies request source language. Java emits `Componentid: prebid-java` — intentional byte-level divergence used for upstream routing/analytics. Cross-language asymmetric on the header value."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: bid-video-conditional-population
    file: adapters/freewheelssp/freewheelssp.go
    line: 92
    summary: "BidVideo (PrimaryCategory + Duration) populated conditionally: PrimaryCategory only when len(bid.Cat) > 0; Duration only when bid.Dur > 0. Otherwise BidVideo fields stay zero-valued. Cross-language symmetric — Java has same conditional checks before populating videoInfo."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: error-message-imp-index-not-id
    file: adapters/freewheelssp/freewheelssp.go
    line: 26
    summary: "Error message references imp by INDEX (`%d` for `i`), not imp.ID. Less debuggable than imp.ID-based messaging. Java side uses imp.getId() (`%s`) — Java carries imp.ID into the error message. Cross-language behavioral asymmetry on error verbosity."
    edge_case_taxon: yaml-field-name-typo

cross_language:
  go_artifacts:
    bidder_dir: adapters/freewheelssp/
    package_name: freewheelssp
    bidder_constant: openrtb_ext.BidderFreewheelSSP
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/freewheelssp/
    bidder_class: FreewheelSSPBidder
    config_class: FreewheelSSPConfiguration
    yaml_path: src/main/resources/bidder-config/freewheelssp.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/freewheelssp/
  port_concerns:
    aliases_inverted: true                    # Go has fwssp as TOP-LEVEL separate bidder package. Java has fwssp as YAML-INTERNAL alias under freewheelssp. Cross-language asymmetric topology on the fwssp sibling.
    yaml_unification: false                   # Go has THREE yaml files (freewheelssp + freewheel-ssp alias-stub + fwssp). Java has ONE yaml file (freewheelssp with fwssp as YAML-internal alias).
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: null
    destination_language: null
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - adr-007-f2-label-collision-corrected
      - adr-005-rule-46-canonical-same-name-corrected
      - alias-of-yaml-stub-mechanism
      - fwssp-cross-language-topology-asymmetry
      - hardcoded-video-bid-type
      - ext-struct-field-count-asymmetry
      - currency-propagation-level-divergence
      - header-componentid-language-divergent
      - misspelled-infomation-preserved
  go_specific_concerns:
    - "Three Go YAMLs: freewheelssp.yaml (canonical), freewheel-ssp.yaml (alias-stub via top-level `aliasOf:` field — NEW corpus pattern), fwssp.yaml (separate top-level bidder package at adapters/fwssp/ with own Builder). The hyphenated form has NO separate Go bidder constant — it inherits via `aliasOf:` indirection."
    - "Go ext struct ImpExtFreewheelSSP has ONLY 1 field (ZoneId). Java POJO has 4 (zoneId + 3 extras). A request with the extra fields is forwarded by Java but silently dropped by Go — cross-language fidelity gap."
    - "Hardcoded video bid type — all bids classified video regardless of MType. Rule 26 master sample (same pattern as vungle, cadent partial)."
    - "imp.Ext OVERWRITTEN with inner ext fields (drops `{\"bidder\":...}` wrapper). Cross-language symmetric."
    - "Error message uses imp index `%d` instead of imp.ID. Java uses imp.getId(). Cross-language debuggability divergence."
    - "Header `Componentid: prebid-go` — Java emits `prebid-java`. Intentional byte-level divergence."
    - "Currency: response-level (`bidResponse.Currency = bidResp.Cur`). Java attaches per-bid (`bidCurrency` on each BidderBid). Cross-language asymmetry on currency propagation level."
    - "Bid pointer: `bid := seatBid.Bid[i]` value-copy then `&bid` pointer-to-local. Less common pattern than range-index `&seatBid.Bid[i]`."
    - "BidVideo conditionally populated — PrimaryCategory only when bid.Cat non-empty, Duration only when bid.Dur > 0. Cross-language symmetric."
    - "fwssp is a separate top-level Go bidder (BidderFWSSP=\"fwssp\") with its own Builder at adapters/fwssp/. Cross-language asymmetric topology — Java treats fwssp as a YAML-internal alias under freewheelssp."
    - "Misspelled `Infomation` (sic) in error message — preserved verbatim cross-language. Useful for golden-test message-equality assertions."
  java_specific_concerns: []
