    edge_case_taxon: bidder-constant-mismatch
  - id: bidder-constant-mismatch-params-test
    file: adapters/kobler/params_test.go
    summary: "params_test.go TestInvalidParams calls validator.Validate with openrtb_ext.BidderKrushmedia (copy-paste from another adapter); TestValidParams uses BidderKobler correctly"
    edge_case_taxon: bidder-constant-mismatch
  - id: hardcoded-dev-endpoint
    file: kobler.go
    summary: "devBidderEndpoint is a const literal in source rather than ExtraAdapterInfo or YAML field. Anti-pattern."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: dev-prod-toggle-via-imp-ext-test-flag
    file: kobler.go
    summary: "testMode flag pulled from imp.ext.bidder.test of the FIRST imp only (line 55, i==0); other imps' test flags are ignored."
    edge_case_taxon: hardcoded-config-as-anti-pattern

cross_language:
  go_artifacts:
    bidder_dir: adapters/kobler/
    package_name: kobler
    bidder_constant: openrtb_ext.BidderKobler
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/kobler/
    bidder_class: KoblerBidder
    config_class: KoblerConfiguration
    yaml_path: src/main/resources/bidder-config/kobler.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/kobler/
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: go
    source_pr: prebid/prebid-server#3904
    destination_language: java
    destination_pr: prebid/prebid-server-java#3684
    fidelity_review_themes:
      - port-fidelity
      - currency-conversion-bidrequest-context
      - mutation-idiom-tobuilder
      - dev-endpoint-config-promotion
  go_specific_concerns:
    - "Adapter struct unexported (type adapter); Builder returns adapters.Bidder interface."
    - "MakeRequests/MakeBids use value receivers (a adapter) rather than pointer receivers — uncommon but valid."
    - "sanitizeRequest takes BidRequest by value (line 163), making the function-local mutation a defacto shallow copy of the framework's request struct. Slice/pointer fields (Imp, Device, User) still alias the framework's underlying memory until reassigned."
    - "convertImpCurrency mutates request.Imp[i] in place via &sanitizedRequest.Imp[i] indexed pointer (kobler.go:48-49); the slice header is shallow-copied by sanitizeRequest so the underlying backing array is shared with the framework's request — bid floor mutations write through to the framework."
    - "testMode flag is read only from the FIRST imp (i==0 branch at line 55), not all imps; multi-imp callers cannot toggle dev endpoint per-imp."
    - "devBidderEndpoint is a package-level const (line 23) — should live in static/bidder-info/kobler.yaml as extra_info or be promoted to YAML config field."
    - "MakeBids uses legacy raw status checks (StatusCode == http.StatusNoContent / != http.StatusOK at lines 104-112) instead of canonical adapters.IsResponseStatusCodeNoContent / adapters.CheckResponseStatusCodeForErrors helpers."
  java_specific_concerns: []
