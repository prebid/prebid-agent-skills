spec_kind: prebid-server-adapter
source_language: go

provenance:
  source:
    repo: prebid/prebid-server
    ref:
      branch: master
    resolved_commit: d7f8515b86258688304b0d9b6668c6a0e258bc9e
    fetch_method: local-checkout
  read:
    skill_versions:
      orchestrator: 1.0.0
    timestamp_utc: "2026-04-28T14:17:50Z"
    operator: claude-code/opus-4-7
  warnings:
    - type: cross-language-byte-divergence
      file: static/bidder-params/elementaltv.json
      line: 1
      summary: "Go elementaltv.json sha256=efdc3ed1c641e9dbe7265e0bf8b309c565508175894d05c708cfeb84ed03e792 differs from Java elementaltv.json sha256=2b83fa36727d98f34537a7561b13f27165b7f1b002127e4d337b513d690223a0 due to whitespace formatting (Go uses 6-space indent in the properties block; Java uses 4-space). Schema interpretation is byte-identical (single string adunit, required). Rule R5 cross-language structural parity violation surfaces here."
    - type: bidder-name-rebrand
      file: exchange/adapter_util.go
      line: 135
      summary: "elementaltv is the post-rename name for the deprecated 'adoppler' bidder (PR #4639 'New Adapter: ElementalTv', merged 2026-03-04 by pavel-ptashyts). The Go side handled the rebrand by DELETING all adoppler files (no alias-back YAML retained) and adding 'adoppler' to the removed-bidder warning map in exchange/adapter_util.go with rename guidance: 'Bidder \"adoppler\" is no longer available in Prebid Server. If you're looking to use the Adoppler adapter, please rename it to \"elementaltv\" in your configuration.' Contrast with Java which retained 'adoppler: ~' as a tilde-inherit alias-back inside elementaltv.yaml."

meta:
  bidder_name: elementaltv
  is_alias: false
  alias_of: null
  parent_aliases: []                                # Go side has NO retained adoppler alias YAML; the rename was clean-delete + removed-bidder-warning, NOT alias-back-via-tilde.
  whitelabel_only: false
  disabled: false
  module_path_major: v4
  java_artifact_version: null

bidder_info:
  endpoint: "https://pbs.elementaltv.io/ads/processHeaderBid/{{.AdUnit}}"
  endpoint_construction:
    kind: single-token-substitution
    macros_used:
      - AdUnit                                      # Canonical Go-template form {{.AdUnit}} resolved through macros.EndpointTemplateParams (line 196 of elementaltv.go).
    macro_syntax: go-template                       # {{.AdUnit}} delimiter (Go canonical) — contrast with Java {{AdUnit}} (no leading dot).
    placeholders_unresolved: []
  endpoint_compression: gzip
  ortb_version: null                                # Go side does NOT declare ortb-version in YAML (Java-only field). The X-OpenRTB-Version request header IS set to "2.6" via the bidHeaders map at line 19 — distinct from Java's hardcoded "2.5" header.
  default_enabled: true
  modifying_vast_xml_allowed: false
  maintainer:
    email: "support@elementaltv.com"
  capabilities:
    app:
      mediaTypes:
        - banner
        - video
        - native
    site:
      mediaTypes:
        - banner
        - video
        - native
  geoscope: []
  gvl_vendor_id: 0
  user_sync: {}
  yaml_extra_fields:
    openrtb:
      version: 2.6                                  # Go static/bidder-info/elementaltv.yaml declares openrtb.version: 2.6 as a sibling of endpoint (NOT under ortb-version). Note this is the YAML metadata; the per-request X-OpenRTB-Version header in elementaltv.go line 19 also reads "2.6" — Go side is consistent across the two surfaces (Java side has the 2.5/2.6 mismatch).
  yaml_field_name_quirks: []

# Go bidder-params file uses 6-space indent for the properties block (compare Java's 4-space).
# Encoded as YAML literal block via the `|` form to preserve byte fidelity. The Go file
# terminates with a trailing newline after the closing brace.
bidder_params_json: |
  {
    "$schema": "http://json-schema.org/draft-04/schema#",
    "title": "ElementalTV Adapter Params",
    "description": "A schema which validates params accepted by the ElementalTV adapter",
    "type": "object",
    "properties": {
        "adunit": {
          "type": "string",
          "description": "AdUnit to bid against to."
        }
    },
    "required": ["adunit"]
  }
bidder_params_sha256: efdc3ed1c641e9dbe7265e0bf8b309c565508175894d05c708cfeb84ed03e792

params:
  schema_interpretation:
    properties:
      - name: adunit
        type: string
        description: "AdUnit to bid against to."
    required_fields:
      - adunit
    flexible_types: []
    combinators_used: []
  ext_struct:
    package: openrtb_ext
    file: openrtb_ext/imp_elementaltv.go
    type_name: ExtImpElementalTV                    # Bidder constant + struct preserve the TV brand-acronym uppercase even though the package directory `elementaltv` is all lowercase. Canonical Go convention for brand-acronym constants.
    fields:
      - name: AdUnit
        json_tag: adunit
        type_native: string
        omitempty: false
        notes:
          - "Read at elementaltv.go:188 (unmarshalExt) where empty AdUnit triggers BadInput error '$.imp.ext.bidder.adunit required'."
    custom_unmarshal: false
    custom_unmarshal_accepts: []
  params_test:
    file: adapters/elementaltv/params_test.go
    valid_cases_count: 3
    invalid_cases_count: 2
    bidder_constant_referenced: openrtb_ext.BidderElementalTV

code:
  package_or_class: elementaltv
  directory_name: elementaltv
  package_directory_mismatch: false
  file_layout:
    kind: single-file
    files:
      - name: elementaltv.go
        role: implementation
        loc: 236
  imports:
    has_template_engine: true                       # text/template imported (line 7); used by Builder to parse the AdUnit endpoint template.
    has_currency_helper: false
    has_jsonutil: true
    third_party: []
  adapter_struct:
    type_name: adapter
    type_visibility: unexported
    fields:
      - name: endpoint
        type: "*template.Template"                  # Pointer to a parsed text/template; resolved per-request via macros.ResolveMacros.
  builder:
    signature_canonical: true
    extra_adapter_info_used: false
    template_parsed_at_build: true                  # template.New("endpointTemplate").Parse(config.Endpoint) at lines 41-44; parse error returned via 'unable to parse endpoint url template: %w' wrap.
    errors_returned:
      - "unable to parse endpoint url template: %w"
  make_requests:
    batching:
      applied_in_order: true
      rules:
        - kind: per-imp                             # Loop over req.Imp at line 64 producing one *adapters.RequestData per imp; each carries a URL with the imp's resolved adunit, plus a single-imp body.
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
    mutation:
      mutates_request: true                         # Each per-imp request rewrites BidRequest.ID to "{originalID}-{adunit}" (line 71) and replaces Imp with a single-imp slice (line 72). Original *req struct is shallow-copied via 'var r openrtb2.BidRequest = *req' at line 70 so the framework's request is not mutated through.
      entity_strategies:
        Id: immutable-rebuild                       # r.ID = req.ID + "-" + ext.AdUnit on the local shallow copy — original framework request.ID is left intact.
        Imp: immutable-rebuild                      # r.Imp = []openrtb2.Imp{imp} — the imp loop variable is by-value so the per-request body carries a fresh slice with one imp.
      go_idiom: shallow-copy                        # 'var r openrtb2.BidRequest = *req' at line 70 dereference-copies the request struct value before mutating local r.
      java_idiom: null
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase              # unmarshalExt at lines 181-201 first decodes imp.Ext into adapters.ExtImpBidder (line 184), then decodes bext.Bidder into ExtImpElementalTV (line 189). Empty AdUnit yields BadInput.
      mechanism_java: null
      target_type: openrtb_ext.ExtImpElementalTV
      wrapper_type: null
    endpoint_resolution:
      kind: single-token-substitution
      mechanism_go: text/template                   # Builder parses config.Endpoint as a text/template at construction time; per-request resolution flows through macros.ResolveMacros(ads.endpoint, params) at line 197 with params.AdUnit = url.PathEscape(ext.AdUnit) (line 196).
      mechanism_java: null
      macro_field_set:
        - AdUnit
      template_params_struct_field_count: null
    helpers:
      - name: bidUri
        signature: "func (ads *adapter) bidUri(ext *openrtb_ext.ExtImpElementalTV) (string, error)"
      - name: unmarshalExt
        signature: "func unmarshalExt(ext json.RawMessage) (*openrtb_ext.ExtImpElementalTV, error)"
      - name: unmarshalAdsExt
        signature: "func unmarshalAdsExt(ext json.RawMessage) (*adsImpExt, error)"
      - name: head
        signature: "func head(s []string) string"
  make_bids:
    response_type: openrtb2.BidResponse
    custom_response_type: null
    http_status_handling:
      kind: legacy-raw-go                           # MakeBids checks resp.StatusCode == http.StatusNoContent (line 109), == http.StatusBadRequest (line 112), and != http.StatusOK (line 115) directly rather than going through adapters.IsResponseStatusCodeNoContent / adapters.CheckResponseStatusCodeForErrors. Pre-canonical-helper era pattern.
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: by-imp-mediatype                  # impTypes map built at lines 132-152 by checking imp.Banner / imp.Video / imp.Audio / imp.Native non-nil in that order; bid.ImpID is then looked up in impTypes (line 159). Throws BadServerResponse 'unknown impid: %s' at line 162 when the bid's impid was not registered, and BadInput when no media type is set on the imp at request time.
          fallback_action: throw
      default_value: null
      multi_format_detection: strict                # Only the FIRST non-nil mediatype found wins (banner > video > audio > native); multi-mediatype imps are not detected; map population fails when none of the four is set.
    # elementaltv mirrors the optidigital pointer-iteration pattern but with one
    # subtle quirk: the inner loop `for _, bid := range seatBid.Bid` captures bid
    # BY VALUE at line 158 and then takes &bid at line 178. Pre-Go-1.22 this
    # would yield the same pointer for every iteration (a classic loop-variable
    # capture bug); the v4 module path implies Go 1.22+ semantics (per-iter
    # variable) so this is safe in modern toolchains. Flagged for porter
    # awareness as a Go-1.22-dependent idiom.
    bid_pointer_pattern: indexed-iteration
    bid_pointer_go_sibling: range-value-pointer     # for _, seatBid := range bidResp.SeatBid { for _, bid := range seatBid.Bid { ... &bid ... } }; both loops are range-value form. The inner &bid relies on Go 1.22 per-iteration variable semantics.
    currency_overwrite_safety: none                 # MakeBids does NOT set bidResp.Currency on the BidderResponse — adapters.NewBidderResponseWithBidsCapacity returns an empty Currency field; framework default applies. Contrast with optidigital which unguardedly overwrites Currency.

