# Go-source spec: code_naming is Java-only; null on every Go-source spec per
# Wave 2 promotion-with-nullability convention.
code_naming: null

# Lifecycle block mirrors the Java-side rename event with Go-specific
# divergences. The Adoppler -> ElementalTV rename was a CROSS-LANGUAGE event
# but the two sides handled it differently: Java retained adoppler as a
# tilde-inherit alias-back inside elementaltv.yaml; Go DELETED all adoppler
# files entirely and added 'adoppler' to the removed-bidder warning registry
# in exchange/adapter_util.go pointing operators to rename their config.
lifecycle:
  rename:
    old_name: adoppler
    new_name: elementaltv
    subtype: bilateral
    pr: prebid/prebid-server#4639
    release: null                                   # Go-side ElementalTv rename merged via PR #4639 on 2026-03-04 by pavel-ptashyts; Go does not tag release versions per-bidder the way Java does (java_artifact_version: 3.38.0 is tied to Java's release-versioning model — there is no equivalent on Go module v4).
    merged_at: "2026-03-04"
    yaml_deletes:
      - adapters/adoppler/adoppler.go               # Renamed via git rename to adapters/elementaltv/elementaltv.go (R087 similarity).
      - adapters/adoppler/adoppler_test.go          # Deleted outright; replaced with new elementaltv_test.go.
      - adapters/adoppler/adopplertest/             # Fixture directory renamed to adapters/elementaltv/elementaltvtest/. The custom-client.json supplemental was deleted standalone; default-client.json renamed to base.json.
      - openrtb_ext/imp_adoppler.go
      - static/bidder-info/adoppler.yaml
      - static/bidder-params/adoppler.json          # R066 git rename to static/bidder-params/elementaltv.json.
    yaml_adds:
      - adapters/elementaltv/elementaltv.go
      - adapters/elementaltv/elementaltv_test.go
      - adapters/elementaltv/params_test.go         # NEW file added in the rename PR — pre-rename adoppler had no params_test.go. Adds 5 valid + 2 invalid params test cases.
      - adapters/elementaltv/elementaltvtest/exemplary/base.json
      - adapters/elementaltv/elementaltvtest/exemplary/multiimp.json
      - adapters/elementaltv/elementaltvtest/supplemental/bad-request.json
      - adapters/elementaltv/elementaltvtest/supplemental/duplicate-imp.json
      - adapters/elementaltv/elementaltvtest/supplemental/invalid-impid.json
      - adapters/elementaltv/elementaltvtest/supplemental/invalid-response.json
      - adapters/elementaltv/elementaltvtest/supplemental/invalid-video-ext.json
      - adapters/elementaltv/elementaltvtest/supplemental/missing-adunit.json
      - adapters/elementaltv/elementaltvtest/supplemental/no-bid.json
      - adapters/elementaltv/elementaltvtest/supplemental/server-error.json
      - openrtb_ext/imp_elementaltv.go
      - static/bidder-info/elementaltv.yaml
      - static/bidder-params/elementaltv.json
    alias_back: false                               # GO-SPECIFIC DIVERGENCE FROM JAVA: there is NO retained adoppler.yaml carrying aliasOf: elementaltv. The clean-rename + removed-bidder-warning approach is canonical on the Go side.
    alias_back_form: null
    alias_back_yaml_path: null
    alias_back_yaml_line: null
    package_moves:
      - from: adapters/adoppler/
        to: adapters/elementaltv/
    fixture_dir_moves:
      - from: adapters/adoppler/adopplertest/
        to: adapters/elementaltv/elementaltvtest/
    notes:
      - "Go-side rename merged via PR #4639 ('New Adapter: ElementalTv') on 2026-03-04 by pavel-ptashyts — TWO MONTHS LATER than the Java-side rename PR #4326 (merged 2026-01-12). The two PRs are independent: each repo carried its own rename change; the Java rename did not auto-propagate to Go."
      - "Go-side rename is CLEAN-DELETE: every adoppler file is removed (yaml + bidder-params + bidder/adoppler/* + openrtb_ext/imp_adoppler.go + adopplertest/ fixture dir). NO retained alias-back YAML. Operators with 'adoppler' in their config get a runtime warning from exchange/adapter_util.go line 135: 'Bidder \"adoppler\" is no longer available in Prebid Server. If you're looking to use the Adoppler adapter, please rename it to \"elementaltv\" in your configuration.'"
      - "Java-side rename retained 'adoppler: ~' under elementaltv.yaml aliases (tilde-inherit alias-back) — backward-compat WITHOUT operator action. Go-side rename forces operator action via the removed-bidder map. This is the cross-language port concern that aliases_inverted: true captures."
      - "Cross-language fidelity: bidder-rename is a major-version event in both languages (Java v3.38.0; Go does not version per-bidder). The four pattern tags from the reference list apply: bidder-rename-major-version, alias-back-via-tilde (Java-only side), package-rename-fixture-dir-rename, acronym-case-preservation."
      - "PR #4639 also DELETED a Go-side custom-client.json supplemental fixture (no equivalent in the elementaltvtest/ tree); the rename was an opportunity to drop a test that no longer reflects current bidder behavior. The remaining elementaltvtest fixtures are git-renames-with-edits from the adopplertest counterparts (R087-R095 similarity scores per the PR's --name-status output)."

quirks:
  - id: bidder-rename-three-step-adoppler-to-elementaltv-go-clean-rename
    file: adapters/elementaltv/elementaltv.go
    summary: "ElementalTV is the Go-side rename of the previous Adoppler bidder (PR #4639 'New Adapter: ElementalTv', merged 2026-03-04 by pavel-ptashyts). Unlike the Java-side rename (PR #4326), the Go side did NOT retain adoppler as a tilde-inherit alias-back inside elementaltv.yaml — instead, all adoppler files were deleted and 'adoppler' was added to exchange/adapter_util.go's removed-bidder warning map (line 135). Operators with adoppler in their config get a runtime warning pointing them to rename to elementaltv. Pattern tags: bidder-rename-major-version, package-rename-fixture-dir-rename, acronym-case-preservation. (NB: alias-back-via-tilde tag applies only to the Java side.)"
    edge_case_taxon: bidder-rename-three-step
  - id: cross-language-byte-divergence
    file: static/bidder-params/elementaltv.json
    summary: "Go elementaltv.json sha256=efdc3ed1c641e9dbe7265e0bf8b309c565508175894d05c708cfeb84ed03e792; Java elementaltv.json sha256=2b83fa36727d98f34537a7561b13f27165b7f1b002127e4d337b513d690223a0. Whitespace formatting differs (Go uses 6-space indent for the inner properties block; Java uses 4-space). Schema interpretation is byte-identical — single string adunit, required. Cross-language R5 violation; surfaces as a port-fidelity concern even though the schema itself is identical."
    edge_case_taxon: port-fidelity-divergence
  - id: acronym-case-preservation-bidder-constant
    file: openrtb_ext/imp_elementaltv.go
    summary: "Go preserves the 'TV' brand acronym uppercase in the bidder constant openrtb_ext.BidderElementalTV and the params struct ExtImpElementalTV, even though the package directory and bidder_name are all lowercase 'elementaltv'. Convention rejects naive PascalCase fold to 'BidderElementaltv' or 'ElementalTv'. Sibling cases on the Go side: BidderFeedAd, BidderBidTheatre, BidderIQX. Less surface area than the Java side (which preserves the acronym across 8+ artifacts: bidder class, configuration class, IT class, ExtImp class, three model classes, the SCREAMING_SNAKE TypeReference constant) — Go only carries the acronym in the bidder constant + struct + Builder doc-comment string."
    edge_case_taxon: acronym-case-preservation
  - id: per-imp-request-id-suffix-rewrite
    file: adapters/elementaltv/elementaltv.go
    summary: "Per-imp request fanout (lines 64-95) overwrites the BidRequest id with the form '{originalID}-{adunit}' (line 71) — each downstream HTTP request carries a request id derived from the imp's adunit, not the original request id. Allows ElementalTV's exchange to disambiguate parallel imps from a single auction by suffix. Note: when the same adunit appears on multiple imps the resulting request ids will collide (line 72 also collapses to a single-imp slice — but the id collision is observable to the upstream exchange across HTTP requests). Mirrors the Java-side same-line behavior."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: video-ext-validation-strict
    file: adapters/elementaltv/elementaltv.go
    summary: "MakeBids requires every VIDEO-typed bid response to carry $.seatbid.bid.ext.ads.video (lines 167-174). The strict requirement walks the local types adsImpExt -> adsVideoExt (lines 28-34) and returns BadServerResponse '$.seatbid.bid.ext.ads.video required' when either link is nil. Banner/native/audio bids skip this check. Mirrors Java-side validateVideoBidExt — BUT Go consolidates the validation into two local types co-located in elementaltv.go rather than the three nested model classes Java uses (ElementalTVResponseExt -> ResponseAdsExt -> ResponseVideoAdsExt). Cross-language port observation: Go's flat-types-in-same-file approach is markedly simpler than Java's three-class hierarchy for the identical validation."
    edge_case_taxon: multi-file-layout-justified
  - id: legacy-raw-go-status-checks
    file: adapters/elementaltv/elementaltv.go
    summary: "MakeBids inspects responseData.StatusCode directly at lines 109, 112, 115 (== http.StatusNoContent, == http.StatusBadRequest, != http.StatusOK) instead of using adapters.IsResponseStatusCodeNoContent and adapters.CheckResponseStatusCodeForErrors. Pre-canonical-helper-era pattern; the rename PR #4639 did not migrate this to the canonical helpers (carry-over from pre-rename Adoppler implementation). Sibling case: kobler.go (Java spec captures the same divergence)."
    edge_case_taxon: legacy-go-pattern-pre-1.22
  - id: range-value-pointer-loop-go122-dependent
    file: adapters/elementaltv/elementaltv.go
    summary: "Inner range loop at line 158 uses 'for _, bid := range seatBid.Bid' (range-value form) and then takes &bid at line 178 in the TypedBid construction. Pre-Go-1.22 this would yield the SAME pointer on every iteration (classic loop-variable capture bug); on Go 1.22+ each iteration gets a fresh variable, making &bid safe. The v4 module path implies Go 1.22+ semantics; safe in current toolchains. Flagged for porter awareness because the safety relies on the Go 1.22 per-iteration variable change."
    edge_case_taxon: legacy-go-pattern-pre-1.22

cross_language:
  go_artifacts:
    bidder_dir: adapters/elementaltv/
    package_name: elementaltv                       # Go package matches yaml_name (no acronym preservation needed — Go package names are lowercase by convention).
    bidder_constant: openrtb_ext.BidderElementalTV  # Go bidder constant DOES preserve the acronym uppercase even though the package is lowercase. Consistent with the canonical Go convention for brand-acronym constants.
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/elementaltv/
    bidder_class: ElementalTVBidder
    config_class: ElementalTVConfiguration
    yaml_path: src/main/resources/bidder-config/elementaltv.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/elementaltv/
  port_concerns:
    aliases_inverted: true                          # Java parent (elementaltv) declares 'aliases: { adoppler: ~ }' inside bidder-config/elementaltv.yaml carrying the rename-origin alias-back. Go side: clean-delete; the deprecated bidder name routes through exchange/adapter_util.go's removed-bidder-warning map at line 135 instead of an alias YAML. Same factual lifecycle event, different durable representation — Go has NO retained adoppler.yaml at this commit.
    yaml_unification: true                          # Java unifies bidder-info + endpoint + aliases under one bidder-config/elementaltv.yaml; Go splits these into static/bidder-info/elementaltv.yaml + static/bidder-params/elementaltv.json.
    mutation_idiom_divergence: true                 # Java uses lombok-tobuilder for the request-id rewrite (BidRequest.toBuilder().id(...).build()); Go uses shallow-copy of the request struct ('var r openrtb2.BidRequest = *req' at line 70) and direct field assignment.
    package_directory_mismatch: false
    multi_file_layout: false                        # Go carries elementaltv.go + elementaltv_test.go + params_test.go (3 files) — the model class hierarchy Java uses is collapsed into two local types (adsVideoExt, adsImpExt) at the top of elementaltv.go.
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: null                           # Pre-rename adoppler existed in BOTH Go and Java; the rename was synchronised across both languages but is not a single-direction port. Each repo carried its own rename PR (Go #4639 in 2026-03-04, Java #4326 in 2026-01-12) — Java-side lifted it first by 2 months. Direction in the dual-spec assertions: shared-genesis.
    source_pr: null
    destination_language: null
    destination_pr: prebid/prebid-server#4639
    fidelity_review_themes:
      - bidder-rename-major-version
      - alias-back-via-tilde
      - package-rename-fixture-dir-rename
      - acronym-case-preservation
  go_specific_concerns:
    - "Adapter struct unexported (type adapter); Builder returns adapters.Bidder interface."
    - "endpoint field is *template.Template (pointer to parsed text/template), not a raw URL string. Builder parses config.Endpoint at construction time and stores the *Template for per-request use via macros.ResolveMacros."
    - "Per-imp fanout in MakeRequests (lines 64-95): one *adapters.RequestData per imp. Each carries a single-imp body (Imp = []openrtb2.Imp{imp} at line 72) and a URL with the imp's adunit substituted. Mirrors Java-side per-imp loop."
    - "BidRequest.ID rewrite at line 71: r.ID = req.ID + '-' + ext.AdUnit. The shallow-copy at line 70 ('var r openrtb2.BidRequest = *req') means slice/pointer fields (Imp, Device, User, Site, App) of req are aliased into r — but the assignment at line 72 (r.Imp = ...) replaces the slice reference rather than mutating through, so the framework's req.Imp is left intact."
    - "MakeBids uses legacy raw status checks (StatusCode == http.StatusNoContent / == http.StatusBadRequest / != http.StatusOK at lines 109-117) instead of canonical adapters.IsResponseStatusCodeNoContent / adapters.CheckResponseStatusCodeForErrors helpers. Pre-canonical-helper-era pattern; the rename PR #4639 did not migrate this."
    - "Inner bid loop (line 158) uses range-value form 'for _, bid := range seatBid.Bid' then takes &bid at line 178. Safe under Go 1.22+ per-iteration variable semantics (the v4 module path implies the modern toolchain); pre-Go-1.22 this would yield the same pointer on every iteration. Surface for porter awareness."
    - "$.seatbid.bid.ext.ads.video validation (lines 167-174) for VIDEO bids walks the locally-defined adsImpExt -> adsVideoExt types in the same file. Java's three-class hierarchy (ElementalTVResponseExt -> ResponseAdsExt -> ResponseVideoAdsExt) collapses into two struct types in Go — multi_file_layout=false on the Go side."
    - "params_test.go was a NEW file added in the rename PR #4639 (the pre-rename adoppler had no params_test.go). Carries 3 valid + 2 invalid cases — far less coverage than typical (kobler has 3 valid + 8 invalid). Possible port-fidelity opportunity for future cross-language alignment."
    - "X-OpenRTB-Version request header is set to '2.6' via the package-level bidHeaders map (lines 18-22). Note: Java side hardcodes '2.5' on its per-request header even though both YAMLs declare ortb-version 2.6 — Go side is internally consistent on this; Java side carries a 2.5/2.6 mismatch documented as a port-fidelity carry-over from the pre-rename Adoppler implementation."
    - "No Currency overwrite in MakeBids (BidderResponse.Currency left at zero value). Framework default currency applies. Differs from optidigital (unguarded) and aax (unguarded-hardcoded USD)."
    - "Removed-bidder-warning registry: exchange/adapter_util.go line 135 carries the 'adoppler -> elementaltv' rename pointer; this is the Go-canonical pattern for bidder renames (preferred over the Java-canonical alias-back-via-tilde approach). The mechanism is durable runtime feedback to operators rather than transparent backward compatibility."
  java_specific_concerns: []                        # Sparse on a Go-source spec; the Java-source spec carries the dense list.
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg
