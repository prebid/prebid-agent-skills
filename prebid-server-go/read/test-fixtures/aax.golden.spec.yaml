quirks:
  - id: passthrough-request-body
    file: adapters/aax/aax.go
    summary: "MakeRequests (lines 24-45) is a json.Marshal passthrough — no per-imp split, no mutation, no imp.ext unmarshal. The single RequestData carries the whole request verbatim with ImpIDs derived via openrtb_ext.GetImpIDs. Mirrors Java's BidderUtil.defaultRequest passthrough."
    edge_case_taxon: incomplete-classification
  - id: imp-ext-unmarshal-skipped-despite-required-params
    file: adapters/aax/aax.go
    summary: "Schema requires cid+crid (with minLength: 1) but the adapter never unmarshals imp.ext. The ExtImpAax struct in openrtb_ext/imp_aax.go is declared but unused by aax.go; params are validated by JSON Schema only and the upstream bidder reads imp.ext.bidder.{cid,crid} verbatim from the passthrough request."
    edge_case_taxon: incomplete-classification
  - id: bid-type-multi-format-strict-throw
    file: adapters/aax/aax.go
    summary: "getMediaTypeForImp (lines 99-130) accumulates typeCnt across non-nil imp.banner/imp.video/imp.native; when typeCnt != 1 it returns an error 'unable to fetch mediaType in multi-format: <impID>' — same message regardless of typeCnt==0 (no media types) or typeCnt>=2 (multi-format). Surfaces as bid_type_resolution.multi_format_detection: strict and method_chain step 2 fallback_action: throw."
    edge_case_taxon: incomplete-classification
  - id: legacy-raw-status-checks
    file: adapters/aax/aax.go
    summary: "MakeBids (lines 49-62) uses raw response.StatusCode == http.StatusNoContent / == http.StatusBadRequest / != http.StatusOK checks instead of canonical adapters.IsResponseStatusCodeNoContent / adapters.CheckResponseStatusCodeForErrors helpers. http_status_handling: legacy-raw-go."
    edge_case_taxon: incomplete-classification
  - id: legacy-encoding-json-on-marshal-path
    file: adapters/aax/aax.go
    summary: "MakeRequests calls encoding/json json.Marshal(request) at line 28 instead of jsonutil.Marshal. The unmarshal paths (response body, bid.Ext) DO use jsonutil correctly. Cosmetic — flagged by reviewers in modern PRs but not load-bearing for behavior."
    edge_case_taxon: legacy-encoding-json-direct-usage

cross_language:
  go_artifacts:
    bidder_dir: adapters/aax/
    package_name: aax
    bidder_constant: openrtb_ext.BidderAax
    impl_file: adapters/aax/aax.go
    test_file: adapters/aax/aax_test.go
    params_test_file: adapters/aax/params_test.go
    ext_struct_file: openrtb_ext/imp_aax.go
    ext_struct_type: ExtImpAax
    bidder_info_yaml: static/bidder-info/aax.yaml
    bidder_params_json: static/bidder-params/aax.json
    test_fixtures_dir: adapters/aax/aaxtest/
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/aax/
    bidder_class: AaxBidder
    config_class: AaxConfiguration
    yaml_path: src/main/resources/bidder-config/aax.yaml
    proto_dir: null
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: false
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: go
    source_pr: null
    destination_language: java
    destination_pr: null
    fidelity_review_themes:
      - bidder-params-schema-drift
      - endpoint-mechanism-divergence
      - currency-overwrite-divergence
  go_specific_concerns:
    - "Endpoint URL is constructed at request time via buildEndpoint (lines 132-149) using net/url Query/RawQuery — Go appends ?src=<ExtraAdapterInfo> ONLY when ExtraAdapterInfo is non-empty. Java's AaxConfiguration.resolveEndpoint substitutes {{PREBID_SERVER_ENDPOINT}} into a fixed endpoint URL once at bean wiring time. Same observable URL, different mechanism: Go endpoint_resolution.kind=query-parameter-augmentation; Java=single-token-substitution."
    - "ExtraAdapterInfo (config field) is consumed at request time by buildEndpoint, NOT by Builder (Builder just passes config.Endpoint + config.ExtraAdapterInfo through). The Go builder.signature_canonical: true but extra_adapter_info_used: true — uncommon combination."
    - "static/bidder-info/aax.yaml carries 'extra_info: \"https://aax.golang.pbs.com\"' which is the default value for ExtraAdapterInfo; this surfaces as bidder_info.yaml_extra_fields.extra_info and feeds buildEndpoint's hostUrl arg."
    - "Go bidder-params/aax.json applies minLength: 1 to both cid and crid; Java side does NOT. SHAs differ: Go=543bb3ef..., Java=c71febfe.... Cross-language R5 fidelity divergence — the dual-spec bidder_params_sha256 byte-equality assertion is expected to fire as severity: fail."
    - "currency_overwrite_safety: none on Go side (adapter never sets bidResponse.Currency, framework defaults handle it). Java side hardcodes USD via BidderBid.of(bid, bidType, USD_CURRENCY) — currency_overwrite_safety: unguarded-hardcoded. Cross-language behavioral divergence: Go responses inherit the framework default, Java responses are forced to USD."
    - "MakeBids' getMediaTypeForImp returns mediaType (still set to last detected non-nil imp media type) AND an error when typeCnt != 1 — caller treats the err as terminal and discards the bid; the value-side is unused. Subtle Go idiom that doesn't translate cleanly: Java equivalent throws PreBidException directly."
    - "ExtImpAax struct is declared in openrtb_ext/imp_aax.go but is dead code from the adapter's perspective — it's referenced by neither aax.go nor params_test.go (which validates JSON schema only). Java side similarly has no proto_dir POJO; the symmetry holds for the unmarshal-skipped pattern but the Go side still pays the cost of the struct file."
    - "params_test.go validParams has only ONE entry ({\"cid\":\"123\", \"crid\":\"1234\"}) and invalidParams has 12 entries — much smaller test surface than Java's AaxBidderTest (14 hand-written test methods)."
    - "TestEndpointTemplateMalformed (aax_test.go lines 25-30) is a no-op assertion: it builds the bidder with Endpoint='{{Malformed}}' and asserts buildErr is nil — proves Builder doesn't validate the endpoint URL (no template parsing happens at build time, since aax doesn't use text/template). Mirrors java_specific_concern that Java's AaxBidder constructor validates the URL at bean construction."
  reviewer_cohort:
    go: []
    java:
      - CTMBNara
      - AntoxaAntoxic
    cross_language_coordinator: bretg
