quirks:
  - id: text-template-endpoint-resolution
    file: adkernel.go
    summary: "Adapter parses endpoint URL with Go's text/template at Builder time (line 312); MakeRequests resolves via macros.ResolveMacros(template, EndpointTemplateParams{ZoneID: strconv.Itoa(params.ZoneId)}) at line 232. ZoneID is the only macro field used; full EndpointTemplateParams struct has 18 fields. TestEndpointTemplateMalformed validates Builder errors on a malformed template — distinct from runtime macro resolution failures. Edge case #10."
    edge_case_taxon: incomplete-classification
  - id: multi-format-imp-split-by-mediatype
    file: adkernel.go
    summary: "splitMultiFormatImp (lines 132-169) splits a single multi-format imp into up to 4 imps (banner, video, native, audio) by appending mediatype-specific suffixes (b__mf, v__mf, n__mf, a__mf) to imp.ID. Splits happen inside dispatchImpressions, AFTER imp grouping by ZoneId but before HTTP request construction. MakeBids strips the suffix at line 264-267 before resolving bid type. Edge case #11."
    edge_case_taxon: incomplete-classification
  - id: imp-grouping-by-extimpadkernel-as-map-key
    file: adkernel.go
    summary: "dispatchImpressions (line 95) uses ExtImpAdkernel struct value as a Go map key. Since ExtImpAdkernel has only ZoneId (int), this effectively groups by ZoneId. Each unique ZoneId becomes its own HTTP request — explains why adkernel emits N RequestData for N distinct zones. Adkernel is the canonical example of grouped-by-key batching combined with format-split."
    edge_case_taxon: incomplete-classification
  - id: legacy-encoding-json-marshal
    file: adkernel.go
    summary: "buildAdapterRequest at line 189 uses encoding/json.Marshal directly (json.Marshal(newBidRequest)) rather than jsonutil.Marshal, even though jsonutil is imported and used for unmarshaling at lines 173/179/247. Should migrate Marshal to jsonutil for consistency with the rest of the file."
    edge_case_taxon: legacy-encoding-json-direct-usage
  - id: legacy-raw-status-checks
    file: adkernel.go
    summary: "MakeBids at lines 238-245 inspects responseData.StatusCode == http.StatusNoContent / != http.StatusOK directly instead of canonical adapters.IsResponseStatusCodeNoContent / adapters.CheckResponseStatusCodeForErrors helpers. Pre-dates the helpers."
    edge_case_taxon: legacy-encoding-json-direct-usage
  - id: invalid-seatbid-count-rejection
    file: adkernel.go
    summary: "MakeBids rejects responses with len(bidResp.SeatBid) != 1 at line 253 — only single-seat responses accepted. Could fail for legitimate multi-seat upstream responses."
    edge_case_taxon: incomplete-classification
  - id: shallow-copy-with-publisher-strip
    file: adkernel.go
    summary: "createBidRequest (lines 212-228) shallow-copies the framework's BidRequest struct, then shallow-copies Site / App and explicitly nils Publisher on each. The copies prevent the framework's request from observing publisher mutations, but the slice header for Imp still aliases the original — adkernel writes a fresh Imp slice from the dispatched-imps map at line 214, which avoids that aliasing."
    edge_case_taxon: incomplete-classification

cross_language:
  go_artifacts:
    bidder_dir: adapters/adkernel/
    package_name: adkernel
    bidder_constant: openrtb_ext.BidderAdkernel
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/adkernel/
    bidder_class: AdkernelBidder
    config_class: AdkernelConfiguration
    yaml_path: src/main/resources/bidder-config/adkernel.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/adkernel/
  port_concerns:
    aliases_inverted: true
    yaml_unification: true
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  go_specific_concerns:
    - "Adapter struct is exported in Go (adkernelAdapter) — atypical; most modern adapters use unexported `adapter` type."
    - "Endpoint template uses Go's text/template package — Builder parses once, MakeRequests resolves per-request via macros.ResolveMacros. Java equivalent uses string-replace on '%s' (positional) per the Java YAML which encodes endpoint as 'http://pbs.adksrv.com/hb?zone=%s' — a different placeholder syntax that the porter must reconcile."
    - "Multi-format imp split inserts artificial suffixes (__mf etc.) into imp.id and strips them in MakeBids at lines 264-267. Java port must preserve this round-trip (request-side suffix injection + response-side suffix removal) or risk imp.id correlation breakage."
    - "Imps grouped by ExtImpAdkernel struct used directly as a Go map key. Java cannot use a POJO-as-map-key without explicit equals/hashCode on lombok-builder POJOs — the Java port likely groups by zoneId int directly."
    - "MakeBids rejects len(SeatBid) != 1 — Java port may differ. This is non-canonical behavior that should be flagged in the dual-spec comparator."
    - "encoding/json.Marshal used in buildAdapterRequest at line 189 even though jsonutil is imported for the same file's Unmarshal calls. Migration recommendation: jsonutil.Marshal."
    - "Legacy raw http.StatusNoContent / http.StatusOK status checks instead of canonical helpers."
    - "endpointCompression value is uppercase 'GZIP' in YAML — PBS-Go normalizes, but the Java side uses kebab-case `endpoint-compression: gzip` (lowercase). Cross-language casing divergence."
  java_specific_concerns: []
  port_lineage:
    source_language: go
    source_pr: null
    destination_language: java
    destination_pr: null
    fidelity_review_themes: []
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg
