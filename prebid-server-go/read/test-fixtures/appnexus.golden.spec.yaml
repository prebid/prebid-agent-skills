quirks:
  - id: keywords-flexible-type-custom-unmarshaljson
    file: openrtb_ext/imp_appnexus.go
    summary: "ExtImpAppnexusKeywords.UnmarshalJSON branches on first byte ('{','[','\"') to fold object / array-of-{key,value[]} / string forms into a single comma-separated 'k=v,k2=v2' string. Canonical Go runtime-polymorphism case; Java side requires a JsonDeserializer per Rule 6."
    edge_case_taxon: port-fidelity-divergence
  - id: legacy-and-new-params-coexist
    file: openrtb_ext/imp_appnexus.go
    summary: "Four legacy camelCase params (placementId, invCode, trafficSourceCode, use_payment_rule) coexist with snake_case successors. JSON Schema declares both via duplicate properties + oneOf-of-oneOf required guard; Go ext struct carries Deprecated*/Legacy* fields and handleLegacyParams copies legacy → new when new is zero/empty/nil."
    edge_case_taxon: json-key-style-mismatch
  - id: schain-source-to-request-ext-relocation
    file: appnexus.go
    summary: "moveSupplyChain (appnexus.go:461) relocates schain from request.Source.Ext.schain to request.Ext.schain — the OpenRTB-2.4→2.6 schain location migration. Uses ptrutil.Clone(request.Source) to avoid mutating the framework's source pointer; rewrites Source.Ext to omit schain (or nil if it was the only key) and inserts the raw schain message into the request-level ext map before re-marshalling."
    edge_case_taxon: port-fidelity-divergence
  - id: composable-batching-pod-grouping-and-max-imps
    file: appnexus.go
    summary: "Two composed batching rules: (1) when video adpod requested, groupByPods groups imps by strings.Split(imp.ID, '_')[0] and assigns a fresh AdPodID per group; (2) inside each group (or in the default path), splitRequests slices imps into batches of <= maxImpsPerReq=10. Spec lists rules in apply-order: pod-grouping then max-imps-per-request."
    edge_case_taxon: incomplete-classification
  - id: multi-file-go-layout
    file: adapters/appnexus/
    summary: "Three Go files: appnexus.go (implementation, 508 LOC), models.go (types, 49 LOC), iab_categories.go (data-table, 99 LOC). The role classifier maps cleanly: implementation/types/data-table. Note: the original Java parallel of this package contains an iab-categories table inlined into bidder-config/appnexus.yaml (yaml-inlined storage_kind), while Go uses a co-located go-data-table."
    edge_case_taxon: multi-file-layout-justified
  - id: imp-ext-incoming-wrapper-folds-gpid
    file: appnexus.go
    summary: "Adapter-local impExtIncoming wrapper { Bidder: ExtImpAppnexus, GPID: string } combines the standard ExtImpBidder.bidder unmarshal AND a sibling gpid sibling-unmarshal in one jsonutil.Unmarshal call (line 262). The 'bidder' tag is renamed from the canonical adapters.ExtImpBidder pattern; structurally still standard-two-phase but mechanically single-pass."
    edge_case_taxon: incomplete-classification
  - id: appnexus-yaml-platform-id-extra-field
    file: static/bidder-info/appnexus.yaml
    summary: "Top-level platform_id: '5' is not a canonical BidderInfo field — it's read by the framework into config.Adapter.PlatformID and then resolvePlatformID converts to int (defaulting to 5 if unparsable). Stored under bidder_info.yaml_extra_fields for round-trip fidelity."
    edge_case_taxon: incomplete-classification
  - id: bid-type-by-numeric-bid-ad-type
    file: appnexus.go
    summary: "getMediaTypeForBid switches on bid.ext.appnexus.bid_ad_type integer (0=banner, 1=video, 3=native; note 2 is skipped). Throws BadServerResponse-equivalent error on unknown value. Uses by-bid-ext-typed-field with throw fallback — no chain, no default."
    edge_case_taxon: port-fidelity-divergence
  - id: currency-overwrite-guarded-by-empty-check
    file: appnexus.go
    summary: "make_bids guards bidderResponse.Currency = appnexusResponse.Cur with `if appnexusResponse.Cur != \"\"` (line 214). Marked `guarded`; differentiates from optidigital's unguarded overwrite."
    edge_case_taxon: incomplete-classification
  - id: imp-banner-pos-and-format-promotion
    file: appnexus.go
    summary: "buildRequestImp performs Banner copy-then-mutate: (a) maps ext.bidder.position 'above'/'below' to adcom1.PositionAboveFold/BelowFold pointer, (b) when banner.W and banner.H are both nil and banner.Format is non-empty, promotes the first format's W/H to top-level — Rule 7 banner-format-dimension-promotion. Pointer-swap is via local bannerCopy := *imp.Banner; imp.Banner = &bannerCopy."
    edge_case_taxon: incomplete-classification

cross_language:
  go_artifacts:
    bidder_dir: adapters/appnexus/
    package_name: appnexus
    bidder_constant: openrtb_ext.BidderAppnexus
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/appnexus/
    bidder_class: AppnexusBidder
    config_class: AppnexusConfiguration
    yaml_path: src/main/resources/bidder-config/appnexus.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/appnexus/
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: true
    custom_unmarshaljson_present: true
  go_specific_concerns:
    - "ExtImpAppnexusKeywords.UnmarshalJSON folds three JSON shapes into a single string-typed value. The Java port must use a separate Jackson JsonDeserializer<ExtImpAppnexusKeywords> class (jackson-jsondeserialize per port-rule Rule 6) — this is the canonical multi-shape custom-unmarshal example."
    - "impExtIncoming is an adapter-local wrapper that combines the standard ExtImpBidder.bidder phase with a sibling 'gpid' field in a single jsonutil.Unmarshal — saves one pass but obscures the standard-two-phase shape. The Java port should use TypeReference<ExtPrebid<ExtImpPrebid, ExtImpAppnexus>> with a separate gpid extraction since Java has no equivalent of the renamed-tag wrapper trick."
    - "moveSupplyChain (appnexus.go:461) uses ptrutil.Clone for the Source pointer but then RE-ASSIGNS request.Source — the framework's request gets a new Source pointer. Java's lombok-tobuilder rebuild equivalent should reproduce the schain relocation under request.toBuilder().source(...).ext(...).build()."
    - "request.Imp = validImps (line 116) replaces the imp slice header in-place on the framework's request. validImps was built imp-by-imp via append from request.Imp[i] copies, but the buildRequestImp mutations write through to the original backing array via &request.Imp[i]. Cross-language ports must use immutable rebuild on Java side."
    - "iabCategoryMap is a 95-entry package-level var in iab_categories.go (Go go-data-table); Java port inlines the same table into bidder-config/appnexus.yaml as 'iab-categories' (yaml-inlined). Cross-language port concern: storage_kind divergence between go-data-table and yaml-inlined."
    - "platform_id is read from static/bidder-info/appnexus.yaml as a top-level YAML scalar (typed string '5'); resolvePlatformID converts to int (default 5). This is opaque extra_info rather than a canonical BidderInfo field — Java port promotes it into AppnexusConfigurationProperties.platformId with @NotNull. Surfaces as dev-endpoint-config-promotion-style win on Java side."
    - "splitRequests mutates request.Imp on every batch iteration (line 344: request.Imp = impsForReq) and re-marshals the request inside the loop. Multi-batch correctness depends on the request value not being shared with caller via reference; the framework's BidRequest pointer is mutated through. Reviewers may flag — see ptrutil.Clone usage on Source for the safer pattern."
    - "splitRequests also mutates request.Ext via maps.Clone(requestExt) + json.Marshal — the cloned map is local but the resulting bytes are written into request.Ext directly, persisting across batches and outliving MakeRequests. Java port via toBuilder will produce a fresh BidRequest per batch."
    - "MakeBids uses canonical helpers (adapters.IsResponseStatusCodeNoContent + adapters.CheckResponseStatusCodeForErrors); curency overwrite is guarded by appnexusResponse.Cur != \"\" empty-string check (line 214)."
    - "Bid type comes from numeric bid.ext.appnexus.bid_ad_type (0=banner, 1=video, 3=native); 2 is skipped (mapped to unrecognized → error). The Java port must preserve the same numeric mapping including the 2-skip via a switch with default-throw."
  java_specific_concerns: []
  port_lineage:
    source_language: go
    source_pr: null
    destination_language: java
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - mutation-idiom-tobuilder
      - custom-unmarshaljson-to-jackson-deserializer
      - schain-source-to-request-ext-relocation
      - iab-category-storage-divergence
  reviewer_cohort:
    go: [bsardo, SyntaxNode, hhhjort]
    java: [CTMBNara, AntoxaAntoxic, EmilNadimanov]
    cross_language_coordinator: bretg
