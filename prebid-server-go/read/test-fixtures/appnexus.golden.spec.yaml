code:
  package_or_class: appnexus
  directory_name: appnexus
  package_directory_mismatch: false
  file_layout:
    kind: multi-file
    files:
      - name: appnexus.go
        role: implementation
        loc: 508
      - name: models.go
        role: types
        loc: 49
      - name: iab_categories.go
        role: data-table
        loc: 99
  imports:
    has_template_engine: false
    has_currency_helper: false
    has_jsonutil: true
    third_party:
      - github.com/buger/jsonparser
      - github.com/prebid/openrtb/v20/adcom1
      - github.com/prebid/openrtb/v20/openrtb2
  adapter_struct:
    type_name: adapter
    type_visibility: unexported
    fields:
      - name: uri
        type: url.URL
      - name: hbSource
        type: int
      - name: randomGenerator
        type: randomutil.RandomGenerator
  builder:
    signature_canonical: true
    extra_adapter_info_used: false
    template_parsed_at_build: false
    errors_returned:
      - "url.Parse(config.Endpoint) error propagated from Builder"
  make_requests:
    batching:
      applied_in_order: true
      rules:
        - kind: pod-grouping
          key: imp.id-prefix-before-underscore
          notes:
            - "Only fires on the video-adpod path: when reqInfo.PbsEntryPoint == metrics.ReqTypeVideo AND every imp's ext.bidder.generate_ad_pod_id is true (validated to be uniform across imps)."
            - "Implementation: groupByPods splits imps by strings.Split(imp.ID, '_')[0]; each pod gets its own splitRequests call."
            - "AdPodID is generated per pod via randomGenerator.GenerateInt63 and written into requestExtAppnexus.AdPodID, so each pod's request body carries a distinct adpod_id."
        - kind: max-imps-per-request
          max: 10
          notes:
            - "Always applied. Default path: splitRequests(request.Imp, ...) with maxImpsPerReq = 10. On video-adpod path: splitRequests is invoked per-pod, so size-split happens INSIDE each pod group."
            - "Composes after pod-grouping: pods are formed first, then each pod's imps are sliced into batches of <=10."
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
    mutation:
      mutates_request: true
      entity_strategies:
        Imp: in-place
        Banner: copy-then-mutate
        Source: copy-then-mutate
        Ext: in-place
      go_idiom: ptrutil.Clone
      java_idiom: null
      schain_mutation: ptrutil.Clone
      fields_mutated:
        - request.Imp
        - request.Imp[i].TagID
        - request.Imp[i].BidFloor
        - request.Imp[i].DisplayManagerVer
        - request.Imp[i].Ext
        - request.Imp[i].Banner (via shallow-copy bannerCopy then re-point)
        - request.Source (replaced via ptrutil.Clone)
        - request.Source.Ext (rewritten without schain key)
        - request.Ext (re-marshalled with appended/replaced appnexus + schain keys)
      schain_movement:
        from: request.Source.Ext.schain
        to: request.Ext.schain
        helper: moveSupplyChain
        notes:
          - "moveSupplyChain (appnexus.go:461): unmarshals request.Source.Ext to a map, deletes 'schain', clones Source via ptrutil.Clone, re-marshals remaining sourceExtMap (or sets Ext=nil if empty), and writes the schain RawMessage into the request-level extMap['schain']."
          - "Pre-OpenRTB-2.5 source.ext.schain → OpenRTB-2.6-style request.ext.schain repositioning. Cross-language port concern."
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase
      mechanism_java: null
      target_type: openrtb_ext.ExtImpAppnexus
      wrapper_type: impExtIncoming
      notes:
        - "Adapter-local wrapper impExtIncoming { Bidder: ExtImpAppnexus, GPID: string } unmarshals BOTH the standard ExtImpBidder.bidder field (renamed 'bidder') AND a sibling 'gpid' field in one pass — saving the second jsonutil.Unmarshal call."
        - "Effectively still two-phase semantically (bidder.bidder is the inner ExtImpAppnexus), but mechanically a single jsonutil.Unmarshal of imp.Ext into impExtIncoming."
    endpoint_resolution:
      kind: query-parameter-augmentation
      mechanism_go: net/url
      mechanism_java: null
      macro_field_set: []
      template_params_struct_field_count: null
      notes:
        - "Member ID extracted from imp.ext.bidder.member (string-formatted IntString) is appended via appendMemberId — uri.Query().Set('member_id', memberId); uri.RawQuery = q.Encode()."
        - "All imps in a single request must share the same member_id; mismatch returns an error and aborts."
    helpers:
      - name: validateAndBuildImpExt
        signature: "func validateAndBuildImpExt(imp *openrtb2.Imp) (impExtIncoming, error)"
      - name: handleLegacyParams
        signature: "func handleLegacyParams(appnexusExt *openrtb_ext.ExtImpAppnexus)"
      - name: validateAppnexusExt
        signature: "func validateAppnexusExt(appnexusExt *openrtb_ext.ExtImpAppnexus) error"
      - name: buildRequestImp
        signature: "func buildRequestImp(imp *openrtb2.Imp, ext impExtIncoming, displayManagerVer string) error"
      - name: groupByPods
        signature: "func groupByPods(imps []openrtb2.Imp) map[string][]openrtb2.Imp"
      - name: splitRequests
        signature: "func splitRequests(imps []openrtb2.Imp, request *openrtb2.BidRequest, requestExt map[string]json.RawMessage, requestExtAppnexus bidReqExtAppnexus, uri string) ([]*adapters.RequestData, []error)"
      - name: buildAdPodRequests
        signature: "func (a *adapter) buildAdPodRequests(imps []openrtb2.Imp, request *openrtb2.BidRequest, requestExt map[string]json.RawMessage, requestExtAppnexus bidReqExtAppnexus, uri string) ([]*adapters.RequestData, []error)"
      - name: getRequestExt
        signature: "func getRequestExt(ext json.RawMessage) (map[string]json.RawMessage, error)"
      - name: getAppnexusExt
        signature: "func (a *adapter) getAppnexusExt(extMap map[string]json.RawMessage, isAMP int, isVIDEO int) (bidReqExtAppnexus, error)"
      - name: moveSupplyChain
        signature: "func moveSupplyChain(request *openrtb2.BidRequest, extMap map[string]json.RawMessage) error"
      - name: appendMemberId
        signature: "func appendMemberId(uri url.URL, memberId string) url.URL"
      - name: buildDisplayManageVer
        signature: "func buildDisplayManageVer(req *openrtb2.BidRequest) string"
      - name: getMediaTypeForBid
        signature: "func getMediaTypeForBid(bid *bidExt) (openrtb_ext.BidType, error)"
      - name: findIabCategoryForBid
        signature: "func (a *adapter) findIabCategoryForBid(bid *bidExt) (string, bool)"
      - name: resolvePlatformID
        signature: "func resolvePlatformID(platformID string) int"
  make_bids:
    response_type: openrtb2.BidResponse
    custom_response_type: null
    http_status_handling:
      kind: canonical-go-helpers
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: by-bid-ext-typed-field
          field: bid.ext.appnexus.bid_ad_type
          fallback_action: throw
      default_value: null
      multi_format_detection: none
    bid_pointer_pattern: indexed-iteration
    bid_pointer_go_sibling: range-value-pointer
    currency_overwrite_safety: guarded

