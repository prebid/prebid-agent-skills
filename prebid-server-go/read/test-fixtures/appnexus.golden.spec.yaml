params:
  schema_interpretation:
    properties:
      - name: placement_id
        type: ["integer", "string"]
        description: "An ID which identifies this placement of the impression"
      - name: placementId
        type: ["integer", "string"]
        description: "Deprecated, use placement_id instead."
      - name: inv_code
        type: string
        description: "A code identifying the inventory of this placement."
      - name: invCode
        type: string
        description: "Deprecated, use inv_code instead."
      - name: member
        type: ["integer", "string"]
        description: "An ID which identifies the member selling the impression."
      - name: keywords
        type: anyOf
        description: "Keywords expressed as string ('k=v,k2=v2'), array of {key, value[]} objects, or object with array values. Each form is folded into a single comma-separated string by ExtImpAppnexusKeywords.UnmarshalJSON."
      - name: traffic_source_code
        type: string
        description: "Specifies the third-party source of this impression."
      - name: trafficSourceCode
        type: string
        description: "Deprecated, use traffic_source_code instead."
      - name: reserve
        type: number
        description: "The minimium acceptable bid, in CPM, using US Dollars"
      - name: position
        type: string
        description: "Specifies the ad unit as above or below the fold"
        constraints:
          enum: [above, below]
      - name: use_pmt_rule
        type: boolean
        description: "Boolean to signal AppNexus to apply the relevant payment rule"
      - name: use_payment_rule
        type: boolean
        description: "Deprecated, Boolean to signal AppNexus to apply the relevant payment rule. use_pmt_rule will get precedence over usePaymentRule."
      - name: generate_ad_pod_id
        type: boolean
        description: "Boolean to signal AppNexus to add ad pod id to each request"
      - name: private_sizes
        type: array
        description: "Private sizes (ex: [{\"w\": 300, \"h\": 250},{...}]), experimental, may not be supported."
      - name: ext_inv_code
        type: string
        description: "Specifies predefined value passed on the query string that can be used in reporting"
      - name: external_imp_id
        type: string
        description: "Unique identifier of an externally generated auction"
    required_fields: []
    flexible_types:
      - placement_id
      - placementId
      - member
      - keywords
    combinators_used:
      - oneOf
      - oneOf-of-oneOf
      - anyOf
      - not
  ext_struct:
    package: openrtb_ext
    file: openrtb_ext/imp_appnexus.go
    type_name: ExtImpAppnexus
    fields:
      - name: DeprecatedPlacementId
        json_tag: placementId
        type_native: jsonutil.StringInt
        omitempty: false
        notes:
          - "legacy alias of PlacementId; copied into PlacementId by handleLegacyParams when PlacementId == 0"
          - "flexible-type via jsonutil.StringInt (accepts integer or string-encoded integer)"
      - name: LegacyInvCode
        json_tag: invCode
        type_native: string
        omitempty: false
        notes:
          - "legacy alias of InvCode; copied into InvCode by handleLegacyParams when InvCode is empty"
      - name: LegacyTrafficSourceCode
        json_tag: trafficSourceCode
        type_native: string
        omitempty: false
        notes:
          - "legacy alias of TrafficSourceCode; copied by handleLegacyParams"
      - name: PlacementId
        json_tag: placement_id
        type_native: jsonutil.StringInt
        omitempty: false
        notes:
          - "flexible-type via jsonutil.StringInt"
      - name: InvCode
        json_tag: inv_code
        type_native: string
        omitempty: false
        notes: []
      - name: Member
        json_tag: member
        type_native: jsonutil.IntString
        omitempty: false
        notes:
          - "flexible-type via jsonutil.IntString (accepts integer or string; serialized as string)"
      - name: Keywords
        json_tag: keywords
        type_native: ExtImpAppnexusKeywords
        omitempty: false
        notes:
          - "named string type with custom UnmarshalJSON"
          - "accepts string, array of {key, value[]} objects, or object with array values"
      - name: TrafficSourceCode
        json_tag: traffic_source_code
        type_native: string
        omitempty: false
        notes: []
      - name: Reserve
        json_tag: reserve
        type_native: float64
        omitempty: false
        notes:
          - "feeds imp.bidfloor only when imp.BidFloor <= 0; comment notes USD-only assumption"
      - name: Position
        json_tag: position
        type_native: string
        omitempty: false
        notes:
          - 'enum {"above","below"}; mapped to adcom1.PositionAboveFold / PositionBelowFold'
      - name: UsePaymentRule
        json_tag: use_pmt_rule
        type_native: '*bool'
        omitempty: false
        notes: []
      - name: DeprecatedUsePaymentRule
        json_tag: use_payment_rule
        type_native: '*bool'
        omitempty: false
        notes:
          - "legacy alias of UsePaymentRule; copied by handleLegacyParams when UsePaymentRule is nil"
      - name: PrivateSizes
        json_tag: private_sizes
        type_native: json.RawMessage
        omitempty: false
        notes:
          - "passed through verbatim — adapter does not parse"
      - name: AdPodId
        json_tag: generate_ad_pod_id
        type_native: bool
        omitempty: false
        notes:
          - "drives buildAdPodRequests path when isVIDEO == 1"
      - name: ExtInvCode
        json_tag: ext_inv_code
        type_native: string
        omitempty: false
        notes: []
      - name: ExternalImpId
        json_tag: external_imp_id
        type_native: string
        omitempty: false
        notes: []
    custom_unmarshal: true
    custom_unmarshal_accepts:
      - string
      - object
      - array
