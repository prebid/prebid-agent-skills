    notes:
      - "Method: func (ks *ExtImpAppnexusKeywords) UnmarshalJSON(b []byte) error"
      - "Branches on b[0]: '{' (object → map[string][]string), '[' (array → []extImpAppnexusKeyVal), '\"' (string → string)."
      - "Object form: 'k=v1,k=v2,...' produced by iterating map; if values is empty just 'k,'. Trailing comma stripped by [:len-1] slice."
      - "Array form: same comma-joined format from {key, value[]} structs."
      - "String form: stored verbatim."
      - "Go canonical example of runtime polymorphism via UnmarshalJSON; Java port uses jackson-jsondeserialize (separate JsonDeserializer<ExtImpAppnexusKeywords> class) per port-translation Rule 6."

