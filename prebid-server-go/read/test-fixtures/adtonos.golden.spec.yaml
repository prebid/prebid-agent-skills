quirks:
  - id: dooh-mediaTypes-audio-only
    file: static/bidder-info/adtonos.yaml
    summary: "DOOH capability declared with `mediaTypes: [audio]` only. AdTonos is a pure-audio exchange (per inline YAML comment lines 12-13: 'video ads are synthesized from audio ads for compatibility with mobile games'). Audio is the only DOOH-supported media type, while app capability extends to [audio, video] and site capability is [audio] only — three distinct mediaType lists across the three capability categories."
    edge_case_taxon: incomplete-classification
  - id: first-imp-only-ext-parsing
    file: adapters/adtonos/adtonos.go
    summary: "MakeRequests parses ONLY request.Imp[0].Ext (line 36) to derive the endpoint PublisherID — other imps' ext objects are never inspected. If multiple imps carry different supplierId values the first one wins silently. The error message hardcodes 'impression index %d, 0' (lines 38, 44), confirming the index-0-only design. The single-batched body still passes ALL imps through to the bidder."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: legacy-json-marshal-mixed-with-jsonutil
    file: adapters/adtonos/adtonos.go
    summary: "Adapter imports BOTH encoding/json (line 4) and util/jsonutil (line 15). Unmarshal paths (lines 36, 42, 88) use jsonutil; the request-body Marshal at line 53 uses encoding/json.Marshal. Inconsistent — should be migrated to jsonutil.Marshal for fidelity with PR #4614 reviewer convention. Surfaces as legacy-encoding-json-direct-usage warning."
    edge_case_taxon: legacy-encoding-json-direct-usage
  - id: bid-type-fallback-favours-audio
    file: adapters/adtonos/adtonos.go
    summary: "getMediaTypeForBid (lines 112-143) chains by-bid-mtype first (handles MarkupAudio/Video/Banner/Native explicitly, lines 115-124), then falls through to imp-mediatype lookup (lines 127-138) which checks Audio FIRST then Video — Banner/Native imps are explicitly rejected with BadInput 'Unsupported bidtype'. The audio-first fallback ordering is by design (inline comment line 126: 'AdTonos is an audio company so we prioritize that')."
    edge_case_taxon: incomplete-classification
  - id: error-message-typo-Infomation
    file: adapters/adtonos/adtonos.go
    summary: "BadInput error messages at lines 38 and 44 spell 'Error Infomation' (missing letter 'r'). Pre-existing typo in the canonical messages. Cosmetic only — does not affect behavior."
    edge_case_taxon: incomplete-classification

cross_language:
  go_artifacts:
    bidder_dir: adapters/adtonos/
    package_name: adtonos
    bidder_constant: openrtb_ext.BidderAdTonos
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/adtonos/
    bidder_class: AdtonosBidder
    config_class: AdtonosConfiguration
    yaml_path: src/main/resources/bidder-config/adtonos.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/adtonos/
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: false
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  go_specific_concerns:
    - "Endpoint template macro key spelled `{{.PublisherID}}` (Go-template syntax) on the Go side; the Java side uses `{{PublisherId}}` (no leading dot, lower-cased 'd'). A porter Go->Java must rewrite the YAML endpoint AND the proto class field name (Go: SupplierID json:'supplierId'; Java: ExtImpAdtonos.supplierId). The bidder constant name itself differs between languages too: Go `BidderAdTonos` (CamelCase preserves brand TitleCase) vs Java `AdtonosBidder` (single-T)."
    - "MakeRequests parses ONLY `request.Imp[0].Ext` (line 36) — multi-imp callers cannot route different imps to different supplierIds. The Java port (AdtonosBidder.java line 47: `bidRequest.getImp().getFirst()`) inherits the same first-imp-only behavior; this is INTENTIONAL parity, not a port-fidelity divergence."
    - "Adapter mixes encoding/json (line 53 Marshal) with util/jsonutil (lines 36, 42, 88 Unmarshal). Reviewer convention from PR #4614 advises migration to jsonutil.Marshal — flagged as legacy-encoding-json-direct-usage warning."
    - "Bid type chain: by-bid-mtype first (4-way switch on MarkupAudio/Video/Banner/Native at lines 115-124), then imp-mediatype fallback (lines 127-138) that checks Audio FIRST then Video and explicitly REJECTS Banner/Native imps with `BadInput 'Unsupported bidtype'`. Inline comment (line 126) documents 'AdTonos is an audio company so we prioritize that' — the Banner/Native rejection is by design despite Banner appearing in the mtype switch above."
    - "DOOH capability is declared with mediaTypes: [audio] only (yaml line 18-20); site capability is [audio] only (line 16-17); app capability extends to [audio, video] (lines 9-14) per the inline comment 'video ads are synthesized from audio ads for compatibility with mobile games that only understand video mimetypes'. Three distinct mediaType lists across three capability categories — uncommon split."
    - "modifyingVastXmlAllowed: true is declared at YAML line 7 (Go side); the Java YAML at src/main/resources/bidder-config/adtonos.yaml does NOT carry the modifying-vast-xml-allowed field. Cross-language asymmetry — Java's modifying-vast-xml-allowed support is a recent addition (FeedAd, Mediasquare); a Go->Java port should add the field on the Java side."
    - "request.Imp[0].Ext is dereferenced unconditionally (line 36) — if the request has zero imps, this panics with index-out-of-range. Framework's adapter loop typically guarantees at least one imp; defensive nil/empty check absent."
  java_specific_concerns: []
  port_lineage:
    source_language: go
    source_pr: null
    destination_language: java
    destination_pr: null
    fidelity_review_themes: []
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg
