# NOTE: encoded as YAML double-quoted scalar (rather than the schema example's `|` literal block)
# to preserve byte-fidelity. The original file has NO terminal newline AND carries trailing
# whitespace on one blank line (line 5 = "  \n", two spaces). A `|` block would force a
# terminal newline and risk clipping the indented blank line; the double-quoted form
# makes sha256(bidder_params_json) == bidder_params_sha256 exactly (R2 contract).
bidder_params_json: "{\n  \"$schema\": \"http://json-schema.org/draft-04/schema#\",\n  \"title\": \"AdTonos Adapter Params\",\n  \"description\": \"A schema which validates params accepted by the AdTonos adapter\",\n  \n  \"type\": \"object\",\n  \"properties\": {\n    \"supplierId\": {\n      \"type\": \"string\",\n      \"description\": \"ID of the supplier account in AdTonos platform\"\n    }\n  },\n  \"required\": [\"supplierId\"]\n}"
