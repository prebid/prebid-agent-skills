code:
  package_or_class: beachfront
  directory_name: beachfront
  package_directory_mismatch: false
  file_layout:
    kind: single-file
    files:
      - name: beachfront.go
        role: implementation
        loc: 808
  imports:
    has_template_engine: false
    has_currency_helper: true
    has_jsonutil: true
    third_party:
      - github.com/prebid/openrtb/v20/adcom1
      - github.com/prebid/prebid-server/v4/util/ptrutil
  adapter_struct:
    type_name: BeachfrontAdapter
    type_visibility: exported
    fields:
      - name: bannerEndpoint
        type: string
      - name: extraInfo
        type: ExtraInfo
  builder:
    signature_canonical: true
    extra_adapter_info_used: true
    template_parsed_at_build: false
    errors_returned:
      - "extra-info-malformed: ExtraAdapterInfo string is non-empty but fails json.Unmarshal into ExtraInfo struct"
  make_requests:
    batching:
      applied_in_order: true
      rules:
        - kind: format-split
          formats:
            - banner
            - video
        - kind: per-imp
          notes: "video imps emit one request per imp; banner imps batch into a single beachfrontBannerRequest with all banner slots aggregated."
    request_body:
      kind: custom
      custom_body_type: beachfrontRequests
    mutation:
      mutates_request: true
      entity_strategies:
        Device: in-place
        User: in-place
        Imp: copy-then-mutate
        Cur: append-if-missing
      go_idiom: shallow-copy
      java_idiom: null
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase
      mechanism_java: null
      target_type: openrtb_ext.ExtImpBeachfront
      wrapper_type: null
    endpoint_resolution:
      kind: multi-endpoint-by-mediatype
      mechanism_go: struct-field-lookup
      mechanism_java: null
      macro_field_set: []
      template_params_struct_field_count: null
    helpers:
      - name: preprocess
        signature: "func preprocess(request *openrtb2.BidRequest, reqInfo *adapters.ExtraRequestInfo) (beachfrontReqs beachfrontRequests, errs []error)"
      - name: getAppId
        signature: "func getAppId(ext openrtb_ext.ExtImpBeachfront, media openrtb_ext.BidType) (string, error)"
      - name: getBannerRequest
        signature: "func getBannerRequest(request *openrtb2.BidRequest, reqInfo *adapters.ExtraRequestInfo) (beachfrontBannerRequest, []error)"
      - name: getVideoRequests
        signature: "func getVideoRequests(request *openrtb2.BidRequest, reqInfo *adapters.ExtraRequestInfo) ([]beachfrontVideoRequest, []error)"
      - name: setBidFloor
        signature: "func setBidFloor(ext *openrtb_ext.ExtImpBeachfront, imp *openrtb2.Imp, reqInfo *adapters.ExtraRequestInfo) (bool, error)"
      - name: getExtraInfo
        signature: "func getExtraInfo(v string) (ExtraInfo, error)"
      - name: getDefaultExtraInfo
        signature: "func getDefaultExtraInfo() ExtraInfo"
  make_bids:
    response_type: openrtb2.BidResponse
    custom_response_type: '[]beachfrontResponseSlot (banner) | openrtb2.BidResponse (video)'
    http_status_handling:
      kind: legacy-raw-go
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: by-request-uri-suffix
          field: externalRequest.Uri ends with bannerEndpoint vs videoEndpoint
          fallback_action: next
        - method: hardcoded
          hardcoded_value: BidTypeBanner
          fallback_action: return-default
      default_value: banner
      multi_format_detection: by-request-uri
    bid_pointer_pattern: indexed-iteration
    bid_pointer_go_sibling: range-value-pointer
    currency_overwrite_safety: passthrough-from-response

