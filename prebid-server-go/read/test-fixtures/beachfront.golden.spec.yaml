quirks:
  - id: multi-endpoint-by-mediatype
    file: beachfront.go
    summary: "Banner imps route to bannerEndpoint (`https://display.bfmio.com/prebid_display`); video imps route to videoEndpoint sourced from ExtraAdapterInfo (`https://reachms.bfmio.com/bid.json?exchange_id`). Master sample for ADR-007 F1 endpoint_resolution.kind: multi-endpoint-by-mediatype."
    edge_case_taxon: multi-endpoint-by-mediatype
  - id: hardcoded-config-via-extra-adapter-info
    file: beachfront.go
    summary: "videoEndpoint stored opaquely in ExtraAdapterInfo JSON string rather than exposed as a typed config field. Builder json.Unmarshals into ExtraInfo struct; default fallback when empty/missing. Java side uses the typed BeachfrontConfigurationProperties subclass with @NotBlank private String videoEndpoint — Rule 35 lossy-direction: Go is the lossy form."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: custom-request-body-banner
    file: beachfront.go
    summary: "Banner endpoint receives beachfrontBannerRequest custom struct (slots[], domain, page, deviceOs, etc.) — NOT the OpenRTB2 BidRequest. Rule 9 master sample for the banner direction."
    edge_case_taxon: custom-request-response-shape
  - id: custom-request-body-video
    file: beachfront.go
    summary: "Video endpoint receives []beachfrontVideoRequest array of custom structs (appId, videoResponseType, request) — NOT the OpenRTB2 BidRequest. Rule 9 master sample for the video direction."
    edge_case_taxon: custom-request-response-shape
  - id: nurl-vs-adm-video-response-type
    file: beachfront.go
    summary: "videoResponseType param ('nurl' | 'adm') controls bid response format. Default 'adm' returns inline VAST; 'nurl' returns Beachfront-hosted player URL with `&prebidserver` suffix appended to videoEndpoint. The two video sub-types route through the same endpoint but with different payload structure."
    edge_case_taxon: vendor-specific-protocol-quirk
  - id: legacy-raw-status-checks
    file: beachfront.go
    summary: "MakeBids uses raw responseData.StatusCode == 204 / != 200 checks (lines 525-534) instead of canonical adapters.IsResponseStatusCodeNoContent / adapters.CheckResponseStatusCodeForErrors helpers."
    edge_case_taxon: hardcoded-config-as-anti-pattern

cross_language:
  go_artifacts:
    bidder_dir: adapters/beachfront/
    package_name: beachfront
    bidder_constant: openrtb_ext.BidderBeachfront
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/beachfront/
    bidder_class: BeachfrontBidder
    config_class: BeachfrontConfiguration
    yaml_path: src/main/resources/bidder-config/beachfront.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/beachfront/
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: null
    destination_language: null
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - rule-9-custom-request-type
      - rule-35-typed-config-subclass
      - adr-007-f1-multi-endpoint-by-mediatype
      - currency-aware-bidfloor-resolver
  go_specific_concerns:
    - "ExtraInfo struct is package-exported and Builder accepts ExtraAdapterInfo string config; opaque JSON-string config is the Go-side anti-pattern Rule 35 inverse demotes Java's typed config TO."
    - "Per-imp processing in preprocess() splits imps into bannerImps + videoImps slices BEFORE building per-mediatype request payloads. Multi-mediatype imps appear in BOTH slices (one banner request + one or more video requests)."
    - "fakeIP constant (255.255.255.255) is sent in the device.ip field when the framework's BidRequest.Device is null — Rule 27-adjacent quirk specific to Beachfront's expected payload shape."
    - "BeachfrontAdapterName + BeachfrontAdapterVersion constants are stamped into the banner request payload (adapterName + adapterVersion fields) — bidder-side identification not present in OpenRTB."
    - "BidCapacity = 5 — apparently a per-request bid limit on response parsing (only the first 5 bids per seatbid are processed)."
  java_specific_concerns: []
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: null
