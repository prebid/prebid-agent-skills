bidder_params_json: |
  {
    "$schema": "http://json-schema.org/draft-04/schema#",
    "title": "Beachfront Adapter Params",
    "description": "A schema which validates params accepted by the Beachfront adapter",
    "type": "object",
    "properties": {
      "appId": {
        "type": "string",
        "description": "The id of an inventory target. This can only be used in requests that contain one media type. It will be applied to all imps in the request."
      },
      "appIds": {
        "type" : "object",
        "description": "An object that specifies appIds for specific media types. This can be used for either single media type requests or multiple.",
        "properties": {
          "video" : {
            "type": "string",
            "title": "Video appId",
            "description": "An appId string that will be applied to video requests in this imp."
          },
          "banner" : {
            "type": "string",
            "title": "Banner appId",
            "description": "An appId string that will be applied to banner requests in this imp."
          }
        },
        "anyOf":[
          {"required":["video"]},
          {"required":["banner"]}
        ]
      },
      "bidfloor": {
        "type": "number",
        "description": "The price floor for the bid. Will override the bidfloor set for the impression. Always in USD, regardless of the value of the currency set for the impression."
      },
      "videoResponseType": {
        "type": "string",
        "description": "By default the video response will be an AdM element containing VAST 3.0 markup including tracking, click through, and mediafile elements pointing to mp4, webm or other playable media files or Vpaid media as configured for the exchange at beachfront.io. Optionally, set this to 'nurl' to receive a URI pointing to VAST 3.0 markup which will contain a mediafile pointing to a beachfront neptune javascript video player which will load your video and take care of tracking, etc. Regardless of which format is selected, the id of the returned impression will be the provided impression id (imp[{'id'...},...] in the request) with the format appended. The impression id will be returned unchanged as 'impid'. So if you indicate 'nurl', and an impression id 'someImp', the returned impression will have an 'impid' value of 'someImpNurlVideo'. This is to differentiate the object in the case that a request includes both video and banner elements. Setting videoResponseType to any other string will have no effect and the default format (AdM) will be returned."
      }
    },

    "oneOf": [
      { "required": ["appIds"] },
      { "required": ["appId"] }
    ]
  }
bidder_params_sha256: 8bb5485afd62744d46625253b49058a58dcdbb00f43b9f04c6ef9b06c1a46311

params:
  schema_interpretation:
    properties:
      - name: appId
        type: string
        description: "Single appId — used when all imps share one media type."
      - name: appIds
        type: object
        description: "Per-mediatype appIds object with optional video and banner string fields. anyOf-required on at least one. Used for multi-mediatype requests."
      - name: bidfloor
        type: number
        description: "Override price floor. Always in USD."
      - name: videoResponseType
        type: string
        description: "Video response format selector — 'adm' (default) returns inline VAST; 'nurl' returns a Beachfront-hosted neptune player URL."
    required_fields: []
    flexible_types: []
    combinators_used:
      - oneOf
      - anyOf
  ext_struct:
    package: openrtb_ext
    file: openrtb_ext/imp_beachfront.go
    type_name: ExtImpBeachfront
    fields:
      - name: AppId
        json_tag: appId
        type_native: string
        omitempty: false
        notes: []
      - name: AppIds
        json_tag: appIds
        type_native: ExtImpBeachfrontAppIds
        omitempty: false
        notes:
          - "Sub-struct with Video + Banner string fields, both omitempty."
      - name: BidFloor
        json_tag: bidfloor
        type_native: float64
        omitempty: false
        notes: []
      - name: VideoResponseType
        json_tag: videoResponseType
        type_native: string
        omitempty: true
        notes: []
    custom_unmarshal: false
    custom_unmarshal_accepts: []
  params_test:
    file: adapters/beachfront/params_test.go
    valid_cases_count: 5
    invalid_cases_count: 7
    bidder_constant_referenced: openrtb_ext.BidderBeachfront

code:
  package_or_class: beachfront
  directory_name: beachfront
  package_directory_mismatch: false
  file_layout:
    kind: single-file
    files:
      - name: beachfront.go
        role: implementation
        loc: 808
  imports:
    has_template_engine: false
    has_currency_helper: true
    has_jsonutil: true
    third_party:
      - github.com/prebid/openrtb/v20/adcom1
      - github.com/prebid/prebid-server/v4/util/ptrutil
  adapter_struct:
    type_name: BeachfrontAdapter
    type_visibility: exported
    fields:
      - name: bannerEndpoint
        type: string
      - name: extraInfo
        type: ExtraInfo
  builder:
    signature_canonical: true
    extra_adapter_info_used: true
    template_parsed_at_build: false
    errors_returned:
      - "extra-info-malformed: ExtraAdapterInfo string is non-empty but fails json.Unmarshal into ExtraInfo struct"
  make_requests:
    batching:
      applied_in_order: true
      rules:
        - kind: format-split
          formats:
            - banner
            - video
        - kind: per-imp
          notes: "video imps emit one request per imp; banner imps batch into a single beachfrontBannerRequest with all banner slots aggregated."
    request_body:
      kind: custom
      custom_body_type: beachfrontRequests
    mutation:
      mutates_request: true
      entity_strategies:
        Device: in-place
        User: in-place
        Imp: copy-then-mutate
        Cur: append-if-missing
      go_idiom: shallow-copy
      java_idiom: null
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase
      mechanism_java: null
      target_type: openrtb_ext.ExtImpBeachfront
      wrapper_type: null
    endpoint_resolution:
      kind: multi-endpoint-by-mediatype
      mechanism_go: struct-field-lookup
      mechanism_java: null
      macro_field_set: []
      template_params_struct_field_count: null
    helpers:
      - name: preprocess
        signature: "func preprocess(request *openrtb2.BidRequest, reqInfo *adapters.ExtraRequestInfo) (beachfrontReqs beachfrontRequests, errs []error)"
      - name: getAppId
        signature: "func getAppId(ext openrtb_ext.ExtImpBeachfront, media openrtb_ext.BidType) (string, error)"
      - name: getBannerRequest
        signature: "func getBannerRequest(request *openrtb2.BidRequest, reqInfo *adapters.ExtraRequestInfo) (beachfrontBannerRequest, []error)"
      - name: getVideoRequests
        signature: "func getVideoRequests(request *openrtb2.BidRequest, reqInfo *adapters.ExtraRequestInfo) ([]beachfrontVideoRequest, []error)"
      - name: setBidFloor
        signature: "func setBidFloor(ext *openrtb_ext.ExtImpBeachfront, imp *openrtb2.Imp, reqInfo *adapters.ExtraRequestInfo) (bool, error)"
      - name: getExtraInfo
        signature: "func getExtraInfo(v string) (ExtraInfo, error)"
      - name: getDefaultExtraInfo
        signature: "func getDefaultExtraInfo() ExtraInfo"
  make_bids:
    response_type: openrtb2.BidResponse
    custom_response_type: '[]beachfrontResponseSlot (banner) | openrtb2.BidResponse (video)'
    http_status_handling:
      kind: legacy-raw-go
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: by-request-uri-suffix
          field: externalRequest.Uri ends with bannerEndpoint vs videoEndpoint
          fallback_action: next
        - method: hardcoded
          hardcoded_value: BidTypeBanner
          fallback_action: return-default
      default_value: banner
      multi_format_detection: by-request-uri
    bid_pointer_pattern: indexed-iteration
    bid_pointer_go_sibling: range-value-pointer
    currency_overwrite_safety: passthrough-from-response

