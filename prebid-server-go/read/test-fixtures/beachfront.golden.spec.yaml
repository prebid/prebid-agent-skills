params:
  schema_interpretation:
    properties:
      - name: appId
        type: string
        description: "Single appId — used when all imps share one media type."
      - name: appIds
        type: object
        description: "Per-mediatype appIds object with optional video and banner string fields. anyOf-required on at least one. Used for multi-mediatype requests."
      - name: bidfloor
        type: number
        description: "Override price floor. Always in USD."
      - name: videoResponseType
        type: string
        description: "Video response format selector — 'adm' (default) returns inline VAST; 'nurl' returns a Beachfront-hosted neptune player URL."
    required_fields: []
    flexible_types: []
    combinators_used:
      - oneOf
      - anyOf
  ext_struct:
