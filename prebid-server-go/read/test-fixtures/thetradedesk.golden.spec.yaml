params:
  schema_interpretation:
    properties:
      - name: publisherId
        type: string
        minLength: 1
        description: "An ID which identifies the publisher"
        notes:
          - "Required field. The adapter takes the FIRST non-empty publisherId from imps and propagates to request.Site.Publisher.ID or request.App.Publisher.ID."
      - name: supplySourceId
        type: string
        minLength: 1
        description: "An ID provided by TheTradeDesk used to determine which endpoint to use"
        notes:
          - "Optional field. If absent, falls back to the Builder's `defaultEndpoint` resolved from `config.ExtraAdapterInfo` at startup. Must be lowercase letters only (regex `([a-z]+)$`)."
    required_fields:
      - publisherId
    flexible_types: []
    combinators_used: []
  ext_struct:
    package: openrtb_ext
    file: openrtb_ext/imp_thetradedesk.go
    type_name: ExtImpTheTradeDesk             # Multi-cap PascalCase preserves inner word boundaries (TheTradeDesk = three words). Cross-language symmetric on the type name.
    fields:
      - name: PublisherId
        json_tag: publisherId
        type_native: string
        omitempty: false
        notes: []
      - name: SupplySourceId
        json_tag: supplySourceId
        type_native: string
        omitempty: false
        notes: []
    custom_unmarshal: false
    custom_unmarshal_accepts: []
  params_test:
    file: adapters/thetradedesk/params_test.go
    valid_cases_count: 3
    invalid_cases_count: 9
    bidder_constant_referenced: openrtb_ext.BidderTheTradeDesk

code:
  package_or_class: thetradedesk
  directory_name: thetradedesk
  package_directory_mismatch: false
  file_layout:
    kind: single-file
    files:
      - name: thetradedesk.go
        role: implementation
        loc: 248
  imports:
    has_template_engine: true                 # text/template via macros.ResolveMacros for endpoint URL substitution
    has_currency_helper: false
    has_jsonutil: true
    third_party:
      - github.com/prebid/openrtb/v20/openrtb2
  adapter_struct:
    type_name: adapter
    type_visibility: unexported
    fields:
      - name: bidderEndpointTemplate
        type: string                           # Raw template string (preserved for inspection)
      - name: defaultEndpoint
        type: string                           # Pre-resolved endpoint using config.ExtraAdapterInfo at builder time
      - name: templateEndpoint
        type: "*template.Template"             # Compiled Go template stored on the adapter struct (per-request macro resolution)
  builder:
    signature_canonical: true
    extra_adapter_info_used: true             # config.ExtraAdapterInfo is the host-config-time supplyId; validated against regex `([a-z]+)$` (lowercase letters only)
    template_parsed_at_build: true            # Builder parses config.Endpoint as text/template once at startup
    errors_returned:
      - "ExtraAdapterInfo regex validation failure: \"ExtraAdapterInfo must be a simple string provided by TheTradeDesk\""
      - "template parse error: \"unable to parse endpoint url template: <err>\""
      - "default-endpoint macro resolution failure: \"unable to resolve endpoint macros: <err>\""
  make_requests:
    batching:
      applied_in_order: true
      rules:
        - kind: per-batch                     # SINGLE outbound HTTP request with ALL imps in one body. Cross-language symmetric.
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
    mutation:
      mutates_request: true
      entity_strategies:
        Imp: in-place                         # for each imp: if Banner non-nil and Format non-empty, deep-copy banner with W/H from format[0]; reassign imp.Banner pointer
        Banner: deep-copy-then-mutate         # `bannerCopy := *imp.Banner`; W/H overridden from format[0]
        Video: none
        Site: deep-copy-then-mutate           # `siteCopy := *request.Site`; if Publisher non-nil, deep-copy + override ID with publisherId; if Publisher nil, synthesize new Publisher{ID: pubID}
        App: deep-copy-then-mutate            # Same as Site path: deep-copy app + publisher mutation
        Source: none
        Device: none
        User: none
        Cur: none
      go_idiom: shallow-copy-then-mutate
      java_idiom: null
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase
      mechanism_java: null
      target_type: openrtb_ext.ExtImpTheTradeDesk
      wrapper_type: null
    endpoint_resolution:
      kind: template-macro
      mechanism_go: text-template-resolve-macros
      mechanism_java: null
      macros_used: ["SupplyId"]
    helpers:
      - name: getExtensionInfo
        signature: "func getExtensionInfo(impressions []openrtb2.Imp) (string, string, error)"
      - name: getImpressionExt
        signature: "func getImpressionExt(imp *openrtb2.Imp) (*openrtb_ext.ExtImpTheTradeDesk, error)"
      - name: buildEndpointURL
        signature: "func (a *adapter) buildEndpointURL(supplySourceId string) (string, error)"
      - name: resolveAuctionPriceMacros
        signature: "func resolveAuctionPriceMacros(bid *openrtb2.Bid)"
      - name: getBidType
        signature: "func getBidType(markupType openrtb2.MarkupType) (openrtb_ext.BidType, error)"
  make_bids:
    response_type: openrtb2.BidResponse
    custom_response_type: null
    http_status_handling:
      kind: canonical-go-helpers              # Uses adapters.IsResponseStatusCodeNoContent + adapters.CheckResponseStatusCodeForErrors helpers
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: bid-mtype-switch            # Switch on bid.MType: 1=banner, 2=video, 4=native. Audio (3) explicitly NOT supported. Default: error "unsupported mtype: <int>". Cross-language symmetric on classification, divergent on error semantics (Go aborts whole MakeBids; Java filters per-bid).
          hardcoded_value: null
          fallback_action: throw
      default_value: null
      multi_format_detection: none
    bid_pointer_pattern: range-with-bid-copy   # `for _, bid := range seatBid.Bid { bid := bid; resolveAuctionPriceMacros(&bid); ...; &bid }` — value copy then pointer-to-local. Same pattern as freewheelssp.
    bid_pointer_go_sibling: range-value-copy
    currency_overwrite_safety: passthrough-from-response   # `bidderResponse.Currency = bidResponse.Cur` — single response-level assignment. Java attaches per-bid via BidderBid.of(bid, type, cur).

