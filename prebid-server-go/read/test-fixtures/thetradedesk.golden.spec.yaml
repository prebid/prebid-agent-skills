quirks:
  - id: bid-post-processing-macro-master-sample
    file: adapters/thetradedesk/thetradedesk.go
    line: 239
    summary: "ADR-007 F4 CANONICAL MASTER SAMPLE. resolveAuctionPriceMacros(bid) helper at line 239 substitutes `${AUCTION_PRICE}` into bid.NURL, bid.AdM, and bid.BURL using strings.ReplaceAll. Number formatting: `strconv.FormatFloat(bid.Price, 'f', -1, 64)` (drops trailing zeros). Runs BEFORE getBidType (Java runs AFTER — order divergence but both end states identical). Single-macro-three-field flavor (only AUCTION_PRICE; only NURL+AdM+BURL — LURL is intentionally not touched). Distinct from adverxo/vungle which have F4 as side-quirks; for thetradedesk, F4 IS the bidder's identity."
    edge_case_taxon: bid-post-processing-macro
  - id: auction-price-macro-replacement-named-fixture
    file: adapters/thetradedesk/thetradedesktest/supplemental/auction-price-macro-replacement.json
    summary: "Dedicated supplemental test fixture with the literal name `auction-price-macro-replacement` — self-documenting marker for ADR-007 F4 in the corpus. Most fixtures are named after media types or scenarios; this one names the F4 pattern explicitly. Worth surfacing as a corpus signal that thetradedesk is the master sample."
    edge_case_taxon: bid-post-processing-macro
  - id: bid-type-mtype-only-no-imp-correlation
    file: adapters/thetradedesk/thetradedesk.go
    line: 199
    summary: "getBidType resolves from bid.MType ONLY (1=banner, 2=video, 4=native). NO imp-correlation fallback, NO `ext.prebid.type` inspection, NO bid.AdM sniffing. Audio (mtype 3) explicitly NOT supported. Default case errors with `unsupported mtype: <int>`. Cross-language symmetric on classification logic, divergent on error semantics (Go aborts whole MakeBids; Java filters per-bid)."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: terminal-error-on-bad-mtype
    file: adapters/thetradedesk/thetradedesk.go
    line: 184
    summary: "If getBidType returns error (unrecognized mtype), MakeBids returns `nil, []error{err}` — terminal abort that drops ALL bids in the response. Java side filters JUST the bad bid via per-bid error append (Rule 41 error-handling divergence). Cross-language behavioral asymmetry on partial-bad responses."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: per-imp-publisher-id-first-non-empty
    file: adapters/thetradedesk/thetradedesk.go
    line: 132
    summary: "getExtensionInfo iterates imps; FIRST non-empty publisherId AND FIRST non-empty supplySourceId win. Once both are found, breaks early. Same algorithm cross-language."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: site-or-app-publisher-id-mutation
    file: adapters/thetradedesk/thetradedesk.go
    line: 55
    summary: "After publisher-id extraction, MakeRequests mutates request.Site.Publisher.ID OR request.App.Publisher.ID (whichever is present). If Publisher is nil, synthesizes new Publisher{ID: pubID}. If Publisher exists, deep-copies and overrides ID. Cross-language symmetric — Java does the same via Publisher.builder().id(publisherId).build()."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: extraAdapterInfo-regex-substring-vs-full-match
    file: adapters/thetradedesk/thetradedesk.go
    line: 214
    summary: "Builder validates `config.ExtraAdapterInfo` against regex `([a-z]+)$` using `regexp.Match` (substring match — returns true if pattern matches anywhere). Java side uses `Pattern.compile(\"([a-z]+)$\").matcher(...).matches()` which requires WHOLE-INPUT match. Subtle correctness divergence: input like `\"ABCabc\"` — Go matches the trailing `abc` (returns true), Java rejects (whole input must be lowercase). Real cross-language fidelity gap with potentially material implications for hosts."
    edge_case_taxon: yaml-field-name-typo
  - id: extraAdapterInfo-error-message-go-config-term
    file: adapters/thetradedesk/thetradedesk.go
    line: 216
    summary: "Validation error message uses Go-config-field name: `\"ExtraAdapterInfo must be a simple string provided by TheTradeDesk\"`. Java uses bidder-concept name: `\"SupplyId must be a simple string provided by TheTradeDesk\"`. Same template structure; first word divergent. Reveals naming-convention asymmetry — Java picks bidder-facing concept, Go picks host-config-facing field name."
    edge_case_taxon: yaml-field-name-typo
  - id: number-format-strconv-floattoa-drops-trailing-zeros
    file: adapters/thetradedesk/thetradedesk.go
    line: 243
    summary: "`strconv.FormatFloat(bid.Price, 'f', -1, 64)` drops trailing zeros (`1.50` → `\"1.5\"`) and limits precision to ~16 significant digits. Java's `BigDecimal.toPlainString()` preserves source scale exactly (`1.50` → `\"1.50\"`) and supports arbitrary precision. For typical 2-3 decimal bid prices, semantically equivalent; for high-precision inputs (>15 sig digits like `123456789.123456789`), Go and Java produce DIFFERENT substituted result strings. Latent fidelity gap — unlikely in production but observable in tests."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: macro-replace-before-bid-type-resolution
    file: adapters/thetradedesk/thetradedesk.go
    line: 181
    summary: "resolveAuctionPriceMacros runs BEFORE getBidType in the bid-iteration loop. Java runs AFTER. Functionally equivalent because Go aborts on bad mtype anyway, but the ordering is a Rule 5 mutation-flow asymmetry. Java's order means the macro substitution only runs on bids that classify successfully; Go's order means even bids that error get processed (but never observed externally)."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: usersync-supports-only-no-url
    file: static/bidder-info/thetradedesk.yaml
    line: 18
    summary: "userSync block declares `supports: [redirect, iframe]` only — no actual `redirect:` or `iframe:` URL subtree. Embedded comment: \"TheTradeDesk supports user syncing, but requires configuration by the host. Contact a technical account manager...\". Host must configure sync URLs out-of-band. Cross-language symmetric: Java YAML also has no usersync URL block."
    edge_case_taxon: yaml-field-name-typo
  - id: gpp-supported-go-only-yaml-declaration
    file: static/bidder-info/thetradedesk.yaml
    line: 26
    summary: "Go YAML declares `openrtb.gpp-supported: true`. Java YAML has no equivalent declaration. Both sides actually do propagate GPP at runtime — the YAML declarations are the divergence, not the runtime behavior. Java handles GPP centrally per OrtbVersion config rather than per-bidder."
    edge_case_taxon: yaml-field-name-typo

cross_language:
  go_artifacts:
    bidder_dir: adapters/thetradedesk/
    package_name: thetradedesk
    bidder_constant: openrtb_ext.BidderTheTradeDesk
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/thetradedesk/
    bidder_class: TheTradeDeskBidder
    config_class: TheTradeDeskConfiguration
    yaml_path: src/main/resources/bidder-config/thetradedesk.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/thetradedesk/
  port_concerns:
    aliases_inverted: true                    # Java has `ttd: ~` tilde-stub alias under thetradedesk.yaml; Go has no `ttd.yaml` entry. Hosts using bidders=ttd succeed against Java but fail against Go. Rule-33-style asymmetric alias declaration.
    yaml_unification: false
    mutation_idiom_divergence: true           # Go shallow-copy + in-place pointer; Java Lombok toBuilder immutable rebuild
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: null
    destination_language: null
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - bid-post-processing-macro              # F4 master sample — CONFIRMED
      - mutation-idiom-tobuilder               # Rule 5
      - macro-form-divergence                  # Rule 11 (endpoint URL macro syntax)
      - alias-presence-divergence              # Rule 33-style ttd asymmetry (Java only)
      - error-message-style                    # Rule 41 (ExtraAdapterInfo vs SupplyId)
      - regex-match-semantics-divergence       # subtle: Go substring vs Java full-string
      - number-formatting-precision-divergence # strconv.FormatFloat 'f' -1 vs BigDecimal.toPlainString
      - bid-type-error-handling-divergence     # Go terminal vs Java per-bid filter
      - cross-language-byte-divergence         # Rule 38 (tabs vs 2-space)
      - gpp-supported-yaml-declaration-go-only
  go_specific_concerns:
    - "Adapter struct has 3 fields: bidderEndpointTemplate (raw template string), defaultEndpoint (pre-resolved at builder time using config.ExtraAdapterInfo), templateEndpoint (compiled *template.Template). Builder parses + resolves once; per-request endpoint resolution uses the compiled template."
    - "ExtraAdapterInfo regex validation uses `regexp.Match` (substring match). Java uses `Matcher.matches()` (full-input match). Input like `\"ABCabc\"` — Go would match the trailing `abc`, Java rejects. Real cross-language fidelity gap on the supplyId validator."
    - "Number formatting: `strconv.FormatFloat(bid.Price, 'f', -1, 64)` drops trailing zeros (`1.50` → `\"1.5\"`). Java's `BigDecimal.toPlainString()` preserves source scale (`1.50` → `\"1.50\"`). High-precision inputs (>15 sig digits) produce different substituted result strings."
    - "Macro substitution order: Go runs `resolveAuctionPriceMacros` BEFORE `getBidType`; Java runs AFTER. Functionally equivalent because Go aborts on bad mtype, but the ordering is a Rule 5 mutation-flow asymmetry."
    - "Bid-type error path: Go aborts whole MakeBids on first bad mtype (`return nil, []error{err}`). Java filters JUST the bad bid via per-bid error append. Cross-language behavioral asymmetry on partial-bad responses."
    - "`openrtb.gpp-supported: true` declared on Go YAML; Java has no equivalent declaration. Both sides do propagate GPP at runtime."
