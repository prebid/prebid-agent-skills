params:
  schema_interpretation:
    properties:
      - name: pubId
        type: integer
        minimum: 1
        description: "Publisher Id to use."
        notes:
          - "Required field; minimum 1. Validated server-side via `pubId >= 1` check before request build."
    required_fields:
      - pubId
    flexible_types: []                        # Pure integer — no string-to-number coercion (distinct from cadent's stringified bidfloor)
    combinators_used: []
  ext_struct:
    package: openrtb_ext
    file: openrtb_ext/imp_adkernelAdn.go      # CamelCase filename — note Go ext filename keeps camelCase, mirroring the package
    type_name: ExtImpAdkernelAdn
    fields:
      - name: PublisherID
        json_tag: pubId
        type_native: int
        omitempty: false
        notes:
          - "Native Go field name `PublisherID` (PascalCase) maps to JSON tag `pubId` (camelCase). Java's lowercase `pubId` field uses @JsonProperty(\"pubId\")."
    custom_unmarshal: false
    custom_unmarshal_accepts: []
  params_test:
    file: adapters/adkernelAdn/params_test.go     # NOTE: search of upstream confirms `params_test.go` is NOT present in this adapter dir at the pinned commit (only `adkernelAdn_test.go` for unit tests). This field reflects the canonical-pluralised path; absence at upstream is acceptable.
    valid_cases_count: null
    invalid_cases_count: null
    bidder_constant_referenced: openrtb_ext.BidderAdkernelAdn

code:
  package_or_class: adkernelAdn               # CamelCase package name (matches directory)
  directory_name: adkernelAdn
  package_directory_mismatch: false           # Both camelCase
  file_layout:
    kind: single-file
    files:
      - name: adkernelAdn.go
        role: implementation
        loc: 320
  imports:
    has_template_engine: true                 # text/template via macros.ResolveMacros for endpoint URL substitution
    has_currency_helper: false                # No requestInfo.ConvertCurrency usage
    has_jsonutil: true                        # util/jsonutil for imp.ext unmarshal
    third_party:
      - github.com/prebid/openrtb/v20/openrtb2
  adapter_struct:
    type_name: adkernelAdnAdapter             # CamelCase (lowercase first char): unexported but with "Adapter" suffix. Distinct from cadent's bare `adapter` and vungle's `adapter`.
    type_visibility: unexported
    fields:
      - name: EndpointTemplate
        type: "*template.Template"            # Compiled Go template stored on the adapter struct (unlike cadent's plain string endpoint)
  builder:
    signature_canonical: true
    extra_adapter_info_used: false
    template_parsed_at_build: true            # Builder parses config.Endpoint as a text/template at startup; reused per-request
    errors_returned:
      - "template parse error if config.Endpoint is malformed"
  make_requests:
    batching:
      applied_in_order: true
      rules:
        - kind: per-key                       # Imps are grouped by `ExtImpAdkernelAdn{PublisherID}` (unique pubId values). One outbound HTTP request per unique pubId.
          group_key: imp.ext.bidder.pubId
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
    mutation:
      mutates_request: true
      entity_strategies:
        Imp: in-place                         # `imp.Ext = nil` (strip after extraction); Banner deep-copy + format-list slicing; clears Video/Audio/Native on banner imps; clears Banner/Audio/Native on video imps
        Banner: deep-copy-then-mutate         # `bannerCopy := *imp.Banner`; if W&H both nil, lift Format[0] into W/H, slice Format[1:]
        Video: deep-copy-then-mutate          # Video kept as-is on video imps; banner/audio/native cleared
        Site: deep-copy-then-mutate           # `siteCopy := *imp.Site`; sets Publisher = nil, Domain = ""
        App: deep-copy-then-mutate            # `appCopy := *imp.App`; sets Publisher = nil (Domain NOT cleared, distinct from Site)
        Source: none
        Device: none
        User: none
        Cur: none
      go_idiom: shallow-copy-then-mutate
      java_idiom: null
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase        # Read imp.ext into adapters.ExtImpBidder, then unmarshal `bidderExt.Bidder` into ExtImpAdkernelAdn
      mechanism_java: null
      target_type: openrtb_ext.ExtImpAdkernelAdn
      wrapper_type: null
    endpoint_resolution:
      kind: template-macro
      mechanism_go: text-template-resolve-macros
      mechanism_java: null
      macros_used: ["PublisherID"]
    helpers:
      - name: dispatchImpressions
        signature: "func (a *adkernelAdnAdapter) dispatchImpressions(...) (map[ExtImpAdkernelAdn][]openrtb2.Imp, []error)"
      - name: validateImpression
        signature: "func validateImpression(imp *openrtb2.Imp, ext *openrtb_ext.ExtImpAdkernelAdn) error"
      - name: compatImpression
        signature: "func compatImpression(imp openrtb2.Imp) (openrtb2.Imp, error)"
      - name: compatBannerImpression
        signature: "func compatBannerImpression(imp *openrtb2.Imp) error"
      - name: compatVideoImpression
        signature: "func compatVideoImpression(imp *openrtb2.Imp)"
      - name: getExtImp
        signature: "func getExtImp(imp openrtb2.Imp) (openrtb_ext.ExtImpAdkernelAdn, error)"
      - name: getMediaTypeForImpID
        signature: "func getMediaTypeForImpID(impID string, imps []openrtb2.Imp) openrtb_ext.BidType"
  make_bids:
    response_type: openrtb2.BidResponse
    custom_response_type: null
    http_status_handling:
      kind: canonical-go-helpers
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: imp-id-correlation          # `getMediaTypeForImpID(impID, imps)` iterates source imps; if matching imp had banner → BidTypeBanner, else BidTypeVideo. NO bid.MType, NO seat.Ext, NO native classification.
          hardcoded_value: null
          fallback_action: classify-as-video
      default_value: video
      multi_format_detection: none
    bid_pointer_pattern: indexed-iteration
    bid_pointer_go_sibling: range-index
    currency_overwrite_safety: drops-response-cur   # Go does NOT propagate `bidResponse.Cur` to BidderResponse.Currency (left empty). Java DOES forward it. Cross-language asymmetry.

