quirks:
  - id: rule-46-multi-form-naming
    file: openrtb_ext/bidders.go
    summary: "Rule 46 lowercase normalization holds (`adkernelAdn` lowercased = `adkerneladn`), BUT the corpus reality is multi-form: Go uses camelCase for package/file/yaml/struct/registry-key, but lowercase for the test fixture root `adkerneladntest/`. Internal asymmetry within Go side itself (similar to cadent's tri-form Go naming)."
    edge_case_taxon: yaml-field-name-typo
  - id: per-pubid-grouped-batching
    file: adkernelAdn.go
    line: 80
    summary: "MakeRequests groups imps by `ExtImpAdkernelAdn{PublisherID}` (one bucket per unique pubId), then emits one HTTP request per bucket. Distinct from per-imp (one request per imp) and per-batch (one request for all imps). Cross-language symmetric — Java does the same `Map<ExtImpAdkernelAdn, List<Imp>>` grouping."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: imp-ext-strip-after-extraction
    file: adkernelAdn.go
    summary: "After extracting ExtImpAdkernelAdn, the adapter sets `imp.Ext = nil` to suppress forwarding the prebid wrapper to AdKernel's platform. Comment in code: `// do not forward ext to adkernel platform`. Cross-language symmetric — Java does `impBuilder.ext(null)`."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: response-validation-exactly-one-seatbid
    file: adkernelAdn.go
    summary: "MakeBids requires `len(bidResp.SeatBid) == 1` exactly. More than one OR zero seatbids → BadServerResponse error. Cross-language symmetric on Java side. Distinct from typical adapters that tolerate multiple seatbids."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: banner-format-list-slicing
    file: adkernelAdn.go
    summary: "compatBannerImpression: if banner.W and banner.H are both nil, lifts Format[0] into W/H and slices Format[1:] (truncating the first format from the list). Cross-language symmetric — Java does `subList(1, ...)` or `emptyList()`."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: site-publisher-and-domain-cleared
    file: adkernelAdn.go
    summary: "On Site, MakeRequests deep-copies and sets `Publisher = nil` AND `Domain = \"\"`. Both cleared. Distinct from App handling (only Publisher cleared, Domain preserved). Cross-language symmetric on Java side."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: app-publisher-only-cleared
    file: adkernelAdn.go
    summary: "On App, MakeRequests deep-copies and sets `Publisher = nil` ONLY (Domain preserved). Asymmetric with Site handling (where both Publisher and Domain are cleared). Cross-language symmetric on Java side."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: hardcoded-currency-empty
    file: adkernelAdn.go
    summary: "Go side does NOT propagate `bidResponse.Cur` to BidderResponse.Currency (left as default empty string). Java side DOES forward `bidResponse.getCur()` per-bid via `BidderBid.of(bid, type, bidResponse.getCur())`. Cross-language behavioral asymmetry."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: bid-type-imp-id-correlation-default-video
    file: adkernelAdn.go
    summary: "getMediaTypeForImpID iterates source imps to find a match by ID. If match has banner → BidTypeBanner. Otherwise → BidTypeVideo (HARDCODED fallback). NO bid.MType lookup, NO native classification. Cross-language symmetric. Note: native-impression supplemental fixture exists, but native bids would be miscategorized as video by this method chain."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: x-openrtb-version-lowercase-header
    file: adkernelAdn.go
    summary: "Header name added as `\"x-openrtb-version\"` (LOWERCASE). Java uses `HttpUtil.X_OPENRTB_VERSION_HEADER` which is `\"X-OpenRTB-Version\"`. HTTP headers are case-insensitive over the wire, but byte-level comparison of outbound requests would diverge."
    edge_case_taxon: yaml-field-name-typo

cross_language:
  go_artifacts:
    bidder_dir: adapters/adkernelAdn/
    package_name: adkernelAdn
    bidder_constant: openrtb_ext.BidderAdkernelAdn
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/adkerneladn/
    bidder_class: AdkernelAdnBidder
    config_class: AdkernelAdnConfiguration
    yaml_path: src/main/resources/bidder-config/adkerneladn.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/adkerneladn/
  port_concerns:
    aliases_inverted: false                   # No aliases on either side (independent bidder, not part of an empire)
    yaml_unification: false
    mutation_idiom_divergence: true           # Go shallow-copy-then-mutate vs Java Lombok toBuilder immutable rebuild
    package_directory_mismatch: false         # Go: package adkernelAdn in dir adkernelAdn (camelCase both). Java: package adkerneladn in dir adkerneladn (lowercase both). Cross-LANGUAGE mismatch but no INTRA-language mismatch.
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: null
    destination_language: null
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - rule-46-naming-normalization-master
      - rule-46-multi-form-internal
      - currency-propagation-java-only
      - bid-type-imp-id-correlation
      - per-pubid-grouped-batching
      - x-openrtb-version-header-casing
  go_specific_concerns:
    - "Internal Go naming asymmetry: package `adkernelAdn` (camelCase) vs test fixture root `adkerneladntest/` (LOWERCASE). The test driver references the lowercase form via `adapterstest.RunJSONBidderTest(t, \"adkerneladntest\", bidder)`. Mirrors cadent's `cadent_aperture_mxtest/` pattern."
    - "Per-pubId grouped batching: imps are bucketed by `ExtImpAdkernelAdn{PublisherID}`, one HTTP request per unique pubId. Distinct from per-imp and per-batch. Cross-language symmetric."
    - "imp.Ext = nil after extraction (strip pattern): adapter does NOT forward the prebid wrapper to AdKernel's platform. Cross-language symmetric."
    - "Currency: Go does NOT propagate `bidResponse.Cur` to BidderResponse.Currency. Java DOES forward `bidResponse.getCur()`. Cross-language asymmetry — Java-only currency propagation (same pattern as cadent_aperture_mx pair)."
    - "Bid-type imp-id correlation defaults to video (hardcoded fallback). Native bids would be miscategorized despite a `native-impression` fixture existing. Cross-language symmetric."
    - "`x-openrtb-version` header is added in lowercase (Go side); Java uses `X-OpenRTB-Version` (mixed case via HttpUtil constant). Wire-level case-insensitive, but byte comparison would diverge."
    - "URL macro syntax: Go uses `{{.PublisherID}}` (Go template dot-syntax) resolved via `macros.ResolveMacros`. Java uses `{{PublisherID}}` (plain placeholder) resolved via `String.replace`. Same effective input/output."
    - "Adapter struct field `EndpointTemplate *template.Template` (compiled at builder-time and reused). Distinct from cadent's plain `endpoint string`. Template-parsed-at-build pattern."
    - "Independent bidder (NOT alias of `adkernel`): different schema (`pubId` vs adkernel's `zoneId`), different endpoint host (`pbs2.adksrv.com` vs adkernel's `pbs.adksrv.com`), different paths (`/rtbpub` vs `/hb`). Same vendor only."
  java_specific_concerns: []
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg
