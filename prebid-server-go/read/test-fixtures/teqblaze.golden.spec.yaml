      - name: endpoint
        type: string                           # NOT *template.Template — direct string
  builder:
    signature_canonical: true
    extra_adapter_info_used: false
    template_parsed_at_build: false
    errors_returned: []
  make_requests:
    batching:
      applied_in_order: true
      rules:
        - kind: per-imp                       # Rule 10 — one HttpRequest per imp via reqCopy + reqCopy.Imp = []openrtb2.Imp{imp}
    request_body:
      kind: openrtb2-modified                 # imp.ext.bidder is REPACKED with new shape (see imp_ext_repack quirk)
      custom_body_type: null
    mutation:
      mutates_request: true
      entity_strategies:
        Imp: copy-then-mutate                 # reqCopy := *request; reqCopy.Imp = []openrtb2.Imp{imp}; reqCopy.Imp[0].Ext = impExtJSON
        Site: none
        App: none
      go_idiom: shallow-copy
      java_idiom: null
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase
      mechanism_java: null
      target_type: openrtb_ext.ImpExtTeqBlaze
      wrapper_type: null
    endpoint_resolution:
      kind: literal                           # Adapter uses raw config.Endpoint string. Aliases' YAML endpoint:s ARE the URLs; no template / no macro substitution.
      mechanism_go: literal
      mechanism_java: null
      macros_used: []
    helpers:
      - name: makeRequest
        signature: "func (a *adapter) makeRequest(request *openrtb2.BidRequest) (*adapters.RequestData, error)"
      - name: getBidType
        signature: "func getBidType(bid openrtb2.Bid) (openrtb_ext.BidType, error)"
  make_bids:
    response_type: openrtb2.BidResponse
    custom_response_type: null
    http_status_handling:
      kind: canonical-go-helpers              # adapters.IsResponseStatusCodeNoContent + adapters.CheckResponseStatusCodeForErrors
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: by-bid-mtype                # Rule 23. Go-side: banner=1, video=2, native=3 (audio NOT supported on Go side; Java does support audio=3 + native=4)
          field: bid.MType
          fallback_action: throw
      default_value: null
      multi_format_detection: strict
    bid_pointer_pattern: indexed-iteration    # `for i := range seatBid.Bid { bid := seatBid.Bid[i]; ... }` — index-based to avoid range-var aliasing
    bid_pointer_go_sibling: range-index
    currency_overwrite_safety: passthrough-from-response

