quirks:
  - id: brand-acronym-titlecase-ext-type
    file: openrtb_ext/imp_teqblaze.go
    summary: "Type name `ImpExtTeqBlaze` preserves brand-acronym TitleCase (`TeqBlaze` with capital B) despite the YAML name being lowercase `teqblaze`. Same pattern as smarthub's ExtSmartHub. Adjacent to Java edge case #27 (acronym-case preservation) but on the Go side."
    edge_case_taxon: acronym-case-preservation
  - id: imp-ext-repack-with-type-tag
    file: teqblaze.go
    line: 60
    summary: "MakeRequests REPACKS imp.ext.bidder with a new shape: `{type: publisher|network, placementId|endpointId: <value>}`. The `type` tag indicates which of the two mutually-exclusive params was supplied (placementId → publisher, endpointId → network). Output JSON shape differs from input — `params.ext_struct.fields[]` describes the input; the wire format ext is the repacked shape. Cross-language: Java side does the SAME repack via TeqblazeExtImp builder."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: white-label-only-parent
    file: static/bidder-info/teqblaze.yaml
    summary: "Parent declares `whiteLabelOnly: true` and supplies NO endpoint. Parent is non-functional; only the 10 aliases (each with own endpoint) function. Distinct from smarthub-style white-label-saas where the parent itself functions."
    edge_case_taxon: incomplete-classification

cross_language:
  go_artifacts:
    bidder_dir: adapters/teqblaze/
    package_name: teqblaze
    bidder_constant: openrtb_ext.BidderTeqBlaze
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/teqblaze/
    bidder_class: TeqblazeBidder
    config_class: TeqblazeConfiguration       # NOTE: lives in spring/config/bidder/util/ NOT spring/config/bidder/ (location anomaly — only Java config in util/ subpackage today)
    yaml_path: src/main/resources/bidder-config/teqblaze.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/teqblaze/
  port_concerns:
    aliases_inverted: true                    # Java parent.aliases[10 entries] vs Go per-alias YAMLs — Rule 33
    yaml_unification: false
    mutation_idiom_divergence: true           # Java imp.toBuilder() vs Go shallow-copy + index-based ext replacement
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: prebid/prebid-server-java#4161
    destination_language: null
    destination_pr: prebid/prebid-server#4480
    fidelity_review_themes:
      - port-fidelity
      - alias-empire-white-label-saas
      - imp-ext-repack
      - first-imp-extraction-anti-pattern
  go_specific_concerns:
    - "Adapter struct holds raw `endpoint string`, not `*template.Template`. Builder does NO template parsing — it stores config.Endpoint verbatim and returns. Aliases supply their own endpoints in static/bidder-info/<alias>.yaml; the parent endpoint is empty (whiteLabelOnly: true)."
    - "MakeRequests REPACKS imp.ext.bidder per imp: input shape is `{placementId | endpointId}`; output (wire) shape is `{bidder: {type: publisher|network, placementId|endpointId: <value>}}`. The `type` field is a derived classification, not present on input. Repacked JSON is written into reqCopy.Imp[0].Ext (line 71)."
    - "Per-imp split via `reqCopy := *request; reqCopy.Imp = []openrtb2.Imp{imp}` — shallow-copies the BidRequest struct, then assigns a fresh single-imp slice. Slice/pointer fields (Source, Site, App, Device, User) still alias the original framework's underlying memory until reassigned."
    - "Bid type resolution supports banner=1, video=2, native=3 (Go's openrtb2.MarkupNative is constant 4 but adapter code uses the canonical enum constants). Adapter does NOT support audio (no MarkupAudio case)."
    - "10 aliases declared via separate Go YAMLs (360playvid, pinkLion, rocketlab, appStockSSP, gravite, bidfuse, adsinteractive, progx, harion, mycodemedia). 360playvid is digit-leading — Java side has the same alias name, but Java's class-naming rules require `Threehundredsixtyplayvid`-style spellout for any class root (Rule 46 digit-leading-workaround case; appStockSSP also has Rule 15 deploy-time-token `#{REGION}#`)."
  java_specific_concerns: []
