quirks:
  - id: legacy-impext-naming
    file: openrtb_ext/imp_adverxo.go
    summary: "Type name `ImpExtAdverxo` (legacy `ImpExt*`) instead of newer `ExtImp*` form. Existing-adapter convention; no rename PR."
    edge_case_taxon: legacy-impext-naming
  - id: bid-post-processing-macro
    file: adverxo.go
    line: 0
    summary: "resolveMacros / getNativeAdm replace `${AUCTION_PRICE}` macro in bid.AdM with the actual bid price after bid type classification — bid-post-processing pattern (ADR-007 F4)."
    edge_case_taxon: bid-post-processing-macro

cross_language:
  go_artifacts:
    bidder_dir: adapters/adverxo/
    package_name: adverxo
    bidder_constant: openrtb_ext.BidderAdverxo
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/adverxo/
    bidder_class: AdverxoBidder
    config_class: AdverxoBidderConfiguration  # Java edge case #19 — alternate `<Name>BidderConfiguration` form (vs `<Name>Configuration`)
    yaml_path: src/main/resources/bidder-config/adverxo.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/adverxo/
  port_concerns:
    aliases_inverted: true                    # Java declares parent.aliases[]; Go declares per-alias YAMLs with aliasOf — Rule 33
    yaml_unification: false                   # Go-source spec; Java-source counterpart sets true
    mutation_idiom_divergence: true           # Go in-place + shallow-copy ↔ Java immutable-rebuild (Rule 5)
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: go
    source_pr: prebid/prebid-server#3705      # Adverxo establish PR; Java side #3705 in references list
    destination_language: java
    destination_pr: prebid/prebid-server-java#3705
    fidelity_review_themes:
      - port-fidelity
      - currency-conversion-bidrequest-context
      - mutation-idiom-tobuilder
      - alias-empire-registration-only
      - bid-post-processing-macro
  go_specific_concerns:
    - "Builder uses text/template parsed at construction time (line 25). The template is reused across all MakeRequests calls — see Rule 11 mechanism `text/template`."
    - "Per-imp endpoint resolution: each imp's adUnitId + auth produce a distinct endpoint URL via macros.ResolveMacros (line 175). Multi-imp callers receive multiple HTTP requests."
    - "Currency conversion uses `requestInfo.ConvertCurrency(value, from, to)` (3-arg, no bidRequest). Java side uses 4-arg `currencyConversionService.convertCurrency(value, bidRequest, from, to)` for time-context — canonical Rule 32 cross-language asymmetry."
    - "MakeBids uses legacy raw status checks (StatusCode == http.StatusNoContent / != http.StatusOK at lines 88-100) instead of canonical adapters.IsResponseStatusCodeNoContent / adapters.CheckResponseStatusCodeForErrors helpers."
    - "Bid AdM macro replacement: resolveMacros() replaces `${AUCTION_PRICE}` after bid-type classification (line 121). For native bids, getNativeAdm() ALSO replaces `${AUCTION_PRICE}` defensively — double-replacement is benign but unusual."
    - "Range-with-shadowing pattern at line 116: `for _, bid := range seatBid.Bid { bid := bid; ... }` — explicit re-binding to capture pointer correctly inside the loop body. Modern Go (1.22+) loop-var semantics make the shadowing redundant but the code targets older versions."
  java_specific_concerns: []                  # populated on Java-source spec
