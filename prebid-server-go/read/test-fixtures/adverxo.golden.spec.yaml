code:
  package_or_class: adverxo
  directory_name: adverxo
  package_directory_mismatch: false
  file_layout:
    kind: single-file
    files:
      - name: adverxo.go
        role: implementation
        loc: 215
  imports:
    has_template_engine: true                 # text/template
    has_currency_helper: true
    has_jsonutil: false
    third_party:
      - github.com/buger/jsonparser
      - github.com/prebid/openrtb/v20/openrtb2
  adapter_struct:
    type_name: adapter
    type_visibility: unexported
    fields:
      - name: endpointTemplate
        type: "*template.Template"
  builder:
    signature_canonical: true
    extra_adapter_info_used: false
    template_parsed_at_build: true            # text/template parsed in Builder
    errors_returned:
      - "unable to parse endpoint url template: %v"
  make_requests:
    batching:
      applied_in_order: true
      rules:
        - kind: per-imp                       # Rule 10 — one HTTP request per imp
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
    mutation:
      mutates_request: true
      entity_strategies:
        Imp: in-place                         # modifyImp(&imp, ...) writes to value-copied imp
        Cur: none
      go_idiom: shallow-copy                  # makeRequestCopyWithImp does *request shallow copy
      java_idiom: null
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase        # Rule 1 — adapters.ExtImpBidder → openrtb_ext.ImpExtAdverxo
      mechanism_java: null
      target_type: openrtb_ext.ImpExtAdverxo
      wrapper_type: null
    endpoint_resolution:
      kind: multi-token-substitution
      mechanism_go: text/template
      mechanism_java: null
      macro_field_set:
        - AdUnit
        - TokenID
      template_params_struct_field_count: 2
    helpers:
      - name: getAdUnitsParams
        signature: "func getAdUnitsParams(imp openrtb2.Imp) (*openrtb_ext.ImpExtAdverxo, error)"
      - name: modifyImp
        signature: "func modifyImp(imp *openrtb2.Imp, requestInfo *adapters.ExtraRequestInfo) error"
      - name: makeRequestCopyWithImp
        signature: "func makeRequestCopyWithImp(request *openrtb2.BidRequest, imp openrtb2.Imp) openrtb2.BidRequest"
      - name: buildEndpointURL
        signature: "func (adapter *adapter) buildEndpointURL(params *openrtb_ext.ImpExtAdverxo) (string, error)"
      - name: getMediaTypeForBid
        signature: "func getMediaTypeForBid(bid *openrtb2.Bid) (openrtb_ext.BidType, error)"
      - name: getNativeAdm
        signature: "func getNativeAdm(adm string) (string, error)"
      - name: resolveMacros
        signature: "func resolveMacros(bid *openrtb2.Bid)"
  make_bids:
    response_type: openrtb2.BidResponse
    custom_response_type: null
    http_status_handling:
      kind: legacy-raw-go                     # explicit StatusNoContent + != StatusOK checks (lines 90-100)
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: by-bid-mtype                # Rule 23
          field: bid.MType
          fallback_action: throw
      default_value: null
      multi_format_detection: strict
    bid_pointer_pattern: pointer-iteration    # `for _, bid := range seatBid.Bid { bid := bid; ... }` — explicit shadowing
    bid_pointer_go_sibling: range-value-shadow
    currency_overwrite_safety: passthrough-from-response

