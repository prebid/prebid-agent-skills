quirks:
  - id: brand-acronym-titlecase-ext-type
    file: openrtb_ext/imp_smarthub.go
    summary: "Type name `ExtSmartHub` preserves brand-acronym TitleCase (`SmartHub`) despite the YAML name being lowercase `smarthub`. Other adapters use `ExtImp{Bidder}` or `ImpExt{Bidder}` form. Edge case adjacent to Java edge case #27 (acronym-case preservation) but on the Go side."
    edge_case_taxon: acronym-case-preservation
  - id: first-imp-only-extraction
    file: smarthub.go
    line: 79
    summary: "MakeRequests reads imp.ext from openRTBRequest.Imp[0] only — multi-imp callers' subsequent imps are ignored for endpoint resolution and ext-extraction. The whole BidRequest is still passed through to the bidder, but the auth token comes from the first imp."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: first-bid-only-extraction
    file: smarthub.go
    line: 165
    summary: "MakeBids returns ONLY the first bid from seatBid[0].Bid[0]. Subsequent bids in the array are silently dropped. Also takes seatBid[0] only — multi-seatbid responses are partially ignored."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: rebrand-in-progress
    file: static/bidder-info/smarthub.yaml
    summary: "JSON schema title says `Attekmi (formerly SmartHub)`; endpoint host is `prebid.attekmi.com`; maintainer email is `prebid@attekmi.com`. The YAML name + adapter package + bidder constant remain `smarthub`/`SmartHub`. SmartHub→Attekmi rebrand is partially propagated (referenced in ADR-003 and Java PR #3699); the YAML rename has not yet landed upstream."
    edge_case_taxon: bidder-rename-three-step

cross_language:
  go_artifacts:
    bidder_dir: adapters/smarthub/
    package_name: smarthub
    bidder_constant: openrtb_ext.BidderSmartHub
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/smarthub/
    bidder_class: SmarthubBidder
    config_class: SmarthubConfiguration       # Canonical `<Name>Configuration` form (vs adverxo's `<Name>BidderConfiguration` alternate)
    yaml_path: src/main/resources/bidder-config/smarthub.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/smarthub/
  port_concerns:
    aliases_inverted: true                    # Java parent.aliases[markapp,jdpmedia,…] vs Go per-alias YAMLs — Rule 33
    yaml_unification: false
    mutation_idiom_divergence: false          # Neither side mutates request entities (request_body: passthrough on Go, similar on Java)
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: prebid/prebid-server-java#1442
    destination_language: null
    destination_pr: prebid/prebid-server#1932
    fidelity_review_themes:
      - port-fidelity
      - alias-empire-white-label-saas
      - parent-rebrand-in-progress
      - first-imp-extraction-anti-pattern
  go_specific_concerns:
    - "Builder uses text/template parsed at construction time (line 31). Template reused across MakeRequests calls — Rule 11 mechanism `text/template`."
    - "MakeRequests extracts bidder ext from openRTBRequest.Imp[0] ONLY (line 79). Multi-imp callers' subsequent imps are sent through to the bidder but their ext is ignored for endpoint resolution. Single-batched + first-imp-only-extraction pattern."
    - "MakeBids returns ONLY bids[0] from seatBid[0] (line 175). Subsequent bids are silently dropped. Adapters that legitimately return multiple bids per request would be incompatible."
    - "Custom HTTP header `Prebid-Adapter-Ver: 1.0.0` is hardcoded const (line 21). Java side uses the same constant string but in a private method literal, not a top-level const."
    - "JSON schema title and description reference `Attekmi (formerly SmartHub)`; the endpoint host is `prebid.attekmi.com`. The bidder package, YAML name, and Go bidder constant (BidderSmartHub) remain `smarthub`/`SmartHub`. SmartHub→Attekmi rebrand IS underway but the YAML rename hasn't landed upstream — see ADR-003 and Java PR #3699."
    - "9 aliases on Java side (markapp, jdpmedia, tredio, felixads, jambojar, adinify, artechnology, addigi, radianfusion) — each declares its own SaaS-host endpoint. Go side mirrors this via 9 separate static/bidder-info/<name>.yaml files with `aliasOf: smarthub`. White-label-saas empire flavor canonical (ADR-003 Rule 44)."
    - "Note: 1 of 9 aliases (jdpmedia) ships its IT fixture dir on Java side but does NOT have a corresponding JdpmediaTest.java IT class. Other 8 aliases all have IT classes. Inconsistency surfaces as `incomplete-classification` quirk on the alias spec."
  java_specific_concerns: []
