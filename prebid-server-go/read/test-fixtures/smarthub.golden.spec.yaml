code:
  package_or_class: smarthub
  directory_name: smarthub
  package_directory_mismatch: false
  file_layout:
    kind: single-file
    files:
      - name: smarthub.go
        role: implementation
        loc: 187
  imports:
    has_template_engine: true                 # text/template
    has_currency_helper: false                # Smarthub does NOT use currency conversion
    has_jsonutil: true                        # uses prebid-server/v4/util/jsonutil (newer)
    third_party:
      - github.com/prebid/openrtb/v20/openrtb2
  adapter_struct:
    type_name: adapter
    type_visibility: unexported
    fields:
      - name: endpoint
        type: "*template.Template"
  builder:
    signature_canonical: true
    extra_adapter_info_used: false
    template_parsed_at_build: true
    errors_returned:
      - "unable to parse endpoint url template: %v"
  make_requests:
    batching:
      applied_in_order: true
      rules:
        - kind: single-batched                # All imps in one HTTP request — but params extracted from openRTBRequest.Imp[0] only (multi-imp callers ignored after [0])
    request_body:
      kind: openrtb2-passthrough              # request marshaled directly without imp mutation
      custom_body_type: null
    mutation:
      mutates_request: false
      entity_strategies:
        Imp: none
        Site: none
        App: none
        Source: none
        Device: none
        User: none
        Cur: none
      go_idiom: none
      java_idiom: null
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: jsonutil-two-phase        # Rule 1 — adapters.ExtImpBidder → openrtb_ext.ExtSmartHub
      mechanism_java: null
      target_type: openrtb_ext.ExtSmartHub
      wrapper_type: null
    endpoint_resolution:
      kind: multi-token-substitution
      mechanism_go: text/template
      mechanism_java: null
      macros_used:
        - Host
        - AccountID
        - SourceId
      template_params_struct_field_count: 3
    helpers:
      - name: getImpressionExt
        signature: "func (a *adapter) getImpressionExt(imp *openrtb2.Imp) (*openrtb_ext.ExtSmartHub, error)"
      - name: buildEndpointURL
        signature: "func (a *adapter) buildEndpointURL(params *openrtb_ext.ExtSmartHub) (string, error)"
      - name: getBidType
        signature: "func getBidType(ext bidExt) (openrtb_ext.BidType, error)"
  make_bids:
    response_type: openrtb2.BidResponse
    custom_response_type: null
    http_status_handling:
      kind: legacy-raw-go                     # Explicit per-status handling: 204 (no content), 400 (BadInput), 503 (BadInput), other non-200 (BadServerResponse)
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: by-bid-ext-typed-field      # Rule 24 — extracts bidExt.MediaType from bid.ext, then ParseBidType
          field: bid.ext.mediaType
          fallback_action: throw
      default_value: null
      multi_format_detection: none            # Smarthub takes only bids[0] from seatBid[0] — single-bid extraction
    bid_pointer_pattern: indexed-iteration    # `bid := bids[0]` — first-bid-only pattern (NOT iterating)
    bid_pointer_go_sibling: first-bid-only
    currency_overwrite_safety: passthrough-from-response

