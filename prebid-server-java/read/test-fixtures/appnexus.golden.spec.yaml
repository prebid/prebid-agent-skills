      type: int
      value: "5"
    - name: AD_POSITION_ABOVE_THE_FOLD
      type: int
      value: "1"
    - name: AD_POSITION_BELOW_THE_FOLD
      type: int
      value: "3"
    - name: POD_SEPARATOR
      type: String
      value: '"_"'
    - name: MAX_IMP_PER_REQUEST
      type: int
      value: "10"
    - name: KEYWORDS_OBJECT_TYPE_REFERENCE
      type: "TypeReference<Map<String, List<String>>>"
    - name: KEYWORDS_ARRAY_TYPE_REFERENCE
      type: "TypeReference<List<AppnexusKeyVal>>"
