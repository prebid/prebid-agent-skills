  parameterized_request_type: BidRequest
  parameterized_response_type: null
  override_methods:
    - makeHttpRequests
    - makeBids
  constructor:
    arity: 4
    parameters:
      - name: endpointUrl
        type: String
        source: config-field
        role: properties
        notes:
          - "Validated via HttpUtil.validateUrl; throws IllegalArgumentException at bean construction (covered by creationShouldFailOnInvalidEndpointUrl test)."
      - name: platformId
        type: Integer
        source: config-field
        role: properties
        notes:
          - "Stored as `headerBiddingSource` (renamed) with default 5; participates in ext.appnexus.hb_source computation."
      - name: iabCategories
        type: "Map<Integer, String>"
        source: config-field
        role: properties
        notes:
          - "Inlined ~95-entry map from bidder-config/appnexus.yaml; default Collections.emptyMap() when null."
      - name: mapper
        type: JacksonMapper
        source: framework-injected
        role: helper-collaborator
