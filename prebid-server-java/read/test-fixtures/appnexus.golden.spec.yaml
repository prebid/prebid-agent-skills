      - jakarta.validation.ValidationException
  adapter_struct: null
  builder: null
  make_requests:
    batching:
      applied_in_order: true
      rules:
        - kind: pod-grouping
          key: imp.id-prefix-before-underscore
          notes:
            - "Only fires when extractEndpointName(bidRequest) == openrtb2_video AND every imp's ext.bidder.appnexus.generateAdPodId is true (validated uniform via SameValueValidator<Boolean>)."
            - "groupImpsByPod splits imps by StringUtils.substringBefore(imp.id, '_'); each pod has a fresh adpod_id (Long.toUnsignedString(ThreadLocalRandom.current().nextLong())) written into ext.appnexus.adpod_id."
            - "Each pod is then individually fed to splitHttpRequests, so size-split happens INSIDE each pod group."
        - kind: max-imps-per-request
          max: 10
          notes:
            - "MAX_IMP_PER_REQUEST = 10; ListUtils.partition(imps, 10) divides imps into chunks of 10 each."
            - "Default path: splitHttpRequests(updatedBidRequest, updatedImps, url). Pod path: splitHttpRequests called per-pod."
            - "Composes AFTER pod-grouping: pods are formed first, then each pod's imps are sliced into batches of <=10."
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
    mutation:
      mutates_request: false
      entity_strategies:
        Imp: immutable-rebuild
        Banner: immutable-rebuild
        Source: immutable-rebuild
        Ext: immutable-rebuild
      go_idiom: null
      java_idiom: lombok-tobuilder
      schain_mutation: null
      fields_mutated:
        - imp.tagid (when invCode present)
        - imp.bidfloor (when imp.bidfloor invalid AND extImp.reserve valid)
        - imp.banner (toBuilder rebuild with pos + w/h promotion)
        - imp.displaymanagerver (filled from app.ext.prebid.{source}-{version} when blank)
        - imp.ext (replaced with AppnexusImpExt(AppnexusImpExtAppnexus, gpid))
        - bidRequest.source (toBuilder rebuild dropping ExtSource.schain field while preserving other ext properties)
        - bidRequest.ext (re-built ExtRequest carrying schain promoted to top-level + appnexus key)
      schain_movement:
        from: bidRequest.source.ext.schain
        to: bidRequest.ext.schain
        helper: AppnexusBidder.updateBidRequest + updateSource + updateExtRequest
        notes:
          - "supplyChain(source) returns source.ext.schain via Optional chain; if non-null, source.toBuilder().ext(non-schain-properties-only-or-null).build() is rebuilt and the schain JsonNode is added as a property of the request-level ExtRequest via updatedExtRequest.addProperty(\"schain\", ...)."
          - "Mirrors Go-side moveSupplyChain (Go appnexus.go:461). OpenRTB 2.4→2.6 schain location migration."
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: null
      mechanism_java: typeref-custom-wrapper
      target_type: AppnexusExtImp
      wrapper_type: AppnexusExtImp
      notes:
        - "AppnexusBidder.parseImpExt() uses mapper.mapper().convertValue(imp.getExt(), AppnexusExtImp.class) — single pass."
        - "AppnexusExtImp { bidder: ExtImpAppnexus, gpid: String } combines the standard ExtImpBidder.bidder unmarshal AND a sibling 'gpid' field; structurally still standard-two-phase but mechanically single convertValue call."
        - "Java analog of Go's adapter-local impExtIncoming wrapper."
    endpoint_resolution:
      kind: query-parameter-augmentation
      mechanism_go: null
      mechanism_java: URIBuilder
      macro_field_set: []
      template_params_struct_field_count: null
      notes:
        - "Member ID extracted from imp.ext.bidder.member (validated to be uniform via SameValueValidator<String>) is appended via new URIBuilder(endpointUrl).addParameter(\"member_id\", member).build().toString()."
        - "All imps in a single request must share the same member_id; mismatch throws ValidationException → entire request aborts via Result.withErrors(errors)."
    helpers:
      - name: defaultDisplayManagerVer
        signature: "private String defaultDisplayManagerVer(BidRequest bidRequest)"
      - name: parseImpExt
        signature: "private AppnexusExtImp parseImpExt(Imp imp)"
      - name: validateExtImpAppnexus
