  factory_method: appnexusBidderDeps
  property_source_path: classpath:/bidder-config/appnexus.yaml
  bidder_creator_lambda: |
    config -> new AppnexusBidder(
            config.getEndpoint(),
            appnexusConfigurationProperties.getPlatformId(),
            appnexusConfigurationProperties.getIabCategories(),
            mapper)
  configuration_properties_class:
    name: AppnexusConfigurationProperties
    extends: BidderConfigurationProperties
    visibility: private-static-inner
    declared_in: AppnexusConfiguration.java
    extra_fields:
      - name: platformId
        type: Integer
        yaml_field: platform-id
        validations: []
        notes:
          - "Defaults to 5 in AppnexusBidder constructor (DEFAULT_PLATFORM_ID) when null via ObjectUtils.defaultIfNull(platformId, DEFAULT_PLATFORM_ID)."
          - "Stored on the adapter as headerBiddingSource; emitted into ext.appnexus.hb_source as headerBiddingSource + (isVideo ? 1 : 0)."
      - name: iabCategories
        type: "Map<Integer, String>"
        yaml_field: iab-categories
        validations: []
        notes:
          - "Inlined map of ~95 numeric Appnexus brand-category IDs to IAB-tier strings."
          - "Defaulted to Collections.emptyMap() in AppnexusBidder constructor when null."
          - "Used by bidCategories(): looks up appnexus.brandCategoryId; if found, sets bid.cat = [iab]; otherwise empty list (forces bid rejection downstream)."
    nested_classes: []
    lombok_annotations:
      - Data
      - "EqualsAndHashCode(callSuper = true)"
      - NoArgsConstructor
  bean_dependencies:
    - name: appnexusConfigurationProperties
      type: AppnexusConfigurationProperties
      source: framework-injected
    - name: externalUrl
      type: String
      source: "@Value(${external-url})"
      validations:
        - "@NotBlank"
    - name: mapper
      type: JacksonMapper
      source: framework-injected

bidder_class:
