params:
  schema_interpretation:
    properties:
      - name: placement_id
        type: ["integer", "string"]
        description: "An ID which identifies this placement of the impression"
      - name: placementId
        type: ["integer", "string"]
        description: "Deprecated, use placement_id instead."
      - name: inv_code
        type: string
        description: "A code identifying the inventory of this placement."
      - name: invCode
        type: string
        description: "Deprecated, use inv_code instead."
      - name: member
        type: ["integer", "string"]
        description: "An ID which identifies the member selling the impression."
      - name: keywords
        type: anyOf
        description: "Keywords expressed as string ('k=v,k2=v2'), array of {key, value[]} objects, or object with array values. AppnexusBidder.readKeywords() branches at runtime via JsonNode.isObject/isArray/isTextual; ExtImpAppnexus.keywords is JsonNode (no Jackson deserializer needed)."
      - name: traffic_source_code
        type: string
        description: "Specifies the third-party source of this impression."
      - name: trafficSourceCode
        type: string
        description: "Deprecated, use traffic_source_code instead."
      - name: reserve
        type: number
        description: "The minimium acceptable bid, in CPM, using US Dollars"
      - name: position
        type: string
        description: "Specifies the ad unit as above or below the fold"
        constraints:
          enum: [above, below]
      - name: use_pmt_rule
        type: boolean
        description: "Boolean to signal AppNexus to apply the relevant payment rule"
      - name: use_payment_rule
        type: boolean
        description: "Deprecated, Boolean to signal AppNexus to apply the relevant payment rule. use_pmt_rule will get precedence over usePaymentRule."
      - name: generate_ad_pod_id
        type: boolean
        description: "Boolean to signal AppNexus to add ad pod id to each request"
      - name: private_sizes
        type: array
        description: "Private sizes (ex: [{\"w\": 300, \"h\": 250},{...}]), experimental, may not be supported."
      - name: ext_inv_code
        type: string
        description: "Specifies predefined value passed on the query string that can be used in reporting"
      - name: external_imp_id
        type: string
        description: "Unique identifier of an externally generated auction"
    required_fields: []
    flexible_types:
      - placement_id
      - placementId
      - member
      - keywords
    combinators_used:
      - oneOf
      - oneOf-of-oneOf
      - anyOf
      - not
      - json-aliases-present
  ext_struct:
    package: org.prebid.server.proto.openrtb.ext.request.appnexus
    file: src/main/java/org/prebid/server/proto/openrtb/ext/request/appnexus/ExtImpAppnexus.java
    type_name: ExtImpAppnexus
    fields:
      - name: placementId
        json_tag: placement_id
        type_native: Integer
        omitempty: false
        notes:
          - "@JsonAlias(\"placementId\") provides legacy camelCase compatibility"
          - "primary tag is implicit snake_case via Jackson default; Lombok @Value field name maps to placement_id by Jackson naming strategy convention used in this codebase (verbatim Java field is placementId)"
      - name: invCode
        json_tag: inv_code
        type_native: String
        omitempty: false
        notes:
          - "@JsonAlias(\"invCode\") legacy alias"
      - name: member
        json_tag: member
        type_native: String
        omitempty: false
        notes: []
      - name: keywords
        json_tag: keywords
        type_native: JsonNode
        omitempty: false
        notes:
          - "Raw JsonNode; runtime polymorphism handled in AppnexusBidder.readKeywords() via JsonNode.isObject()/isArray()/isTextual() branching"
          - "Per port-translation Rule 6, this is the runtime-isobject-isarray-branching pattern (no Jackson @JsonDeserialize class)"
      - name: trafficSourceCode
        json_tag: traffic_source_code
        type_native: String
        omitempty: false
        notes:
          - "@JsonAlias(\"trafficSourceCode\") legacy alias"
      - name: reserve
        json_tag: reserve
        type_native: BigDecimal
        omitempty: false
        notes:
          - "feeds imp.bidfloor only when imp.BidFloor is invalid (non-positive); USD-only assumption"
      - name: position
        json_tag: position
        type_native: String
        omitempty: false
        notes:
          - 'enum {"above","below"}; mapped via switch to AD_POSITION_ABOVE_THE_FOLD (1) / AD_POSITION_BELOW_THE_FOLD (3)'
      - name: usePaymentRule
        json_tag: use_pmt_rule
        type_native: Boolean
        omitempty: false
        notes:
          - "@JsonProperty(\"use_pmt_rule\") + @JsonAlias(\"use_payment_rule\") — preference: use_pmt_rule takes precedence over use_payment_rule"
      - name: privateSizes
        json_tag: private_sizes
        type_native: JsonNode
        omitempty: false
        notes:
          - "passed through verbatim — adapter does not parse"
      - name: generateAdPodId
        json_tag: generate_ad_pod_id
        type_native: boolean
        omitempty: false
        notes:
          - "primitive boolean; default false; drives makePodRequests path on video endpoint"
      - name: extInvCode
        json_tag: ext_inv_code
        type_native: String
        omitempty: false
        notes: []
      - name: externalImpId
        json_tag: external_imp_id
        type_native: String
        omitempty: false
        notes: []
    custom_unmarshal: false
