iab_category_storage:
  storage_kind: yaml-inlined
  yaml_field: iab-categories
  go_data_file: null
  table_size: 95
  delivery_mechanism: constructor-arg
  notes:
    - "Map<Integer, String> keys are numeric Appnexus brand-category IDs; values are IAB-tier strings (e.g., 1 -> IAB20-3)."
    - "YAML key sequence is sparse (skips e.g. 40, 44-49, 54, 70, 72, 75-77, 79-84, 88-111, 116-117, 128-131, 134-136, 139, 144-165, 167-174, 177-181)."
    - "Spring binds the YAML iab-categories block under adapters.appnexus.iab-categories into AppnexusConfigurationProperties.iabCategories via @ConfigurationProperties(\"adapters.appnexus\")."
    - "Adapter receives this map by constructor injection (not static-init) — distinct from Go MSFT's go-data-table package-level var."
    - "Cross-language note: Go side has no equivalent table for Appnexus; Go Appnexus uses a co-located iab_categories.go data table that is byte/value-equivalent to this YAML map (count parity required across languages)."

ext_pojo_construction:
  framework_choice: lombok-value-builder
  flexible_extension_used: false
  custom_unmarshal:
    kind: runtime-isobject-isarray-branching
    accepts_shapes:
      - string
      - object
      - array
    where_branched: bidder-class
    notes:
      - "ExtImpAppnexus.keywords is typed as raw JsonNode (no @JsonDeserialize, no separate Deserializer class)."
      - "Branching lives in AppnexusBidder.readKeywords() which inspects keywords.isObject()/isArray()/isTextual() at runtime."
      - "Object form: convertValue to TypeReference<Map<String, List<String>>>, joined as 'k=v1,k=v2,...' (or just 'k' when value list empty)."
      - "Array form: convertValue to TypeReference<List<AppnexusKeyVal>>, same comma-joined format."
      - "String form: keywords.textValue() returned verbatim."
      - "Throws PreBidException(\"'keywords' field has the wrong type.\") when JsonNode is none of object/array/text."
      - "This is the canonical Java pattern in the codebase that avoids a separate JsonDeserializer<ExtImpAppnexusKeywords> class — diverges from the Go canonical custom-UnmarshalJSON pattern. See cross-language port concerns."

currency_conversion:
  used: false
  helper:
    go_signature: null
    java_signature: null
  injection: null
  bid_request_passed_for_context: false

headers_constructed:
  pre_built_in_constructor: false
  per_request_dynamic: true
  custom_headers:
    - name: Content-Type
      value: "application/json;charset=utf-8"
    - name: Accept
      value: "application/json"
  authentication_kind: none
  authentication_input: []
  notes:
    - "Headers populated by BidderUtil.defaultRequest(...) in AppnexusBidder.createHttpRequest — Content-Type and Accept come from framework default."

deploy_time_tokens: []

quirks:
  - id: configuration-properties-subclass-with-platform-id-and-iab-categories
    file: src/main/java/org/prebid/server/spring/config/bidder/AppnexusConfiguration.java
    summary: "AppnexusConfiguration declares a private static inner class AppnexusConfigurationProperties extends BidderConfigurationProperties with two extra fields: Integer platformId (binds YAML 'platform-id') and Map<Integer, String> iabCategories (binds YAML 'iab-categories', ~95 entries inlined). The subclass uses @Data + @EqualsAndHashCode(callSuper=true) + @NoArgsConstructor and is referenced explicitly by bean type in the @Bean factory. Both fields are passed by config-field injection into AppnexusBidder constructor."
    edge_case_taxon: spring-config-properties-subclass
  - id: iab-categories-inlined-in-bidder-config-yaml
    file: src/main/resources/bidder-config/appnexus.yaml
    summary: "iab-categories: is a 95-entry Map<Integer, String> inlined directly in adapters/appnexus/bidder-config YAML (ids 1..183 sparse), bound into AppnexusConfigurationProperties.iabCategories. Cross-language divergence: Go-side appnexus uses a co-located iab_categories.go go-data-table at adapters/appnexus/iab_categories.go with a 95-entry package-level map literal — same data, different storage_kind."
    edge_case_taxon: yaml-inlined-data-table
  - id: keywords-runtime-isobject-isarray-branching
    file: src/main/java/org/prebid/server/bidder/appnexus/AppnexusBidder.java
    summary: "AppnexusBidder.readKeywords() folds keywords field (JsonNode) into a 'k=v,k2=v2' string by branching on JsonNode.isObject/isArray/isTextual. ExtImpAppnexus.keywords is plain JsonNode — there is no separate Jackson JsonDeserializer<ExtImpAppnexusKeywords> class. Diverges from the port-translation Rule 6 default (which would suggest jackson-jsondeserialize); this codebase uses runtime-isobject-isarray-branching instead, keeping branching co-located in the bidder rather than in a deserializer class."
    edge_case_taxon: runtime-polymorphism-bidder-class
  - id: composable-batching-pod-grouping-and-max-imps
    file: src/main/java/org/prebid/server/bidder/appnexus/AppnexusBidder.java
    summary: "Two composed batching rules: (1) when extractEndpointName == openrtb2_video AND every imp's generateAdPodId is true, groupImpsByPod groups by StringUtils.substringBefore(imp.id, '_') and writes a fresh adpod_id (Long.toUnsignedString(ThreadLocalRandom.current().nextLong())) into ext.appnexus.adpod_id per pod; (2) inside each group (or default path), splitHttpRequests via ListUtils.partition(imps, MAX_IMP_PER_REQUEST=10) slices into <=10-imp batches. Spec lists rules in apply-order: pod-grouping then max-imps-per-request."
    edge_case_taxon: incomplete-classification
  - id: imp-ext-wrapper-folds-gpid-into-single-pass
    file: src/main/java/org/prebid/server/bidder/appnexus/AppnexusBidder.java
    summary: "AppnexusExtImp { ExtImpAppnexus bidder; String gpid } is the adapter-local DTO unmarshalled by parseImpExt() in a single mapper.convertValue(imp.getExt(), AppnexusExtImp.class) call — combines what would normally be two phases (TypeReference<ExtPrebid<ExtImpPrebid, ExtImpAppnexus>> followed by separate gpid extraction) into one. Mechanically single-pass, semantically still standard-two-phase. Java mirror of Go's adapter-local impExtIncoming wrapper."
    edge_case_taxon: incomplete-classification
  - id: schain-source-to-request-ext-relocation
    file: src/main/java/org/prebid/server/bidder/appnexus/AppnexusBidder.java
    summary: "updateBidRequest + updateSource + updateExtRequest implement the OpenRTB 2.4→2.6 schain location migration: pull source.ext.schain via supplyChain(source); rebuild bidRequest.source via toBuilder() with ext rewritten to drop the schain key (set ext null when properties is empty); rebuild bidRequest.ext via makeCopyOrNew + addProperty(\"schain\", ...). Mirrors Go-side moveSupplyChain (appnexus.go:461)."
    edge_case_taxon: port-fidelity-divergence
  - id: bid-type-by-numeric-bid-ad-type
    file: src/main/java/org/prebid/server/bidder/appnexus/AppnexusBidder.java
    summary: "AppnexusBidder.bidType() switches on bid.ext.appnexus.bid_ad_type integer (0=banner, 1=video, 3=xNative; note 2 is skipped). Throws PreBidException(\"Unrecognized bid_ad_type in response from appnexus: <n>\") on unknown value, which is captured into BidderError.badServerResponse downstream. Uses by-bid-ext-typed-field with throw fallback — no chain, no default. Matches Go side."
    edge_case_taxon: port-fidelity-divergence
  - id: empty-bid-cat-on-unknown-iab-or-multi-cat
    file: src/main/java/org/prebid/server/bidder/appnexus/AppnexusBidder.java
    summary: "bidCategories(bid, appnexus) looks up iabCategories.get(appnexus.brandCategoryId); if found returns singletonList(iab). Otherwise returns the original bid.cat IF it has size <=1, otherwise emptyList() — the empty-list case is intentional to force downstream rejection (comment: 'create empty categories array to force bid to be rejected'). Cross-language port note: matches Go-side findIabCategoryForBid behavior in spirit."
    edge_case_taxon: incomplete-classification
  - id: pre-validation-throws-validationexception-aborts-request
    file: src/main/java/org/prebid/server/bidder/appnexus/AppnexusBidder.java
    summary: "validateExtImpAppnexus throws ValidationException for two cross-imp consistency violations: (a) member ID mismatch across imps via SameValueValidator<String>, and (b) generateAdPodId disagreement across imps via SameValueValidator<Boolean>. ValidationException is caught at the imp-loop level and triggers Result.withErrors(errors) — the ENTIRE request is aborted, NOT just the offending imp (PreBidException merely accumulates errors and skips that imp). This is a finer-grained error semantic than typical adapters."
    edge_case_taxon: incomplete-classification
  - id: imp-banner-pos-and-format-promotion
    file: src/main/java/org/prebid/server/bidder/appnexus/AppnexusBidder.java
    summary: "updateBanner performs Banner toBuilder rebuild: (a) maps ext.bidder.position 'above'/'below' to AD_POSITION_ABOVE_THE_FOLD (1) / AD_POSITION_BELOW_THE_FOLD (3) via switch, (b) when banner.W and banner.H are both null and banner.format is non-empty, promotes the first format's W/H to top-level. Rule 7 banner-format-dimension-promotion. The rebuild is short-circuited (returns input banner unchanged) when neither condition triggers."
    edge_case_taxon: incomplete-classification
  - id: alias-mediafuse-with-only-maintainer-override
    file: src/main/resources/bidder-config/appnexus.yaml
    summary: "appnexus.yaml declares aliases.mediafuse with only meta-info.maintainer-email overridden (support@mediafuse.com). No separate MediafuseConfiguration / MediafuseBidder classes exist — mediafuse is a YAML-only alias; the framework synthesizes the bidder via the parent appnexus configuration. parent_aliases reflects this in meta."
    edge_case_taxon: alias-yaml-only

cross_language:
  go_artifacts:
    bidder_dir: adapters/appnexus/
    package_name: appnexus
    bidder_constant: openrtb_ext.BidderAppnexus
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/appnexus/
    bidder_class: AppnexusBidder
    config_class: AppnexusConfiguration
    yaml_path: src/main/resources/bidder-config/appnexus.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/appnexus/
  port_concerns:
    aliases_inverted: true
    yaml_unification: true
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: true
    custom_unmarshaljson_present: false
  go_specific_concerns: []
  java_specific_concerns:
    - "AppnexusConfiguration declares a private-static-inner AppnexusConfigurationProperties subclass (extends BidderConfigurationProperties) — Java-only edge case. The class adds Integer platformId and Map<Integer, String> iabCategories. Both extra fields are populated from YAML keys 'platform-id' and 'iab-categories' under adapters.appnexus."
    - "iabCategories is a ~95-entry Map<Integer, String> inlined under adapters.appnexus.iab-categories in src/main/resources/bidder-config/appnexus.yaml. Cross-language storage_kind divergence: Java uses yaml-inlined while Go uses go-data-table (adapters/appnexus/iab_categories.go)."
    - "ExtImpAppnexus.keywords is typed as raw JsonNode (NOT a custom-typed string with @JsonDeserialize). Branching is co-located in AppnexusBidder.readKeywords() via JsonNode.isObject/isArray/isTextual rather than a separate Jackson JsonDeserializer. This contradicts the port-translation Rule 6 default which would suggest jackson-jsondeserialize for the canonical Go ExtImpAppnexusKeywords.UnmarshalJSON (3-shape) translation."
    - "AppnexusExtImp { bidder: ExtImpAppnexus, gpid: String } adapter-local wrapper unmarshals BOTH the standard ExtImpBidder.bidder field AND a sibling 'gpid' in a single mapper.convertValue(imp.getExt(), AppnexusExtImp.class) call — Java equivalent of Go's renamed-tag impExtIncoming trick."
    - "schain relocation: updateBidRequest + supplyChain + updateSource + updateExtRequest implement the source.ext.schain → request.ext.schain repositioning via Lombok toBuilder() rebuilds, mirroring Go's moveSupplyChain (appnexus.go:461) but using immutable-rebuild idiom."
    - "Validation semantics divergence: Java throws ValidationException for cross-imp consistency violations (member mismatch, generateAdPodId disagreement) which aborts the ENTIRE request via Result.withErrors(errors). PreBidException merely accumulates a per-imp error and skips the imp. Go side has equivalent logic but with different exception types."
    - "AppnexusBidder constructor calls HttpUtil.validateUrl(endpointUrl) and Objects.requireNonNull(mapper) — invalid URL or null mapper triggers IllegalArgumentException / NullPointerException at bean construction time (covered by creationShouldFailOnInvalidEndpointUrl)."
    - "headerBiddingSource = ObjectUtils.defaultIfNull(platformId, DEFAULT_PLATFORM_ID=5) — platformId is renamed to headerBiddingSource on the adapter and emitted as ext.appnexus.hb_source = headerBiddingSource + (isVideo ? 1 : 0). Matches Go's resolvePlatformID(platformID) + isVIDEO addition."
    - "Bid currency overwrite: BidderBid.bidCurrency = bidResponse.getCur() — passthrough-from-response with no empty-check guard (Go side guards via `if appnexusResponse.Cur != \"\"` — Java is unguarded but yields the same result because bidResponse.getCur() returns null/empty cleanly)."
    - "Multi-file layout: 11 Java files split as 1 implementation (AppnexusBidder.java, 561 LOC) + 1 utility (SameValueValidator.java) + 9 proto/ DTOs + 1 ExtImpAppnexus in proto/openrtb/ext/request/appnexus/. Mirrors Go's 3-file layout (appnexus.go + models.go + iab_categories.go) but with finer-grained DTO splitting."
    - "Mediafuse alias: aliases.mediafuse declared in appnexus.yaml with only meta-info.maintainer-email override (support@mediafuse.com). No separate MediafuseConfiguration / MediafuseBidder classes — pure YAML-only alias. Cross-language inversion: Go has the relationship inverted (child declares aliasOf=parent)."
  port_lineage:
    source_language: go
    source_pr: null
    destination_language: java
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - mutation-idiom-tobuilder
      - keywords-runtime-vs-jsondeserialize-branching
      - schain-source-to-request-ext-relocation
      - iab-category-storage-divergence
      - configuration-properties-subclass
  reviewer_cohort:
    go: [bsardo, SyntaxNode, hhhjort]
    java: [CTMBNara, AntoxaAntoxic, EmilNadimanov]
    cross_language_coordinator: bretg
