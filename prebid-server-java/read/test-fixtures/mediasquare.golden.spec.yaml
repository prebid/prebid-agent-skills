# bytes terminating with `\n}\n`. R2 holds: sha256(decoded scalar) == bidder_params_sha256.
# Note the Go-side counterpart uses a different formatting for `required` (single-line
# array vs Java's 4-line block) — bidder_params_sha256 differs across languages, R5 FAILS.
