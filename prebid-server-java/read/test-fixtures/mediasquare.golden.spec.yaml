quirks:
  # Edge case #28 — Bidder<MediasquareRequest> generic parameterization.
  - id: bidder-generic-custom-request-type
    file: src/main/java/org/prebid/server/bidder/mediasquare/MediasquareBidder.java
    summary: "MediasquareBidder declares `implements Bidder<MediasquareRequest>` (line 55) — the framework's Bidder<T> interface is parameterized with the custom payload type so HttpRequest<MediasquareRequest>, BidderCall<MediasquareRequest>, and the marshaled body all flow through the typed pipeline. Constructor uses HttpRequest.<MediasquareRequest>builder() (line 92) instead of BidderUtil.defaultRequest (which is typed for BidRequest only)."
    edge_case_taxon: multi-file-layout-justified
  # Edge case #5 — custom request body shape (paired with batching.rules custom_body_type
  # AND request_body.custom_body_type so the custom enum value has a quirks entry).
  - id: custom-request-body-mediasquare
    file: src/main/java/org/prebid/server/bidder/mediasquare/request/MediasquareRequest.java
    summary: "makeHttpRequests marshals MediasquareRequest (request/MediasquareRequest.java) — a Lombok @Builder/@Value(staticConstructor=of) class with codes[], gdpr, type, dsa, support (@JsonProperty(\"tech\")), test fields. Codes[] aggregates one MediasquareCode per imp via makeCode (line 112-127). makeRequest at line 196-208 sets type=\"pbs\", test=Objects.equals(bidRequest.getTest(), 1), support=MediasquareSupport.of(device, app), and gdpr/dsa from regs. Canonical case for batching.rules: imp-flatten-aggregate."
    edge_case_taxon: multi-file-layout-justified
  # Edge case #6 — custom response shape.
  - id: custom-response-body-mediasquare
    file: src/main/java/org/prebid/server/bidder/mediasquare/response/MediasquareResponse.java
    summary: "makeBids decodes MediasquareResponse (response/MediasquareResponse.java) with responses[] of MediasquareBid (response/MediasquareBid.java). MediasquareBid carries id/ad/bidId/cpm/currency/creativeId/height/width/netRevenue/transactionId/ttl/video(ObjectNode)/nativeResponse(@JsonProperty(\"native\") ObjectNode)/adomain/dsa(ObjectNode)/burl. extractBids (line 238-247) maps each MediasquareBid → BidderBid via makeBidderBid; getBidType (line 254-262) classifies by which sub-object (video/nativeResponse) is non-null; makeBid (line 264-278) constructs the OpenRTB Bid with mtype=bidType.ordinal()+1."
    edge_case_taxon: multi-file-layout-justified
  # Edge case — multi-file Java layout justified by the non-OpenRTB request body
  # plus the rich MediasquareCode/MediasquareMediaTypes/MediasquareFloor type tree.
  - id: multi-file-java-layout-non-openrtb-payload
    file: src/main/java/org/prebid/server/bidder/mediasquare/
    summary: "Adapter splits across MediasquareBidder.java (296 LOC orchestrator) plus 9 helper classes: 7 under request/ (MediasquareRequest, MediasquareCode, MediasquareBanner, MediasquareFloor, MediasquareGdpr, MediasquareMediaTypes, MediasquareSupport) and 2 under response/ (MediasquareBid, MediasquareResponse). Plus ExtImpMediasquare under proto/openrtb/ext/request/mediasquare/. Each Lombok @Value(staticConstructor=of) class is concise (11-49 LOC); the split is justified by the custom payload's type tree."
    edge_case_taxon: multi-file-layout-justified
  # Edge case #31 — modifying-vast-xml-allowed: true in YAML.
  - id: modifying-vast-xml-allowed-true
    file: src/main/resources/bidder-config/mediasquare.yaml
    summary: "modifying-vast-xml-allowed: true at line 5 of bidder-config/mediasquare.yaml. Mediasquare's video bid responses may carry rewritable VAST XML; the framework grants this bidder the ability to modify VAST URLs/wrappers post-bid. Default is false; this is the explicit opt-in."
    edge_case_taxon: port-fidelity-divergence
  # R5 cross-language byte-divergence: the two bidder_params_ref sha256 values differ.
  - id: bidder-params-byte-divergence-go
    file: src/main/resources/static/bidder-params/mediasquare.json
    summary: "Java mediasquare.json (527 bytes, sha256=946207d8) formats the `required` array across multiple lines; Go-side same file (515 bytes, sha256=798a251b) uses single-line `[\"owner\", \"code\"]`. Schema content is semantically identical (same properties, same required fields, same descriptions, same minLength constraints) but bytes differ. R5 cross-language byte-equality FAILS for bidder_params_sha256."
    edge_case_taxon: port-fidelity-divergence
  # YAML capabilities asymmetry: site capabilities are EMPTY on Java but present on Go.
  - id: site-capabilities-omitted-java
    file: src/main/resources/bidder-config/mediasquare.yaml
    summary: "Java bidder-config/mediasquare.yaml declares only `app-media-types: [banner, video, native]`; `site-media-types` is OMITTED (yields null on MetaInfo POJO). Go-side static/bidder-info/mediasquare.yaml declares both site AND app capabilities with [banner, video, native]. Effectively, the Java configuration restricts mediasquare to app-only inventory while the Go configuration allows site too."
    edge_case_taxon: port-fidelity-divergence
  # Test-application.properties registry append.
  - id: test-application-properties-registry-append
    file: src/test/resources/org/prebid/server/it/test-application.properties
    summary: "test-application.properties carries 2 mediasquare registry entries (lines 386-387): `adapters.mediasquare.enabled=true` and `adapters.mediasquare.endpoint=http://localhost:8090/mediasquare-exchange`. Standard 2-line registry append for IT-class wiring; matches the canonical 2-line pattern across most Java bidders."
    edge_case_taxon: multi-file-layout-justified
  # mtype computed via ordinal() arithmetic — fragile to enum reorder.
  - id: mtype-from-bidtype-ordinal-arithmetic
    file: src/main/java/org/prebid/server/bidder/mediasquare/MediasquareBidder.java
    summary: "makeBid sets bid.mtype via `bidType.ordinal() + 1` (line 274). BidType ordinals: banner=0, video=1, audio=2, xNative=3 — so mtype maps to 1/2/3/4 matching OpenRTB 2.6 markup type values. This is fragile to BidType enum reordering; Go side hardcodes the int values per case (utils.go:18-27 mType()). Cross-language port concern: Java port relies on ordinal stability, Go port is explicit."
    edge_case_taxon: port-fidelity-divergence
  # @JsonProperty("tech") on MediasquareRequest.support: Java field name diverges from
  # JSON key. Mirrors Go-side `tech` in msqParameters.
  - id: jsonproperty-renames-support-to-tech
    file: src/main/java/org/prebid/server/bidder/mediasquare/request/MediasquareRequest.java
    summary: "MediasquareRequest field `support` is annotated @JsonProperty(\"tech\") (line 22). The wire payload key is `tech` (matching Go-side msqParameters.Tech via json tag); the Java field is named `support` for readability. Cross-language semantic match preserved by the Jackson annotation."
    edge_case_taxon: json-key-style-mismatch

cross_language:
  go_artifacts:
    bidder_dir: adapters/mediasquare/
    package_name: mediasquare
    bidder_constant: openrtb_ext.BidderMediasquare
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/mediasquare/
    bidder_class: MediasquareBidder
    config_class: MediasquareConfiguration
    yaml_path: src/main/resources/bidder-config/mediasquare.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/mediasquare/
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: false
    package_directory_mismatch: false
    multi_file_layout: true
    custom_unmarshaljson_present: false
  go_specific_concerns: []
  java_specific_concerns:
    - "MediasquareBidder declares `implements Bidder<MediasquareRequest>` — Java's typed payload generic is the canonical mechanism for non-OpenRTB request bodies. Go side has no equivalent generic; Go's adapter explicitly marshals msqParameters via jsonutil.Marshal and assembles RequestData manually."
    - "MediasquareBidder constructor calls HttpUtil.validateUrl(endpointUrl) at line 65 — invalid URL triggers IllegalArgumentException at bean construction (covered by creationShouldFailOnInvalidEndpointUrl test)."
    - "TYPE_REFERENCE static TypeReference<ExtPrebid<?, ExtImpMediasquare>> at line 58 enables mapper.convertValue(imp.getExt(), TYPE_REFERENCE).getBidder() to yield ExtImpMediasquare with one call. Mirrors Go-side jsonutil.Unmarshal two-phase pattern via Java's typed pipeline."
    - "makeCode (line 112-127) uses Lombok @Builder on MediasquareCode rather than @Value(staticConstructor=of); MediasquareRequest, MediasquareCode, and MediasquareMediaTypes all carry @Builder for multi-field assembly. The remaining types use the static-of factory exclusively."
    - "makeFloors (line 162-188) constructs a Map<String, MediasquareFloor> keyed by `WxH` size strings (e.g., \"300x250\") plus an asterisk wildcard for video/native. Returns null if the map ends up empty (line 187) — pairs with isCodeValid (line 190-194) which rejects codes whose mediaTypes lack any of banner/video/nativeRequest."
    - "MediasquareRequest.support field is annotated @JsonProperty(\"tech\") — JSON wire key is `tech`, Java field is `support`. This is a deliberate rename (not a typo); Go side uses json:\"tech\" tag identically."
    - "MediasquareBid.nativeResponse is annotated @JsonProperty(\"native\") because `native` is a Java keyword. The field stores an ObjectNode directly (not a typed Native class) because the upstream payload shape is opaque/passthrough."
    - "getBidType (line 254-262) is order-dependent: video > xNative > banner. If a bid carries BOTH video AND nativeResponse simultaneously (malformed upstream), video wins. Mirrors Go-side utils.go:30-39 bidType() priority."
    - "makeBid sets bid.mtype = bidType.ordinal() + 1 (line 274) — fragile to BidType enum reordering. Maintainers must NOT reorder BidType.banner/video/audio/xNative without breaking this adapter."
