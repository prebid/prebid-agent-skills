code:
  package_or_class: MediasquareBidder
  directory_name: mediasquare
  package_directory_mismatch: false
  # Edge case — multi-file Java layout. The implementation lives in MediasquareBidder.java
  # plus 7 helper classes co-located under bidder/mediasquare/{request,response}/ and 1
  # proto class under proto/openrtb/ext/request/mediasquare/. The split mirrors the Go-side
  # multi-file layout but uses Java's class-per-type convention rather than file-per-role.
  file_layout:
    kind: multi-file
    files:
      - name: MediasquareBidder.java
        role: implementation
        loc: 296
      - name: request/MediasquareRequest.java
        role: types
        loc: 26
      - name: request/MediasquareCode.java
        role: types
        loc: 30
      - name: request/MediasquareBanner.java
        role: types
        loc: 11
      - name: request/MediasquareFloor.java
        role: types
        loc: 13
      - name: request/MediasquareGdpr.java
        role: types
        loc: 11
      - name: request/MediasquareMediaTypes.java
        role: types
        loc: 16
      - name: request/MediasquareSupport.java
        role: types
        loc: 13
      - name: response/MediasquareBid.java
        role: types
        loc: 49
      - name: response/MediasquareResponse.java
        role: types
        loc: 11
  imports:
    has_template_engine: false
    has_currency_helper: false
    has_jsonutil: false
    third_party:
      - CollectionUtils
      - MapUtils
      - ObjectUtils
  adapter_struct: null
  builder: null
  make_requests:
    # Edge case — multi-imp aggregation: each imp becomes one entry in
    # MediasquareRequest.codes[], all sent in a single HTTP request. Mirrors Go-side
    # imp-flatten-aggregate semantics.
    batching:
      applied_in_order: true
      rules:
        - kind: imp-flatten-aggregate
          custom_body_type: MediasquareRequest
    # Edge case #5 — custom (non-OpenRTB) request body. The HTTP body is a
    # MediasquareRequest payload (request/MediasquareRequest.java), NOT a BidRequest.
    # Bidder<MediasquareRequest> generic parameterization carries this through the
    # framework's HttpRequest<MediasquareRequest> typing — see bidder_class section.
    request_body:
      kind: custom
      custom_body_type: MediasquareRequest
    mutation:
      mutates_request: false
      entity_strategies: {}
      go_idiom: null
      java_idiom: none
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: null
      mechanism_java: typeref-extprebid
      target_type: ExtImpMediasquare
      wrapper_type: null
    endpoint_resolution:
      kind: static
      mechanism_go: null
      mechanism_java: null
      macro_field_set: []
      template_params_struct_field_count: null
    helpers:
      - name: parseImpExt
        signature: "private ExtImpMediasquare parseImpExt(Imp imp)"
      - name: makeCode
        signature: "private static MediasquareCode makeCode(BidRequest bidRequest, Imp imp, ExtImpMediasquare extImp)"
      - name: makeMediaTypes
        signature: "private static MediasquareMediaTypes makeMediaTypes(Imp imp)"
      - name: makeBanner
        signature: "private static MediasquareBanner makeBanner(Banner banner)"
      - name: makeFloors
        signature: "private static Map<String, MediasquareFloor> makeFloors(MediasquareFloor floor, MediasquareMediaTypes mediaTypes)"
      - name: isCodeValid
        signature: "private static boolean isCodeValid(MediasquareCode code)"
      - name: makeRequest
        signature: "private MediasquareRequest makeRequest(BidRequest bidRequest, List<MediasquareCode> codes)"
      - name: getDsa
        signature: "private static ExtRegsDsa getDsa(Regs regs)"
      - name: makeGdpr
        signature: "private static MediasquareGdpr makeGdpr(User user, Regs regs)"
      - name: extractBids
        signature: "private List<BidderBid> extractBids(MediasquareResponse response)"
      - name: makeBidderBid
        signature: "private BidderBid makeBidderBid(MediasquareBid bid)"
      - name: getBidType
        signature: "private static BidType getBidType(MediasquareBid bid)"
      - name: makeBid
        signature: "private Bid makeBid(MediasquareBid bid, BidType bidType)"
      - name: getBidExt
        signature: "private ObjectNode getBidExt(MediasquareBid bid, BidType bidType)"
  make_bids:
    # Edge case #6 — custom response unmarshal. The body is a MediasquareResponse
    # struct (response/MediasquareResponse.java), with `responses[]` carrying
    # MediasquareBid entries that are NOT openrtb2.Bid-shaped (cpm/creative_id/native
    # sub-object).
    response_type: custom
    custom_response_type: MediasquareResponse
    http_status_handling:
      # Catches DecodeException from mapper.decodeValue (line 233) and emits
      # BidderError.badServerResponse. HTTP status code itself is auto-handled by
      # the Vert.x framework before makeBids is invoked.
      kind: framework-default
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      # MediasquareBidder.getBidType (line 254-262) inspects the MediasquareBid payload
      # shape: bid.video != null → video, bid.nativeResponse != null → xNative, else
      # default banner. Pairs with custom response_type. Note: bid.mtype on the OUTPUT
      # Bid is set via bidType.ordinal()+1 (line 274) — banner=1, video=2, audio=3, xNative=4.
      method_chain:
        - method: by-response-payload-shape
          fallback_action: return-default
      default_value: banner
      multi_format_detection: none
    # extractBids uses .stream().filter(Objects::nonNull).map(this::makeBidderBid)
    # over MediasquareResponse.responses (line 243-246). Java-side flatten via stream.
    bid_pointer_pattern: flatten-streams
    bid_pointer_go_sibling: null
    # BidderBid.of(makeBid(bid, bidType), bidType, bid.getCurrency()) at line 251 —
    # passes bid.getCurrency() per-bid into BidderBid; the framework concatenates
    # currencies across bids without overwriting. No bidResponse.Currency = ... assignment.
    # Note: Go side has unguarded last-bid-wins overwrite; Java side does NOT — Java passes
    # currency per-bid via BidderBid.of, which is structurally safer.
    currency_overwrite_safety: passthrough-from-response

