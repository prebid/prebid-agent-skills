quirks:
  - id: alias-it-class-missing-jdpmedia
    file: src/main/resources/bidder-config/smarthub.yaml
    summary: "Alias `jdpmedia` is declared in parent.aliases[] AND has its IT fixture dir at openrtb2/jdpmedia/ — but does NOT have a corresponding JdpmediaTest.java IT class. The 8 sibling aliases (markapp, tredio, felixads, jambojar, adinify, artechnology, addigi, radianfusion) all have IT classes. Reviewers may flag this as a gap."
    edge_case_taxon: incomplete-classification
  - id: rebrand-in-progress
    file: src/main/resources/bidder-config/smarthub.yaml
    summary: "Endpoint host (`prebid.attekmi.com`), maintainer email (`prebid@attekmi.com`), and JSON schema title (`Attekmi (formerly SmartHub) Adapter Params`) reference the Attekmi rebrand. The YAML name + class name remain `smarthub`/`Smarthub`. SmartHub→Attekmi rebrand is partial; ADR-003 expects this rebrand to land as a Rule 43 lifecycle.rename event in a future Java PR (referenced #3699)."
    edge_case_taxon: bidder-rename-three-step
  - id: alias-typo-radianfusion-vs-radiantfusion
    file: src/main/resources/bidder-config/smarthub.yaml
    summary: "Alias name in parent.aliases[] is `radianfusion` but the endpoint URL points at `radiantfusion-prebid.attekmi.co` (extra `t` AND `.co` not `.com`). Likely a typo at PR-time that landed without notice. Cross-language fidelity NOT broken (Go side mirrors with `radianfusion` YAML name)."
    edge_case_taxon: yaml-field-name-typo

cross_language:
  go_artifacts:
    bidder_dir: adapters/smarthub/
    package_name: smarthub
    bidder_constant: openrtb_ext.BidderSmartHub
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/smarthub/
    bidder_class: SmarthubBidder
    config_class: SmarthubConfiguration
    yaml_path: src/main/resources/bidder-config/smarthub.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/smarthub/
  port_concerns:
    aliases_inverted: true                    # Java parent.aliases[markapp,jdpmedia,…] (all 9) vs Go per-alias YAMLs — Rule 33 + Rule 44
    yaml_unification: true
    mutation_idiom_divergence: false          # Both sides do passthrough (no entity mutation)
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis           # Both established pre-Phase-2 ports (Java #1442; Go #1932)
    source_pr: prebid/prebid-server-java#1442
    destination_language: null
    destination_pr: prebid/prebid-server#1932
    fidelity_review_themes:
      - port-fidelity
      - alias-empire-white-label-saas
      - parent-rebrand-in-progress
      - first-imp-extraction-anti-pattern
  go_specific_concerns: []
  java_specific_concerns:
    - "Bean-construction-time URL validation: SmarthubBidder constructor calls HttpUtil.validateUrl(endpointTemplate) at line 49. Throws IllegalArgumentException on invalid URL — caught at Spring startup."
    - "Static TypeReference<ExtPrebid<?, ExtImpSmarthub>> at class init (line 38)."
    - "Single-batched: makeHttpRequests reads imp.ext from the FIRST imp via `request.getImp().getFirst()` (line 57), then sends the entire BidRequest as one HttpRequest. Multi-imp callers' subsequent imps are passed through but not used for endpoint resolution — symmetric with Go-side first-imp-only-extraction quirk."
    - "Empty-seatbid shortcircuit: extractBids returns Collections.emptyList() BEFORE iterating when getSeatbid() is null/empty. Distinct from Go's explicit error-on-empty-seatbid (which returns BadServerResponse instead)."
    - "Custom HTTP header `Prebid-Adapter-Ver: 1.0.0` is hardcoded in resolveHeaders (line 76). Go side uses the same constant value but as a top-level package const (ADAPTER_VER) at line 21."
    - "9 aliases declare full_block config_form (each ships its own endpoint URL; vs tilde_inherit which would inherit all parent fields). White-label-saas empire flavor canonical (ADR-003 Rule 44)."
    - "Alias inconsistency: jdpmedia has fixture dir but NO IT class. radianfusion alias name spelled without the `t` but endpoint URL is `radiantfusion-prebid.attekmi.co`. Both upstream artifacts; not introduced by this read."
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg

registry: {}
