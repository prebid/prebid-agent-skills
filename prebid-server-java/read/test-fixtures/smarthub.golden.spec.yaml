code:
  package_or_class: SmarthubBidder
  directory_name: smarthub
  package_directory_mismatch: false
  file_layout:
    kind: single-file
    files:
      - name: SmarthubBidder.java
        role: implementation
        loc: 130
  imports:
    has_jsonutil: false
    has_template_engine: false
    has_currency_helper: false                # Smarthub does NOT use CurrencyConversionService
  make_requests:
    request_body:
      kind: openrtb2-passthrough              # Body = mapper.encodeToBytes(request) directly; no imp mutation
      custom_body_type: null
    batching:
      applied_in_order: true
      rules:
        - kind: single-batched                # Single HTTP request returned with the entire BidRequest
    mutation:
      mutates_request: false
      go_idiom: null
      java_idiom: none
      entity_strategies:
        Imp: none
        Site: none
        App: none
        Source: none
        Banner: none
        Device: none
        User: none
        Cur: none
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: null
      mechanism_java: typeref-extprebid       # TypeReference<ExtPrebid<?, ExtImpSmarthub>>
      target_type: ExtImpSmarthub
      wrapper_type: null
    endpoint_resolution:
      kind: multi-token-substitution
      mechanism_go: null
      mechanism_java: string-replace
      macros_used:
        - Host
        - AccountID
        - SourceId
    helpers:
      - name: resolveHeaders
        signature: "private MultiMap resolveHeaders()"
      - name: buildEndpointUrl
        signature: "private String buildEndpointUrl(ExtImpSmarthub extImpSmarthub)"
      - name: extractBids
        signature: "private List<BidderBid> extractBids(BidResponse bidResponse)"
      - name: makeBid
        signature: "private static BidderBid makeBid(Bid bid, String currency)"
      - name: getBidType
        signature: "private static BidType getBidType(Bid bid)"
  make_bids:
    response_type: BidResponse
    custom_response_type: null
    bid_type_resolution:
      method_chain:
        - method: by-bid-ext-typed-field      # Rule 24 — bid.getExt().get("mediaType") parses to BidType
          field: bid.ext.mediaType
          fallback_action: throw
      default_value: null
      multi_format_detection: strict
    http_status_handling:
      kind: framework-default-plus-empty-seatbid-shortcircuit
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_pointer_pattern: flatten-streams
    bid_pointer_go_sibling: null
    currency_overwrite_safety: passthrough-from-response

