quirks:
  - id: imp-ext-repack-with-type-tag
    file: src/main/java/org/prebid/server/bidder/teqblaze/TeqblazeBidder.java
    line: 80
    summary: "modifyImp REPACKS imp.ext.bidder with the TeqblazeExtImp output POJO: `{type: publisher|network, placementId|endpointId: <value>}`. Input ExtImpTeqblaze has only placementId+endpointId; output adds the type tag classifying which mode the imp is in. Symmetric with Go side. Two ext POJO classes used: ExtImpTeqblaze (input, in canonical proto/) + TeqblazeExtImp (output, in bidder/teqblaze/proto/ — non-canonical location)."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: configuration-class-non-canonical-package
    file: src/main/java/org/prebid/server/spring/config/bidder/util/TeqblazeConfiguration.java
    summary: "TeqblazeConfiguration lives in `org.prebid.server.spring.config.bidder.util` package (the `util/` subpackage), NOT the canonical `org.prebid.server.spring.config.bidder` package. Only Java config currently in this subpackage today (255 sibling configs in the canonical location). Likely an upstream artifact from when teqblaze was first ported and got mis-placed; reviewers haven't moved it back."
    edge_case_taxon: incomplete-classification
  - id: yaml-field-name-typo-mata-info
    file: src/main/resources/bidder-config/teqblaze.yaml
    line: 50
    summary: "gravite alias declares `mata-info:` (line 50) instead of canonical `meta-info:`. The maintainer-email (`support@gravite.net`) and vendor-id (`377`) under the typo'd key are SILENTLY IGNORED by Spring's YAML binding. Distinct yaml-field-name-typo from Java edge case #34's `endpointCompression` regression. Cross-language fidelity NOT broken (Go alias gravite.yaml separately specifies its own maintainer)."
    edge_case_taxon: yaml-field-name-typo
  - id: white-label-only-parent-placeholder-endpoint
    file: src/main/resources/bidder-config/teqblaze.yaml
    summary: "Parent declares `endpoint: http://` — an unusable placeholder. Parent is non-functional; only the 10 alias children (each with own endpoint host) function. Distinct from smarthub-style white-label-saas where the parent itself functions (`prebid.attekmi.com`)."
    edge_case_taxon: incomplete-classification
  - id: bid-mtype-audio-divergence
    file: src/main/java/org/prebid/server/bidder/teqblaze/TeqblazeBidder.java
    summary: "Java getBidType supports mtype=3 (audio); Go side does NOT. The capabilities block on both sides only declares banner+video+native, so audio bids would never be requested — but the Java adapter would correctly classify an audio bid if one arrived; Go would throw. Asymmetry is a port-fidelity gap (porter Java→Go missed the audio case)."
    edge_case_taxon: incomplete-classification

cross_language:
  go_artifacts:
    bidder_dir: adapters/teqblaze/
    package_name: teqblaze
    bidder_constant: openrtb_ext.BidderTeqBlaze
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/teqblaze/
    bidder_class: TeqblazeBidder
    config_class: TeqblazeConfiguration
    yaml_path: src/main/resources/bidder-config/teqblaze.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/teqblaze/
  port_concerns:
    aliases_inverted: true
    yaml_unification: true
    mutation_idiom_divergence: true           # Java imp.toBuilder().ext(...).build() ↔ Go reqCopy.Imp[0].Ext = repackedJSON
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: prebid/prebid-server-java#4161
    destination_language: null
    destination_pr: prebid/prebid-server#4480
    fidelity_review_themes:
      - port-fidelity
      - alias-empire-white-label-saas
      - imp-ext-repack
      - bid-mtype-audio-divergence
  go_specific_concerns: []
  java_specific_concerns:
    - "TeqblazeConfiguration lives in spring/config/bidder/util/ (NOT canonical spring/config/bidder/). Likely an upstream port-time mis-placement; only Java config in this subpackage today."
    - "imp.ext repack via TeqblazeExtImp output POJO: input ExtImpTeqblaze has placementId+endpointId; output adds `type: publisher|network` derived from which input field was supplied. Two ext POJO classes: ExtImpTeqblaze (canonical proto/) + TeqblazeExtImp (non-canonical bidder/teqblaze/proto/)."
    - "10 aliases all default-disabled — Rule 45 mass-evidence (matching smarthub). NONE of the 10 have per-alias IT classes; only the parent TeqblazeTest exists. Distinct from smarthub which has 8/9 alias IT classes."
    - "appStockSSP alias has Rule 15 deploy-time-token: `endpoint: https://#{REGION}#.al-ad.com/pserver`. Operator substitutes #{REGION}# before deployment (lb/ortb-eu/ortb-apac for US_EAST/EU/APAC). Aliasing-with-token is rare; typically tokens live on parent. Currently defused because alias is disabled-by-default."
    - "gravite alias has yaml-field-name-typo: `mata-info:` instead of `meta-info:` (line 50). Maintainer-email and vendor-id under the typo'd key are silently ignored by Spring."
    - "Bid type resolution supports mtype=1 (banner), 2 (video), 3 (audio), 4 (native). Capabilities only declare banner+video+native — but an audio bid would still classify correctly. Cross-language asymmetry: Go does NOT support mtype=3 (audio)."
    - "TeqblazeBidder uses BidderUtil.defaultRequest for outgoing HTTP request construction — Rule 8 Java side."
    - "ExtImpTeqblaze uses @Value(staticConstructor = \"of\"); TeqblazeExtImp uses @Value @Builder. Two POJO frameworks for the input vs output ext shapes."
