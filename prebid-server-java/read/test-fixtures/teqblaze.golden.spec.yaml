code:
  package_or_class: TeqblazeBidder
  directory_name: teqblaze
  package_directory_mismatch: false
  file_layout:
    kind: single-file
    files:
      - name: TeqblazeBidder.java
        role: implementation
        loc: 156
  imports:
    has_jsonutil: false
    has_template_engine: false
    has_currency_helper: false
  make_requests:
    request_body:
      kind: openrtb2-modified                 # imp.ext is REPACKED with new shape (see imp_ext_repack quirk; symmetric with Go side)
      custom_body_type: null
    batching:
      applied_in_order: true
      rules:
        - kind: per-imp                       # Rule 10
    mutation:
      mutates_request: true
      go_idiom: null
      java_idiom: lombok-tobuilder            # imp.toBuilder().ext(modifiedImpExtBidder).build() + bidRequest.toBuilder().imp(List.of(imp)).build()
      entity_strategies:
        Imp: immutable-rebuild
        Site: none
        App: none
        Source: none
        Banner: none
        Device: none
        User: none
        Cur: none
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: null
      mechanism_java: typeref-extprebid       # TypeReference<ExtPrebid<?, ExtImpTeqblaze>>
      target_type: ExtImpTeqblaze
      wrapper_type: null
    endpoint_resolution:
      kind: literal
      mechanism_go: null
      mechanism_java: literal                  # No macro substitution — the parent's endpoint is "http://" placeholder; aliases supply real URLs.
      macros_used: []
    helpers:
      - name: parseExtImp
        signature: "private ExtImpTeqblaze parseExtImp(Imp imp)"
      - name: modifyImp
        signature: "private Imp modifyImp(Imp imp, ExtImpTeqblaze extImpTeqblaze)"
      - name: resolveImpExt
        signature: "private TeqblazeExtImp resolveImpExt(ExtImpTeqblaze extImpTeqblaze)"
      - name: makeHttpRequest
        signature: "private HttpRequest<BidRequest> makeHttpRequest(BidRequest request, Imp imp)"
      - name: extractBids
        signature: "private List<BidderBid> extractBids(BidResponse bidResponse)"
      - name: getBidType
        signature: "private BidType getBidType(Bid bid)"
  make_bids:
    response_type: BidResponse
    custom_response_type: null
    bid_type_resolution:
      method_chain:
        - method: by-bid-mtype                # Rule 23. Java case-list: 1=banner, 2=video, 3=audio, 4=native (THROWS on null/default).
          field: bid.mtype
          fallback_action: throw
      default_value: null
      multi_format_detection: strict
    http_status_handling:
      kind: framework-default-plus-empty-seatbid-shortcircuit
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_pointer_pattern: flatten-streams
    bid_pointer_go_sibling: null
    currency_overwrite_safety: passthrough-from-response

