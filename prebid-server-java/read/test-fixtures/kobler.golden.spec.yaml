quirks:
  - id: bidder-constant-mismatch-test
    file: adapters/kobler/kobler_test.go
    summary: "kobler_test.go calls Builder with openrtb_ext.BidderKargo (copy-paste from another adapter). This is a Go-side bug; recorded here in the Java spec for cross-language port awareness only."
    edge_case_taxon: bidder-constant-mismatch
  - id: bidder-constant-mismatch-params-test
    file: adapters/kobler/params_test.go
    summary: "params_test.go TestInvalidParams calls validator.Validate with openrtb_ext.BidderKrushmedia (copy-paste from another adapter). This is a Go-side bug; recorded here for cross-language port awareness only."
    edge_case_taxon: bidder-constant-mismatch
  - id: dev-endpoint-config-subclass
    file: src/main/java/org/prebid/server/spring/config/bidder/KoblerConfiguration.java
    summary: "Java port correctly externalizes dev endpoint into config subclass with @NotBlank validation, fixing the Go-side anti-pattern."
    edge_case_taxon: port-fidelity-divergence
  - id: currency-conversion-bidrequest-context
    file: src/main/java/org/prebid/server/bidder/kobler/KoblerBidder.java
    summary: "convertBidFloor passes bidRequest as 2nd arg to currencyConversionService.convertCurrency for time-context (line 112-116). Go side does not pass bidRequest — intentional cross-language asymmetry."
    edge_case_taxon: port-fidelity-divergence
  - id: mutation-idiom-tobuilder
    file: src/main/java/org/prebid/server/bidder/kobler/KoblerBidder.java
    summary: "Mutation uses Lombok toBuilder().build() for Imp, Device, and root BidRequest (lines 82-87, 98-101) — Java idiom mirrors Go's pointer mutation semantics with immutable-rebuild."
    edge_case_taxon: port-fidelity-divergence

cross_language:
  go_artifacts:
    bidder_dir: adapters/kobler/
    package_name: kobler
    bidder_constant: openrtb_ext.BidderKobler
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/kobler/
    bidder_class: KoblerBidder
    config_class: KoblerConfiguration
    yaml_path: src/main/resources/bidder-config/kobler.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/kobler/
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: go
    source_pr: prebid/prebid-server#3904
    destination_language: java
    destination_pr: prebid/prebid-server-java#3684
    fidelity_review_themes:
      - port-fidelity
      - currency-conversion-bidrequest-context
      - mutation-idiom-tobuilder
      - dev-endpoint-config-promotion
  go_specific_concerns: []
  java_specific_concerns:
    - "KoblerBidder constructor calls HttpUtil.validateUrl(endpointUrl) at line 60 — invalid URL triggers IllegalArgumentException at bean construction (covered by creationShouldFailOnInvalidEndpointUrl test)."
    - "KOBLER_EXT_TYPE_REFERENCE static TypeReference<ExtPrebid<?, ExtImpKobler>> is constructed once at class init; mapper.convertValue(imp.getExt(), KOBLER_EXT_TYPE_REFERENCE).getBidder() yields the params POJO (line 143)."
    - "isTest reads imp.ext.bidder.test from imps.getFirst() ONLY (line 89) — multi-imp callers cannot toggle dev endpoint per-imp; mirrors Go's i==0 branch behaviour."
    - "BidderUtil.defaultRequest(modifiedRequest, endpoint, mapper) at line 91 collapses what Go expands inline — JSON marshal + Content-Type header + ImpIDs population happens in the helper."
    - "getBidType uses Optional chain with double JsonNode::isObject filter (lines 178-186) — second filter is redundant after ObjectNode::class cast but does not affect behaviour."
    - "parseExtBidPrebid catches JsonProcessingException and returns null silently (lines 188-194), causing the Optional chain to fall through to BidType.banner default — fidelity-equivalent to Go's err == nil chain in getMediaTypeForBid."
    - "ExtImpKobler uses @Value(staticConstructor=of) yielding ExtImpKobler.of(true) factory (rare for params POJOs which more commonly use @Value @Builder)."
    - "Empty-seatbid shortcircuit at line 160-162 returns Collections.emptyList() before bidsFromResponse stream pipeline runs — paired with framework-default HTTP status handling."
    - "stream pipeline in bidsFromResponse uses three Objects::nonNull filters across SeatBid, SeatBid.Bid, and Bid (lines 167-174) — defensive against null entries; Go side does not need equivalent because Go ranges never iterate over nil-element slots."
