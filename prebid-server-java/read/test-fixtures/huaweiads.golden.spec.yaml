quirks:
  - id: hmac-sha256-authentication-per-request
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdsBidder.java
    summary: "Per-request HMAC-SHA-256 Digest Authorization header built in makeAuthorization (line 201-215) using publisherId+signKey+keyId from ExtImpHuaweiAds and System.currentTimeMillis() as nonce. Apache commons-codec Hex output is lowercase. Cross-language byte-equal contract with Go side."
    edge_case_taxon: per-request-cryptographic-auth
  - id: application-status-via-retcode-body-field
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdsBidder.java
    summary: "validateRetcode (line 244-250) reads retcode from response body (HuaweiAdsResponse.retcode) — error windows are (200,300) excl 204/206 and [400,600). HTTP status code is not consulted directly — application-level status pattern."
    edge_case_taxon: application-status-code
  - id: per-ad-retcode30-secondary-status
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdsBidder.java
    summary: "Secondary per-ad status: Ad30.retcode30 (@JsonProperty(\"retcode30\")) must equal 200 to be eligible (line 281). Each ad in multiad list has its own retcode separate from the top-level response retcode."
    edge_case_taxon: application-status-code
  - id: acronym-case-preservation-in-class-names
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdsBidder.java
    summary: "Edge case #27: Java class names preserve TitleCase Ads acronym (HuaweiAds, HuaweiAdsBidder, HuaweiAdSlotBuilder, HuaweiAdmBuilder, HuaweiAdsRequest, HuaweiAdsResponse, HuaweiAdsTest); directory/YAML name remains all-lowercase huaweiads. Configuration file is HuaweiadsConfiguration.java (lowercase 'a' in filename) but class inside is HuaweiAdsConfiguration."
    edge_case_taxon: acronym-case-preservation
  - id: parameterized-request-type-non-default
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdsBidder.java
    summary: "Edge case #28: implements Bidder<HuaweiAdsRequest>, sending a vendor-specific JSON payload (multislot/app/device/network/regs/geo/consent/clientAdRequestId) instead of openrtb2.BidRequest. Mediasquare is the only sibling doing this."
    edge_case_taxon: parameterized-request-type
  - id: nested-extrainfo-configuration-properties
    file: src/main/java/org/prebid/server/spring/config/bidder/HuaweiadsConfiguration.java
    summary: "HuaweiAdsConfigurationProperties extends BidderConfigurationProperties with @Valid @NotNull ExtraInfo extraInfo field (default new ExtraInfo()). Nested static class ExtraInfo holds 6 fields: pkgNameConvert + closeSiteSelectionByCountry + 4 region endpoints. Reference list mentions huaweiads/nextmillennium share this nested-ExtraInfo pattern."
    edge_case_taxon: nested-configuration-properties
  - id: configuration-class-name-vs-filename-asymmetry
    file: src/main/java/org/prebid/server/spring/config/bidder/HuaweiadsConfiguration.java
    summary: "Filename HuaweiadsConfiguration.java (lowercase 'ads') but class declaration is `public class HuaweiAdsConfiguration` (TitleCase 'Ads'). Java compiles fine because Spring scans by class annotation, but the file/class name mismatch is unusual; reference list flags this asymmetry."
    edge_case_taxon: acronym-case-preservation
  - id: runtime-region-selection-endpoint-fan-out
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiEndpointResolver.java
    summary: "HuaweiEndpointResolver.resolve(countryCode) chooses among 5 endpoint URLs (chinese/russian/european/asian + fallback) based on resolved country code via 57-country EUROPEAN allowlist + CN + RU dispatch. closeSiteSelectionByCountry config flag (=\"1\") forces use of base endpoint."
    edge_case_taxon: runtime-region-selection
  - id: country-code-resolution-multi-source
    file: src/main/java/org/prebid/server/bidder/huaweiads/CountryCodeResolver.java
    summary: "Country code resolved by walking device.geo.country → user.geo.country → device.mccmnc[0] (mapped via CountryCodeMapper.mapMccToAlpha2). Defaults to ZA when none resolve. ALPHA2 normalization handles 1-char (skipped), 2-char (passed through), 3+ char (mapped to alpha2 via countryCodeMapper)."
    edge_case_taxon: country-code-resolution-fallback-chain
  - id: vendor-specific-request-body-shape
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdsBidder.java
    summary: "Body sent to Huawei is HuaweiAdsRequest (custom DTO), not openrtb2.BidRequest. Conversion done by helper builders (adSlotBuilder, appBuilder, deviceBuilder, networkBuilder). Response shape is also custom: HuaweiAdsResponse with multiad: List<Ad30>."
    edge_case_taxon: custom-request-response-shape
  - id: per-ad-creative-type-with-100-offset
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdmBuilder.java
    summary: "buildBanner at line 74-76 reads Content.creativeType and applies `type > 100 ? type - 100 : type` before mapping via CreativeType.of(). Vendor-specific +100 offset for an alternate creative-type encoding."
    edge_case_taxon: vendor-specific-protocol-quirk
  - id: pkg-name-conversion-table-from-yaml
    file: src/main/resources/bidder-config/huaweiads.yaml
    summary: "extra-info.pkgNameConvert (List<PkgNameConvert>) holds rewriting rules for app bundle names with 4 input criteria (unconvertedPkgNames, unconvertedPkgNameKeyWords, unconvertedPkgNamePrefixs, exceptionPkgNames) → convertedPkgName. HuaweiAppBuilder consults this list to rewrite the outbound app.pkgName. YAML uses camelCase keys for PkgNameConvert fields contrasting with kebab-case meta-info."
    edge_case_taxon: yaml-configuration-rewrite-table
  - id: bidder-params-json-byte-divergence-go-vs-java
    file: src/main/resources/static/bidder-params/huaweiads.json
    summary: "Java JSON file uses LF line endings + trailing newline (sha256 ce8ea453...); Go file uses CRLF line endings + no trailing newline (sha256 c2d5585c...). Schema content is semantically identical. R5 cross-language SHA equality FAILS due to whitespace divergence. This is a Go-side anomaly (CRLF endings unusual for upstream JSON files) — port-fidelity violation surfaced as a port concern."
    edge_case_taxon: cross-language-byte-divergence
  - id: ext-imp-test-authorization-string-not-boolean
    file: src/main/java/org/prebid/server/proto/openrtb/ext/request/huaweiads/ExtImpHuaweiAds.java
    summary: "ExtImpHuaweiAds.isTestAuthorization is type String (not Boolean) and field is NOT in bidder-params/huaweiads.json schema. HuaweiAdSlotBuilder.build line 87 compares to literal string \"true\" to set test=1; any other value (including \"TRUE\" or null) yields test=0. Schema-undocumented runtime field is a tech-debt anti-pattern."
    edge_case_taxon: schema-undocumented-runtime-field
  - id: hardcoded-default-currency-cny
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdsBidder.java
    summary: "DEFAULT_BID_CURRENCY = \"CNY\" at line 61 — non-USD default reflects bidder's primary China-region market. getCurrency falls through to CNY when Content.cur is empty for all contents."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: hardcoded-default-country-za
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdsBidder.java
    summary: "DEFAULT_COUNTRY_CODE = \"ZA\" at line 60 — South Africa as catch-all fallback when CountryCodeResolver returns empty. Combined with HuaweiEndpointResolver, ZA falls to asianEndpoint (since not in CN/RU/EUROPEAN allowlist)."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: imp-ext-parsed-twice-per-request-cycle
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdsBidder.java
    summary: "parseImpExt is called once per Imp in makeHttpRequests (line 101) AND once again per Imp in makeBids (line 265) to rebuild slotId→Imp map. No caching — duplicate Jackson convertValue work on every bid round-trip."
    edge_case_taxon: redundant-work
  - id: empty-multiad-pre-bid-exception
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdsBidder.java
    summary: "extractBids (line 252-256) throws PreBidException(\"convert huaweiads response to bidder response failed: multiad length is 0, get no ads from huawei side.\") when response.multiad is empty/null — surfaces as BidderError.badServerResponse via the makeBids catch at line 240. Empty multiad is treated as protocol error, not no-bid."
    edge_case_taxon: empty-response-as-error
  - id: high-test-method-count
    file: src/test/java/org/prebid/server/bidder/huaweiads/
    summary: "198 @Test methods across 10 unit-test files (4880 total LOC). HuaweiAdmBuilderTest alone has 64 tests covering banner/video/native creative-type matrix. One of the most-tested adapters in the Java codebase."
    edge_case_taxon: high-test-method-count
  - id: integration-test-class-name-titlecase-preservation
    file: src/test/java/org/prebid/server/it/HuaweiAdsTest.java
    summary: "Integration test class is HuaweiAdsTest (TitleCase Ads) not HuaweiadsTest. Reference list explicitly catalogs this as Edge case #27 — class-name brand-acronym preservation in IT tests."
    edge_case_taxon: acronym-case-preservation
  - id: country-defaulting-after-resolution-failure
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdsBidder.java
    summary: "makeHttpRequests line 95: countryCodeResolver.resolve(bidRequest).orElse(DEFAULT_COUNTRY_CODE) — wraps Optional empty case with ZA default. Edge case: resolved code is later USED for {App.country, Device.belongCountry, Device.localeCountry, HuaweiEndpointResolver.resolve} — single source of truth fans out to multiple downstream uses."
    edge_case_taxon: shared-default-fan-out
  - id: native-version-default-1-1
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdmBuilder.java
    summary: "DEFAULT_NATIVE_VERSION = \"1.1\" at HuaweiAdmBuilder line 57; if native request payload doesn't carry ver, response uses 1.1 (not 1.2). Vendor-specific default."
    edge_case_taxon: vendor-specific-protocol-quirk
  - id: vast-3-tracker-event-mapping
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAdmBuilder.java
    summary: "MonitorEventType maps Huawei-side event strings (imp/click/vastError/userclose/playStart/playEnd/playResume/playPause/soundClickOff/soundClickOn/win) into VAST event element names (start/complete/resume/pause/mute/unmute) when emitting <Tracking event=\"...\">. USER_CLOSE expands to TWO Tracking elements (skip + closeLinear)."
    edge_case_taxon: vendor-to-iab-mapping
  - id: clienttime-iso-format-mutator
    file: src/main/java/org/prebid/server/bidder/huaweiads/ClientTimeFormatter.java
    summary: "ClientTimeFormatter normalizes user-supplied clientTime to format `yyyy-MM-dd HH:mm:ss.SSS+ZZZZ`. If input matches with-offset pattern → passthrough; if matches without-offset → reformat with system zone offset; else uses LocalDateTime.now(clock). Clock is injected (testable). Output anchored at OffsetDateTime in injected clock."
    edge_case_taxon: time-formatting-quirk
  - id: pkgname-conversion-key-length-checks
    file: src/main/java/org/prebid/server/bidder/huaweiads/HuaweiAppBuilder.java
    summary: "getPackageName uses `bundleName.indexOf(keyword) > 0` (strict greater-than zero, not >=) — keyword at position 0 is not matched by indexOf check, only at position 1 onward. unconvertedPkgNames also accepts \"*\" wildcard meaning convert-all. Multi-table walk: exception → name → keyword → prefix in fixed order."
    edge_case_taxon: vendor-specific-protocol-quirk

cross_language:
  go_artifacts:
    bidder_dir: adapters/huaweiads/
    package_name: huaweiads
    bidder_constant: openrtb_ext.BidderHuaweiAds
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/huaweiads/
    bidder_class: HuaweiAdsBidder
    config_class: HuaweiAdsConfiguration
    yaml_path: src/main/resources/bidder-config/huaweiads.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/huaweiads/
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: false
    package_directory_mismatch: false
    multi_file_layout: true
    custom_unmarshaljson_present: false
  go_specific_concerns: []
  java_specific_concerns:
    - "Bidder<HuaweiAdsRequest> generic — port to Java fan-out into model/request/HuaweiAdsRequest DTO + companion model/response/HuaweiAdsResponse. Go side likely uses a struct named openrtb_ext.HuaweiAdsRequest in same package as adapter."
    - "TitleCase brand acronym preserved in 14+ class names (HuaweiAds*, HuaweiAdSlotBuilder, HuaweiAdmBuilder, HuaweiAdsTest); Go-side files use lowercase huaweiads_ prefix — round-trip port must apply Title-case rule on file/class boundary."
    - "Nested ExtraInfo configuration class (huaweiads/nextmillennium pattern) — Go-side equivalent is likely a config flag struct passed to Builder via ExtraAdapterInfo string parsed at boot."
    - "HMAC-SHA-256 implementation must use UTF-8 encoding and lowercase hex output to match Go side's crypto/hmac + encoding/hex.EncodeToString. Apache commons-codec Hex.encodeHexString outputs lowercase by default — confirmed byte-equal contract."
    - "ClientTimeFormatter uses Java's DateTimeFormatter pattern `yyyy-MM-dd HH:mm:ss.SSSZ` matching Go's reference time `2006-01-02 15:04:05.000-0700`. Round-trip parser must accept BOTH variants (with-offset and without-offset)."
    - "Auth header data input includes `nonce + \":POST:/ppsadx/getResult\"` — the path string is hardcoded; cross-language byte-equality of HMAC depends on bit-identical apiKey and message strings."
    - "5 region endpoints (chinese, russian, european, asian + fallback) plus closeSiteSelectionByCountry kill-switch — Go side likely has equivalent ExtraInfo dispatch with same 57-country EUROPEAN allowlist."
    - "Country code fallback chain: device.geo.country → user.geo.country → mccmnc[0]→alpha2 → ZA. Go side likely uses identical chain in CountryCodeMapper."
    - "Application-status retcode windows: success [<=200, 204, 206, 300..399, >=600] — error windows (200,300) excl 204/206 and [400,600). Asymmetric: codes outside both windows fall through silently as success — Go side must mirror this bit-for-bit."
    - "Per-ad retcode30 second dimension (Ad30.retcode30 must == 200) — orthogonal to top-level response retcode. Both must hold for an ad to be considered."
    - "Two parseImpExt calls per cycle (makeHttpRequests + makeBids) — Go-side parity check: do they cache the parsed ExtImpHuaweiAds across the round-trip, or also re-parse?"
    - "Bidder-params JSON SHA differs across languages: Go file has CRLF endings (sha256 c2d5585c27...); Java file has LF endings + trailing newline (sha256 ce8ea45365...). Content semantically identical. R5 cross-language assertion FAILS on whitespace bytes alone."
    - "DEFAULT_BID_CURRENCY=CNY (not USD) — vendor-specific. Go side must hold same default."
    - "Custom CreativeType offset of +100 in buildBanner (`type > 100 ? type - 100 : type`) — vendor-specific protocol quirk. Go side must have identical offset."
    - "MonitorEventType.USER_CLOSE expands to TWO VAST Tracking elements (skip + closeLinear) — Go side must emit identical concatenation."
    - "PkgNameConvert keyword check uses `> 0` not `>= 0` — bundle starting with the keyword is NOT matched (position 0 ignored). This is semantic: Go regex must mirror this off-by-one."
    - "isTestAuthorization is typed String, not Boolean, and is NOT declared in bidder-params/huaweiads.json — runtime escape hatch. Go side may have same field type."
  port_lineage:
    source_language: go
    source_pr: null
    destination_language: java
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - hmac-cross-language-byte-equality
      - retcode-application-status-handling
      - region-endpoint-dispatch
      - title-case-acronym-preservation
      - nested-extrainfo-config
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg
