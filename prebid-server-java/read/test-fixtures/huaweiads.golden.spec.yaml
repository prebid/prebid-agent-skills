      - name: makeHeaders
        signature: "private static MultiMap makeHeaders(BidRequest bidRequest, ExtImpHuaweiAds extImp)"
      - name: makeAuthorization
        signature: "private static String makeAuthorization(ExtImpHuaweiAds extImp)"
      - name: encrypt
        signature: "private static String encrypt(String message, String key)"
      - name: validateRetcode
        signature: "private static void validateRetcode(Integer retcode, String reason)"
      - name: extractBids
        signature: "private List<BidderBid> extractBids(HuaweiAdsResponse response, BidRequest bidRequest)"
      - name: makeBidderBids
        signature: "private List<BidderBid> makeBidderBids(HuaweiAdsResponse response, Map<String, Imp> slotIdToImpMap)"
      - name: getMediaType
        signature: "private static BidType getMediaType(Imp imp)"
      - name: getCurrency
        signature: "private static Optional<String> getCurrency(List<Content> contentList)"
      - name: makeBid
        signature: "private Bid makeBid(Ad30 ad, Imp imp, BidType mediaType, Content content)"
      - name: getNurl
        signature: "private String getNurl(List<Monitor> monitorList)"
  make_bids:
    response_type: custom
    custom_response_type: HuaweiAdsResponse
    http_status_handling:
      kind: framework-default
      notes: "No explicit HTTP status branching — relies on framework defaults; primary success/error gating is done via the application_status_handling retcode field below."
    application_status_handling:
      kind: retcode-field
      field: retcode
      success_codes: [200, 204, 206]
      error_codes:
        - "201..299 (exclusive of 200, 204, 206) — matches retcode > 200 && retcode < 300 && retcode != 204 && retcode != 206"
        - "400..599 inclusive — matches retcode >= 400 && retcode < 600"
      notes:
        - "validateRetcode at HuaweiAdsBidder line 244-250: throws PreBidException(\"HuaweiAdsResponse retcode: \" + retcode + \" , reason: \" + reason) when (retcode > 200 && retcode < 300 && retcode != 204 && retcode != 206) OR (retcode >= 400 && retcode < 600)."
        - "Retcodes <= 200 (i.e. 200 itself and any anomalous below-200 values) and 300..399 and >=600 fall through to extractBids without raising — the retcode==200 path proceeds to bid extraction; other unhandled ranges are silently treated as success."
        - "Within multi-ad responses, each Ad30.retcode30 must equal 200 to be eligible (line 281: !Objects.equals(ad.getRetCode(), 200) → continue) — this is a SECOND retcode dimension at the per-ad level (Ad30.retcode30 with @JsonProperty(\"retcode30\"))."
    bid_type_resolution:
      method_chain:
        - method: by-imp-mediatype
          fallback_action: next
          field: imp.video
          notes: "if (imp.getVideo() != null) → BidType.video"
        - method: by-imp-mediatype
          fallback_action: next
          field: imp.native
          notes: "else if (imp.getXNative() != null) → BidType.xNative"
        - method: by-imp-mediatype
          fallback_action: next
          field: imp.audio
          notes: "else if (imp.getAudio() != null) → BidType.audio (then later thrown as 'no support bidtype: audio' in makeBid)"
        - method: hardcoded
          hardcoded_value: BidType.banner
          fallback_action: return-default
          notes: "default branch in getMediaType (line 308)"
      default_value: banner
      multi_format_detection: strict
      notes:
        - "getMediaType at HuaweiAdsBidder line 300-310 uses if/else-if chain over imp.getVideo, imp.getXNative, imp.getAudio, falling to banner. Then makeBid (line 321) uses switch over BidType to dispatch to admBuilder.buildBanner / buildVideo / buildNative; audio explicitly throws PreBidException(\"no support bidtype: audio\")."
    bid_pointer_pattern: indexed-iteration
    bid_pointer_go_sibling: null
    currency_overwrite_safety: passthrough-from-response
    notes_currency:
      - "DEFAULT_BID_CURRENCY constant is CNY (line 61). getCurrency returns first non-blank Content.cur; if none found, defaults to CNY."
      - "Bid.price set from Content.price directly (no currency conversion). Comment in code: 'The bidder has already helped us automatically convert the currency price, here only the CNY price is filled in'."

