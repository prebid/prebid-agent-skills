      value: "Digest username=<publisherId>,realm=ppsadx/getResult,nonce=<currentTimeMillis>,response=<HMAC-SHA256(nonce:POST:/ppsadx/getResult, publisherId:ppsadx/getResult:signKey)>,algorithm=HmacSHA256,usertype=1,keyid=<keyId>"
    - name: User-Agent
      value: "<bidRequest.device.ua> (set only when device.ua is non-blank)"
  authentication_kind: hmac-digest
  authentication_input:
    - "ExtImpHuaweiAds.publisherId (used as Digest username AND as part of apiKey)"
    - "ExtImpHuaweiAds.signKey (used as third segment of apiKey, the HMAC secret)"
    - "ExtImpHuaweiAds.keyId (used as Digest keyid)"
    - "System.currentTimeMillis() (nonce; per-request timestamp)"
    - "Hardcoded \"POST:/ppsadx/getResult\" path string in signed payload"
    - "Hardcoded \"ppsadx/getResult\" realm and apiKey-segment string"
  authentication_algorithm: HMAC-SHA-256
  authentication_output_encoding: hex (lowercase)
  notes:
    - "makeAuthorization at HuaweiAdsBidder line 201-215 and encrypt at line 217-227. Uses Apache commons-codec HmacUtils.getInitializedMac(HmacAlgorithms.HMAC_SHA_256, key.getBytes(UTF_8)) and Hex.encodeHexString."
    - "Format string literal: \"Digest username=%s,realm=ppsadx/getResult,nonce=%s,response=%s,algorithm=%s,usertype=1,keyid=%s\""
    - "apiKey is built as `publisherId.trim() + \":ppsadx/getResult:\" + signKey.trim()`; data is `nonce + \":POST:/ppsadx/getResult\"`."
    - "Cross-language R5: SHA256 of the same (data, key) byte strings must match between Go and Java implementations — both use UTF-8 encoding and lowercase hex output."

