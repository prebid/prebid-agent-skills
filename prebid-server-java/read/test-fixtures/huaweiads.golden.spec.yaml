      notes:
        - "EXT_IMP_TYPE_REFERENCE: TypeReference<ExtPrebid<?, ExtImpHuaweiAds>> at HuaweiAdsBidder line 56."
        - "parseImpExt called once per Imp inside makeHttpRequests (line 122) and again per Imp inside makeBids (line 265) to rebuild slotId→Imp map — duplicate work but no caching."
    endpoint_resolution:
      kind: runtime-region-selection
      mechanism_go: null
      mechanism_java: custom-resolver-class
      macro_field_set: []
      template_params_struct_field_count: null
      notes:
        - "HuaweiEndpointResolver.resolve(countryCode) chooses among five endpoints: chineseEndpoint, russianEndpoint, europeanEndpoint, asianEndpoint, or fallback endpointUrl."
        - "closeSiteSelectionByCountry config flag (=\"1\") forces use of endpointUrl regardless of countryCode."
        - "CHINESE: {CN}; RUSSIAN: {RU}; EUROPEAN: 57-country alpha-2 set including AX, AL, AD, AU, AT, BE, BA, BG, CA, HR, CY, CZ, DK, EE, FO, FI, FR, DE, GI, GR, GL, GG, VA, HU, IS, IE, IM, IL, IT, JE, YK, LV, LI, LT, LU, MT, MD, MC, ME, NL, AN, NZ, NO, PL, PT, RO, MF, VC, SM, RS, SX, SK, SI, ES, SE, CH, TR, UA, GB, US, MK, SJ, BQ, PM, CW; default ASIAN."
        - "CountryCodeResolver pulls countryCode from device.geo.country, then user.geo.country, then device.mccmnc[0]→alpha2 fallback (defaults to ZA)."
    helpers:
