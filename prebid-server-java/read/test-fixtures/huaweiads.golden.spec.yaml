spring_config:
  factory_class: HuaweiAdsConfiguration
  factory_method: huaweiAdsBidderDeps
  property_source_path: classpath:/bidder-config/huaweiads.yaml
  bidder_creator_lambda: |
    config -> {
        final ExtraInfo extraInfo = config.getExtraInfo();
        return new HuaweiAdsBidder(
                mapper,
                new HuaweiAdSlotBuilder(mapper),
                new HuaweiAppBuilder(extraInfo.getPkgNameConvert()),
                new HuaweiDeviceBuilder(mapper, new ClientTimeFormatter(clock)),
                new HuaweiNetworkBuilder(),
                new HuaweiAdmBuilder(mapper),
                new CountryCodeResolver(countryCodeMapper),
                new HuaweiEndpointResolver(
                        config.getEndpoint(),
                        extraInfo.getChineseEndpoint(),
                        extraInfo.getRussianEndpoint(),
                        extraInfo.getEuropeanEndpoint(),
                        extraInfo.getAsianEndpoint(),
                        extraInfo.getCloseSiteSelectionByCountry()));
    }
  configuration_properties_class:
    name: HuaweiAdsConfigurationProperties
    extends: BidderConfigurationProperties
    extra_fields:
      - name: extraInfo
        type: ExtraInfo
        validations:
          - "@Valid"
          - "@NotNull"
          - "default = new ExtraInfo()"
    nested_classes:
      - name: ExtraInfo
        annotations: [Data, NoArgsConstructor]
        access: "private static"
        fields:
          - { name: pkgNameConvert, type: "List<PkgNameConvert>" }
          - { name: closeSiteSelectionByCountry, type: String }
          - { name: chineseEndpoint, type: String }
          - { name: russianEndpoint, type: String }
          - { name: europeanEndpoint, type: String }
          - { name: asianEndpoint, type: String }
        notes:
          - "Edge case: Java port stores 5 region-specific endpoints in a nested ExtraInfo class on top of the parent endpoint. Configured via YAML extra-info: section."
          - "Reference list explicitly mentions huaweiads/nextmillennium as the two adapters with nested ExtraInfo class."
