quirks:
  - id: three-step-bid-type-method-chain
    file: src/main/java/org/prebid/server/bidder/aax/AaxBidder.java
    summary: "getBidType (lines 94-98) uses ObjectUtil.firstNonNull over [bidTypeFromExt, bidTypeFromImp]; bidTypeFromExt (lines 100-113) reads bid.ext.adCodeType and returns null on missing/unsupported, bidTypeFromImp (lines 115-140) requires exactly one media type on the matched imp or throws PreBidException 'Unable to fetch mediaType in multi-format'. Encoded as 3-step method_chain[by-bid-ext-typed-field -> by-imp-mediatype -> throw] with strict multi_format_detection (canonical example for the rules-list refactor)."
    edge_case_taxon: incomplete-classification
  - id: forced-usd-currency
    file: src/main/java/org/prebid/server/bidder/aax/AaxBidder.java
    summary: "resolveBidderBid (line 91) calls BidderBid.of(bid, bidType, USD_CURRENCY) — currency is hardcoded to USD regardless of bidResponse.cur or upstream signal. Surfaces as currency_overwrite_safety: unguarded-hardcoded."
    edge_case_taxon: unguarded-currency-overwrite
  - id: ext-struct-absent-but-params-required
    file: src/main/resources/static/bidder-params/aax.json
    summary: "Bidder declares cid+crid as required string params but ships NO ExtImpAax POJO under proto/openrtb/ext/request/aax/. AaxBidder never unmarshals imp.ext (mutates_request: false, imp_ext_unmarshal.kind: none). The params are validated by JSON Schema only and the upstream bidder reads them from imp.ext.bidder.{cid,crid} verbatim."
    edge_case_taxon: incomplete-classification
  - id: bidder-params-sha-divergence-from-go
    file: src/main/resources/static/bidder-params/aax.json
    summary: "Java JSON schema lacks the minLength: 1 constraints that Go's static/bidder-params/aax.json applies to cid and crid. SHAs differ: Java=c71febfe..., Go=543bb3ef.... Cross-language R5 fidelity violation."
    edge_case_taxon: port-fidelity-divergence
  - id: passthrough-default-request
    file: src/main/java/org/prebid/server/bidder/aax/AaxBidder.java
    summary: "makeHttpRequests (lines 44-47) is a single-line BidderUtil.defaultRequest passthrough — no mutation, no batching, no per-imp split. The Java side mirrors Go's similarly minimal MakeRequests (which directly json.Marshal's the request)."
    edge_case_taxon: incomplete-classification

cross_language:
  go_artifacts:
    bidder_dir: adapters/aax/
    package_name: aax
    bidder_constant: openrtb_ext.BidderAax
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/aax/
    bidder_class: AaxBidder
    config_class: AaxConfiguration
    yaml_path: src/main/resources/bidder-config/aax.yaml
    proto_dir: null
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: false
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: go
    source_pr: null
    destination_language: java
    destination_pr: null
    fidelity_review_themes:
      - bid-type-3-step-chain
      - hardcoded-usd-currency
      - bidder-params-schema-drift
  go_specific_concerns: []
  java_specific_concerns:
    - "AaxBidder constructor (line 39-42) calls HttpUtil.validateUrl(endpointUrl) — invalid endpoint URLs throw IllegalArgumentException at bean construction (covered by creationShouldFailOnInvalidEndpointUrl test)."
    - "AaxConfiguration.resolveEndpoint (lines 44-46) substitutes {{PREBID_SERVER_ENDPOINT}} with HttpUtil.encodeUrl(externalUrl) at bean wiring time; the substitution happens once before the bidder is constructed, NOT per-request."
    - "Java endpoint URL embeds the ?src= query parameter inline as part of {{PREBID_SERVER_ENDPOINT}} substitution; Go's aax.go builds the same query parameter at runtime via net/url Query/RawQuery in buildEndpoint (lines 136-149). Cross-language: same observable URL, different mechanism."
    - "ObjectUtil.firstNonNull (org/prebid/server/util/ObjectUtil.java) walks Supplier<T>... until one returns non-null — drives the by-bid-ext-typed-field -> by-imp-mediatype chain order; the second supplier's PreBidException propagates as the terminal throw step rather than being caught inside firstNonNull."
    - "bidTypeFromExt (lines 100-113) maps adCodeType strings 'banner'/'native'/'video' to BidType.banner/xNative/video respectively — note Java's BidType.xNative (the Java POJO renames native due to keyword collision)."
    - "bidTypeFromImp (lines 115-140) accumulates a counter across banner/video/xNative non-null tests on each matching imp; counter != 1 throws regardless of whether counter==0 (no media types) or counter>=2 (multi-format) — both surfaced under the same 'Unable to fetch mediaType in multi-format' message."
    - "AaxConfiguration declares no custom BidderConfigurationProperties subclass; the bidderCreator lambda receives the default BidderConfigurationProperties and only reads config.getEndpoint()."
    - "bidsFromResponse (lines 68-81) uses defensive Stream pipeline with three Objects::nonNull filters across SeatBid, SeatBid.Bid, and Bid — flattens via Collection::stream + flatMap; bid_pointer_pattern: flatten-streams."
    - "extractBids (lines 61-66) early-returns Collections.emptyList() when bidResponse is null OR seatbid is empty — pairs with framework-default HTTP status validation."
    - "AaxBidderTest.makeBidsShouldReturnErrorIfBidExtContainUnsupportedMediaType (lines 224-239) covers the case where bid.ext.adCodeType='audio' (unsupported in switch -> null), causing the chain to fall through to bidTypeFromImp; the imp has no media type set, counter==0, throws — concrete witness for step 3 of the method_chain."
  reviewer_cohort:
    go: []
    java:
      - CTMBNara
      - AntoxaAntoxic
    cross_language_coordinator: bretg
