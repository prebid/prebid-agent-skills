      - name: resolveEndpoint
        signature: "private String resolveEndpoint(String sourceSupplyId)"
      - name: extractBids
        signature: "private static List<BidderBid> extractBids(BidResponse bidResponse, List<BidderError> errors)"
      - name: makeBid
        signature: "private static BidderBid makeBid(Bid bid, String currency, List<BidderError> errors)"
      - name: getBidType
        signature: "private static BidType getBidType(Bid bid, List<BidderError> errors)"
      - name: resolvePriceMacros
        signature: "private static Bid resolvePriceMacros(Bid bid)"
  make_bids:
    response_type: BidResponse
    custom_response_type: null
    bid_type_resolution:
      method_chain:
        - method: bid-mtype-switch              # Java 21 switch expression on bid.getMtype(): 1=banner, 2=video, 4=native, null/default=error. Audio (3) NOT supported. Per-bid error filter: bad mtype causes that bid to be filtered, processing continues. Go aborts whole MakeBids on first bad mtype.
          hardcoded_value: null
          fallback_action: filter-bid
      default_value: null
      multi_format_detection: none
    http_status_handling:
