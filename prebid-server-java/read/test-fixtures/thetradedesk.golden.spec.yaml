quirks:
  - id: bid-post-processing-macro-master-sample
    file: src/main/java/org/prebid/server/bidder/thetradedesk/TheTradeDeskBidder.java
    summary: "ADR-007 F4 CANONICAL MASTER SAMPLE. resolvePriceMacros(bid) helper substitutes `${AUCTION_PRICE}` into bid.nurl, bid.adm, and bid.burl using `StringUtils.replace` (null-safe). Number formatting: `BigDecimal.toPlainString()` (preserves source scale, arbitrary precision). Defensive null-check: `price != null ? price.toPlainString() : \"0\"`. Mutation idiom: `bid.toBuilder().nurl(...).adm(...).burl(...).build()` (immutable rebuild). Runs AFTER getBidType (Go runs BEFORE — order divergence). 8 dedicated unit tests cover null/zero/multi-occurrence/high-precision."
    edge_case_taxon: bid-post-processing-macro
  - id: java-edge-case-19-alternate-naming
    file: src/main/java/org/prebid/server/bidder/thetradedesk/
    summary: "Bidder package contains ONLY `TheTradeDeskBidder.java`. No Util/Helper/Model classes. Java edge case #19 alternate naming. Same pattern as emxdigital, adkerneladn, freewheelssp."
    edge_case_taxon: yaml-field-name-typo
  - id: ttd-alias-tilde-stub-java-only
    file: src/main/resources/bidder-config/thetradedesk.yaml
    line: 4
    summary: "`aliases.ttd: ~` — tilde-stub alias-back form (minimal). Java-only declaration. Go has NO `ttd.yaml` or any equivalent. Hosts using `bidders=ttd` succeed against Java but fail against Go (Rule-33-style alias-graph divergence)."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: bid-type-mtype-only-per-bid-filter
    file: src/main/java/org/prebid/server/bidder/thetradedesk/TheTradeDeskBidder.java
    summary: "getBidType uses Java 21 switch expression on bid.getMtype() (1=banner, 2=video, 4=native, null/default=error). Audio (3) NOT supported. On unrecognized mtype: appends `BidderError.badServerResponse(\"could not define media type for impression: <impid>\")` to errors list, returns null → that bid is filtered. Go side aborts whole MakeBids on first bad mtype (terminal). Cross-language behavioral asymmetry on partial-bad responses."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: macro-replace-after-bid-type-resolution
    file: src/main/java/org/prebid/server/bidder/thetradedesk/TheTradeDeskBidder.java
    summary: "resolvePriceMacros runs AFTER getBidType in makeBid: only bids that classify successfully get processed. Go runs BEFORE getBidType. Functionally equivalent because Go aborts on bad mtype, but the ordering is a Rule 5 mutation-flow asymmetry."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: number-format-bigdecimal-preserves-scale
    file: src/main/java/org/prebid/server/bidder/thetradedesk/TheTradeDeskBidder.java
    summary: "`BigDecimal.toPlainString()` preserves source scale (`1.50` → `\"1.50\"`) and supports arbitrary precision. Go's `strconv.FormatFloat(price, 'f', -1, 64)` drops trailing zeros (`1.50` → `\"1.5\"`) and limits to ~16 significant digits. For typical 2-3 decimal bid prices, semantically equivalent; for high-precision inputs (>15 sig digits like `123456789.123456789`), Go and Java produce DIFFERENT substituted result strings."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: null-price-defensive-handling
    file: src/main/java/org/prebid/server/bidder/thetradedesk/TheTradeDeskBidder.java
    summary: "Explicit null-check: `price != null ? price.toPlainString() : \"0\"`. If bid.price is null, substitution uses `\"0\"`. Go side relies on float64 zero-value (no nil-check); both converge on `\"0\"` substitution but through different mechanisms."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: stringutils-replace-null-safe
    file: src/main/java/org/prebid/server/bidder/thetradedesk/TheTradeDeskBidder.java
    summary: "`org.apache.commons.lang3.StringUtils.replace(input, search, replacement)` is null-safe — returns null if input is null, replaces all occurrences otherwise. Go's `strings.ReplaceAll` works on Go strings (which can't be nil). Equivalent end-state behavior."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: supply-id-regex-full-input-match
    file: src/main/java/org/prebid/server/bidder/thetradedesk/TheTradeDeskBidder.java
    summary: "`Pattern.compile(\"([a-z]+)$\").matcher(supplyId).matches()` — Java's `matches()` requires the WHOLE input to match the pattern. Go uses `regexp.Match` (substring match — returns true on partial match). Subtle correctness divergence: input like `\"ABCabc\"` — Go matches the trailing `abc` (returns true), Java rejects (whole input must be lowercase). Real cross-language fidelity gap with potentially material implications for hosts."
    edge_case_taxon: yaml-field-name-typo
  - id: supply-id-error-message-bidder-concept
    file: src/main/java/org/prebid/server/bidder/thetradedesk/TheTradeDeskBidder.java
    summary: "Validation error message: `\"SupplyId must be a simple string provided by TheTradeDesk\"` (uses bidder-concept name `SupplyId`). Go uses Go-config-field name: `\"ExtraAdapterInfo must be a simple string provided by TheTradeDesk\"`. Same template structure; first word divergent. Reveals Java picks bidder-facing concept while Go picks host-config-facing field name."
    edge_case_taxon: yaml-field-name-typo
  - id: typed-extra-info-supplyid-config
    file: src/main/java/org/prebid/server/spring/config/bidder/TheTradeDeskConfiguration.java
    summary: "Configuration uses a TYPED inner class `ExtraInfo` with `String supplyId` field. Spring property: `adapters.thetradedesk.extra-info.supplyId`. Go uses a flat string field `config.ExtraAdapterInfo`. Java's typed pattern is more structured — different per-language config conventions."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: url-encoded-supply-id-substitution
    file: src/main/java/org/prebid/server/bidder/thetradedesk/TheTradeDeskBidder.java
    summary: "`endpointUrl.replace(SUPPLY_ID_MACRO, HttpUtil.encodeUrl(supplyId))` — Java URL-encodes the supplyId before substitution. Go uses raw substitution via `macros.ResolveMacros` (no URL-encoding). For lowercase-only valid inputs (which is the regex constraint), encoding is no-op so URLs are byte-equal. But the divergence becomes observable if regex validation is bypassed or extended."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: usersync-empty-default-still-wired
    file: src/main/java/org/prebid/server/spring/config/bidder/TheTradeDeskConfiguration.java
    summary: "`usersyncerCreator(UsersyncerCreator.create(externalUrl))` — Java still wires up usersync infrastructure even though the YAML has no usersync URL config. Java edge: empty default usersyncer is registered. Same as Go's stance (host must configure)."
    edge_case_taxon: yaml-field-name-typo

cross_language:
  go_artifacts:
    bidder_dir: adapters/thetradedesk/
    package_name: thetradedesk
    bidder_constant: openrtb_ext.BidderTheTradeDesk
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/thetradedesk/
    bidder_class: TheTradeDeskBidder
    config_class: TheTradeDeskConfiguration
    yaml_path: src/main/resources/bidder-config/thetradedesk.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/thetradedesk/
  port_concerns:
    aliases_inverted: true                    # Java has `ttd: ~` tilde-stub; Go has no equivalent. Rule-33 alias-graph divergence.
    yaml_unification: false
    mutation_idiom_divergence: true           # Go shallow-copy + in-place pointer; Java Lombok toBuilder immutable rebuild
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: null
    destination_language: null
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - bid-post-processing-macro              # F4 master sample — CONFIRMED
      - mutation-idiom-tobuilder               # Rule 5
      - macro-form-divergence                  # Rule 11 (endpoint URL macro syntax)
      - alias-presence-divergence              # Rule 33-style ttd asymmetry (Java only)
      - error-message-style                    # Rule 41 (ExtraAdapterInfo vs SupplyId; mtype error wording)
      - regex-match-semantics-divergence       # Go substring vs Java full-input match
      - number-formatting-precision-divergence # strconv.FormatFloat 'f' -1 vs BigDecimal.toPlainString
      - bid-type-error-handling-divergence     # Go terminal vs Java per-bid filter
      - cross-language-byte-divergence         # Rule 38 (tabs vs 2-space)
      - typed-extra-info-supplyid-java
  go_specific_concerns: []
  java_specific_concerns:
    - "Java edge case #19 alternate naming: `TheTradeDeskBidder.java` is the SOLE class in the package."
    - "ADR-007 F4 master sample: `resolvePriceMacros(bid)` substitutes `${AUCTION_PRICE}` into nurl/adm/burl via `StringUtils.replace` (null-safe). 8 dedicated unit tests."
    - "Number formatting: `BigDecimal.toPlainString()` preserves source scale and arbitrary precision. Go's `strconv.FormatFloat 'f' -1 64` drops trailing zeros + ~16 sig digits. High-precision inputs differ across languages."
    - "Macro-replace order: AFTER getBidType. Go runs BEFORE. Rule 5 mutation-flow asymmetry."
    - "Bid-type error path: per-bid filter via `errors.add(BidderError.badServerResponse(...))`; bad bid is dropped, others continue. Go aborts whole MakeBids."
    - "Constructor 3-arity (endpointUrl, mapper, supplyId). Distinct from typical 2-arity. Configuration uses typed `ExtraInfo` inner class with `String supplyId` field."
    - "URL-encoding asymmetry: Java's `endpointUrl.replace(SUPPLY_ID_MACRO, HttpUtil.encodeUrl(supplyId))`. Go uses raw substitution. For lowercase-only valid inputs, no-op."
    - "Regex match-semantics: Java `matches()` (full-input). Go `regexp.Match` (substring). Real correctness divergence for mixed inputs."
    - "ttd alias is Java-only (`aliases.ttd: ~` tilde-stub). Go has no equivalent. Hosts using bidders=ttd succeed against Java but fail against Go."
    - "Currency: per-bid attachment via `BidderBid.of(bid, type, bidResponse.getCur())`. Go propagates once at BidderResponse.Currency level."
