    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: null
      mechanism_java: typeref-extprebid        # mapper.convertValue(imp.getExt(), TYPE_REFERENCE).getBidder()
      target_type: ExtImpTheTradeDesk
      wrapper_type: null
    endpoint_resolution:
      kind: template-macro
      mechanism_go: null
      mechanism_java: string-replace            # endpointUrl.replace("{{SupplyId}}", HttpUtil.encodeUrl(...)) — URL-encodes the supplyId. Go does NOT URL-encode (raw substitution). For lowercase-only valid inputs the encoding is no-op.
      macros_used: ["SupplyId"]
    helpers:
      - name: parseExtImp
        signature: "private ExtImpTheTradeDesk parseExtImp(Imp imp)"
      - name: extractSupplySourceId
