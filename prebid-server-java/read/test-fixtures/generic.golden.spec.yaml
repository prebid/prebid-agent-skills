quirks:
  - id: bidder-class-at-bidder-root-no-subdir
    file: src/main/java/org/prebid/server/bidder/GenericBidder.java
    summary: "GenericBidder.java lives directly in src/main/java/org/prebid/server/bidder/ rather than in a per-bidder subdirectory bidder/generic/. Unique among production bidders — every other adapter has its own subdirectory. Side effect: helper proto types like ExtImp{Bidder} have no canonical home, but generic has no params POJO so this is moot. Test code DOES live under the canonical bidder/generic/ subdirectory (GenericBidderTest.java)."
    edge_case_taxon: incomplete-classification
  - id: configuration-class-naming-variant-bidderconfiguration
    file: src/main/java/org/prebid/server/spring/config/bidder/GenericBidderConfiguration.java
    summary: "Spring config class is named GenericBidderConfiguration (with Bidder infix) rather than the canonical GenericConfiguration pattern used by all other bidders. config_class_name_pattern: <Name>BidderConfiguration. Only generic uses this naming variant."
    edge_case_taxon: incomplete-classification
  - id: bidderutil-defaultrequest-thin-wrapper
    file: src/main/java/org/prebid/server/bidder/GenericBidder.java
    summary: "makeHttpRequests is a single-line delegation to BidderUtil.defaultRequest(bidRequest, endpointUrl, mapper) at line 38. The helper handles HTTP method, headers, impIds population, body encoding, and payload attachment in one call. Generic is the canonical thin-wrapper baseline — no request body modification at all (openrtb2-passthrough)."
    edge_case_taxon: incomplete-classification
  - id: bidderutil-getbidtype-shared-helper
    file: src/main/java/org/prebid/server/bidder/GenericBidder.java
    summary: "extractBids delegates BidType resolution to BidderUtil.getBidType(bid, impMap) at line 66. The shared helper resolves BidType from imp media types (banner > video > xNative > audio > banner-default fallback when imp is missing). Cross-corpus baseline behaviour for by-imp-mediatype with lenient multi-format detection."
    edge_case_taxon: incomplete-classification
  - id: bidder-yaml-as-multi-alias-vendor
    file: src/main/resources/bidder-config/generic.yaml
    summary: "generic.yaml carries 7 disabled aliases (genericAlias, adrino, ccx, infytv, zeta_global_ssp, blue, cwire) — each fully-fledged with their own meta-info, vendor-id, and (some) usersync blocks. The 'generic' adapter is overloaded as a generic-OpenRTB facade that other bidders alias into rather than running their own implementations."
    edge_case_taxon: tilde-alias-syntax
  - id: minimal-spring-config-only-mapper
    file: src/main/java/org/prebid/server/spring/config/bidder/GenericBidderConfiguration.java
    summary: "Constructor takes only endpointUrl and JacksonMapper — no currencyConversionService, no co-located helper classes. Minimum-viable Spring DI baseline (arity 2). Useful as a port-fidelity reference: any bidder requiring more collaborators is doing more work than the OpenRTB-passthrough baseline."
    edge_case_taxon: incomplete-classification
  - id: example-property-placeholder-params-schema
    file: src/main/resources/static/bidder-params/generic.json
    summary: "bidder-params/generic.json declares a single 'exampleProperty' field with no required[] array — placeholder schema for the canonical generic-OpenRTB facade. No matching ExtImpGeneric POJO exists in proto/openrtb/ext/request/, so the field is never deserialized at runtime."
    edge_case_taxon: incomplete-classification
  - id: integration-test-multi-folder-layout
    file: src/test/resources/org/prebid/server/it/openrtb2/generic/
    summary: "Integration tests live under TWO sibling folders: openrtb2/generic/ (4 files, simple auction) and openrtb2/generic_core_functionality/ (6 files, includes cache request/response pair). java_it_folder_naming: multi-folder. The _core_functionality suffix is unique to generic — used as the cross-cutting end-to-end smoke test for the framework rather than for the bidder itself."
    edge_case_taxon: incomplete-classification

cross_language:
  go_artifacts:
    bidder_dir: null
    package_name: null
    bidder_constant: null
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/
    bidder_class: GenericBidder
    config_class: GenericBidderConfiguration
    yaml_path: src/main/resources/bidder-config/generic.yaml
    proto_dir: null
  port_concerns:
    aliases_inverted: false
    yaml_unification: false
    mutation_idiom_divergence: false
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage: null
  go_specific_concerns: []
  java_specific_concerns:
    - "GenericBidder is Java-only; no corresponding adapter exists at /tmp/prebid-server-go/adapters/generic/. The Go side has no 'generic' bidder constant in openrtb_ext nor any static/bidder-params/generic.json. R5 cross-language SHA256 parity is N/A (singleton)."
    - "GenericBidder.java is the only concrete bidder implementation file at src/main/java/org/prebid/server/bidder/ root level. All other files at that level are framework infrastructure (Bidder.java interface, BidderCatalog, HttpBidderRequester, Usersyncer, etc.). Port skills targeting Java MUST honour this no-subdir layout for generic specifically."
    - "GenericBidderConfiguration violates the convention <Name>Configuration adopted by all other bidders (KoblerConfiguration, OptidigitalConfiguration). Spring config naming pattern <Name>BidderConfiguration is unique to generic. Port skills must NOT regenerate this as GenericConfiguration."
    - "BidderUtil.defaultRequest(bidRequest, endpointUrl, mapper) at line 38 is the canonical thin-adapter helper. It handles: HttpMethod.POST, HttpUtil.headers() default Content-Type, impIds(bidRequest) for the impIds tracking field, mapper.encodeToBytes(bidRequest) for the body, and payload(bidRequest) for the response correlation. Anyone using this helper signals openrtb2-passthrough request_body kind."
    - "BidderUtil.getBidType(bid, impMap) at line 66 returns BidType.banner as the default when imp is missing AND when no media type is set on the imp. Order-of-preference: banner > video > xNative > audio. Lenient multi-format detection — never throws."
    - "Empty-seatbid shortcircuit at lines 51-54 returns Collections.emptyList() before stream pipeline. Paired with framework-default HTTP status handling. Generic uses framework-default-plus-empty-seatbid-shortcircuit pattern."
    - "Stream pipeline at lines 61-67 uses three Objects::nonNull filters across SeatBid, SeatBid.Bid, and Bid (defensive against null entries). flatMap(Collection::stream) flattens before mapping each Bid to BidderBid.of(bid, BidderUtil.getBidType(bid, impMap), bidResponse.getCur())."
    - "extractBids passes bidResponse.getCur() as the currency for each BidderBid — passthrough-from-response, no overwrite, no guard. Empty/missing bidResponse.cur is allowed downstream."
    - "Constructor calls HttpUtil.validateUrl(Objects.requireNonNull(endpointUrl)) at line 32 — invalid URL triggers IllegalArgumentException at bean construction (covered by creationShouldFailOnInvalidEndpointUrl test at line 43-45)."
    - "DecodeException catch at line 46-48 returns Result.withError(BidderError.badServerResponse(e.getMessage())) — does not throw, returns single-error Result. The error type is bad_server_response (string-typed enum)."
    - "GenericBidderTest is a hand-written JUnit class (10 @Test methods) at src/test/java/org/prebid/server/bidder/generic/GenericBidderTest.java — note the canonical bidder/generic/ subdir for tests, even though the production code is at bidder/ root. Tests extend VertxTest (canonical harness)."
    - "Integration test GenericTest extends IntegrationTest (not VertxTest), wires WireMock stubs at /generic-exchange path, and uses singletonList('generic') as the bidder list. Located at src/test/java/org/prebid/server/it/GenericTest.java with a single @Test method."
    - "test-application.properties contains 16 lines registering the generic adapter and 7 aliases (genericAlias, adrino, blue, ccx, cwire, infytv, zeta_global_ssp) — each with .enabled=true and .endpoint=http://localhost:8090/{name}-exchange. test_application_properties_entries_added: 16 (largest of any bidder)."
    - "bidder-config/generic.yaml endpoint is 'https://' literal (line 3) — placeholder value for the disabled-by-default parent. The 7 aliases each carry their own real endpoint URLs and meta-info. Generic-as-overload pattern: the parent is a registration shell, the aliases are the working bidders."
    - "BidderUtil class import at line 15 is the shared utility — generic uses TWO of its functions: defaultRequest (request shaping) and getBidType (response shaping). Together these two helpers ARE the entire adapter behaviour. Counts as a degenerate case for port-fidelity comparison."
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg
