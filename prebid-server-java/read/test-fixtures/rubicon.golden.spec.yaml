deploy_time_tokens:
  - token: REGION
    file: src/main/resources/bidder-config/rubicon.yaml
    line: 7
    notes: |
      Operator must substitute REGION with one of {exapi-us-east, exapi-us-west, exapi-apac, exapi-eu}
      pre-deployment per the YAML comment (line 5-6). The token is NOT a Java template macro - it
      is a literal substring in the endpoint URL: `https://REGION.rubiconproject.com/a/api/exchange`.
      No runtime substitution exists in RubiconBidder; endpoint is read verbatim from cfg.getEndpoint()
      via the bidder_creator_lambda (RubiconConfiguration line 54). Distinct from runtime
      template-macro endpoint construction.

quirks:
  - id: deploy-time-region-token
    file: src/main/resources/bidder-config/rubicon.yaml
    summary: "Endpoint URL contains literal `REGION` placeholder that operator must substitute pre-deployment to one of {exapi-us-east, exapi-us-west, exapi-apac, exapi-eu}. Not a Java template macro. Surfaced separately under deploy_time_tokens[]."
    edge_case_taxon: port-fidelity-divergence
  - id: format-split-deals-split-composition
    file: src/main/java/org/prebid/server/bidder/rubicon/RubiconBidder.java
    summary: "makeHttpRequests applies TWO ordered batching rules: (1) format-split via createMultiFormatRequests (line 258) when ExtImpRubicon.bidonmultiformat=true, AND (2) deals-split via createDealsRequests (line 1451) when imp.pmp.deals is non-empty. Composition is per-imp inside createImpHttpRequests (line 303): format-split first, then deals-split applied to each format-specific request."
    edge_case_taxon: port-fidelity-divergence
  - id: pre-built-basic-auth-header
    file: src/main/java/org/prebid/server/bidder/rubicon/RubiconBidder.java
    summary: "Authorization: Basic <base64(xapiUsername:xapiPassword)> is constructed once in the constructor at line 222 via headers(xapiUsername, xapiPassword) helper (lines 382-390) and stored in MultiMap headers field. Every HttpRequest reuses the same MultiMap (line 1441). Pre-built once, not per-request."
    edge_case_taxon: port-fidelity-divergence
  - id: xapi-credentials-as-yaml-extra-fields
    file: src/main/resources/bidder-config/rubicon.yaml
    summary: "YAML declares `XAPI.Username` and `XAPI.Password` under adapters.rubicon (lines 41-43). These are mapped to a private static nested XAPI class inside RubiconConfigurationProperties (RubiconConfiguration lines 85-94) and surfaced via cfg.getXapi().getUsername()/getPassword() in the bidder_creator_lambda. Not present in the standard BidderConfigurationProperties surface."
    edge_case_taxon: port-fidelity-divergence
  - id: xapi-tracker-yaml-only
    file: src/main/resources/bidder-config/rubicon.yaml
    summary: "Go yaml has `xapi.tracker: SAME_AS_USERNAME` field; Java yaml does NOT include `tracker` and the Java RubiconConfiguration.XAPI nested class has no tracker field. Cross-language asymmetry — Go side stores tracker but Java side discards it."
    edge_case_taxon: port-fidelity-divergence
  - id: currency-conversion-bidrequest-context
    file: src/main/java/org/prebid/server/bidder/rubicon/RubiconBidder.java
    summary: "convertBidFloorCurrency (line 657-668) calls currencyConversionService.convertCurrency(bidFloor, bidRequest, bidFloorCurrency, XAPI_CURRENCY) — 4-arg Java signature with bidRequest passed for time-context. Go counterpart uses 3-arg ConvertCurrency. Cross-language port concern."
    edge_case_taxon: currency-conversion-bidrequest-context
  - id: mutation-idiom-tobuilder
    file: src/main/java/org/prebid/server/bidder/rubicon/RubiconBidder.java
    summary: "Mutation throughout uses Lombok toBuilder().build() — Imp (line 437), Banner (line 1476), Source (line 1399), Regs (line 1429), Metric (line 577), as well as createSingleRequest's bidRequest.toBuilder() (line 437). Every entity is rebuilt immutably; the input BidRequest is never mutated."
    edge_case_taxon: mutation-idiom-tobuilder
  - id: tk-xint-query-augmentation-via-uribuilder
    file: src/main/java/org/prebid/server/bidder/rubicon/RubiconBidder.java
    summary: "makeUri (line 450) appends ?tk_xint=<integration> via org.apache.http.client.utils.URIBuilder when bidRequest.ext.prebid.integration is non-blank. URI construction with URIBuilder rather than string-replace is rare in Java adapters."
    edge_case_taxon: port-fidelity-divergence
  - id: bidtype-from-imp0-throws-on-audio
    file: src/main/java/org/prebid/server/bidder/rubicon/RubiconBidder.java
    summary: "bidType helper (line 1736) resolves response BidType from bidRequest.imp[0]'s media-type only — first-imp-only resolution. Throws PreBidException(`Unsupported bid mediaType`) on imp[0] audio (impType collapses audio→banner only when banner==null && xNative==null path doesn't match — coverage gap)."
    edge_case_taxon: port-fidelity-divergence
  - id: response-type-custom-rubicon
    file: src/main/java/org/prebid/server/bidder/rubicon/proto/response/RubiconBidResponse.java
    summary: "makeBids decodes to RubiconBidResponse (line 318) — a custom Lombok @Value @Builder type, not com.iab.openrtb.response.BidResponse. RubiconBid carries extra fields (admNative, wratio, hratio, qagmediarating, language) on top of standard Bid. Java pattern of custom response type."
    edge_case_taxon: port-fidelity-divergence
  - id: flexible-extension-property-copy
    file: src/main/java/org/prebid/server/bidder/rubicon/RubiconBidder.java
    summary: "copyProperties helper (line 1405-1411) carries unknown properties from source FlexibleExtension to a target FlexibleExtension via getProperties()/addProperties(). Used in makeSource (line 1397) and makeRegs (line 1427) to preserve unknown ext fields after rebuild."
    edge_case_taxon: port-fidelity-divergence
  - id: heaviest-multi-file-layout
    file: src/main/java/org/prebid/server/bidder/rubicon/
    summary: "29 Java source files: 1 implementation (RubiconBidder.java, 1751 LOC) + 25 proto/request DTOs + 3 proto/response DTOs. Heaviest multi-file adapter in the Java codebase. All DTOs are co-located under bidder/rubicon/proto/{request,response}/."
    edge_case_taxon: multi-file-layout-justified
  - id: 145-handwritten-test-methods
    file: src/test/java/org/prebid/server/bidder/rubicon/RubiconBidderTest.java
    summary: "RubiconBidderTest declares 145 @Test methods across 4116 LOC — by far the largest unit test suite for any Java bidder. setUp uses @BeforeEach (not counted)."
    edge_case_taxon: multi-file-layout-justified
  - id: aliases-not-inverted
    file: src/main/resources/bidder-config/rubicon.yaml
    summary: "Java declares `magnite` as alias of rubicon under adapters.rubicon.aliases.magnite (lines 11-13). Go has no `magnite` alias. Asymmetric alias surface — Java parent surface differs from Go (where magnite is a separate adapter or absent)."
    edge_case_taxon: port-fidelity-divergence
  - id: cur-suppressed-not-mutated
    file: src/main/java/org/prebid/server/bidder/rubicon/RubiconBidder.java
    summary: "createSingleRequest (line 444) sets `.cur(null)` to suppress the upstream currency list and `.ext(null)` to suppress the upstream ExtRequest. Comment on line 444: `// suppress currencies`."
    edge_case_taxon: port-fidelity-divergence

cross_language:
  go_artifacts:
    bidder_dir: adapters/rubicon/
    package_name: rubicon
    bidder_constant: openrtb_ext.BidderRubicon
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/rubicon/
    bidder_class: RubiconBidder
    config_class: RubiconConfiguration
    yaml_path: src/main/resources/bidder-config/rubicon.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/rubicon/
  port_concerns:
    aliases_inverted: true
    yaml_unification: true
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: true
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: null
    destination_language: shared-genesis
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - currency-conversion-bidrequest-context
      - mutation-idiom-tobuilder
      - basic-auth-header-construction
      - format-split-deals-split-composition
      - deploy-time-region-token
  go_specific_concerns:
    - "Go side keeps `xapi.tracker` field; Java side discards it. Port concern: if Java grows a feature using tracker, this YAML field would need to be added to the XAPI nested class in RubiconConfiguration."
    - "Go static/bidder-params/rubicon.json has NO trailing newline (2608 bytes); Java has trailing newline (2610 bytes). Go also normalizes the description text `Can this ad be skipped (0 = no, 1 = yes)` (no leading space inside parens) while Java keeps `Can this ad be skipped ( 0 = no, 1 = yes)` (extra space). SHA differs (Go: f1aa818fa0af09c4cf5143f3c70edba541500f43f2f7e9e121cb4f865d379380; Java: 382bb51ff23caa9305f4351b15c0f1fe7f249bdbf1308398cd912c95ce10d41f) — R5 cross-language SHA contract VIOLATED. Operationally the schemas express the same constraints; the only diff is whitespace and one description string. A reconciliation PR could collapse these on either side."
    - "Go yaml has `disabled: true` (line 8); Java yaml has no `disabled` field (Java defaults to `enabled: true`). Cross-language deployment-state asymmetry: Go ships rubicon disabled-by-default; Java ships it enabled."
    - "Go capabilities split has both `app` and `site` mediaTypes; Java identical. Confirmed cross-language parity for `bidder_info.capabilities`."
    - "Go gvl_vendor_id=52; Java gvl_vendor_id=52. Confirmed parity."
  java_specific_concerns:
    - "RubiconConfiguration.XAPI nested class has no `tracker` field; Java side cannot consume the Go yaml `xapi.tracker: SAME_AS_USERNAME` value. If a future port adds tracker dependency, the nested class must grow a field."
    - "RubiconBidder constructor at line 195 has 13 parameters — heaviest Java constructor. The bidder_creator_lambda passes BIDDER_NAME ('rubicon') as the first arg (used for floorResolver context line 558) — port concern: Go's RubiconAdapter struct does not carry bidderName, suggesting it inlines `\"rubicon\"` directly."
    - "RubiconConfigurationProperties.apexRendererUrl carries @NotNull validation but DEFAULT_VALUE is the YAML field `apex-renderer-url`. The bidder_creator_lambda forwards config.getApexRendererUrl() to the bidder constructor (line 60). Used by makeBids in resolveRendererUrl (line 1638) to set ExtBidPrebidMeta.rendererUrl on outstream video bids."
    - "Pre-built basic-auth header lives in MultiMap field on the bidder instance — consequence: the bidder is NOT thread-safe with respect to header mutation, but because MultiMap is read-only after construction this is fine. Go side computes auth header per-request inside makeRequest (or similar) — divergent threading model."
    - "extractTargeting override (line 326) is a Rubicon-specific Bidder interface method — most Java adapters do NOT override extractTargeting. Used in AMP flow to inject Rubicon-specific RubiconTargetingExtRp.targeting key/values into the AMP response. Distinguishes Rubicon as the de facto AMP-targeting reference."
    - "29-file proto layout (25 request + 3 response + 1 implementation): Java's heaviest multi-file adapter. All DTOs use Lombok @Value @Builder, suggesting they were ported from Go's struct definitions one-by-one rather than synthesized."
    - "test-application.properties registers 9 entries for rubicon (lines 487-495) including alias `adapters.rubicon.aliases.magnite.endpoint` for IT exercising the alias mapping."
