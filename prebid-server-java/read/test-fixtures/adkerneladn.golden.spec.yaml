code:
  package_or_class: AdkernelAdnBidder
  directory_name: adkerneladn                 # Lowercase Java package directory
  package_directory_mismatch: false
  file_layout:
    kind: single-file
    files:
      - name: AdkernelAdnBidder.java          # SOLE class in the package — Java edge case #19 alternate naming
        role: implementation
        loc: 280
  imports:
    has_jsonutil: false
    has_template_engine: false                # No template engine; plain String.replace for endpoint URL
    has_currency_helper: false
  make_requests:
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
    batching:
      applied_in_order: true
      rules:
        - kind: per-key                       # Map<ExtImpAdkernelAdn, List<Imp>> grouping by full ext POJO (effectively per-pubId since pubId is the sole field). Cross-language symmetric with Go.
          group_key: imp.ext.bidder.pubId
    mutation:
      mutates_request: true
      go_idiom: null
      java_idiom: lombok-tobuilder            # impBuilder.toBuilder() chained calls; immutable rebuild pattern
      entity_strategies:
        Imp: immutable-rebuild                # impBuilder with ext(null), modified banner/video, secure(...) etc.
        Banner: immutable-rebuild             # bannerBuilder with W/H from format[0] if missing, format(emptyList()) or format(subList(1, ...))
        Video: immutable-rebuild
        Site: immutable-rebuild               # siteBuilder.publisher(null).domain("")
        App: immutable-rebuild                # appBuilder.publisher(null) only
        Source: none
        Device: none
        User: none
        Cur: none
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: null
      mechanism_java: typeref-extprebid       # mapper.mapper().convertValue(imp.getExt(), TypeReference<ExtPrebid<?, ExtImpAdkernelAdn>>{}).getBidder()
      target_type: ExtImpAdkernelAdn
      wrapper_type: null
    endpoint_resolution:
      kind: template-macro
      mechanism_go: null
      mechanism_java: string-replace
      macros_used: ["PublisherID"]
    helpers:
      - name: extractImpExt
        signature: "private ExtImpAdkernelAdn extractImpExt(Imp imp)"
      - name: dispatchImpressions
        signature: "private Map<ExtImpAdkernelAdn, List<Imp>> dispatchImpressions(List<Imp> imps, List<BidderError> errors)"
      - name: compatImpression
        signature: "private static Imp compatImpression(Imp imp)"
      - name: compatBannerImpression
        signature: "private static Imp.ImpBuilder compatBannerImpression(Imp.ImpBuilder impBuilder, Imp imp)"
      - name: compatBanner
        signature: "private static Banner compatBanner(Banner banner)"
      - name: compatSite
        signature: "private static Site compatSite(Site site)"
      - name: compatApp
        signature: "private static App compatApp(App app)"
      - name: makeUrl
        signature: "private String makeUrl(ExtImpAdkernelAdn extImp)"
      - name: getType
        signature: "private static BidType getType(String impId, List<Imp> imps)"
  make_bids:
    response_type: BidResponse
    custom_response_type: null
    bid_type_resolution:
      method_chain:
        - method: imp-id-correlation          # Iterate source imps; if matching imp had banner → BidType.banner, else BidType.video. Cross-language symmetric with Go.
          hardcoded_value: null
          fallback_action: classify-as-video
      default_value: video
      multi_format_detection: none
    http_status_handling:
      kind: framework-default-plus-empty-seatbid-shortcircuit
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_pointer_pattern: flatten-streams
    bid_pointer_go_sibling: null
    currency_overwrite_safety: passthrough-from-response   # Java forwards `bidResponse.getCur()` per-bid via BidderBid.of(bid, type, bidResponse.getCur()). Go does NOT propagate. Cross-language asymmetry.

