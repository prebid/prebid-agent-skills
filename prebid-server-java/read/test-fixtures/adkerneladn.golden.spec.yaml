quirks:
  - id: rule-46-multi-form-naming
    file: src/main/resources/bidder-config/adkerneladn.yaml
    summary: "ADR-005 RULE_46_PAIRS classifies adkernelAdn↔adkerneladn as `lowercase`. Java reality is multi-form: BIDDER_NAME constant `adkernelAdn` (camelCase, registers with BidderCatalog matching Go); YAML/Spring property key `adkerneladn` (lowercase); class names PascalCase `AdkernelAdn*`; bidder-params filename `adkernelAdn.json` (CAMELCASE — lowercase variant 404s); cookie-family-name `adkernelAdn` (camelCase). Spring property naming convention diverges from public bidder-name contract."
    edge_case_taxon: yaml-field-name-typo
  - id: bidder-params-camelcase-filename
    file: src/main/resources/static/bidder-params/adkernelAdn.json
    summary: "Java bidder-params filename is `adkernelAdn.json` (CAMELCASE) — NOT lowercase. The lowercase variant `adkerneladn.json` returns 404. This breaks the simple \"Java uses lowercase\" assumption. The audit-golden.py cookie_family_name fallback handles this case (cookie-family-name=adkernelAdn matches the actual params filename)."
    edge_case_taxon: yaml-field-name-typo
  - id: java-edge-case-19-alternate-naming
    file: src/main/java/org/prebid/server/bidder/adkerneladn/
    summary: "Bidder package contains ONLY `AdkernelAdnBidder.java`. No `AdkernelAdnUtil`, no separate request/response model classes. Java edge case #19 alternate naming. Same pattern as emxdigital."
    edge_case_taxon: yaml-field-name-typo
  - id: per-pubid-grouped-batching
    file: src/main/java/org/prebid/server/bidder/adkerneladn/AdkernelAdnBidder.java
    summary: "MakeHttpRequests groups imps by `Map<ExtImpAdkernelAdn, List<Imp>>` (effectively per-pubId since pubId is the sole field). One outbound HTTP request per group. Cross-language symmetric with Go's `dispatchImpressions` returning the same map shape."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: imp-ext-strip-after-extraction
    file: src/main/java/org/prebid/server/bidder/adkerneladn/AdkernelAdnBidder.java
    summary: "After extracting ExtImpAdkernelAdn, adapter sets `impBuilder.ext(null)` to suppress forwarding the prebid wrapper to AdKernel's platform. Cross-language symmetric — Go does `imp.Ext = nil`."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: response-validation-exactly-one-seatbid
    file: src/main/java/org/prebid/server/bidder/adkerneladn/AdkernelAdnBidder.java
    summary: "extractBids requires `bidResponse.getSeatbid().size() == 1` exactly. More than one OR zero seatbids → PreBidException. Cross-language symmetric on Go side."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: empty-seatbid-tolerance-asymmetry
    file: src/main/java/org/prebid/server/bidder/adkerneladn/AdkernelAdnBidder.java
    summary: "Java tolerates `bidResponse == null || bidResponse.getSeatbid() == null` (null-check returns empty list). Go would error on count-check failure. Subtle empty-handling divergence."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: currency-propagation-from-response
    file: src/main/java/org/prebid/server/bidder/adkerneladn/AdkernelAdnBidder.java
    summary: "extractBids forwards `bidResponse.getCur()` per-bid via `BidderBid.of(bid, type, bidResponse.getCur())`. Go side does NOT propagate (BidderResponse.Currency left empty). Cross-language behavioral asymmetry — Java-only currency propagation. Same pattern as emxdigital."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: bid-type-imp-id-correlation-default-video
    file: src/main/java/org/prebid/server/bidder/adkerneladn/AdkernelAdnBidder.java
    summary: "getType(impId, imps) iterates source imps. Match has banner → BidType.banner. Otherwise → BidType.video (HARDCODED fallback). NO bid.MType lookup, NO native classification. Cross-language symmetric. Note: Go has a native-impression supplemental fixture, but native bids would be miscategorized as video by this method chain."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: cookie-family-name-camelcase-deliberate
    file: src/main/resources/bidder-config/adkerneladn.yaml
    line: 14
    summary: "`cookie-family-name: adkernelAdn` uses CAMELCASE deliberately — matches BIDDER_NAME constant and Go's registry key. Distinct from the lowercase YAML/Spring property key. Cross-language identity boundary, leveraged by audit-golden.py's cookie_family_name fallback for the params filename mismatch."
    edge_case_taxon: yaml-field-name-typo
  - id: uid-macro-spring-style
    file: src/main/resources/bidder-config/adkerneladn.yaml
    line: 18
    summary: "`uid-macro: '${UID}'` uses Spring `${...}` syntax. Go side uses plain `{UID}`. Cross-language uid-macro syntax divergence (consistent across the Java codebase)."
    edge_case_taxon: yaml-field-name-typo

cross_language:
  go_artifacts:
    bidder_dir: adapters/adkernelAdn/
    package_name: adkernelAdn
    bidder_constant: openrtb_ext.BidderAdkernelAdn
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/adkerneladn/
    bidder_class: AdkernelAdnBidder
    config_class: AdkernelAdnConfiguration
    yaml_path: src/main/resources/bidder-config/adkerneladn.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/adkerneladn/
  port_concerns:
    aliases_inverted: false                   # No aliases on either side
    yaml_unification: false
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: null
    destination_language: null
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - rule-46-naming-normalization-master
      - rule-46-multi-form-internal
      - currency-propagation-java-only
      - bid-type-imp-id-correlation
      - per-pubid-grouped-batching
      - bidder-params-camelcase-filename
      - x-openrtb-version-header-casing
      - cookie-family-name-camelcase-deliberate
  go_specific_concerns: []
  java_specific_concerns:
    - "Tri-form Java naming: BIDDER_NAME constant `adkernelAdn` (camelCase, registers with BidderCatalog matching Go); YAML/Spring property key `adkerneladn` (lowercase); class names PascalCase `AdkernelAdn*`. Spring property naming convention diverges from public bidder-name contract."
    - "Bidder-params filename `adkernelAdn.json` (CAMELCASE — lowercase variant 404s). The audit-golden.py cookie_family_name fallback handles this case automatically (cookie-family-name=adkernelAdn matches the actual params filename)."
    - "cookie-family-name `adkernelAdn` (camelCase) deliberately matches BIDDER_NAME, not the lowercase YAML key. Cross-language identity boundary leveraged by the audit fallback."
    - "Currency: Java forwards `bidResponse.getCur()` per-bid; Go does NOT propagate. Cross-language asymmetry — Java-only currency propagation (same pattern as emxdigital)."
    - "Constructor 2-arity (endpointUrl, mapper) — no currency service injection."
    - "Empty-seatbid tolerance: Java null-checks before iteration; Go would error. Subtle empty-handling divergence."
    - "ExtImpAdkernelAdn uses Lombok @Builder + @Value with EXPLICIT @JsonProperty(\"pubId\") annotation — distinct from the typical Lombok-only pattern (where @Value defaults to Jackson PROPERTY_NAMING_STRATEGY)."
    - "`uid-macro: '${UID}'` uses Spring placeholder syntax. Go uses plain `{UID}`. Cross-language uid-macro syntax divergence (consistent across the Java codebase)."
    - "X-OpenRTB-Version header is mixed-case via HttpUtil.X_OPENRTB_VERSION_HEADER constant. Go uses lowercase `x-openrtb-version`. Wire-level case-insensitive but byte comparison would diverge."
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg
