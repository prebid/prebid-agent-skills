# Java alias structural metadata block: parent linkage, config-form (tilde vs full),
# inherited fields, overridden fields, identifier-rule workaround, fixture-dir
# asymmetry. This is the 152media-specific narrative — the rest of the spec is
# parent-derived.
aliases:
  - bidder_name: 152media
    parent: adkernel
    config_form: tilde_inherit              # YAML value is ~ (null/empty); inherits all parent fields.
    parent_yaml_path: src/main/resources/bidder-config/adkernel.yaml
    parent_yaml_line: 6                     # The "152media: ~" line under adkernel.aliases.
    inherited_fields:                       # All parent fields flow through unchanged.
      - endpoint
      - endpoint-compression
      - meta-info.maintainer-email
      - meta-info.app-media-types
      - meta-info.site-media-types
      - meta-info.vendor-id
      - usersync.cookie-family-name
      - usersync.redirect.url
      - usersync.redirect.support-cors
      - usersync.redirect.uid-macro
    overridden_fields: []                   # tilde_inherit form has no overrides.
    test_assets:
      it_class: OneFiveTwoMediaTest
      it_class_file: src/test/java/org/prebid/server/it/OneFiveTwoMediaTest.java
      fixture_dir: src/test/resources/org/prebid/server/it/openrtb2/152media/
      fixture_file_count: 4
      naming_asymmetry:
        it_class_uses_workaround: true       # "OneFiveTwoMedia" — digit-leading rename.
        fixture_dir_uses_yaml_name: true     # "152media/" — preserves the digit-leading YAML name.
        rationale: "Test class name must be a valid Java identifier; resource directory paths have no such constraint, so the fixture dir keeps the canonical YAML name. This asymmetry is unique to digit-leading bidders."
    test_application_properties_entries:
      - key: adapters.adkernel.aliases.152media.enabled
        value: "true"
        line: 40
      - key: adapters.adkernel.aliases.152media.endpoint
        value: "http://localhost:8090/152media-exchange"
        line: 41

# Code-level naming workaround block. The yaml_name is the canonical lowercase
# form; class_name_root is the Java-identifier-safe TitleCase form used for the
# IT class. Edge case #26 in the Java edge-case taxonomy.
code_naming:
  yaml_name: 152media
  class_name_root: OneFiveTwoMedia
  identifier_workaround: digit-leading-rename
  preserves_acronym_case: false
  notes:
    - "152media starts with the digit '1' which Java rejects as the first character of an identifier."
    - "Convention: spell out each leading digit as English (One, Five, Two), then continue with TitleCase of the rest (Media). Yields 'OneFiveTwoMedia' for the class root."
    - "The IT class file is OneFiveTwoMediaTest.java; the fixture-dir is openrtb2/152media/ (resource paths face no such constraint)."

# Central test-application.properties registry block (Edge case #25). Java
# aliases require their two-line registry append; Go aliases need none.
registry:
  test_application_properties:
    file: src/test/resources/org/prebid/server/it/test-application.properties
    entries_added: 2
    entries:
      - "adapters.adkernel.aliases.152media.enabled=true"
      - "adapters.adkernel.aliases.152media.endpoint=http://localhost:8090/152media-exchange"

quirks:
  - id: identifier-rule-workaround-class-vs-resource-path
    file: src/test/java/org/prebid/server/it/OneFiveTwoMediaTest.java
    summary: "Test class is OneFiveTwoMediaTest (digit-leading rename) but the fixture directory and YAML name remain '152media'. Edge case #26 in the Java edge-case taxonomy: digit-leading bidders cannot be Java class names; convention spells out each leading digit. Resource paths have no such constraint so the fixture dir keeps the canonical name — captures the asymmetry."
    edge_case_taxon: identifier-rule-workaround
  - id: tilde-alias-syntax
    file: src/main/resources/bidder-config/adkernel.yaml
    summary: "152media is declared as 'aliases.152media: ~' under adkernel — the empty-tilde form means the alias inherits every adkernel field unchanged (no overrides). Contrast with the sibling 'xapads' alias which uses a populated full block to override enabled, vendor-id, and usersync."
    edge_case_taxon: tilde-alias-syntax
  - id: per-alias-it-class-required
    file: src/test/java/org/prebid/server/it/OneFiveTwoMediaTest.java
    summary: "Java aliases REQUIRE their own IT class + 4-file fixture set + 2-line test-application.properties append even when the alias is a pure tilde-inherit (zero behavioral divergence from parent). Per-alias IT class is canonical Java pattern (Rule 37). The Go counterpart has no such requirement — Go aliases ship just a 2-line static/bidder-info YAML."
    edge_case_taxon: port-fidelity-divergence
  - id: cross-language-byte-divergence
    file: src/main/resources/static/bidder-params/adkernel.json
    summary: "Java's adkernel.json has different whitespace formatting than Go's adkernel.json (Java sha256 e814426953d0dea7abac9ef9618600fa48a72c934381465a238863384228649c vs Go sha256 388942de93197dd52ce21151cf3f7fddbe499d594f89a5d88ef47a296130f4ed). Schema interpretation is identical (zoneId required integer >= 1) but byte-equality fails Rule R5. This is a parent-level concern, surfaced here for cross-language port awareness on the alias."
    edge_case_taxon: port-fidelity-divergence

cross_language:
  go_artifacts:
    bidder_dir: adapters/adkernel/             # Alias has no own dir; execution rides parent.
    package_name: adkernel                       # Go's 152media has NO package — only static/bidder-info/152media.yaml.
    bidder_constant: openrtb_ext.BidderAdkernel  # Alias has no own constant; parent's constant covers it via core/yaml.go aliases map.
    alias_yaml_path: static/bidder-info/152media.yaml   # GO declares 152media in its OWN file — child->parent direction.
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/adkernel/    # Alias rides parent's bidder dir.
    bidder_class: AdkernelBidder                                     # Alias has no own bidder class.
    config_class: AdkernelConfiguration                              # Alias has no own configuration class.
    yaml_path: src/main/resources/bidder-config/adkernel.yaml        # JAVA declares 152media UNDER parent's aliases map — parent->child direction.
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/adkernel/   # Alias has no own proto dir.
  port_concerns:
    aliases_inverted: true                       # CANONICAL ALIAS-INVERSION CASE. Go: child static/bidder-info/152media.yaml declares "aliasOf: adkernel". Java: parent bidder-config/adkernel.yaml declares "aliases: { 152media: ~ }". Same fact, opposite direction. Rule 33.
    yaml_unification: true                       # Java unifies bidder-info + endpoint + aliases under one bidder-config/adkernel.yaml; Go splits the alias into its own static/bidder-info/152media.yaml file.
    mutation_idiom_divergence: true              # Inherited from parent (adkernel uses lombok-tobuilder Java side, value-mutation Go side).
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: null                        # Alias is not a port-pair on its own; port lineage lives on the parent.
    source_pr: null
    destination_language: null
    destination_pr: null
    fidelity_review_themes: []
  go_specific_concerns: []
  java_specific_concerns:
    - "Per-alias IT class OneFiveTwoMediaTest.java is the digit-leading-bidder canonical example (Edge case #26). Class name 'OneFiveTwoMedia' transliterates each leading digit (1='One', 5='Five', 2='Two') and TitleCases the rest ('Media'). When porting Go alias -> Java alias the porter must apply this rename for ANY digit-leading alias name."
    - "Fixture directory openrtb2/152media/ retains the canonical YAML name despite the IT class rename. This asymmetry between Java identifier rules (apply to class) and resource-path rules (no constraint) is unique to digit-leading bidders."
    - "Tilde-inherit alias form (152media: ~) means zero behavioral divergence from adkernel: same endpoint, same compression, same capabilities, same gvl-vendor-id (14), same usersync — yet 7 files still ship for the alias (1 IT class + 4 fixtures + 2 properties lines). Java-vs-Go test-fixture-cost asymmetry. Compare to Go where 152media is a single 2-line file."
    - "Java's adkernel.json bidder-params is byte-divergent from Go's adkernel.json (whitespace formatting differs). Java sha=e8144269 vs Go sha=388942de. Surfaces as Rule R5 cross-language structural parity violation if both specs are read; impact is at parent (adkernel) not alias (152media), but flagged here for cross-language port awareness."
    - "Go declares 152media gvlVendorID=1111 in static/bidder-info/152media.yaml; Java does NOT override gvl-vendor-id on the 152media alias (tilde_inherit), so Java's effective gvl_vendor_id for 152media inherits adkernel's value of 14. CROSS-LANGUAGE GVL-ID DIVERGENCE — surfaces as a port fidelity violation. The Go alias is overriding while the Java alias is not."
  reviewer_cohort:
    go: []                                       # Alias-only; no per-alias review cohort. Parent (adkernel) cohort applies.
    java: []
    cross_language_coordinator: bretg
