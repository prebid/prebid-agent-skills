code:
  package_or_class: AdverxoBidder
  directory_name: adverxo
  package_directory_mismatch: false
  file_layout:
    kind: single-file                         # bidder package contains only AdverxoBidder.java; helper classes (ExtImpAdverxo) live in the proto package, configuration and tests in their own packages.
    files:
      - name: AdverxoBidder.java
        role: implementation
        loc: 200
  imports:
    has_jsonutil: false                       # Go-only flag.
    has_template_engine: false
    has_currency_helper: true                 # CurrencyConversionService
  make_requests:
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
    batching:
      applied_in_order: true
      rules:
        - kind: per-imp                       # Rule 10 — one HttpRequest per imp
    mutation:
      mutates_request: true
      go_idiom: null
      java_idiom: lombok-tobuilder            # imp.toBuilder().build() + bidRequest.toBuilder()
      entity_strategies:
        Imp: immutable-rebuild                # Rule 5 — copy-then-mutate (Go) ↔ immutable-rebuild (Java)
        Site: none
        App: none
        Source: none
        Banner: none
        Device: none
        User: none
        Cur: none
    imp_ext_unmarshal:
      kind: standard-two-phase                # Rule 1
      mechanism_go: null
      mechanism_java: typeref-extprebid       # TypeReference<ExtPrebid<?, ExtImpAdverxo>>
      target_type: ExtImpAdverxo
      wrapper_type: null
    endpoint_resolution:
      kind: multi-token-substitution
      mechanism_go: null
      mechanism_java: string-replace          # endpointUrl.replace("{{adUnitId}}", ...).replace("{{auth}}", ...)
      macros_used:
        - adUnitId
        - auth
    helpers:
      - name: parseImpExt
        signature: "private ExtImpAdverxo parseImpExt(Imp imp)"
      - name: resolveEndpoint
        signature: "private String resolveEndpoint(ExtImpAdverxo extImp)"
      - name: modifyImp
        signature: "private Imp modifyImp(BidRequest bidRequest, Imp imp)"
      - name: resolveBidFloor
        signature: "private Price resolveBidFloor(Imp imp, BidRequest bidRequest)"
      - name: convertBidFloor
        signature: "private Price convertBidFloor(Price bidFloorPrice, BidRequest bidRequest)"
      - name: createRequest
        signature: "private static BidRequest createRequest(BidRequest originalRequest, Imp modifiedImp)"
      - name: extractBids
        signature: "private List<BidderBid> extractBids(BidResponse bidResponse)"
      - name: makeBid
        signature: "private BidderBid makeBid(Bid bid, String currency)"
      - name: getBidType
        signature: "private static BidType getBidType(Integer mType)"
      - name: processBidMacros
        signature: "private static Bid processBidMacros(Bid bid, String adm)"
      - name: replaceMacro
        signature: "private static String replaceMacro(String input, String value)"
      - name: resolveAdm
        signature: "private static String resolveAdm(String bidAdm, BigDecimal price)"
  make_bids:
    response_type: BidResponse
    custom_response_type: null
    bid_type_resolution:
      method_chain:
        - method: by-bid-mtype                # Rule 23 — switch on bid.getMtype() values 1, 2, 4
          field: bid.mtype
          fallback_action: throw
      default_value: null
      multi_format_detection: strict
    http_status_handling:
      kind: framework-default                 # Java — relies on Vert.x auto-handling via HttpUtil.validateResponse
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_pointer_pattern: flatten-streams      # bidResponse.getSeatbid().stream().flatMap(seatBid -> seatBid.getBid().stream())
    bid_pointer_go_sibling: null
    currency_overwrite_safety: passthrough-from-response

