quirks:
  - id: bid-post-processing-macro
    file: src/main/java/org/prebid/server/bidder/adverxo/AdverxoBidder.java
    summary: "AdverxoBidder.processBidMacros + resolveAdm replace `${AUCTION_PRICE}` macro in bid.adm with the actual bid price after bid-type classification — bid-post-processing pattern (ADR-007 F4 master sample)."
    edge_case_taxon: bid-post-processing-macro
  - id: configuration-naming-bidder-suffix
    file: src/main/java/org/prebid/server/spring/config/bidder/AdverxoBidderConfiguration.java
    summary: "Configuration class is `AdverxoBidderConfiguration` (with the explicit `Bidder` suffix) — Java edge case #19 alternate form. Most Java adapters use `<Name>Configuration`."
    edge_case_taxon: identifier-rule-workaround    # Closest taxon; not a true Java identifier rule but a naming-variance signal

cross_language:
  go_artifacts:
    bidder_dir: adapters/adverxo/
    package_name: adverxo
    bidder_constant: openrtb_ext.BidderAdverxo
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/adverxo/
    bidder_class: AdverxoBidder
    config_class: AdverxoBidderConfiguration
    yaml_path: src/main/resources/bidder-config/adverxo.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/adverxo/
  port_concerns:
    aliases_inverted: true                    # Java parent declares aliases[adport,bidsmind,harrenmedia] in this YAML; Go declares per-alias YAMLs with aliasOf — Rule 33
    yaml_unification: true                    # Java unifies what Go splits — Rule 34
    mutation_idiom_divergence: true           # Java immutable-rebuild ↔ Go in-place — Rule 5
    package_directory_mismatch: false
    multi_file_layout: false                  # bidder package is single-file (AdverxoBidder.java); other artifacts live in sibling packages
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: null
    destination_language: null
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - currency-conversion-bidrequest-context
      - mutation-idiom-tobuilder
      - alias-empire-registration-only
      - bid-post-processing-macro
  go_specific_concerns: []
  java_specific_concerns:
    - "Bean-construction-time URL validation: AdverxoBidder constructor calls HttpUtil.validateUrl(endpointUrl) at line 60. Throws IllegalArgumentException on invalid URL — caught by Spring at startup."
    - "Static TypeReference<ExtPrebid<?, ExtImpAdverxo>> constructed once at class init (line 36)."
    - "Per-imp split: each imp produces a distinct HttpRequest. parseImpExt + resolveEndpoint + modifyImp run per-imp; createRequest wraps the modified imp in a fresh BidRequest via toBuilder().build()."
    - "modifyImp uses BidderUtil.shouldConvertBidFloor + currencyConversionService.convertCurrency with bidRequest passed for time-context — canonical Rule 32 cross-language asymmetry vs Go's 3-arg form."
    - "ExtImpAdverxo uses @Value(staticConstructor = \"of\") — same Lombok shape as Kobler. Less common than @Value @Builder."
    - "Empty-seatbid shortcircuit ordering: extractBids returns Collections.emptyList() BEFORE the seatbid stream when getSeatbid() is null/empty (line 152)."
    - "Stream-pipeline defensive Objects::nonNull filters across getSeatbid → getBid → getBid (line 156-160) — five filters total. Go uses simple range loops without nil checks since Go ranges never iterate over nil-element slots."
    - "${AUCTION_PRICE} macro replacement happens TWICE on native bids: resolveAdm replaces it on the raw adm (line 187), then processBidMacros replaces it again via replaceMacro on the toBuilder-rebuilt bid (line 175). Defensive but unusual — second replacement is a no-op when the first succeeded."
    - "AdverxoBidderConfiguration uses `<Name>BidderConfiguration` naming form — Java edge case #19 alternate. Most Java configs use `<Name>Configuration`."
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg

registry: {}
