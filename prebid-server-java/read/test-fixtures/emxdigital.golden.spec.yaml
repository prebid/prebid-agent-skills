bidder_info:
  endpoint: "https://hb.emxdgt.com"           # Hostname retains legacy EMX domain (`emxdgt.com`) even though maintainer is on `cadent.tv`. Cross-language symmetric with Go side.
  endpoint_construction:
    kind: url-with-query                      # `endpoint?t=<tmax>&ts=<unix>&src=pbserver` — query params built at runtime via String.format
    macros_used: ["t", "ts", "src"]
    macro_syntax: printf
    placeholders_unresolved: []
  endpoint_compression: null                  # Not declared in upstream YAML
  ortb_version: null
  default_enabled: true                       # `enabled` field is the Java-side default — true at the parent level
  modifying_vast_xml_allowed: false
  maintainer:
    email: contactaperturemx@cadent.tv        # Cross-language identical with Go side
  capabilities:
    site:
      mediaTypes:
        - banner
        - video
    app:
      mediaTypes:
        - banner
        - video
  geoscope: []                                # Parent has no geo restriction; alias `cadent_aperture_mx` has [USA, CAN] (alias-only field captured under `aliases:`)
  gvl_vendor_id: 183
  user_sync:
    cookie_family_name: emx_digital           # UNDERSCORED form (matches Go's `emx_digital` core bidder name) — distinct from the YAML key `emxdigital` used by Spring
    iframe:
      url: "https://cs.emxdgt.com/um?ssp=pbs&gdpr={{gdpr}}&gdpr_consent={{gdpr_consent}}&us_privacy={{us_privacy}}&redirect={{redirect_url}}"
      support_cors: false                     # Java-only YAML field (no Go equivalent)
      uid_macro: "$UID"
  yaml_extra_fields:
    supported_vendors: null                   # YAML key is present with a null value (`supported-vendors:` empty entry)
  yaml_field_name_quirks: []

bidder_params_json: |
  {
    "$schema": "http://json-schema.org/draft-04/schema#",
    "title": "EMX Digital Adapter Params",
    "description": "A schema which validates params accepted by the EMX Digital adapter",
    "type": "object",
    "properties": {
      "tagid" : {
        "type": "string",
        "description": "The id of an inventory target"
      },
      "bidfloor": {
        "type": "string",
        "description": "The minimum price acceptable for a bid"
      }
    },
    "required": ["tagid"]
  }
bidder_params_sha256: 0e1252c73f997b35a99dbfaabc83ccf602a0c60de8e9253c0eecdac971dfd6de

params:
  schema_interpretation:
    properties:
      - name: tagid
        type: string
        description: "The id of an inventory target"
        notes:
          - "String type but parsed at runtime via Integer.parseInt — must be a numeric string. NumberFormatException → PreBidException; tagidNumber == 0 → PreBidException."
      - name: bidfloor
        type: string
        description: "The minimum price acceptable for a bid"
        notes:
          - "String type but parsed at runtime via new BigDecimal(String). NumberFormatException is silently swallowed (no error logged); imp returned without bidfloor in that case."
    required_fields:
      - tagid
    flexible_types:
      - field: tagid
        declared_type: string
        runtime_parse: Integer
        rejection_kind: parse-error-or-zero
      - field: bidfloor
        declared_type: string
        runtime_parse: BigDecimal
        rejection_kind: silent-skip-on-parse-error
    combinators_used: []
  ext_struct:
    package: org.prebid.server.proto.openrtb.ext.request.emxdigital
    file: src/main/java/org/prebid/server/proto/openrtb/ext/request/emxdigital/ExtImpEmxDigital.java
    type_name: ExtImpEmxDigital
    fields:
      - name: tagid
        json_tag: tagid                       # Lombok @Value field name matches JSON tag (lowercase Java field, lowercase JSON key) — no @JsonProperty needed
        type_native: String
        omitempty: true
        notes:
          - "Java field is lowercase `tagid` (matching the JSON key directly) — distinct from the typical Java convention of camelCase fields with @JsonProperty annotations"
      - name: bidfloor
        json_tag: bidfloor
        type_native: String
        omitempty: true
        notes:
          - "Lowercase Java field (matches JSON key); String type holds a stringified decimal; parsed via new BigDecimal(String) at runtime"
    custom_unmarshal: false
    custom_unmarshal_accepts: []
  params_test: null

code:
  package_or_class: EmxDigitalBidder
  directory_name: emxdigital
  package_directory_mismatch: false
  file_layout:
    kind: single-file
    files:
      - name: EmxDigitalBidder.java           # SOLE class in the package — Java edge case #19 alternate naming (no separate Util/Helper/Model classes)
        role: implementation
        loc: 268
  imports:
    has_jsonutil: false
    has_template_engine: false
    has_currency_helper: false
  make_requests:
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
    batching:
      applied_in_order: true
      rules:
        - kind: per-batch                     # SINGLE HTTP request for the entire batch — all imps go in one body. Cross-language symmetric with Go.
    mutation:
      mutates_request: true
      go_idiom: null
      java_idiom: lombok-tobuilder            # request.toBuilder().imp(modifiedImps).build() — whole-request immutable rebuild via Lombok builder
      entity_strategies:
        Imp: immutable-rebuild                # imp.toBuilder() then chain setters (tagid, secure, banner/video, bidfloor)
        Banner: immutable-rebuild             # banner.toBuilder() then format(subList)
        Video: immutable-rebuild              # video.toBuilder() then protocols(filtered)
        Site: none
        App: none
        Source: none
        Device: none
        User: none
        Cur: none
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: null
      mechanism_java: typeref-extprebid       # `mapper.mapper().convertValue(imp.getExt(), TypeReference<ExtPrebid<?, ExtImpEmxDigital>>{}).getBidder()`
      target_type: ExtImpEmxDigital
      wrapper_type: null
    endpoint_resolution:
      kind: dynamic-template-string
      mechanism_go: null
      mechanism_java: stringformat-with-instant-now
      macros_used:
        - "t (TMax milliseconds, defaults to 1000 if 0)"
        - "ts (Instant.now().getEpochSecond() — NO testing-mode override; tests use ${json-unit.any-number} placeholders)"
        - "src (literal `pbserver`)"
    helpers:
      - name: makeBidRequest
        signature: "private BidRequest makeBidRequest(BidRequest request)"
      - name: unpackImpExt
        signature: "private ExtImpEmxDigital unpackImpExt(Imp imp)"
      - name: modifyImp
        signature: "private Imp modifyImp(Imp imp, boolean isSecure, ExtImpEmxDigital extImpEmxDigital)"
      - name: modifyImpVideo
        signature: "private Video modifyImpVideo(Video video)"
      - name: modifyImpBanner
        signature: "private Banner modifyImpBanner(Banner banner)"
      - name: cleanProtocol
        signature: "private List<Integer> cleanProtocol(List<Integer> protocols)"
      - name: makeHeaders
        signature: "private MultiMap makeHeaders(BidRequest request)"
      - name: makeUrl
        signature: "private String makeUrl(Long tmax)"
      - name: resolveUrl
        signature: "private static String resolveUrl(BidRequest bidRequest)"
      - name: extractBids
        signature: "private List<BidderBid> extractBids(BidResponse bidResponse)"
      - name: getBidType
        signature: "private static BidType getBidType(String bidAdm)"
  make_bids:
    response_type: BidResponse
    custom_response_type: null
    bid_type_resolution:
      method_chain:
        - method: string-sniff-adm-substring  # `StringUtils.containsAny(bidAdm, "<?xml", "<vast")` — case-SENSITIVE substring match (Go side lowercases AdM first; Java does NOT — case-sensitivity divergence)
          hardcoded_value: null
          fallback_action: classify-as-banner
      default_value: banner
      multi_format_detection: none
    http_status_handling:
      kind: framework-default-plus-empty-seatbid-shortcircuit
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_pointer_pattern: flatten-streams
    bid_pointer_go_sibling: null
    currency_overwrite_safety: passthrough-from-response

