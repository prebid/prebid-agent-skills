quirks:
  - id: java-edge-case-19-alternate-naming
    file: src/main/java/org/prebid/server/bidder/emxdigital/
    summary: "Bidder package contains ONLY `EmxDigitalBidder.java`. No `EmxDigitalUtil`, no separate request/response model classes. Java edge case #19 alternate naming form. Distinct from canonical Java bidders that ship Bidder + Util/Helper classes in the same package."
    edge_case_taxon: yaml-field-name-typo
  - id: tri-form-java-naming
    file: src/main/java/org/prebid/server/spring/config/bidder/EmxDigitalConfiguration.java
    line: 22
    summary: "Three name forms within Java: `BIDDER_NAME = \"emx_digital\"` (underscored — Prebid routing identifier, used in BidderDepsAssembler.forBidder); `@ConfigurationProperties(\"adapters.emxdigital\")` (no underscore — Spring property key); `EmxDigitalBidder/Configuration/ExtImpEmxDigital` (PascalCase). Plus integration test class title-cases break further: `EmxdigitalTest` (not `EmxDigitalTest`) and `CadentApertureMxTest` (not `CadentApertureMXTest`). Rule 46 normalization happens INSIDE the Java side itself."
    edge_case_taxon: yaml-field-name-typo
  - id: bidder-name-vs-yaml-key-divergence
    file: src/main/resources/bidder-config/emxdigital.yaml
    line: 2
    summary: "YAML structure root key is `adapters.emxdigital` (no underscore). Spring class uses `@ConfigurationProperties(\"adapters.emxdigital\")` matching. But the params filename is `emx_digital.json` (with underscore) and BIDDER_NAME constant is `emx_digital`. Cross-name layer asymmetry between Spring property naming and Prebid Core routing identifier."
    edge_case_taxon: yaml-field-name-typo
  - id: cadent-alias-with-geoscope-and-default-disabled
    file: src/main/resources/bidder-config/emxdigital.yaml
    line: 5
    summary: "Alias `cadent_aperture_mx` has BOTH `enabled: false` (default-disabled, Rule 45 instance) AND `geoscope: [USA, CAN]` (alias-only field; geo-restriction). Comment: `# CadentAperture only operates in North America`. Operators must explicitly enable. Cross-language asymmetric — Go has NO yaml alias; both names are core sibling bidders."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: bid-type-string-sniff-case-sensitive
    file: src/main/java/org/prebid/server/bidder/emxdigital/EmxDigitalBidder.java
    summary: "`StringUtils.containsAny(bidAdm, \"<?xml\", \"<vast\")` is CASE-SENSITIVE. Go side lowercases AdM via `strings.ToLower(raw)` first; Java does NOT. Java would miss `<VAST>` uppercase variant. Real Cadent VAST responses likely use lowercase, so this is a latent fidelity gap rather than a current bug."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: currency-propagation-from-response
    file: src/main/java/org/prebid/server/bidder/emxdigital/EmxDigitalBidder.java
    summary: "`extractBids` sets `BidderBid.cur = bidResponse.getCur()` — Java propagates response currency to TypedBid. Go side does NOT propagate (Go's TypedBid has no currency field). Java-only currency propagation. Cross-language behavioral asymmetry."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: no-imp-id-clobber
    file: src/main/java/org/prebid/server/bidder/emxdigital/EmxDigitalBidder.java
    summary: "Java does NOT clobber `bid.impID` with `bid.id`. Go side does (`sb.Bid[i].ImpID = sb.Bid[i].ID`). Cross-language behavioral asymmetry — Java assumes the Cadent server emits Bid.ImpID correctly, while Go preempts."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: no-testing-mode-override
    file: src/main/java/org/prebid/server/bidder/emxdigital/EmxDigitalBidder.java
    summary: "Java's `makeUrl` always uses `Instant.now().getEpochSecond()` for the `ts` query parameter — no testing-mode override. IT tests rely on `${json-unit.any-number}` placeholders for timestamp variance. Go side has a `testing bool` flag pinning ts=2060541160 for golden test stability."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: vast40-protocol-filter-literal-7
    file: src/main/java/org/prebid/server/bidder/emxdigital/EmxDigitalBidder.java
    summary: "`PROTOCOL_VAST_40 = 7` literal int constant; cleanProtocol filters this. Go uses typed `adcom1.CreativeVAST40` constant. Same effect; type-system-divergence."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: bidfloor-parse-error-silent-skip
    file: src/main/java/org/prebid/server/bidder/emxdigital/EmxDigitalBidder.java
    summary: "If bidfloor extension parse to BigDecimal throws NumberFormatException, the imp is returned WITHOUT bidfloor set — the exception is silently swallowed (no error logged). Cross-language symmetric — Go also silently skips on parse failure (sets bidFloor=0 then skips since bidFloor>0 is false)."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: cookie-family-name-underscored
    file: src/main/resources/bidder-config/emxdigital.yaml
    line: 22
    summary: "`cookie-family-name: emx_digital` uses underscored form (matches Go's `emx_digital` core bidder name) — distinct from the YAML key `emxdigital` used by Spring. Cookie family is the cross-language identity boundary."
    edge_case_taxon: yaml-field-name-typo

cross_language:
  go_artifacts:
    bidder_dir: adapters/cadent_aperture_mx/
    package_name: cadentaperturemx
    bidder_constant: openrtb_ext.BidderCadentApertureMX
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/emxdigital/
    bidder_class: EmxDigitalBidder
    config_class: EmxDigitalConfiguration
    yaml_path: src/main/resources/bidder-config/emxdigital.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/emxdigital/
  port_concerns:
    aliases_inverted: true                    # Java declares cadent_aperture_mx as disabled+geo-restricted alias under emxdigital. Go has NO YAML alias — co-registers both as core bidders with shared Builder. Cross-language asymmetry on the alias mechanism (Rule 33-adjacent).
    yaml_unification: false                   # Java has ONE yaml file (emxdigital.yaml with alias block). Go has TWO yaml files (cadent_aperture_mx.yaml + emx_digital.yaml, byte-identical).
    mutation_idiom_divergence: true           # Java uses Lombok toBuilder immutable rebuild; Go uses shallow-copy-then-mutate
    package_directory_mismatch: false         # Java side: package emxdigital in dir emxdigital. Go side has the mismatch (package cadentaperturemx in dir cadent_aperture_mx).
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: null
    destination_language: null
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - bidder-rename-cadent-acquired-emx
      - dual-core-bidder-registration-go
      - parent-with-disabled-alias-java
      - bid-type-string-sniff-case-sensitivity
      - imp-id-clobber-go-only
      - currency-propagation-java-only
      - tri-form-java-naming
      - alias-with-geoscope-and-default-disabled
  go_specific_concerns: []
  java_specific_concerns:
