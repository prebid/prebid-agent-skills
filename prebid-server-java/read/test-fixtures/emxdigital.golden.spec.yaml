code_naming: null

lifecycle:
  rename:
    old_name: emx_digital
    new_name: cadent_aperture_mx
    subtype: java-leads                       # ADR-006 sub-type. Java retains `emxdigital` (legacy EMX brand) as canonical parent with `cadent_aperture_mx` (new Cadent brand) as a disabled+geo-restricted alias under it. Defensible under the parent-canonical interpretation.
    alias_back: true                          # Java DOES use a YAML alias-back: `aliases: { cadent_aperture_mx: { enabled: false, geoscope: [USA, CAN] } }`
    alias_back_form: tilde_inherit_with_geoscope
    package_moves: []
    fixture_dir_moves: []
    yaml_deletes: []
    yaml_adds: []
    merged_at: null
    release: null
    notes:
      - "Cadent acquired EMX Digital; the SSP/exchange product was rebranded to 'Cadent Aperture MX'. Maintainer email is `contactaperturemx@cadent.tv` — same on both sides."
      - "Java retains `emxdigital` as the canonical parent. The new Cadent brand `cadent_aperture_mx` lives ONLY as a disabled+geo-restricted alias under emxdigital.yaml — operators must explicitly enable via `adapters.emxdigital.aliases.cadent_aperture_mx.enabled=true`."
      - "Comment in emxdigital.yaml at the alias block: `# CadentAperture only operates in North America` — explicitly explains the geo-restriction rationale."
      - "Java has only ONE bidder code path (`EmxDigitalBidder`); the alias is purely YAML-declared. No `CadentApertureMxBidder.java`, no `CadentApertureMxConfiguration.java`, no `ExtImpCadentApertureMx.java` exist."
      - "Two integration test classes for one bidder code path: `EmxdigitalTest` (parent regression) and `CadentApertureMxTest` (alias regression). Both hit the same wiremock endpoint `/emx_digital-exchange`."
      - "Go side has dual-core-bidder-registration (BOTH cadent_aperture_mx + emx_digital as siblings sharing one Builder). Java side has parent-with-disabled-alias. Asymmetric topology — both retain both names but with different organizational primacy."
      - "Per ADR-006 LIFECYCLE_PAIRS: ('cadent_aperture_mx', 'emxdigital', 'java-leads', 'Cadent acquired EMX'). The label is empirically defensible (Java has designated a canonical name; Go has not), though strictly the rename is partial on both sides."

