provenance:
  source:
    repo: prebid/prebid-server-java
    ref:
      branch: master
    resolved_commit: a1fe64e123d65a3eb146787e93790ddabb3b4988
    fetch_method: github-raw
  read:
    skill_versions:
      orchestrator: 1.0.0
      read-bidder-config: 1.0.0
      read-bidder-class: 1.0.0
      read-bidder-params-java: 1.0.0
    timestamp_utc: "2026-05-02T00:00:00Z"
    operator: claude-code/opus-4-7
  warnings:
    - type: java-edge-case-19-alternate-naming
      file: src/main/java/org/prebid/server/bidder/emxdigital/
      line: 0
      summary: "The bidder package contains ONLY one class: `EmxDigitalBidder.java`. There is NO `EmxDigitalUtil.java`, no separate request/response model classes — Java edge case #19 (alternate naming form: package has only the Bidder-suffix class). Distinct from canonical Java bidders that ship Bidder + Util/Helper classes in the same package."
    - type: tri-form-java-naming
      file: src/main/resources/bidder-config/emxdigital.yaml
      line: 0
      summary: "Three name forms within the Java side: (1) BIDDER_NAME constant `emx_digital` (underscore — used as Prebid routing identifier and as params filename `emx_digital.json`); (2) YAML/Spring property key `emxdigital` (no underscore — used in `bidder-config/emxdigital.yaml` and `@ConfigurationProperties(\"adapters.emxdigital\")`); (3) Java class names `EmxDigital*` PascalCase (`EmxDigitalBidder`, `EmxDigitalConfiguration`, `ExtImpEmxDigital`). Rule 46 normalization happens INSIDE the Java side itself, not just cross-language. Additionally, the integration test classes break casing further: `EmxdigitalTest` (not `EmxDigitalTest`) and `CadentApertureMxTest` (not `CadentApertureMXTest`)."

