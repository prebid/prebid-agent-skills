quirks:
  - id: bidder-params-sha-conflict-with-go
    file: src/main/resources/static/bidder-params/optidigital.json
    summary: "Java bidder-params JSON is byte-divergent from Go-side optidigital.json (Java sha 93bad2a9..., Go sha 6bc97780...). Same JSON Schema content but reformatted: Go uses 4-space indent with stray blank line + no trailing newline; Java uses 2-space indent + trailing newline. R5 cross-language parity FAIL."
    edge_case_taxon: port-fidelity-divergence
  - id: hardcoded-banner-bid-type
    file: src/main/java/org/prebid/server/bidder/optidigital/OptidigitalBidder.java
    summary: "bidsFromResponse hardcodes BidType.banner for every bid (line 62: BidderBid.of(bid, BidType.banner, bidResponse.getCur())); cannot return non-banner even if upstream replied with one. Mirrors Go-side optidigital hardcoded-bid-type behavior."
    edge_case_taxon: hardcoded-bid-type
  - id: enabled-false-opt-in
    file: src/main/resources/bidder-config/optidigital.yaml
    summary: "YAML declares enabled: false (line 3), flipping the default-enabled bit to false. Operators must opt-in by setting adapters.optidigital.enabled=true. Canonical Java edge case #30 (enabled-false-default)."
    edge_case_taxon: incomplete-classification
  - id: ortb-version-quoted-string
    file: src/main/resources/bidder-config/optidigital.yaml
    summary: "YAML declares ortb-version: \"2.6\" as a quoted string (line 6) so the YAML parser yields a String, not the float 2.6. Canonical Java edge case #29 (ortb-version-quoted)."
    edge_case_taxon: incomplete-classification
  - id: dooh-platform-declared
    file: src/main/resources/bidder-config/optidigital.yaml
    summary: "YAML declares dooh-media-types: [banner] (line 14) — Optidigital is one of the few Java adapters declaring DOOH platform support alongside site/app. Mirrors Go-side capabilities.dooh."
    edge_case_taxon: incomplete-classification
  - id: no-proto-no-imp-ext-parse
    file: src/main/java/org/prebid/server/bidder/optidigital/OptidigitalBidder.java
    summary: "OptidigitalBidder does NOT parse imp.ext.bidder — there is NO ExtImpOptidigital POJO under proto/openrtb/ext/request/optidigital/ (the directory does not exist). makeHttpRequests delegates entirely to BidderUtil.defaultRequest(bidRequest, endpointUrl, mapper) and passes the bidRequest through unchanged. The Go-side adapter ALSO does not parse imp.ext (matching behavior), but Go DOES carry an ImpExtOptidigital struct in openrtb_ext/imp_optidigital.go for params validation. Java skips the POJO entirely; the bidder-params JSON Schema is the only validation surface."
    edge_case_taxon: port-fidelity-divergence
  - id: bidder-class-url-validation-at-construction
    file: src/main/java/org/prebid/server/bidder/optidigital/OptidigitalBidder.java
    summary: "Constructor invokes HttpUtil.validateUrl(Objects.requireNonNull(endpointUrl)) at line 30 — invalid URL triggers IllegalArgumentException at bean construction time. Covered by creationShouldFailOnInvalidEndpointUrl test."
    edge_case_taxon: incomplete-classification

cross_language:
  go_artifacts:
    bidder_dir: adapters/optidigital/
    package_name: optidigital
    bidder_constant: openrtb_ext.BidderOptidigital
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/optidigital/
    bidder_class: OptidigitalBidder
    config_class: OptidigitalConfiguration
    yaml_path: src/main/resources/bidder-config/optidigital.yaml
    proto_dir: null
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: false
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: go
    source_pr: null
    destination_language: java
    destination_pr: prebid/prebid-server-java#4054
    fidelity_review_themes:
      - port-from-go
      - dooh-platform-declared
      - enabled-false-default
      - ortb-version-quoted
  go_specific_concerns: []
  java_specific_concerns:
    - "OptidigitalBidder constructor calls HttpUtil.validateUrl(Objects.requireNonNull(endpointUrl)) at line 30 — invalid URL triggers IllegalArgumentException at bean construction (covered by creationShouldFailOnInvalidEndpointUrl test). Go has no equivalent — Builder() returns nil/error rather than throwing."
    - "makeHttpRequests at line 35-37 collapses to a single delegating call: Result.withValue(BidderUtil.defaultRequest(bidRequest, endpointUrl, mapper)). Go expands this inline (jsonutil.Marshal + http.Header.Add + RequestData{} struct construction + ImpIDs population)."
    - "extractBids/bidsFromResponse pipeline at lines 49-64 uses the Java stream + flatMap idiom with three Objects::nonNull defensive filters across SeatBid, SeatBid.bid, and the flatMap output. Go side uses indexed iteration (for i := range seatBid.Bid) which never visits nil-element slots, so these defensive filters have no Go counterpart."
    - "Empty-seatbid shortcircuit at line 50-52 (CollectionUtils.isEmpty(bidResponse.getSeatbid()) → Collections.emptyList()) is paired with framework-default HTTP status handling — the framework auto-handles 204/4xx/5xx via HttpUtil.validateResponse and the adapter only handles the empty-body case explicitly."
    - "Currency passthrough via bidResponse.getCur() (line 62: BidderBid.of(bid, BidType.banner, bidResponse.getCur())) is the canonical Java passthrough-from-response idiom. Go-side optidigital sets bidResponse.Currency = response.Cur unconditionally (unguarded-currency-overwrite quirk); Java idiom is implicit per-bid currency assignment without overwriting any aggregate state — different shape, equivalent result when response.Cur is non-empty."
    - "OptidigitalConfiguration uses the BASE BidderConfigurationProperties without subclassing (no @Validated inner class declaring extra fields). Spring DI passes the framework-default property set; @PropertySource annotation points at classpath:/bidder-config/optidigital.yaml."
    - "OptidigitalBidder has NO co-located helper classes and NO proto/openrtb/ext/request/optidigital/ directory at all — the imp.ext.bidder payload is never deserialized into a typed POJO. JSON Schema (static/bidder-params/optidigital.json) is the only param validation surface. The Java bidder is structurally minimal: just constructor + makeHttpRequests delegate + makeBids three-method-chain."
    - "Hardcoded BidType.banner inside the per-bid map closure (line 62) means BidType resolution does NOT consult bid.mtype, bid.ext.prebid.type, or imp.banner/video/native discrimination — every bid is unconditionally tagged banner. Go-side optidigital has the same hardcoded behavior; surfaces as quirk hardcoded-bid-type on both sides."
    - "Test class OptidigitalBidderTest extends VertxTest (canonical Java unit-test harness) with 6 hand-written @Test methods covering: invalid-endpoint-construction, request-passthrough, bad-response-decode, null-bidresponse, empty-seatbid, and a happy-path with USD currency assertion (BidderBid.of(..., BidType.banner, \"USD\"))."
    - "Integration test OptidigitalTest extends IntegrationTest with a single @Test method openrtb2AuctionShouldRespondWithBidsFromOptidigital. WireMock stubs POST /optidigital-exchange (the local mock URL) with the test-optidigital-bid-request.json body match and the test-optidigital-bid-response.json mock response. The 4 IT fixtures sum 2392 bytes."
  reviewer_cohort:
    go: []
    java:
      - CTMBNara
    cross_language_coordinator: bretg
