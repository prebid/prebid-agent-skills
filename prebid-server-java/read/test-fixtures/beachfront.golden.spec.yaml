      mechanism_java: typeref-extprebid
      target_type: ExtImpBeachfront
      wrapper_type: null
    endpoint_resolution:
      kind: multi-endpoint-by-mediatype
      mechanism_go: null
      mechanism_java: typed-config-subclass-fields
      macro_field_set: []
      template_params_struct_field_count: null
    helpers:
