        signature: "private String getAppId(ExtImpBeachfront extImpBeachfront, BidType bidType)"
      - name: extractFloor
        signature: "private Price extractFloor(ExtImpBeachfront extImpBeachfront, Imp imp, BidRequest bidRequest)"
      - name: checkFormats
        signature: "private boolean checkFormats(Banner banner)"
      - name: extractBids
        signature: "private List<BidderBid> extractBids(BidderCall<Void> httpCall, BidRequest bidRequest)"
      - name: bidsFromBannerResponse
        signature: "private List<BidderBid> bidsFromBannerResponse(BidderCall<Void> httpCall, BidRequest bidRequest)"
      - name: bidsFromVideoResponse
        signature: "private List<BidderBid> bidsFromVideoResponse(BidderCall<Void> httpCall, BidResponse bidResponse, BidRequest bidRequest)"
  make_bids:
    response_type: Void
    custom_response_type: 'List<BeachfrontResponseSlot> (banner) | BidResponse (video)'
    http_status_handling:
      kind: framework-default-plus-empty-seatbid-shortcircuit
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_type_resolution:
      method_chain:
        - method: by-request-uri-suffix
