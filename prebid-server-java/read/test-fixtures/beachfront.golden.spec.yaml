      - name: makeVideoRequests
        signature: "private List<HttpRequest<Void>> makeVideoRequests(BidRequest bidRequest, List<Imp> imps)"
      - name: parseImpExt
        signature: "private ExtImpBeachfront parseImpExt(Imp imp)"
