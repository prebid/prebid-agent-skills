quirks:
  - id: typed-video-endpoint-config-subclass
    file: src/main/java/org/prebid/server/spring/config/bidder/BeachfrontConfiguration.java
    summary: "BeachfrontConfigurationProperties subclasses BidderConfigurationProperties and adds @NotBlank private String videoEndpoint. Master sample for ADR-007 F1 + Rule 35 typed-config-subclass — Java externalizes the video endpoint as a typed bean field rather than the Go-side opaque ExtraAdapterInfo JSON string."
    edge_case_taxon: spring-config-properties-subclass
  - id: parameterized-request-type-Void
    file: src/main/java/org/prebid/server/bidder/beachfront/BeachfrontBidder.java
    summary: "BeachfrontBidder implements Bidder<Void> rather than Bidder<BidRequest> — the bidder sends custom request bodies (BeachfrontBannerRequest, BeachfrontVideoRequest) per-mediatype, NOT the OpenRTB2 BidRequest. Rule 9 master sample for the Java direction."
    edge_case_taxon: parameterized-request-type
  - id: floor-resolver-helper-class
    file: src/main/java/org/prebid/server/bidder/beachfront/BeachfrontFloorResolver.java
    summary: "Currency-aware bidfloor resolution lives in a dedicated helper class (BeachfrontFloorResolver) injected with CurrencyConversionService. Encapsulates Price + currency conversion logic the Go side handles inline in setBidFloor."
    edge_case_taxon: multi-file-layout-justified
  - id: nurl-vs-adm-video-response-type
    file: src/main/java/org/prebid/server/bidder/beachfront/BeachfrontBidder.java
    summary: "videoResponseType ('nurl' | 'adm') controls bid response format with NURL_VIDEO_ENDPOINT_SUFFIX ('&prebidserver') appended for nurl variant. Mirror of Go-side quirk."
    edge_case_taxon: vendor-specific-protocol-quirk
  - id: multi-endpoint-by-mediatype
    file: src/main/java/org/prebid/server/bidder/beachfront/BeachfrontBidder.java
    summary: "Per-imp routing: imps with valid Banner go to bannerEndpointUrl; imps with Video go to videoEndpointUrl. Master sample for ADR-007 F1 endpoint_resolution.kind: multi-endpoint-by-mediatype."
    edge_case_taxon: multi-endpoint-by-mediatype

cross_language:
  go_artifacts:
    bidder_dir: adapters/beachfront/
    package_name: beachfront
    bidder_constant: openrtb_ext.BidderBeachfront
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/beachfront/
    bidder_class: BeachfrontBidder
    config_class: BeachfrontConfiguration
    yaml_path: src/main/resources/bidder-config/beachfront.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/beachfront/
  port_concerns:
    aliases_inverted: false
    yaml_unification: true
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: true
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: null
    destination_language: null
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - rule-9-custom-request-type
      - rule-35-typed-config-subclass
      - adr-007-f1-multi-endpoint-by-mediatype
      - currency-aware-bidfloor-resolver
  go_specific_concerns: []
  java_specific_concerns:
    - "BeachfrontBidder implements Bidder<Void> — the request body is a custom struct, not OpenRTB2 BidRequest. Framework dispatches the Bidder<Void> path differently from Bidder<BidRequest>; the bidder is responsible for serializing the custom struct to bytes."
    - "BeachfrontConfigurationProperties is declared as a private static inner class inside BeachfrontConfiguration.java rather than a separate file — atypical placement; most adapters that have a config subclass put it in its own file."
    - "BeachfrontFloorResolver helper class is distinct from BeachfrontBidder and lives in the same package directory; unusual extraction granularity (most adapters inline floor resolution)."
    - "BIDDER_NAME = 'BF_PREBID_S2S' (with version '1.0.0') is stamped into outgoing request payloads as adapterName + adapterVersion fields — bidder-side identification not present in OpenRTB."
