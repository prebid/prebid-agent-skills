      applied_in_order: true
      rules:
        - kind: per-imp
    mutation:
      mutates_request: true
      go_idiom: null
      java_idiom: lombok-tobuilder
      entity_strategies:
        Imp: immutable-rebuild
        Site: replace-with-app-synthesis      # If request has Site (no App), Java synthesizes an App via builder and removes Site
        App: synthesize-app-replacement       # If request has App, override App.ID with pub_app_store_id; if Site, synthesize fresh App
        Source: none
        Banner: none
        Device: none
        User: none
        Cur: none
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: null
      mechanism_java: typeref-extprebid
      target_type: ExtImpVungle
      wrapper_type: VungleImpressionExt       # Co-located helper class in `bidder/vungle/model/` package. Wraps `prebid + bidder + vungle` keys.
    endpoint_resolution:
      kind: static
      mechanism_go: null
      mechanism_java: literal
      macros_used: []
    helpers:
      - name: parseExtImp
        signature: "private ExtImpVungle parseExtImp(Imp imp)"
      - name: modifyImp
        signature: "private Imp modifyImp(Imp imp, BidRequest bidRequest, ExtImpVungle extImp, String buyerUid)"
      - name: resolveImpExt
        signature: "private ObjectNode resolveImpExt(Imp imp, ExtImpVungle extImp, String buyerUid)"
      - name: resolveBidFloor
        signature: "private Price resolveBidFloor(Imp imp, BidRequest bidRequest)"
      - name: resolveApp
        signature: "private static App resolveApp(BidRequest bidRequest, ExtImpVungle extImp)"
      - name: resolveSite
        signature: "private static Site resolveSite(BidRequest bidRequest)"
      - name: makeBid
        signature: "private static BidderBid makeBid(Bid bid, String currency)"
  make_bids:
    response_type: BidResponse
    custom_response_type: null
    bid_type_resolution:
