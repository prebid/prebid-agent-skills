quirks:
  - id: site-to-app-synthesis
    file: src/main/java/org/prebid/server/bidder/vungle/VungleBidder.java
    summary: "If bidRequest has Site object (no App), VungleBidder synthesizes an App with `App.ID = extImp.appStoreId` and removes Site. If request has App, copies and overrides App.ID. The outgoing request to Vungle ALWAYS has app context. ADR-007 F3 mediatype-context-rewrite-site-to-app master sample (cross-language symmetric with Go side)."
    edge_case_taxon: mediatype-context-rewrite-site-to-app
  - id: buyer-uid-promotion-to-imp-ext
    file: src/main/java/org/prebid/server/bidder/vungle/VungleBidder.java
    summary: "VungleBidder promotes `bidRequest.user.buyerUid` into the imp.ext.vungle.bid_token field at request-build time. Distinct from publisher-supplied imp ext fields. Cross-language symmetric — Go side does the same promotion (line 70)."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: imp-ext-three-key-wrapper
    file: src/main/java/org/prebid/server/bidder/vungle/model/VungleImpressionExt.java
    summary: "VungleImpressionExt wraps imp.ext with THREE keys: `prebid` (ExtImpPrebid), `bidder` (ExtImpVungle), `vungle` (ExtImpVungle). The `vungle` key carries the same ExtImpVungle as `bidder` but with bid_token populated from buyerUid. Wire-format imp.ext after build has both `bidder` AND `vungle` keys with overlapping content. Cross-language symmetric — Go side does the same via vungleImpressionExt struct embedding."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: hardcoded-video-bid-type
    file: src/main/java/org/prebid/server/bidder/vungle/VungleBidder.java
    summary: "All bids classified BidType.video regardless of bid.mtype. Rule 26 hardcoded fallback (cross-language symmetric with Go)."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: bid-token-snake-case-divergence
    file: src/main/java/org/prebid/server/proto/openrtb/ext/request/vungle/ExtImpVungle.java
    summary: "Java field `bidToken` (camelCase) has NO @JsonProperty annotation, but the wire-format JSON tag should be `bid_token` (snake_case) per the JSON schema. Lombok @Value defaults to Jackson's PROPERTY_NAMING_STRATEGY (likely set globally on JacksonMapper). If the strategy is not snake_case, the field would serialize as `bidToken` and break wire-format parity with Go side (which has explicit `bid_token` JSON tag). Verify the JacksonMapper config — possible cross-language fidelity gap."
    edge_case_taxon: yaml-field-name-typo
  - id: liftoff-alias-back-via-tilde
    file: src/main/resources/bidder-config/vungle.yaml
    summary: "Java handles the phantom liftoff/vungle rename via tilde_inherit alias `aliases: { liftoff: { enabled: false } }`. Operators with `liftoff` config get the vungle adapter (default-disabled, must opt in). LiftoffTest IT class tests this path. Distinct from Go's removed-bidder warning map (which forces operators to update config)."
    edge_case_taxon: bidder-rename-three-step

cross_language:
  go_artifacts:
    bidder_dir: adapters/vungle/
    package_name: vungle
    bidder_constant: openrtb_ext.BidderVungle
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/vungle/
    bidder_class: VungleBidder
    config_class: VungleConfiguration
    yaml_path: src/main/resources/bidder-config/vungle.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/vungle/
  port_concerns:
    aliases_inverted: true                    # Java declares alias `liftoff` under vungle.aliases[]; Go declares NO alias YAML — uses removed-bidder warning map instead. Cross-language asymmetry on alias-back mechanism.
    yaml_unification: true
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: prebid/prebid-server-java#1819
    destination_language: null
    destination_pr: prebid/prebid-server#3024
    fidelity_review_themes:
      - port-fidelity
      - mediatype-context-rewrite-site-to-app
      - buyer-uid-promotion
      - hardcoded-video-bid-type
      - phantom-rename-liftoff-vungle
      - bid-token-snake-case-jackson-mapping
  go_specific_concerns: []
  java_specific_concerns:
    - "VungleImpressionExt (in `bidder/vungle/model/` subpackage) wraps imp.ext with three keys: prebid + bidder + vungle. The `vungle` key carries the same ExtImpVungle as `bidder` but with bidToken populated from request.user.buyerUid. Wire-format imp.ext has overlapping content under bidder vs vungle keys."
    - "Site-to-App synthesis: resolveSite returns null + resolveApp synthesizes (line 130). The outgoing request to Vungle ALWAYS has App.ID = publisher's app_store_id. ADR-007 F3 mediatype-context-rewrite-site-to-app cross-language symmetric with Go."
    - "Hardcoded BidType.video for all bids — Rule 26 master sample. Cross-language symmetric with Go."
    - "ExtImpVungle.bidToken has no @JsonProperty annotation; relies on JacksonMapper's PROPERTY_NAMING_STRATEGY for snake_case conversion to bid_token. Potential cross-language fidelity gap if the global strategy isn't set."
    - "X-OpenRTB-Version: 2.5 header (line 130) — pinned to 2.5; Vungle's upstream may not yet support 2.6 features."
    - "liftoff alias is tilde_inherit + default-disabled (Rule 45 instance + alias-back-via-tilde for the phantom liftoff/vungle rename). Java's LiftoffTest IT class exercises this alias-back path (fixture dir openrtb2/liftoff/). Cross-language asymmetric alias-back: Java tilde-inherit vs Go removed-bidder warning map."
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg
