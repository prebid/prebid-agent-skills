      file: src/main/java/org/prebid/server/proto/openrtb/ext/request/freewheelssp/ExtImpFreewheelSSP.java
      line: 0
      summary: "ExtImpFreewheelSSP has FOUR fields (zoneId + customSiteSectionId + networkId + profileId). Go ImpExtFreewheelSSP has ONLY 1 (ZoneId). Java forwards the extra fields to upstream as snake_case (`custom_site_section_id`, `network_id`, `profile_id`); Go silently drops them. Real cross-language fidelity gap. Java fields lack @JsonProperty annotations on the 3 extras — relies on JacksonMapper's snake_case PROPERTY_NAMING_STRATEGY for serialization."

