      summary: "The bidder package contains ONLY one class: `FreewheelSSPBidder.java`. There is NO separate Util/Helper/Model class — Java edge case #19 (alternate naming form: package has only the Bidder-suffix class). Same pattern as emxdigital and adkerneladn."
    - type: adr-007-f2-label-collision-corrected
      file: src/main/java/org/prebid/server/bidder/freewheelssp/FreewheelSSPBidder.java
      line: 43
      summary: "ADR-007 F2 master claim (freewheelssp = `language-stamped-header-divergence`) was empirically RE-AFFIRMED — Componentid: prebid-go (Go) vs Componentid: prebid-java (Java). The earlier `coverage-report.py:58` framing labeled F2 as `multi-endpoint-by-mediatype` (which is actually F1's master = beachfront); that label-collision was corrected per the ADR-corrections commit. Empirical structural evidence on the SINGLE-endpoint fact: bidder class has ONE `endpointUrl String` field; makeHttpRequests uses `BidderUtil.defaultRequest(...)` with single endpointUrl. Capabilities declare video-only — confirming F2 is about HEADER divergence (Componentid value), not per-mediatype endpoint switching. The `fwssp` alias's different endpoint is at YAML config level (alias-with-different-endpoint pattern), NOT a runtime multi-endpoint switch."
