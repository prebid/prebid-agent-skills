params:
  schema_interpretation:
    properties:
      - name: zoneId
        type: ["integer", "string"]
        description: "Zone ID"
        notes:
          - "FLEXIBLE TYPE — accepts both integer and string. Java uses plain `String zoneId` field; Jackson lenient string coercion handles both forms. Go uses `jsonutil.StringInt` custom type."
    required_fields:
      - zoneId
    flexible_types:
      - field: zoneId
        declared_type: ["integer", "string"]
        runtime_parse: String
        rejection_kind: never
    combinators_used: []
  ext_struct:
    package: org.prebid.server.proto.openrtb.ext.request.freewheelssp
    file: src/main/java/org/prebid/server/proto/openrtb/ext/request/freewheelssp/ExtImpFreewheelSSP.java
    type_name: ExtImpFreewheelSSP
    fields:
      - name: zoneId
        json_tag: zoneId
        type_native: String
        omitempty: true
        notes:
          - "Has explicit @JsonProperty(\"zoneId\") annotation — preserves the camelCase JSON tag even if global Jackson PROPERTY_NAMING_STRATEGY is snake_case."
      - name: customSiteSectionId               # Java-only field; Go ext struct has no equivalent
        json_tag: custom_site_section_id        # NO @JsonProperty annotation — relies on JacksonMapper PROPERTY_NAMING_STRATEGY (snake_case) for wire form
        type_native: String
        omitempty: true
        notes:
          - "Java-only field. Wire form `custom_site_section_id` per JacksonMapper snake_case strategy. Go ext struct has no equivalent — Java forwards to upstream, Go drops."
      - name: networkId                          # Java-only field
        json_tag: network_id
        type_native: String
        omitempty: true
        notes:
          - "Java-only field. Wire form `network_id` per JacksonMapper snake_case strategy."
      - name: profileId                          # Java-only field
        json_tag: profile_id
        type_native: String
        omitempty: true
        notes:
          - "Java-only field. Wire form `profile_id` per JacksonMapper snake_case strategy."
    custom_unmarshal: false
    custom_unmarshal_accepts: []
  params_test: null

