        - kind: per-batch                       # SINGLE outbound HTTP request with all imps. Cross-language symmetric.
    mutation:
      mutates_request: true
      go_idiom: null
      java_idiom: lombok-tobuilder
      entity_strategies:
        Imp: immutable-rebuild                  # impBuilder with ext OVERWRITTEN via mapper.valueToTree(extImpFreewheelSSP) — drops {"bidder":...} wrapper
        Banner: none
        Video: none
        Site: none
        App: none
        Source: none
        Device: none
        User: none
        Cur: none
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: null
      mechanism_java: typeref-extprebid
      target_type: ExtImpFreewheelSSP
      wrapper_type: null
    endpoint_resolution:
      kind: static
      mechanism_go: null
      mechanism_java: literal
      macros_used: []
    helpers:
      - name: parseExtImp
        signature: "private ExtImpFreewheelSSP parseExtImp(Imp imp)"
      - name: modifyImp
        signature: "private Imp modifyImp(Imp imp, ExtImpFreewheelSSP extImpFreewheelSSP)"
      - name: modifyBidRequest
        signature: "private BidRequest modifyBidRequest(BidRequest bidRequest, List<Imp> modifiedImps)"
      - name: headers
        signature: "private MultiMap headers()"
      - name: extractBids
        signature: "private List<BidderBid> extractBids(BidResponse bidResponse)"
      - name: getVideoInfo
        signature: "private static ExtBidPrebidVideo getVideoInfo(Bid bid)"
  make_bids:
    response_type: BidResponse
    custom_response_type: null
    bid_type_resolution:
      method_chain:
        - method: hardcoded                     # Rule 26 hardcoded — `BID_TYPE = BidType.video` static constant. Cross-language symmetric.
          hardcoded_value: BidType.video
          fallback_action: throw
      default_value: video
      multi_format_detection: none
    http_status_handling:
      kind: framework-default-plus-empty-seatbid-shortcircuit
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_pointer_pattern: flatten-streams
    bid_pointer_go_sibling: null
    currency_overwrite_safety: passthrough-from-response   # Java attaches `bidCurrency = bidResponse.getCur()` to EACH BidderBid (per-bid). Go propagates ONCE at BidderResponse.Currency level (per-response). Cross-language asymmetry on propagation level.

