quirks:
  - id: java-edge-case-19-alternate-naming
    file: src/main/java/org/prebid/server/bidder/freewheelssp/
    summary: "Bidder package contains ONLY `FreewheelSSPBidder.java`. No Util/Helper/Model classes. Java edge case #19 alternate naming. Same pattern as emxdigital and adkerneladn."
    edge_case_taxon: yaml-field-name-typo
  - id: adr-007-f2-label-collision-corrected
    file: src/main/java/org/prebid/server/bidder/freewheelssp/FreewheelSSPBidder.java
    summary: "ADR-007 F2 master claim (freewheelssp = language-stamped-header-divergence) RE-AFFIRMED. The label-collision in coverage-report.py:58 (mis-labeling F2 as multi-endpoint-by-mediatype, which is F1's master = beachfront) was corrected per the ADR-corrections commit. Empirical structural evidence on the SINGLE-endpoint fact: bidder has ONE `endpointUrl String` field; makeHttpRequests uses BidderUtil.defaultRequest with single endpointUrl — confirming F2 is about HEADER divergence (Componentid value), not per-mediatype endpoint switching. Capabilities are video-only."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: java-pojo-extra-fields-snake-case
    file: src/main/java/org/prebid/server/proto/openrtb/ext/request/freewheelssp/ExtImpFreewheelSSP.java
    summary: "ExtImpFreewheelSSP has 4 fields (zoneId + customSiteSectionId + networkId + profileId). Only `zoneId` has @JsonProperty annotation; the 3 extras rely on JacksonMapper PROPERTY_NAMING_STRATEGY (snake_case). Wire form: `custom_site_section_id`, `network_id`, `profile_id`. Go ext struct has only `zoneId` — Java forwards the extras, Go drops. Cross-language fidelity gap."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: hardcoded-video-bid-type
    file: src/main/java/org/prebid/server/bidder/freewheelssp/FreewheelSSPBidder.java
    summary: "Static `BID_TYPE = BidType.video` constant used for ALL bids regardless of bid signals. Rule 26 hardcoded fallback. Cross-language symmetric — Go uses `bidType := openrtb_ext.BidTypeVideo`."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: imp-ext-replace-with-inner
    file: src/main/java/org/prebid/server/bidder/freewheelssp/FreewheelSSPBidder.java
    summary: "modifyImp OVERWRITES imp.ext with `mapper.valueToTree(extImpFreewheelSSP)` — drops the {\"bidder\":...} wrapper, replaces with inner ext fields directly. Wire-format imp.ext sent to upstream has only the inner ExtImpFreewheelSSP fields. Cross-language symmetric."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: header-componentid-prebid-java
    file: src/main/java/org/prebid/server/bidder/freewheelssp/FreewheelSSPBidder.java
    summary: "Custom header `Componentid: prebid-java` — Go emits `Componentid: prebid-go`. Intentional byte-level divergence used for upstream routing/analytics."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: per-bid-currency-attachment
    file: src/main/java/org/prebid/server/bidder/freewheelssp/FreewheelSSPBidder.java
    summary: "Java attaches `bidCurrency = bidResponse.getCur()` to EACH BidderBid (per-bid attachment). Go propagates ONCE at BidderResponse.Currency level (per-response). Cross-language asymmetry on currency-propagation level. Functionally equivalent for single-currency responses; can diverge on multi-currency seats."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: error-message-misspelling-infomation
    file: src/main/java/org/prebid/server/bidder/freewheelssp/FreewheelSSPBidder.java
    summary: "Error message uses misspelled \"Infomation\" (sic) instead of \"Information\". Cross-language identical: Go side preserves the same misspelling verbatim."
    edge_case_taxon: yaml-field-name-typo
  - id: error-message-imp-id-vs-go-index
    file: src/main/java/org/prebid/server/bidder/freewheelssp/FreewheelSSPBidder.java
    summary: "Error message references imp by `imp.getId()` (`%s`). Go side uses imp INDEX (`%d` for `i`). Cross-language behavioral asymmetry on error verbosity — Java is more debuggable (imp.id), Go uses positional index."
    edge_case_taxon: yaml-field-name-typo
  - id: bid-video-conditional-population
    file: src/main/java/org/prebid/server/bidder/freewheelssp/FreewheelSSPBidder.java
    summary: "videoInfo (PrimaryCategory + Duration) populated conditionally: PrimaryCategory only when bid.cat non-empty; Duration only when bid.dur > 0. Returns null otherwise. Cross-language symmetric — Go has same conditional checks."
    edge_case_taxon: hardcoded-config-as-anti-pattern
  - id: fwssp-alias-with-endpoint-override
    file: src/main/resources/bidder-config/freewheelssp.yaml
    line: 6
    summary: "fwssp alias has EXPLICIT endpoint override (`https://prebid.v.fwmrm.net/ortb/ssp`), endpoint-compression: gzip, own cookie-family-name (`fwssp`), own iframe URL (different host `user-sync.fwmrm.net`), and own uid-macro (`#{user.id}` Spring style). NOT a typical tilde-inherit alias — alias-with-full-override pattern. Cross-language asymmetric: Go has fwssp as a separate top-level bidder package, NOT a YAML alias."
    edge_case_taxon: hardcoded-config-as-anti-pattern

cross_language:
  go_artifacts:
    bidder_dir: adapters/freewheelssp/
    package_name: freewheelssp
    bidder_constant: openrtb_ext.BidderFreewheelSSP
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/freewheelssp/
    bidder_class: FreewheelSSPBidder
    config_class: FreewheelSSPConfiguration
    yaml_path: src/main/resources/bidder-config/freewheelssp.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/freewheelssp/
  port_concerns:
    aliases_inverted: true                    # Java has fwssp as YAML-internal alias under freewheelssp. Go has fwssp as TOP-LEVEL separate bidder package. Cross-language asymmetric topology on the fwssp sibling.
    yaml_unification: false                   # Go has THREE yaml files (freewheelssp + freewheel-ssp aliasOf-stub + fwssp separate). Java has ONE yaml file (freewheelssp with fwssp as YAML alias).
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: null
    destination_language: null
    destination_pr: null
    fidelity_review_themes:
      - port-fidelity
      - adr-007-f2-label-collision-corrected
      - adr-005-rule-46-canonical-same-name-corrected
      - alias-of-yaml-stub-mechanism
      - fwssp-cross-language-topology-asymmetry
      - hardcoded-video-bid-type
      - ext-struct-field-count-asymmetry
      - currency-propagation-level-divergence
      - header-componentid-language-divergent
      - misspelled-infomation-preserved
  go_specific_concerns: []
  java_specific_concerns:
    - "Java edge case #19 alternate naming: `FreewheelSSPBidder.java` is the SOLE class in the package. No Util/Helper/Model classes."
    - "ExtImpFreewheelSSP has 4 fields (zoneId + 3 extras). The 3 extras (customSiteSectionId, networkId, profileId) lack @JsonProperty annotations and rely on JacksonMapper PROPERTY_NAMING_STRATEGY (snake_case). Wire form: snake_case. Go drops these fields entirely — cross-language fidelity gap."
    - "fwssp alias is a YAML-internal alias under `adapters.freewheelssp.aliases.fwssp` with default-disabled (Rule 45) + EXPLICIT endpoint override (different upstream host). Alias-with-full-override pattern, distinct from typical tilde-inherit. Go has fwssp as a SEPARATE TOP-LEVEL bidder package — cross-language asymmetric topology."
    - "Currency: Java attaches `bidCurrency` per-BidderBid (per-bid). Go propagates once at BidderResponse.Currency level (per-response). Cross-language propagation-level asymmetry."
    - "Header `Componentid: prebid-java` — Go emits `prebid-go`. Intentional byte-level divergence."
    - "Hardcoded BidType.video for ALL bids regardless of bid signals. Rule 26 hardcoded master sample (cross-language symmetric with Go)."
    - "Error message uses imp.getId() (`%s`). Go uses imp INDEX (`%d`). Java more debuggable; Go uses positional index."
    - "Misspelled \"Infomation\" (sic) preserved cross-language."
    - "`AdkernelAdnTest` parallel naming — `FreewheelSSPTest` IT class title-case preserves uppercase SSP throughout. Distinct from EmxdigitalTest naming-case loss."
  reviewer_cohort:
    go: []
    java: []
    cross_language_coordinator: bretg
