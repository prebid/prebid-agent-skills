quirks:
  - id: imp-ext-strip-post-extraction
    file: src/main/java/org/prebid/server/bidder/limelightdigital/LimeLightDigitalBidder.java
    line: 95
    summary: "modifyImp uses `imp.toBuilder().ext(null).build()` — strips imp.ext after extraction. Cross-language symmetric (Go side does `imp.Ext = nil`). ADR-007 F5 imp-ext-strip-post-extraction master sample."
    edge_case_taxon: imp-ext-strip-post-extraction
  - id: multi-form-naming-four-variants
    file: src/main/resources/bidder-config/limelightDigital.yaml
    summary: "Four distinct naming forms for one bidder on the Java side: YAML `limelightDigital` (camelCase single-cap), package `limelightdigital` (lowercase), class root `LimeLightDigital` (CamelCase double-cap), @ConfigurationProperties key `adapters.limelightdigital` (lowercase). Adjacent to Java edge cases #19 (config-class naming variance) + #27 (acronym-case preservation) — combined in one fixture."
    edge_case_taxon: acronym-case-preservation
  - id: configuration-properties-key-mismatch
    file: src/main/java/org/prebid/server/spring/config/bidder/LimeLightDigitalConfiguration.java
    line: 24
    summary: "@ConfigurationProperties(\"adapters.limelightdigital\") uses LOWERCASE while the YAML key is `adapters.limelightDigital` (camelCase). Spring's relaxed binding handles the case-insensitive match — a known Spring Boot feature — but the discrepancy reads as a bug. Cross-references @Bean name `limelightDigitalConfigurationProperties` (camelCase) for the bean, but the property-source key path is lowercase."
    edge_case_taxon: yaml-field-name-typo
  - id: integer-only-publisher-id
    file: src/main/java/org/prebid/server/proto/openrtb/ext/request/limelightdigital/ExtImpLimeLightDigital.java
    summary: "publisherId typed as `Integer` — schema declares `[\"integer\", \"string\"]` flexible-type. Java side would FAIL to deserialize a string-form publisherId; Go side uses `json.Number` which handles both. Cross-language fidelity gap; the wire-format publisherId for upstream consumers must always be integer-form to avoid breaking the Java side."
    edge_case_taxon: incomplete-classification
  - id: alias-it-class-missing-evtech
    file: src/main/resources/bidder-config/limelightDigital.yaml
    summary: "evtech alias is the most-elaborated (own endpoint + usersync iframe + redirect) but does NOT have an IT class. Other 14 aliases (filmzie, iionads, etc.) all have IT classes."
    edge_case_taxon: incomplete-classification
  - id: alias-it-class-name-divergence-appstock
    file: src/main/resources/bidder-config/limelightDigital.yaml
    summary: "appstock alias's IT class is `AppStockSspTest` and fixture dir is `appstockssp/` — both add `Ssp` suffix that's NOT in the alias name. Possibly a copy from a different bidder's IT setup. Distinct from the Java identifier-rule workaround (which strips characters); this APPENDS a suffix."
    edge_case_taxon: incomplete-classification
  - id: alias-underscore-name-adtg-org
    file: src/main/resources/bidder-config/limelightDigital.yaml
    summary: "adtg_org alias has UNDERSCORE in name. Java IT class is `AdtgorgTest` (underscore stripped — Java identifier-rule workaround similar to Java edge case #26 digit-leading-rename but applied to underscores). Fixture dir KEEPS the underscore: `adtg_org/`."
    edge_case_taxon: identifier-rule-workaround
  - id: performist-endpoint-truncated
    file: src/main/resources/bidder-config/limelightDigital.yaml
    summary: "performist alias endpoint is `http://ads-pbs.performserv.com/openrtb/{{PublisherID}}` — OMITS the `?host={{Host}}` query param that all 14 sibling aliases include. Probably an upstream bug; performist would receive requests without the host context other aliases pass through."
    edge_case_taxon: yaml-field-name-typo

cross_language:
  go_artifacts:
    bidder_dir: adapters/limelightDigital/
    package_name: limelightDigital
    bidder_constant: openrtb_ext.BidderLimelightDigital
  java_artifacts:
    bidder_dir: src/main/java/org/prebid/server/bidder/limelightdigital/
    bidder_class: LimeLightDigitalBidder
    config_class: LimeLightDigitalConfiguration
    yaml_path: src/main/resources/bidder-config/limelightDigital.yaml
    proto_dir: src/main/java/org/prebid/server/proto/openrtb/ext/request/limelightdigital/
  port_concerns:
    aliases_inverted: true
    yaml_unification: true
    mutation_idiom_divergence: true
    package_directory_mismatch: false
    multi_file_layout: false
    custom_unmarshaljson_present: false
  port_lineage:
    source_language: shared-genesis
    source_pr: prebid/prebid-server-java#2228
    destination_language: null
    destination_pr: prebid/prebid-server#2539
    fidelity_review_themes:
      - port-fidelity
      - alias-empire-endpoint-macro-substitution
      - imp-ext-strip-post-extraction
      - flexible-type-publisher-id
      - multi-form-naming-asymmetry
  go_specific_concerns: []
  java_specific_concerns:
    - "Four-form naming asymmetry: YAML camelCase + package lowercase + class CamelCase + @ConfigurationProperties lowercase. Spring's relaxed binding makes this work but is a code-organization smell."
    - "publisherId typed Integer not String/json.Number — cross-language fidelity gap with Go's json.Number. String-form publisherId from publisher would fail on Java but succeed on Go. Schema is more permissive than the Java type system."
    - "imp.toBuilder().ext(null).build() strips imp.ext (line 95). Cross-language symmetric with Go's `imp.Ext = nil`. ADR-007 F5 master sample on both sides."
    - "URL macros are URL-ENCODED via HttpUtil.encodeUrl on both substitutions (line 89). Go side does NOT URL-encode (uses macros.ResolveMacros which substitutes verbatim). Cross-language asymmetry — could surface as wire-format URL divergence for hosts containing reserved URL characters (rare in practice since aliases use clean hostnames)."
    - "Currency conversion uses 4-arg form with bidRequest for time-context (Rule 32 Java side). Go uses 3-arg form."
    - "BidderUtil.defaultRequest constructs the HttpRequest (Rule 8 Java side; Go expands the boilerplate inline)."
    - "15 aliases with various Java identifier-rule workarounds: AdtgorgTest (underscore stripped from adtg_org), AppStockSspTest (Ssp suffix added on appstock), GreedyGameTest + OrangeClickMediaTest (CamelCase from lowercase alias names). evtech alias (most-elaborated config) MISSING IT class. performist alias has truncated endpoint (no ?host= query)."
