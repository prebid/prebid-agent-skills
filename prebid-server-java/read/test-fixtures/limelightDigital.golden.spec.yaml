params:
  schema_interpretation:
    properties:
      - name: host
        type: string
        description: "Ad network's RTB host"
        format: hostname
        pattern: '^.+\..+$'
      - name: publisherId
        type: ["integer", "string"]
        description: "Publisher ID"
        minimum: 1
        pattern: '^[1-9][0-9]*$'
    required_fields:
      - host
      - publisherId
    flexible_types:
      - publisherId
    combinators_used: []
  ext_struct:
    package: org.prebid.server.proto.openrtb.ext.request.limelightdigital
    file: src/main/java/org/prebid/server/proto/openrtb/ext/request/limelightdigital/ExtImpLimeLightDigital.java
    type_name: ExtImpLimeLightDigital          # CamelCase double-cap (LimeLight) — distinct from YAML name (camelCase single-cap `limelightDigital`) and from package name (lowercase `limelightdigital`)
    fields:
      - name: host
        json_tag: host
        type_native: String
        omitempty: true
        notes: []
      - name: publisherId
        json_tag: publisherId
        type_native: Integer                    # Java uses Integer (NOT flexible) — schema accepts integer-OR-string but Java's deserializer would fail on a string-form input. Cross-language fidelity gap vs Go's json.Number.
        omitempty: true
        notes:
          - "@JsonProperty(\"publisherId\") explicit"
          - "Schema accepts publisherId as integer OR string but Java types as Integer only — would fail to deserialize a string-form publisherId. Go uses json.Number for full flexibility."
    custom_unmarshal: false
    custom_unmarshal_accepts: []
  params_test: null

code:
  package_or_class: LimeLightDigitalBidder      # CamelCase double-cap class name
  directory_name: limelightdigital               # Lowercase package directory — multi-form naming asymmetry with class name
  package_directory_mismatch: false              # Standard Java convention: lowercase package + CamelCase class
  file_layout:
    kind: single-file
    files:
      - name: LimeLightDigitalBidder.java
        role: implementation
        loc: 220
  imports:
    has_jsonutil: false
    has_template_engine: false
    has_currency_helper: true                    # CurrencyConversionService injected
  make_requests:
    request_body:
      kind: openrtb2-modified
      custom_body_type: null
    batching:
      applied_in_order: true
      rules:
        - kind: per-imp
    mutation:
      mutates_request: true
      go_idiom: null
      java_idiom: lombok-tobuilder
      entity_strategies:
        Imp: immutable-rebuild                    # imp.toBuilder().ext(null).build()
        Site: none
        App: none
    imp_ext_unmarshal:
      kind: standard-two-phase
      mechanism_go: null
      mechanism_java: typeref-extprebid
      target_type: ExtImpLimeLightDigital
      wrapper_type: null
    endpoint_resolution:
      kind: multi-token-substitution
      mechanism_go: null
      mechanism_java: string-replace
      macros_used:
        - PublisherID
        - Host
    helpers:
      - name: parseExtImp
        signature: "private ExtImpLimeLightDigital parseExtImp(Imp imp)"
      - name: resolveEndpoint
        signature: "private String resolveEndpoint(ExtImpLimeLightDigital extImp)"
      - name: modifyImp
        signature: "private Imp modifyImp(Imp imp, BidRequest request)"
      - name: resolveBidFloor
        signature: "private Price resolveBidFloor(Imp imp, BidRequest bidRequest)"
      - name: convertBidFloor
        signature: "private Price convertBidFloor(Price bidFloorPrice, BidRequest bidRequest)"
      - name: modifyRequest
        signature: "private static BidRequest modifyRequest(BidRequest request, Imp imp)"
      - name: createHttpRequest
        signature: "private HttpRequest<BidRequest> createHttpRequest(BidRequest request, String endpointUri)"
  make_bids:
    response_type: BidResponse
    custom_response_type: null
    bid_type_resolution:
      method_chain:
        - method: by-imp-mediatype                 # Rule 22 — same as Go side
          field: imp.banner|video|audio|native
          fallback_action: throw
      default_value: null
      multi_format_detection: strict
    http_status_handling:
      kind: framework-default-plus-empty-seatbid-shortcircuit
    application_status_handling:
      kind: none
      field: null
      success_codes: []
      error_codes: []
    bid_pointer_pattern: flatten-streams
    bid_pointer_go_sibling: null
    currency_overwrite_safety: passthrough-from-response

