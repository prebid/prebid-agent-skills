    - "Multi-form naming: YAML `limelightDigital` (single-cap), package `limelightdigital` (lowercase), class root `LimeLightDigital` (double-cap), @ConfigurationProperties key `adapters.limelightdigital` (lowercase). Four distinct casings for one bidder."
    - "The class root's `LimeLight` (with capital L mid-word) reflects the brand's marketing typography; the YAML/Go side normalizes to `Limelight` (single-cap). Adjacent to Java edge case #27 acronym-case-preservation."

