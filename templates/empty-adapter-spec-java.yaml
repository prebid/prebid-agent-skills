# Empty Adapter Specification — Java-source template
# Phase 4.0 of execution-plan.md.
#
# Scaffold for authoring a new Java-source spec by hand. Differs from
# empty-adapter-spec-go.yaml in three places:
#   - source_language: java
#   - spring_config and bidder_class are non-null on non-alias bidders
#     (the schema's if/then/else discrimination requires it)
#   - cross_language.port_concerns.yaml_unification: true (Java unifies what Go splits)
#
# Validate via: python3 -m unittest scripts.tests.test_schema_jsonschema
#               scripts/audit-golden.py --bidder=<your-bidder>
#
# Schema:    prebid-server-go/read/skills/shared/adapter-spec.schema.json
# Worked:    prebid-server-java/read/test-fixtures/kobler.golden.spec.yaml

