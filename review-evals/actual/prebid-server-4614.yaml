findings:
  - path: adapters/trustx/trustx.go
    anchor: 'extJSON, err := jsonutil.Marshal(ext) if err == nil { imp.Ext = extJSON }'
    symbol: setImpExtData
    severity: FAIL
    family: error-handling
    skill: adapter-code-pr-review
    note: >-
      Workflow: MakeRequests Changed step 6 and shared/framework-utilities
      "Marshaling Error Safety". The jsonutil.Marshal error is discarded — the
      write is guarded by `if err == nil` and setImpExtData returns nothing, so a
      marshal failure is invisible to MakeRequests and the request goes out with
      the un-updated ext. The skill's stated severity for an ignored/discarded
      Marshal error is FAIL; marshal failures signal shared-memory corruption and
      must surface.

  - path: adapters/trustx/trustx.go
    anchor: 'Message: fmt.Sprintf("Unsupported MType: %v", bid.MType),'
    symbol: getTypedBid
    severity: WARN
    family: error-handling
    skill: adapter-code-pr-review
    note: >-
      Workflow: MakeBids Changed step 4, final bullet — "Error messages that fail
      to resolve bid type MUST include the bid.ImpID for log diagnosability". The
      error names the MType but not the impression, so a production log cannot
      identify which bid was dropped. No severity is attached to that bullet;
      rated WARN (ASK) on the ladder.

  - path: adapters/trustx/trustx.go
    anchor: 'headers.Set("X-Openrtb-Version", "2.6")'
    symbol: getHeaders
    severity: WARN
    family: openrtb-version-drift
    skill: adapter-code-pr-review
    note: >-
      bidder-info-pr-review Cross-Field Validation rule 12 (cross-check owned by
      adapter-code-pr-review). The adapter advertises OpenRTB 2.6 on the wire but
      static/bidder-info/trustx.yaml declares no `openrtb: version: "2.6"` block
      — the post-diff YAML has endpoint, maintainer, capabilities and userSync
      only — so PBS will send 2.5-shaped requests behind a 2.6 header. Stated
      severity: WARN.

  - path: adapters/trustx/trustx.go
    anchor: 'bidderResponse := adapters.NewBidderResponseWithBidsCapacity(1)'
    symbol: MakeBids
    severity: INFO
    family: perf
    skill: adapter-code-pr-review
    note: >-
      Workflow: MakeBids Changed step 5 — the stated form is
      NewBidderResponseWithBidsCapacity(len(request.Imp)); a fixed capacity of 1
      under-allocates for the multi-imp case the adapter's own
      exemplary/multiple-imp-types.json exercises. Allocation sizing only, no
      behavioral effect; recorded at INFO.

