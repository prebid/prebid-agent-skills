# prebid/prebid-server#4211 "New Adapter: AdTarget.org - Limelight Alias".
#
# CLEAN-outcome fixture. Two reviewers opened exactly the findings a
# rule-literal reviewer would open -- an http:// endpoint and an underscore in
# the bidder name -- and both were adjudicated as PERMITTED before merge. The
# file merged unchanged: the review SHA 6511cc2b91da IS the merged head.
#
# The corpus needs this shape. Recall alone rewards a reviewer that flags
# everything; a named non-finding is the only thing that punishes it.

pr: prebid/prebid-server#4211
review_sha: 6511cc2b91da507b3d827d266f88571ae9b5fc43

expected: []

forbidden:
  - id: adtg-http-endpoint-is-permitted
    path: static/bidder-info/adtg_org.yaml
    anchor: 'endpoint: "http://ads-pbs.rtb.adtarget.org/openrtb/{{.PublisherID}}?host={{.Host}}"'
    family: endpoint-config
    severity: WARN
    source: https://github.com/prebid/prebid-server/pull/4211#discussion_r1989888655
    forbidden_at_or_above: WARN
    why_it_matters: >
      Settled on this line during review: https is strongly preferred but http is
      still permitted, and the PR merged with http intact. What contradicts the
      merge bar is BLOCKING on it, not noting it -- so an INFO note is tolerated
      and a WARN or FAIL is the forbidden verdict. The Go bidder-info skill says
      the same thing ("flag HTTP as INFO ... never FAIL"), and before this entry
      carried a severity floor that instruction scored as a hard false positive.

  - id: adtg-underscore-in-bidder-name-is-permitted
    path: static/bidder-info/adtg_org.yaml
    anchor: "<file>"
    family: naming-conventions
    severity: WARN
    source: https://github.com/prebid/prebid-server/pull/4211#discussion_r2010721315
    forbidden_at_or_above: WARN
    why_it_matters: >
      Ruled during review that underscores are allowed server-side for parity with
      the Prebid.js bidder name; adtg_org merged with the underscore intact. As
      above, the forbidden verdict is a blocking one; observing the underscore at
      INFO is tolerated.

# Findings this repo's own documented rules require, that no maintainer raised on
# this PR. A citation must match the rule AS CURRENTLY SCOPED, not merely name it;
# see review-evals/README.md for the two ordering rules.
additional:
  - id: adtg-alias-omits-maintainer-email
    path: static/bidder-info/adtg_org.yaml
    anchor: 'aliasOf: "limelightDigital"'
    family: maintainer-metadata
    severity: WARN
    rule: >-
      bidder-info-pr-review/SKILL.md:175 step 6 — alias completeness, maintainer.email. WARN is the sanctioned severity when the alias appears to be an independent organization; the heuristic is a distinct endpoint domain not sharing a stem with the parent's, and adtarget.org does not share one with the parent's ortb.net
