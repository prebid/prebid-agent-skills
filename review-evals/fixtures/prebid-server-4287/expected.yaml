#  - WARN on optidigital_test.go `RunJSONBidderTest` (supplemental coverage). The
#    rule reports absences other than 204 "as a single INFO naming what is
#    missing; never as six findings, and never as a FAIL"
#    (adapter-code-pr-review/SKILL.md step 3). WARN is above the sanctioned
#    severity, so the subject is right and the verdict is not.
#  - INFO on the test runner's `Endpoint:` literal. adapter-code-index.md:349 is
#    explicit: "A test-runner endpoint is not a finding at any severity" -- 134
#    adapters configure their real production domain there and `fake.endpoint.test`
#    appears in 0 upstream fixtures.
#  - WARN on supplemental/no_response.json `"status": 204`. Step 4 says "Do NOT
#    flag a fixture asserting graceful degradation ... This covers HTTP 204 /
#    no-content" and "Do NOT flag 'this looks like it belongs in exemplary/'" --
#    the recorded note gives both as its reasons.
#
# All three quote pre-calibration wording, so the recorded run predates the
# re-scoping now in the skills. They stay `unexpected`: that is the class for a
# finding the suite should not have made.
