    symbol: setImpExtData
    family: error-handling
    severity: FAIL
    source: https://github.com/prebid/prebid-server/pull/4614#discussion_r2747036491
    why_it_matters: "@bsardo: swallowing the unmarshal error here is fine, swallowing a marshaling error is not -- production marshal failures have signalled shared-memory corruption and must surface."

