# prebid/prebid-server#4614 "New Adapter: TRUSTX (remove Grid alias)".
#
# Captured at 5cc01b6aca01, the state @bsardo reviewed on 2026-01-30. The
# earlier @karwaankit32 round (2026-01-09) raised two of these against an
# ancestor commit; both anchors are still present here.
#
# The headline finding is the corpus's only marshal-vs-unmarshal distinction:
# the maintainers explicitly tolerate swallowing an UNMARSHAL error in this
# helper and explicitly refuse to tolerate swallowing a MARSHAL error, because
# a marshal failure in production has meant memory corruption. A check that
# treats "swallowed error" as one class gets this fixture half wrong in either
# direction.

