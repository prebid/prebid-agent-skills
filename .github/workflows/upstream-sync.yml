name: upstream-sync

# Phase 4.1 drift detection. Runs Mondays at 09:00 UTC against upstream
# `prebid/prebid-server` and `prebid/prebid-server-java` master HEADs and
# uploads the drift report as an artifact.
#
# Manual trigger via workflow_dispatch supports ad-hoc runs (e.g., after a
# merge of a major upstream PR).

on:
  schedule:
    - cron: '0 9 * * 1'        # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream ref to compare against (default: master)'
        type: string
        default: 'master'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync-from-upstream
        id: sync
        run: |
          set +e
          python3 scripts/sync-from-upstream.py \
            --source-mode=github-raw \
            --ref=${{ github.event.inputs.ref || 'master' }}
          EXIT=$?
          set -e
          # Exit 0 = clean; 1 = fail (real drift requiring update); 2 = warn-only.
          # Always upload the report; only block the workflow on EXIT=1.
          echo "exit=$EXIT" >> $GITHUB_OUTPUT
          if [ "$EXIT" -eq 0 ] || [ "$EXIT" -eq 2 ]; then exit 0; else exit "$EXIT"; fi

      - name: Upload drift-report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift-report
          path: |
            scripts/output/drift-report.json
            scripts/output/drift-report.md

      - name: Surface drift summary in workflow output
        if: always()
        run: |
          if [ -f scripts/output/drift-report.md ]; then
            echo "## Drift report summary" >> $GITHUB_STEP_SUMMARY
            cat scripts/output/drift-report.md >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.sync.outputs.exit }}" = "1" ]; then
            echo "::warning::Upstream drift detected — review scripts/output/drift-report.md and update goldens."
          fi
