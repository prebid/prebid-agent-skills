name: round-trip-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate read-skill suite (R1-R10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run round-trip CI harness (R1-R10)
        run: |
          python3 scripts/round-trip-ci.py --strict-r3 --check-network
        env:
          # gh CLI authentication for R1 network checks. The default
          # GITHUB_TOKEN is sufficient for read-only access to public repos.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI harness unit tests
        run: |
          python3 -m unittest discover -s scripts/tests -v

      - name: Run schema contract test
        run: |
          python3 scripts/tests/test_schema_contract.py
